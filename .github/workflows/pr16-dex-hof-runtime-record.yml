name: pr16-dex-hof-runtime-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-dex-hof-runtime-record.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-hof-runtime-record
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact terminal source and retired measurement triggers
        run: python3 -B scripts/pr16_dex_hof_runtime_record.py guard_source
      - name: Record completed originals without rerunning native
        run: python3 -B scripts/pr16_dex_hof_runtime_record.py record
      - name: Scoped final index and fixed resume
        run: python3 -B scripts/pr16_dex_hof_runtime_record.py guard
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20261005-DEX-HOF-CONTROLLER: record successor owner and isolated ARM results'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Whole committed text readback
        run: python3 -B scripts/pr16_dex_hof_runtime_record.py snapshot
      - name: Closed record publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_hof_runtime_record.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-hof-runtime-record-text-only
          path: public-dex-hof-runtime-record
          retention-days: 90
          if-no-files-found: error

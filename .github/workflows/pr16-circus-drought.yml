name: PR16 Circus Drought native repair
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-drought.yml
      - scripts/pr16_circus_drought.py
      - tests/test_pr16_circus_drought.py
      - tests/fixtures/circus_drought_fixture.c
      - overlays/circus_streak/circus_drought.c
      - overlays/circus_streak/circus_drought.h
      - tools/mgba_pr16_circus_drought_watch.h
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: CPU原本と空loader限定修復のhost契約を記録
        id: prepare
        run: python3 scripts/pr16_circus_drought.py prepare
      - name: 独立2linkと全ROM差分を証明して未完continuationを検証
        run: python3 scripts/pr16_circus_drought.py pipeline
      - name: 成否原本と固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_drought.py finish
      - name: ROMとsaveを除外して証跡を保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_drought.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-drought
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

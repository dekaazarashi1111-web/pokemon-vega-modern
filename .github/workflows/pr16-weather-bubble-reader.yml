name: pr16-weather-bubble-reader
run-name: current-weather-bubble-finite-reader-only
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-weather-bubble-reader.yml
      - scripts/pr16_weather_bubble.py
      - scripts/pr16_weather_bubble_sources.py
      - scripts/pr16_weather_bubble_actions.py
      - tests/test_pr16_weather_bubble.py
      - content/modernization/pr16_weather_bubble_sources.json
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-weather-bubble-reader
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  bubble-reader:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Closed first scope and unchanged saved resume
        run: python3 -B scripts/pr16_weather_bubble_actions.py guard
      - name: Official compiler and independent PNG checker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: New bubble source, ARM ABI, 27 tests and finite reader only
        id: measurement
        run: python3 -B scripts/pr16_weather_bubble_actions.py run
      - name: Closed successful text publication guard
        id: publication_guard
        env:
          BUBBLE_MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
        if: always()
        run: python3 -B scripts/pr16_weather_bubble_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-weather-bubble-reader-text-only
          path: public-weather-bubble-reader
          retention-days: 90
          if-no-files-found: error

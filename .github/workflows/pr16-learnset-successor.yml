name: pr16-learnset-successor
run-name: PR16 learnset successor ${{ github.sha }}

on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-learnset-successor.yml
      - tools/pr16_learnset_successor.py
      - tests/test_pr16_learnset_successor.py
      - scripts/record_pr16_learnset_successor.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr16-learnset-successor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scoped:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked implementation inputs only
        run: |
          python3 - <<'PY'
          import fnmatch, hashlib, json, pathlib, subprocess, zipfile
          patterns = [
              '*AGENTS.md', 'CHATGPT_RESUME.md',
              'design/version_log.md', 'design/run_log.md',
              'design/agent_context_map.md',
              'docs/PR16_*', 'config/*.json',
              'tools/pr16*.py', 'tools/*learnset*.py',
              'scripts/*pr16*.py', 'scripts/taskctl.py',
              'scripts/*guard*.py', 'scripts/*private*.py',
              'tests/test_pr16*.py', 'tests/test_*learnset*.py',
              'content/modernization/pr16*learnset*',
              'content/modernization/pr16*vega*',
              'content/modernization/pr16_native_supply_resume_20260913.json',
              'content/modernization/pr16_bp_chooser_checkpoint.json',
              'content/modernization/p08_remaining_work.json',
              'content/expansion/*.json', 'content/expansion/*.csv',
              '.github/workflows/pr16*',
          ]
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          selected = sorted(p for p in names if p and any(fnmatch.fnmatch(p, x) for x in patterns))
          root = pathlib.Path('build/pr16-learnset-successor')
          root.mkdir(parents=True, exist_ok=True)
          manifest = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'files': {}}
          with zipfile.ZipFile(root / 'tracked-inputs.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in selected:
                  path = pathlib.Path(name)
                  if path.is_symlink() or not path.is_file():
                      raise SystemExit('non-regular tracked input: ' + name)
                  data = path.read_bytes()
                  data.decode('utf-8')
                  manifest['files'][name] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
                  archive.writestr(name, data)
              archive.writestr('SNAPSHOT_MANIFEST.json', json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          (root / 'snapshot.json').write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'head': manifest['head'], 'files': len(selected), 'bytes': sum(x['size'] for x in manifest['files'].values())}))
          PY
      - name: Focused successor tests
        if: hashFiles('tests/test_pr16_learnset_successor.py') != ''
        run: python3 -B -m unittest -v tests.test_pr16_learnset_successor
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-learnset-successor-${{ github.sha }}
          path: build/pr16-learnset-successor/
          if-no-files-found: error
          retention-days: 7

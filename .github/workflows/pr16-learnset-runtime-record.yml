name: pr16-learnset-runtime-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-learnset-runtime-record.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-runtime-record
  cancel-in-progress: false
jobs:
  runtime-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 完了済み2入口の証拠照合と固定引継ぎ更新
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-learnset-runtime-record/proof
          python3 -B scripts/pr16_learnset_runtime_record.py record | tee .local/pr16-learnset-runtime-record/proof/record.json
          python3 -B -m unittest tests.test_pr16_learnset_runtime_record -v 2>&1 | tee .local/pr16-learnset-runtime-record/proof/record-tests.txt
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-learnset-runtime-record/proof/resume.json
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-learnset-runtime-record/proof/task-graph.txt
      - name: final index限定guardと同branch非force push
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_runtime_record.py paths | while IFS= read -r path; do git add -- "$path"; done
          python3 -B scripts/pr16_learnset_runtime_record.py guard | tee .local/pr16-learnset-runtime-record/proof/guard.json
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260922-LEARNSET-RUNTIME: 2入口ROM検証を受入・未接続consumerと固定引継ぎを同期'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "RESULT=DONE TASK=USER-20260922-LEARNSET-RUNTIME VERIFY=PASS COMMIT=$sha" | tee .local/pr16-learnset-runtime-record/proof/result.txt
      - name: 後続実装用の限定tracked source保存
        if: always()
        run: python3 -B scripts/pr16_learnset_runtime_record.py snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-runtime-record-proof
          path: .local/pr16-learnset-runtime-record/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-runtime-source-context
          path: .local/pr16-learnset-runtime-record/context.zip
          retention-days: 30
          if-no-files-found: error

name: pr16-story-save13-terminal
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save13-terminal.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save13-terminal
  cancel-in-progress: false
jobs:
  terminal:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resume and immutable source boundary
        run: python3 -B scripts/pr16_resume.py check
      - name: Collect completed original only without native or unit replay
        run: python3 -B scripts/pr16_story_save13_actions.py terminal
      - name: Task graph and scoped final index
        run: |
          python3 -B scripts/validate_task_graph.py --check
          python3 -B scripts/pr16_story_save13_actions.py guard
      - name: Non-force commit and remote readback
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260929-STORY-SAVE13: 全stepと原本の終端確認、固定引継ぎ・両ログ同期 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/$branch
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          python3 -B scripts/pr16_story_save13_actions.py snapshot
          echo "RESULT=DONE TASK=USER-20260929-STORY-SAVE13 VERIFY=ORIGINAL_READBACK_PASS COMMIT=$(git rev-parse HEAD)"
      - name: Preserve terminal receipt
        if: always()
        run: python3 -B scripts/pr16_story_save13_actions.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save13-terminal
          path: .local/pr16-story-save13/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-ring-story-resource-suppliers
run-name: BG実定数・属性表とmemcpy・heap・GPU供給を限定採取
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-story-resource-suppliers.yml
      - scripts/pr16_ring_story_resource_suppliers.py
      - tests/test_pr16_ring_story_resource_suppliers.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-story-resource-suppliers
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 未読供給を採取し同branchへ記録
        run: python3 scripts/pr16_ring_story_resource_suppliers.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-story-resource-suppliers
          path: |
            .local/pr16-ring-story-resource-suppliers/analysis.json
            .local/pr16-ring-story-resource-suppliers/preflight.json
            .local/pr16-ring-story-resource-suppliers/tests.json
            .local/pr16-ring-story-resource-suppliers/tests.txt
            .local/pr16-ring-story-resource-suppliers/guard.json
            .local/pr16-ring-story-resource-suppliers/recorded-result.json
            .local/pr16-ring-story-resource-suppliers/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-ips-dpe-instruction-extent
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_ips_dpe_instruction_probe.py
      - scripts/pr16_ips_dpe_instruction_probe_actions.py
      - tests/test_pr16_ips_dpe_instruction_probe.py
      - .github/workflows/pr16-ips-dpe-instruction-extent.yml
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ips-dpe-instruction-extent
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新規11命令・境界試験
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests -p test_pr16_ips_dpe_instruction_probe.py -v
      - name: 新scope ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev gcc g++ make
      - name: IPS/DPE の限定実byte照合（機密ROM出力禁止）
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_ips_dpe_instruction_probe_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ips-dpe-instruction-extent-public-text
          path: .local/pr16-ips-dpe-instruction-extent/public/
          if-no-files-found: error
          retention-days: 90

name: pr16-story-save98
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save98.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save98
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  continuation:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: 観測済party3byteの位置限定修復・影響16検査のみ
        run: |
          set -euo pipefail
          PYTHONPATH=tests python3 -B -m unittest -v test_pr16_story_save98_measure.Controller.test_first_field_stops test_pr16_story_save98_measure.Controller.test_transition_wait_only test_pr16_story_save98_measure.Controller.test_no_A_before_save test_pr16_story_save98_measure.Controller.test_blocked_edge_stop test_pr16_story_save98_measure.Controller.test_event_rejected test_pr16_story_save98_measure.Controller.test_battle_rejected test_pr16_story_save98_measure.Controller.test_early_map_rejected test_pr16_story_save98_measure.Controller.test_wrong_arrival_rejected test_pr16_story_save98_measure.Controller.test_finite_transition test_pr16_story_save98_measure.Controller.test_finite_blocked_connection test_pr16_story_save98_measure.Controller.test_scope_party_changed test_pr16_story_save98_measure.Controller.test_scope_flash_changed test_pr16_story_save98_measure.Controller.test_scope_battle_flags test_pr16_story_save98_measure.Controller.test_exact_party_phase test_pr16_story_save98_measure.Controller.test_party_phase_too_early test_pr16_story_save98_measure.Controller.test_failed_input_preserved
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_save98_measure as m; import pr16_learnset_runtime_record as g; g.START=m.BASE; g.CODE=m.CODE; g.OWNED=set(); g.guard()"
      - name: 最初の505番道路field Save98と独立Continue
        run: python3 -B scripts/pr16_story_save98_measure.py
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save98-checkpoint
          path: .local/pr16-story-save98/artifact
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

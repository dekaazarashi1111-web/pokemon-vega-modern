name: pr16-bp-loss-return-owner
run-name: Source-only audit of native loss WhiteOut and field-return owner
on:
  workflow_dispatch:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-bp-loss-return-owner.yml
      - scripts/pr16_bp_loss_return_owner.py
      - tests/test_pr16_bp_loss_return_owner.py
permissions:
  contents: read
concurrency:
  group: pr16-bp-loss-return-owner
  cancel-in-progress: false
jobs:
  audit-owner:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile fixed handoff and run focused tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-loss-return-owner
          mkdir -p "$out"
          git rev-parse HEAD > "$out/tested-head.txt"
          test "$(gh api repos/dekaazarashi1111-web/pokemon-vega-modern/pulls/16 --jq .state)" = open
          test "$(gh api repos/dekaazarashi1111-web/pokemon-vega-modern/pulls/16 --jq .draft)" = true
          test "$(gh api repos/dekaazarashi1111-web/pokemon-vega-modern/pulls/16 --jq .merged)" = false
          test "$(gh api repos/dekaazarashi1111-web/pokemon-vega-modern/pulls/16 --jq .head.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/dekaazarashi1111-web/pokemon-vega-modern/pulls/16 --jq .head.ref)" = codex/modernization-followup-20260908
          python3 -m unittest tests.test_pr16_bp_loss_return_owner -v > "$out/unit.stdout" 2> "$out/unit.stderr"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          out=root/'.local/pr16-bp-loss-return-owner'
          state=json.loads((root/'content/modernization/pr16_native_supply_resume_20260913.json').read_bytes())
          assert state['latest_native_run']==34749370272
          assert state['next_action']['id']=='BP_LOSS_RETURN_CALLBACK_OWNER'
          assert state['bp']['native_loss_observed'] is True
          assert state['bp']['loss_return_to_facility_observed'] is False
          assert state['bp']['earning_and_spending_accepted'] is False
          assert state['release_ready'] is False
          (out/'reconciliation.json').write_text(json.dumps({
              'latest_native_run':state['latest_native_run'],
              'next_action':state['next_action']['id'],
              'accepted_native_cases_replayed':0,
              'new_emulator_processes':0,
              'candidate_rom_changed':False,
          },sort_keys=True,indent=2)+'\n')
          PY
      - name: Restore exact fixed CFRU source from bound state archive only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-loss-return-owner
          assets=.local/pr16-bp-loss-return-owner-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 - <<'PY'
          import hashlib,json,pathlib,stat,zipfile
          root=pathlib.Path('.').resolve()
          out=root/'.local/pr16-bp-loss-return-owner'
          archive=root/'.local/pr16-bp-loss-return-owner-inputs/pokemon-vega-private-env-v1-state.zip'
          cfg=json.loads((root/'config/github_private_environment.json').read_bytes())
          bound=next(row for row in cfg['archives'] if row['name']==archive.name)
          raw=archive.read_bytes()
          assert len(raw)==bound['size']
          assert hashlib.sha256(raw).hexdigest()==bound['sha256']
          prefix=pathlib.PurePosixPath('vendor/upstream/CFRU-JP')
          rows=[];total=0
          with zipfile.ZipFile(archive) as z:
              assert len(z.namelist())==len(set(z.namelist()))
              for info in z.infolist():
                  name=pathlib.PurePosixPath(info.filename)
                  if name!=prefix and prefix not in name.parents:
                      continue
                  assert not name.is_absolute() and '..' not in name.parts and '\\' not in info.filename
                  mode=info.external_attr>>16
                  assert not stat.S_ISLNK(mode)
                  rows.append((info,name,mode))
                  if not info.is_dir():total+=info.file_size
              assert 1<=len(rows)<=20000 and 0<total<=160000000
              for info,name,mode in rows:
                  target=(root/pathlib.Path(*name.parts)).resolve()
                  assert target==root/pathlib.Path(*name.parts)
                  assert target==root or root in target.parents
                  if info.is_dir():
                      target.mkdir(parents=True,exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True,exist_ok=True)
                  data=z.read(info)
                  assert len(data)==info.file_size
                  target.write_bytes(data)
                  target.chmod((mode & 0o777) or 0o644)
          source=root/pathlib.Path(*prefix.parts)
          assert (source/'.git').is_dir()
          (out/'source-restore.json').write_text(json.dumps({
              'archive':archive.name,'archive_size':len(raw),'archive_sha256':bound['sha256'],
              'prefix':prefix.as_posix(),'members':len(rows),'uncompressed_size':total,
              'rom_extracted':False,'new_emulator_processes':0,
          },sort_keys=True,indent=2)+'\n')
          PY
          test -z "$(git -C vendor/upstream/CFRU-JP status --porcelain)"
          test -z "$(git status --short --untracked-files=no)"
      - name: Audit exact source owner without ROM or emulator execution
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-loss-return-owner
          python3 scripts/pr16_bp_loss_return_owner.py --root . --output-dir "$out" > "$out/audit.stdout" 2> "$out/audit.stderr"
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('.local/pr16-bp-loss-return-owner/owner-report.json').read_bytes())
          assert r['classification']=='SOURCE_ONLY_OWNER_AUDIT_NOT_NATIVE_ACCEPTANCE'
          assert r['summary']['owner_resolved'] is True
          assert r['summary']['candidate_rom_changed'] is False
          assert r['summary']['new_emulator_processes']==0
          assert r['summary']['accepted_native_cases_replayed']==0
          assert r['native_bp_earning_accepted'] is False
          assert r['release_ready'] is False
          PY
      - name: Guard text-only audit artifact
        id: artifact_guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          out=pathlib.Path('.local/pr16-bp-loss-return-owner')
          members={};allowed={'.json','.txt','.stdout','.stderr'}
          for p in out.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in allowed,p
              raw=p.read_bytes();text=raw.decode('utf-8')
              assert b'\0' not in raw and len(raw)<16000000
              assert '/home/runner/' not in text and '\\Users\\' not in text
              assert not re.search(r'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',text)
              members[p.name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.artifact_guard.outcome == 'success'
        with:
          name: pr16-bp-loss-return-owner
          path: .local/pr16-bp-loss-return-owner/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

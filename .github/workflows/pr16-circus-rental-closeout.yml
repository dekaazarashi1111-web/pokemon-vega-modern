name: PR16 Circus rental completed evidence closeout
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-circus-rental-closeout.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  closeout:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 完了原本と24勝保存を再実行せず照合し非force記録
        run: python3 scripts/pr16_circus_rental_closeout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-rental-closeout
          path: .local/pr16-circus-rental-closeout/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

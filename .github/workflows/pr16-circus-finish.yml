name: PR16 Circus three-win finish
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-finish.yml
      - scripts/pr16_circus_finish.py
      - tools/mgba_pr16_circus_finish.h
      - tests/test_pr16_circus_finish.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 最新成功と旧2勝失敗を照合し新入力契約を保存
        id: prepare
        run: python3 scripts/pr16_circus_finish.py prepare
      - name: 受入済み候補を再linkせず未完3勝9BP保存だけ検証
        run: python3 scripts/pr16_circus_finish.py pipeline
      - name: 成否原本と固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_finish.py finish
      - name: ROMとsaveを除外して証跡を保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_finish.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-finish
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

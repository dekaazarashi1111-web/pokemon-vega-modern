name: pr16-story-save23-inspect
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save23-inspect.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save23-inspect
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  inspect:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: New static path tests and scoped source guard
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_pr16_story_save23_inspect.py -v
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_save23_inspect as m; import pr16_learnset_runtime_record as g; g.START=m.BASE; g.CODE=m.CODE; g.OWNED=set(); g.guard()"
      - name: Inspect new cave options without accepted input replay
        run: python3 -B scripts/pr16_story_save23_inspect.py
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save23-inspection
          path: .local/pr16-story-save23-inspect/public
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

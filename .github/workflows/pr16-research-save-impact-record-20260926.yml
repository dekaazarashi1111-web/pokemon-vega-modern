name: pr16-research-save-impact-record-20260926
# 原本compiler記録はartifactに保持。公開写像12試験のみ実行し68試験/nativeは再利用。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-save-impact-record-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-save-impact-record-20260926
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      RESEARCH_MODE: record
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 固定原本から受入記録または終端確定（native再実行なし）
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_research_save_impact_record.py "$RESEARCH_MODE"
      - name: 固定引継ぎとtask graphを照合
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-research-save-impact-record/resume-check.txt
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-research-save-impact-record/task-graph.txt
      - name: 最終indexの限定private guardと差分検査
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_research_save_impact_record.py paths > .local/pr16-research-save-impact-record/paths.txt
          mapfile -t owned < .local/pr16-research-save-impact-record/paths.txt
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_save_impact_record.py guard | tee .local/pr16-research-save-impact-record/index-guard.txt
          git diff --cached --stat > .local/pr16-research-save-impact-record/staged-stat.txt
      - name: 同branchへcommit・非force push・remote HEAD照合
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260926-RESEARCH-SAVE-IMPACT: 共有研究保存18境界とBag誤接続修正を記録 ($RESEARCH_MODE)"
          git push origin "HEAD:refs/heads/$branch"
          reflected=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$reflected"
          printf '%s\n' "$reflected" > .local/pr16-research-save-impact-record/reflected-head.txt
          git status --porcelain=v1 > .local/pr16-research-save-impact-record/post-push-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-save-impact-record
          path: .local/pr16-research-save-impact-record/
          retention-days: 30
          if-no-files-found: error

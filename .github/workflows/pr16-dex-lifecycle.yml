name: pr16-dex-lifecycle
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_dex_lifecycle.py
      - scripts/pr16_dex_lifecycle_actions.py
      - overlays/dex_owner/dex_lifecycle.c
      - overlays/dex_owner/dex_newgame_tail.S
      - tests/test_pr16_dex_lifecycle.py
      - tools/mgba_pr16_dex_lifecycle.c
      - content/modernization/pr16_dex_load_status_audit.json
      - .github/workflows/pr16-dex-lifecycle.yml
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-lifecycle
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  lifecycle:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact lifecycle scope and accepted source guard
        run: python3 -B scripts/pr16_dex_lifecycle_actions.py guard
      - name: Official Ubuntu ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libmgba-dev
      - name: Build candidate and verify new isolated load and newgame boundaries
        run: python3 -B scripts/pr16_dex_lifecycle_actions.py run
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Strict text-only publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_lifecycle_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-lifecycle-text-only
          path: public-dex-lifecycle
          retention-days: 90
          if-no-files-found: warn

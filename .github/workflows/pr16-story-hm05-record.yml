name: pr16-story-hm05-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-hm05-record.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-story-hm05-record
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: New 12 record gates and scoped source guard only
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-story-hm05-record/preflight .local/pr16-story-hm05-record/public
          printf '%s\n' 'b03f8462c2e85e7823980dc5fa9de866b98c7b89d2cbf3fe0674be298b4f3842  scripts/pr16_story_hm05_record.py' '1468373acd2ecae7d7371319af9d61b5e37a26c036ee231bd855c8595934d443  tests/test_pr16_story_hm05_record.py' | sha256sum --check
          python3 -B -m unittest discover -s tests -p test_pr16_story_hm05_record.py -v > .local/pr16-story-hm05-record/preflight/unit.stdout.txt 2> .local/pr16-story-hm05-record/preflight/unit.stderr.txt
          cat .local/pr16-story-hm05-record/preflight/unit.stderr.txt
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_hm05_record as m; import pr16_learnset_runtime_record as g; g.START=m.SOURCE; g.CODE=m.CODE; g.OWNED=set(); g.guard()"
      - name: Record completed Save20 without native or accepted suite reruns
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_story_hm05_record.py record 2>&1 | tee .local/pr16-story-hm05-record/public/record.log
      - name: Scoped final index private guard and fixed resume
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_story_hm05_record.py guard 2>&1 | tee .local/pr16-story-hm05-record/public/guard.log
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260929-STORY-HM05: 通常HM05取得・新2勝/2離脱・全回復Save20と独立Continueを限定受入'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: |
          python3 -B scripts/pr16_story_hm05_record.py snapshot
          echo "RESULT=DONE TASK=USER-20260929-STORY-HM05 VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-hm05-record
          path: |
            .local/pr16-story-hm05-record/public
            .local/pr16-story-hm05-record/preflight
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

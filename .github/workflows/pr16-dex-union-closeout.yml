name: pr16-dex-union-closeout
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-dex-union-closeout.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-union-closeout
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  codec:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact new source guard
        run: python3 -B scripts/pr16_dex_union_closeout.py source_guard
      - name: Close terminal record and verify complete committed source snapshots
        run: python3 -B scripts/pr16_dex_union_closeout.py close
      - name: Scoped final index and fixed resume
        run: python3 -B scripts/pr16_dex_union_closeout.py guard
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20261005-DEX-UNION-FAILURE: close Union notification and restored scheduler records'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: python3 -B scripts/pr16_dex_union_closeout.py snapshot
      - name: Publish only validated text receipt
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_union_closeout.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-union-closeout-receipts
          path: public-dex-union-closeout
          retention-days: 90
          if-no-files-found: error

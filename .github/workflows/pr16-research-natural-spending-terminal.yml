name: pr16-research-natural-spending-terminal
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-natural-spending-terminal.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-natural-spending-terminal
  cancel-in-progress: false
jobs:
  terminal:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Externally confirm completed acceptance without replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-natural-terminal
          python3 -B scripts/pr16_research_natural_spending_terminal.py record >.local/pr16-natural-terminal/record.stdout.txt 2>.local/pr16-natural-terminal/record.stderr.txt
      - name: Task graph resume and exact scoped final index
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/validate_task_graph.py
          mapfile -t owned < <(python3 -B scripts/pr16_research_natural_spending_terminal.py paths)
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_natural_spending_terminal.py guard
      - name: Non-force terminal confirmation commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260927-RESEARCH-NATURAL-SPENDING: Actions成功終端を外部照合し固定引継ぎを確定'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=DONE TASK=USER-20260927-RESEARCH-NATURAL-SPENDING VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - name: Final text-only context
        run: python3 -B scripts/pr16_research_natural_spending_terminal.py snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-natural-spending-terminal
          path: |
            .local/pr16-natural-terminal/summary.json
            .local/pr16-natural-terminal/record.stdout.txt
            .local/pr16-natural-terminal/record.stderr.txt
            .local/pr16-natural-terminal/context.zip
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

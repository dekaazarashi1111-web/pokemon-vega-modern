name: pr16-research-phase0-load-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-phase0-load-20260926.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-research-phase0-load-20260926
  cancel-in-progress: false
jobs:
  phase0-load:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: phase0実装用のtracked textを限定取得（既受入試験は実行しない）
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, tarfile
          root = pathlib.Path('.')
          out = root / '.local/pr16-research-phase0-load/public'
          out.mkdir(parents=True)
          exact = {'AGENTS.md', 'CHATGPT_RESUME.md', 'config/active_play_baseline.json', 'design/active_play_baseline.md', 'design/run_log.md', 'design/version_log.md', 'content/modernization/pr16_native_supply_resume_20260913.json', 'content/modernization/pr16_bp_chooser_checkpoint.json', 'content/modernization/p08_remaining_work.json', 'scripts/validate_task_graph.py', 'scripts/guard_private_files.py'}
          prefixes = ('scripts/pr16_', 'tests/test_pr16_research', 'tools/mgba_pr16_research', 'overlays/research_economy_v1/', 'overlays/qol_production/', 'content/modernization/pr16_research', 'docs/PR16_RESEARCH', 'docs/CHATGPT_WEB_GITHUB_ENVIRONMENT', '.github/workflows/pr16-research')
          paths = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and (p in exact or p.endswith('/AGENTS.md') or p.startswith(prefixes)) and pathlib.Path(p).suffix in {'.py','.c','.h','.json','.md','.yml'}]
          manifest = {}
          with tarfile.open(out/'source-context.tar.gz', 'w:gz') as archive:
              for name in paths:
                  data = pathlib.Path(name).read_bytes()
                  data.decode('utf-8')
                  manifest[name] = {'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
                  archive.add(name, arcname=name, recursive=False)
          (out/'source-manifest.json').write_text(json.dumps({'source_head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':manifest,'native_runs':0,'unit_runs':0,'rom_changes':0},ensure_ascii=False,indent=2)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-phase0-load-source
          path: .local/pr16-research-phase0-load/public/
          retention-days: 7
          if-no-files-found: error

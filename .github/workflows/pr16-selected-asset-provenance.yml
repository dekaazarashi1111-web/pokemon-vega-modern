name: pr16-selected-asset-provenance
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_selected_asset_provenance.py
      - scripts/pr16_selected_asset_provenance_actions.py
      - tests/test_pr16_selected_asset_provenance.py
      - .github/workflows/pr16-selected-asset-provenance.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-selected-asset-provenance
  cancel-in-progress: false
jobs:
  provenance:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 選定3地点の入力系譜とowner境界を検証して記録
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_selected_asset_provenance_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-selected-asset-provenance-public-text
          path: .local/pr16-selected-asset-provenance/public/
          if-no-files-found: error
          retention-days: 90

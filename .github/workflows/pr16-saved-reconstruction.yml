name: PR16 saved byte reconstruction
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-saved-reconstruction.yml
      - scripts/pr16_saved_recipe.py
      - scripts/pr16_saved_reconstruction.py
      - tests/test_pr16_saved_object_bytes.py
      - content/modernization/pr16_saved_reconstruction_seed.json
permissions:
  contents: read
  actions: read
jobs:
  reconstruct:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: 変更したdecoderだけを検証し既受入9契約は原本を継承
        run: |
          mkdir -p .local/pr16-saved-reconstruction
          git rev-parse HEAD > .local/pr16-saved-reconstruction/tested-head.txt
          PYTHONPATH=scripts:tests python3 -m unittest test_pr16_saved_recipe.SavedRecipeTests.test_disassembly_exact_halfwords_and_literals test_pr16_saved_object_bytes -v > .local/pr16-saved-reconstruction/tests.txt 2>&1
          cat .local/pr16-saved-reconstruction/tests.txt
      - name: 保存byte20層と全ROM逆適用を検証
        run: |
          python3 scripts/pr16_saved_reconstruction.py normalize > .local/pr16-saved-reconstruction/normalize.stdout 2> .local/pr16-saved-reconstruction/normalize.stderr
      - name: 成否にかかわらずtext証拠だけ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-saved-byte-reconstruction
          path: |
            .local/pr16-saved-reconstruction/normalized-recipes.json
            .local/pr16-saved-reconstruction/reconstruction.json
            .local/pr16-saved-reconstruction/tested-head.txt
            .local/pr16-saved-reconstruction/tests.txt
            .local/pr16-saved-reconstruction/normalize.stdout
            .local/pr16-saved-reconstruction/normalize.stderr
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

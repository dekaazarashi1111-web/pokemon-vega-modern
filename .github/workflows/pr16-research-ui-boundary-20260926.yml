name: pr16-research-ui-boundary-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-ui-boundary-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-ui-boundary-20260926
  cancel-in-progress: false
jobs:
  ui-boundary:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MODE: finalize
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: exact source転送照合
        shell: python
        run: |
          import subprocess
          bindings = {
            'scripts/pr16_research_ui_boundary.py': '9437e8de685d080b538b554a57f2961cc9190de3',
            'tools/research_ui_boundary_shim.c': '8c684dd679cf650e2de86950043c510616e05020',
            'tests/test_pr16_research_ui_boundary.py': 'c15c179bbceb253ab729eb7aabd7cac14cb09a5b',
            'scripts/pr16_research_ui_boundary_actions.py': '0d5e17955fc8b1de68ff4868ab59fc3ba1a8bb3a',
          }
          for path, sha in bindings.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip() == sha, path
          print('PASS_EXACT_UI_BOUNDARY_SOURCE_TRANSFER')
      - name: 未受入C host境界だけを検証して正本へ記録
        run: python3 -B scripts/pr16_research_ui_boundary_actions.py "$MODE"
      - name: 引継ぎとtask graphと最終index
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-research-lifecycle/public/resume-check.txt
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-research-lifecycle/public/task-graph.txt
          python3 -B scripts/pr16_research_ui_boundary_actions.py guard | tee .local/pr16-research-lifecycle/public/index-guard.txt
      - name: 同branchへcommitと非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260926-RESEARCH-UI-BOUNDARY: 初期化と取引UIの限定host境界${MODE}と引継ぎ記録"
          git push origin "HEAD:refs/heads/$branch"
          reflected=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$reflected"
          printf '%s\n' "$reflected" > .local/pr16-research-lifecycle/public/reflected-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-ui-boundary
          path: .local/pr16-research-lifecycle/public/
          retention-days: 30
          if-no-files-found: error

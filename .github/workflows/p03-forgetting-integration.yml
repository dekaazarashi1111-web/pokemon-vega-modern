name: p03-forgetting-integration
run-name: Accept twelve native forgetting routes and reconcile current remaining work
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/p03-forgetting-integration.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: p03-forgetting-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.actor == 'dekaazarashi1111-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Retrieve exact successful originals and Actions receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/p03-forgetting-integration
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,urllib.request
          sys.path.insert(0,'scripts')
          import record_modernization_p03_forgetting as record
          base='https://api.github.com/repos/'+record.REPO
          directory=pathlib.Path(record.DIRECTORY)
          assert not directory.exists(),'refuse existing originals overwrite'
          directory.mkdir(parents=True)
          def get(suffix):
              request=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          run=get('/actions/runs/'+str(record.RUN));jobs=get('/actions/runs/'+str(record.RUN)+'/jobs?per_page=100')
          artifacts=get('/actions/runs/'+str(record.RUN)+'/artifacts?per_page=100')
          matches=[a for a in artifacts['artifacts'] if a['id']==record.ARTIFACT and a['name']=='p03-p05-remaining-routes']
          assert len(matches)==1
          for name,value in [('actions-run',run),('actions-jobs',jobs),('actions-artifact',matches[0])]:
              (directory/(name+'.json')).write_text(json.dumps(value,indent=2)+'\n')
          subprocess.run(['curl','--fail','--silent','--show-error','--location','--proto','=https','--proto-redir','=https','--header','Authorization: Bearer '+os.environ['GH_TOKEN'],base+'/actions/artifacts/'+str(record.ARTIFACT)+'/zip','--output',str(directory/'original.zip')],check=True)
          assert hashlib.sha256((directory/'original.zip').read_bytes()).hexdigest()==record.ZIP_SHA
          PY
      - name: Revalidate actual originals, source closure and current-work mutations
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_modernization_remaining_routes.py -v 2>&1 | tee .local/p03-forgetting-integration/runtime-contracts.log
          python3 -m unittest discover -s tests -p test_modernization_p08_forgetting_evidence.py -v 2>&1 | tee .local/p03-forgetting-integration/original-mutations.log
          python3 scripts/record_modernization_p03_forgetting.py --write | tee .local/p03-forgetting-integration/write.json
          python3 scripts/record_modernization_p03_forgetting.py | tee .local/p03-forgetting-integration/check.json
          python3 scripts/validate_task_graph.py
      - name: Record scope, current backlog and read-only CI checks
        env:
          INTEGRATION_RUN: ${{ github.run_id }}
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          text='\n\n## 2026-09-10 — USER-MODERNIZATION-P03-P05 / 技忘れ12経路とStage84空き技PP修正\n\nStage83の通常Bag→わざメモリー→技忘れ操作で、末尾MOVE_NONEのPPが35になる不具合を実再現した。Stage84はID 0のcanonical PP 35→0の1byteのみ修正。実技の全行、P06の採用2種3項目、保存ABI、Stage62基準は不変。旧Stage83で同じ不具合が検出される対照1件も維持した。\n\nActions 34459625383、実行HEAD 8846cd86de22af35b41eb358b9ed30e4c825750c、GCC 13.3.0 / mGBA 0.10.2で12件PASS。4枠削除、PP Up警告拒否、最終確認拒否、画面取消、最後の1技拒否、2フォーム制約、秘伝技削除、Keldeoの姿復帰を、通常保存・新規core Continueまで検証。12新規プロセス・24core・キャッシュ0、ホスト書込7 API拒否、保存後100byte個体一致を確認。準備個体・位置・道具はfixtureなので自然入手は受入対象外。\n\n原本78ファイルのZIP、Actions run/jobs/artifact原本、20入力source hashを検証し、P08個別受入 content/modernization/p08_p03_forgetting_acceptance.json に接続した。新しい残件総括は content/modernization/p08_remaining_work.json。旧 p08_current_acceptance.json はStage81起点の履歴として保持し、現時点の残件数には使用しない。受入済みの繁殖8件・容量3件・Mega6+36件・思い出し46件を再び未着手と数えず、P06採用2件を反映する。異なる候補の成功を最終候補全体の受入へ昇格しない。\n\nP05の現行facility_modes.csvはFactory/Mirageの20モードで、Circus入場モードは同採用表に無い。表外の入口まで不存在と断定しない。実際の受付・入場から特性抑制までの検証は未完了。P03の他の進化・フォーム習得、その他タマゴ供給、economy正式確定、P06工程受入、P07既存資料照合・採用・実装、単一最終候補と配布判定も残る。\n\n本統合は新規mGBA実行0件。PRはDraftのまま、マージ・配布・プレイ基準変更なし。全体guardの既存ROM/save・過去path違反は未解消であり、差分guardと分離して記録する。\n\nIntegration run: '+os.environ['INTEGRATION_RUN']+'; source: '+os.environ['SOURCE_HEAD']+'.\n'
          for name in ('design/run_log.md','design/version_log.md'):
              p=pathlib.Path(name);p.write_bytes(p.read_bytes()+text.encode())
          doc=pathlib.Path('docs/P03_FORGETTING_E2E.md');assert not doc.exists();doc.write_text('# P03 技忘れの実操作・保存受入\n'+text)
          p=pathlib.Path('docs/P08_CURRENT_ACCEPTANCE.md')
          notice='> 2026-09-10更新: **現在の残件は `content/modernization/p08_remaining_work.json` を参照。** `p08_current_acceptance.json` はStage81起点の履歴であり、繁殖未完了・P06採用0件などを現在の残件として数えない。技忘れ12件の新しい個別受入は `p08_p03_forgetting_acceptance.json`。工程全体・リリースは未承認。\n\n'
          p.write_bytes(notice.encode()+p.read_bytes()+text.encode())
          p=pathlib.Path('.github/workflows/ci.yml')
          step='''
                - name: P03 forgetting originals and reconciled remaining work
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 -m unittest discover -s tests -p test_modernization_remaining_routes.py -v
                    python3 -m unittest discover -s tests -p test_modernization_p08_forgetting_evidence.py -v
                    python3 scripts/record_modernization_p03_forgetting.py
                    git diff --exit-code -- config/active_play_baseline.json content/modernization/p08_*.json
          '''
          import textwrap
          step=textwrap.dedent(step)
          step='\n'+'\n'.join('      '+line if line else '' for line in step.strip('\n').splitlines())+'\n'
          assert 'P03 forgetting originals and reconciled remaining work' not in p.read_text()
          p.write_bytes(p.read_bytes()+step.encode())
          PY
      - name: Preserve inherited guard findings and publish only reviewed changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          git add .github/workflows/ci.yml design/run_log.md design/version_log.md docs/P03_FORGETTING_E2E.md docs/P08_CURRENT_ACCEPTANCE.md content/modernization/p08_p03_forgetting_acceptance.json content/modernization/p08_remaining_work.json
          git add content/modernization/p08_forgetting_evidence/34459625383/actions-*.json
          git add -f content/modernization/p08_forgetting_evidence/34459625383/original.zip
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile
          out=pathlib.Path('.local/p03-forgetting-integration')
          prefix='content/modernization/p08_forgetting_evidence/34459625383/'
          allowed={'.github/workflows/ci.yml','design/run_log.md','design/version_log.md','docs/P03_FORGETTING_E2E.md','docs/P08_CURRENT_ACCEPTANCE.md','content/modernization/p08_p03_forgetting_acceptance.json','content/modernization/p08_remaining_work.json',*(prefix+n for n in ('original.zip','actions-run.json','actions-jobs.json','actions-artifact.json'))}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0'));assert changed==allowed,(changed,allowed)
          for name in changed:assert subprocess.check_output(['git','show',':'+name])==pathlib.Path(name).read_bytes(),name
          assert hashlib.sha256(subprocess.check_output(['git','show',':'+prefix+'original.zip'])).hexdigest()=='aa7a122729052c711e27a85658ad96277837b55aa961b8f33799ae2ebf975e04'
          def guard(label,env):
              p=subprocess.run(['python3','scripts/guard_private_files.py'],env=env,capture_output=True)
              (out/(label+'.stdout.log')).write_bytes(p.stdout);(out/(label+'.stderr.log')).write_bytes(p.stderr)
              return p.returncode,p.stdout,p.stderr
          after=guard('full-staged',os.environ.copy())
          with tempfile.TemporaryDirectory() as tmp:
              env=dict(os.environ,GIT_INDEX_FILE=str(pathlib.Path(tmp)/'parent.index'))
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True);before=guard('full-parent',env);assert before==after,'new whole-index guard findings'
              env['GIT_INDEX_FILE']=str(pathlib.Path(tmp)/'changed.index');subprocess.run(['git','read-tree','--empty'],env=env,check=True)
              for name in sorted(changed):
                  sha=subprocess.check_output(['git','rev-parse',':'+name],text=True).strip()
                  subprocess.run(['git','update-index','--add','--cacheinfo','100644',sha,name],env=env,check=True)
              scoped=guard('changed-blobs',env);assert scoped[0]==0,scoped
          (out/'guard-scope.json').write_text(json.dumps(dict(whole_parent_exit=before[0],whole_staged_exit=after[0],inherited_findings_unchanged=True,changed_blobs=len(changed),changed_guard_exit=scoped[0]),indent=2)+'\n')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-P03-P05: accept twelve forgetting routes, preserve originals and reconcile remaining work'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > .local/p03-forgetting-integration/published-head.txt
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p03-forgetting-integration
          path: |
            .local/p03-forgetting-integration/
            content/modernization/p08_p03_forgetting_acceptance.json
            content/modernization/p08_remaining_work.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: pr16-learnset-wiki-publish
# Reuse verified 36 tests/two builds; only materialize the identical tree once after the failed publication.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-wiki-publish.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-wiki-followup
  cancel-in-progress: false
jobs:
  wiki-publish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新しい公開view10試験だけを実行
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-learnset-wiki-publish
          python3 -B -m unittest tests.test_pr16_learnset_wiki_publish -v >.local/pr16-learnset-wiki-publish/unit.txt 2>&1
      - name: 成功原本から同一treeを復元し公開証拠と引継ぎを記録
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_wiki_publish.py publish
      - name: 引継ぎ・タスク・限定最終indexを検証
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_wiki_publish.py paths | tr '\n' '\0' >.local/pr16-learnset-wiki-publish/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-wiki-publish/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_learnset_wiki_publish.py guard
      - name: 同branchへ非force commit/pushし最新refを照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260923-LEARNSET-WIKI: 成功済み4932fileの後継Wikiと原本結合を反映し公開ログを修復'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "RESULT=DONE TASK=USER-20260923-LEARNSET-WIKI VERIFY=PASS COMMIT=$sha SCOPE=LEARNSET_WIKI_NOT_GAMEPLAY" | tee .local/pr16-learnset-wiki/proof/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-wiki-tree
          path: .local/pr16-learnset-wiki-publish/wiki-tree.zip
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-wiki-proof
          path: |
            .local/pr16-learnset-wiki/proof/
          retention-days: 30
          if-no-files-found: warn
      - name: 失敗時だけ公開処理のdiagnosticを保存
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr16-learnset-wiki-publish-failure
          path: .local/pr16-learnset-wiki-publish/failure.json
          retention-days: 30
          if-no-files-found: warn

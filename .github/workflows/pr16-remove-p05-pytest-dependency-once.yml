name: PR16 remove P05 pytest dependency once

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-remove-p05-pytest-dependency-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/modernization-followup-20260908
          fetch-depth: 0

      - name: Add dependency-free module test runner
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/run_module_tests.py <<'PY'
          #!/usr/bin/env python3
          """Run unittest cases and argument-free module-level test_* functions."""
          from __future__ import annotations

          import importlib
          import importlib.util
          import inspect
          from pathlib import Path
          import sys
          import traceback
          import unittest


          def load_target(target: str):
              path = Path(target)
              if not path.is_file():
                  return importlib.import_module(target)
              module_name = f"_plain_tests_{path.stem}"
              spec = importlib.util.spec_from_file_location(module_name, path)
              if spec is None or spec.loader is None:
                  raise ImportError(f"cannot load test file: {path}")
              module = importlib.util.module_from_spec(spec)
              sys.modules[module_name] = module
              spec.loader.exec_module(module)
              return module


          def run_target(target: str) -> bool:
              module = load_target(target)
              ok = True

              suite = unittest.defaultTestLoader.loadTestsFromModule(module)
              if suite.countTestCases():
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  ok = result.wasSuccessful() and ok

              functions = [
                  (name, value)
                  for name, value in sorted(vars(module).items())
                  if name.startswith("test_") and inspect.isfunction(value)
              ]
              for name, function in functions:
                  required = [
                      parameter
                      for parameter in inspect.signature(function).parameters.values()
                      if parameter.default is inspect.Parameter.empty
                      and parameter.kind
                      in (inspect.Parameter.POSITIONAL_ONLY, inspect.Parameter.POSITIONAL_OR_KEYWORD, inspect.Parameter.KEYWORD_ONLY)
                  ]
                  if required:
                      names = ", ".join(parameter.name for parameter in required)
                      print(f"ERROR {target}:{name}: unsupported required arguments: {names}", file=sys.stderr)
                      ok = False
                      continue
                  try:
                      function()
                  except Exception:
                      print(f"FAIL {target}:{name}", file=sys.stderr)
                      traceback.print_exc()
                      ok = False
                  else:
                      print(f"PASS {target}:{name}")
              return ok


          def main(argv: list[str]) -> int:
              if len(argv) < 2:
                  print("usage: run_module_tests.py MODULE_OR_PATH [MODULE_OR_PATH ...]", file=sys.stderr)
                  return 2
              ok = True
              for target in argv[1:]:
                  ok = run_target(target) and ok
              return 0 if ok else 1


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv))
          PY
          chmod +x scripts/run_module_tests.py

      - name: Point both P05 workflows at the shared runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/pr16-p05-native-supply-reconciliation.yml'): (
                  'run: python3 -m pytest -q tests/test_pr16_p05_native_supply_reconciliation.py',
                  'run: python3 scripts/run_module_tests.py tests/test_pr16_p05_native_supply_reconciliation.py',
              ),
              Path('.github/workflows/pr16-p05-native-supply-evidence-map.yml'): (
                  'run: python3 -m pytest -q tests/test_pr16_p05_native_supply_evidence_map.py',
                  'run: python3 scripts/run_module_tests.py tests/test_pr16_p05_native_supply_evidence_map.py',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: pytest command edit point differs')
              path.write_text(text.replace(old, new))
          PY

      - name: Preserve the documented cold Continue policy boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr16_p05_native_supply_evidence_map.py')
          text = path.read_text()
          old = 'demonstrate the documented cold-Continue boundary and reselect normally when required'
          new = 'demonstrate the documented cold Continue boundary and reselect normally when required'
          if text.count(old) != 1:
              raise SystemExit('policy cold Continue contract edit point differs')
          path.write_text(text.replace(old, new))
          PY

      - name: Validate both focused suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/run_module_tests.py
          python3 scripts/run_module_tests.py \
            tests/test_pr16_p05_native_supply_reconciliation.py \
            tests/test_pr16_p05_native_supply_evidence_map.py
          git diff --check

      - name: Commit validated workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr16-remove-p05-pytest-dependency-once.yml
          git add \
            scripts/run_module_tests.py \
            scripts/pr16_p05_native_supply_evidence_map.py \
            .github/workflows/pr16-p05-native-supply-reconciliation.yml \
            .github/workflows/pr16-p05-native-supply-evidence-map.yml
          git commit -m "USER-MODERNIZATION: validate P05 workflows without pytest"
          git push origin HEAD:codex/modernization-followup-20260908

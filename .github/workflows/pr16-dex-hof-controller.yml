name: pr16-dex-hof-controller
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-dex-hof-controller.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-hof-controller
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  controller:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact new controller source and previous evidence
        run: python3 -B scripts/pr16_dex_hof_controller_actions.py guard
      - name: Official Ubuntu ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev
      - name: New C host and ARM footprint
        run: python3 -B scripts/pr16_dex_hof_controller_actions.py run
      - name: Closed controller publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_hof_controller_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-hof-controller-text-only
          path: public-dex-hof-controller
          retention-days: 90
          if-no-files-found: error


name: pr16-learnset-floette
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/pr16-learnset-floette-run.json]
permissions:
  contents: read
concurrency:
  group: pr16-learnset-floette
  cancel-in-progress: false
jobs:
  floette-verify:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 原本/親を再生成せず新44試験と実owner C全数を検証
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_floette_verify.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-floette-proof
          path: .local/pr16-learnset-floette/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-learnset-floette-data
          path: .local/pr16-learnset-floette/build11/
          retention-days: 30
          if-no-files-found: error

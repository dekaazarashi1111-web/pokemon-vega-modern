name: pr16-learnset-progress
# 固定ROM入口の限定診断。完了受入ではなく、旧試験/ARM/nativeの再実行なし。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-progress.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-progress
  cancel-in-progress: false
jobs:
  progress-boundary:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 逆アセンブラだけ導入
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
      - name: 既存ゲーム入口の読取専用診断
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_progress_abi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-progress-abi
          path: .local/pr16-learnset-progress/proof/
          retention-days: 30
          if-no-files-found: error

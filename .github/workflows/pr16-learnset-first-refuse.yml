name: pr16-learnset-first-refuse
# 未受入first-question拒否1caseのみ。旧4成功/ARM/原本生成を再実行しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-first-refuse.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-first-refuse
  cancel-in-progress: false
jobs:
  first-refuse:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ローカル検証済みの新source転送identity
        run: |
          echo '0e143e468f73fa6207cbc4a694389e5e64dd7dd11acdeb60d9cedbc9663d9258  scripts/pr16_learnset_first_refuse.py' | sha256sum -c -
          echo '4cbb4540e6f5eac404f9d6820c1b1543e40ed04cf701b7a66742aa327418ed70  tools/mgba_pr16_learnset_first_refuse.c' | sha256sum -c -
          echo '77dd88f258919b4d217cf58c9cb1e5c7cc416d88cef2b20ae22286685d3ca4b8  tests/test_pr16_learnset_first_refuse.py' | sha256sum -c -
      - name: host mGBAだけを準備（ARM compilerなし）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmgba-dev
      - name: 新21試験・保存recipe復元・最初の質問でB拒否1case
        id: native
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_first_refuse.py execute
      - name: 成功と失敗原本・固定引継ぎ・両ログを記録し最終index検査
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_first_refuse.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_first_refuse.py paths | tr '\n' '\0' >.local/pr16-learnset-first-refuse/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-first-refuse/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_learnset_first_refuse.py guard
      - name: 同branchへ非force commit/push・remote ref照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-LEARNSET-FIRST-REFUSE: 最初の質問の拒否実測・固定引継ぎと両ログを保存'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-learnset-first-refuse/proof/reflected-head.txt
          echo "RESULT=STOPPED TASK=USER-20260925-LEARNSET-FIRST-REFUSE VERIFY=${{ steps.native.outcome }} COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-first-refuse-proof
          path: .local/pr16-learnset-first-refuse/proof/
          retention-days: 30
          if-no-files-found: error
      - name: native失敗を成功へ読み替えない
        if: steps.native.outcome != 'success'
        run: exit 1

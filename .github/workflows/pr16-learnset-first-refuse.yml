name: pr16-learnset-first-refuse
# WIP: 初回だけのtracked text読取。既受入native/unit/buildは呼ばない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-first-refuse.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-learnset-first-refuse
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Git管理内の必要textだけをhash付きで転送（ROM・private入力なし）
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          exact={'AGENTS.md','CHATGPT_RESUME.md','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md','docs/CHATGPT_WEB_GITHUB_ENVIRONMENT_JA.md','content/modernization/pr16_native_supply_resume_20260913.json','content/modernization/pr16_bp_chooser_checkpoint.json','content/modernization/p08_remaining_work.json','design/run_log.md','design/version_log.md','design/active_play_baseline.md','config/active_play_baseline.json'}
          selected=[p for p in paths if p and (p in exact or p.endswith('/AGENTS.md') or p.startswith(('scripts/pr16_','tests/test_pr16_','tools/mgba_pr16_','tools/pr16_','.github/workflows/pr16-learnset-','docs/PR16_LEARNSET_','content/modernization/pr16_learnset_'))) and pathlib.Path(p).suffix in {'.py','.c','.h','.md','.json','.yml','.txt'}]
          out=pathlib.Path('.local/first-refuse-source');out.mkdir(parents=True)
          manifest={'source_head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':{},'native_runs':0,'unit_runs':0,'arm_compiles':0}
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(selected):
                  f=pathlib.Path(p);assert f.is_file() and not f.is_symlink()
                  raw=f.read_bytes();assert len(raw)<16000000 and b'\0' not in raw;raw.decode('utf-8')
                  z.writestr(p,raw);manifest['files'][p]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              z.writestr('source-manifest.json',json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('SOURCE_TEXT_FILES',len(selected),'NATIVE_RERUNS=0 UNIT_RERUNS=0 ARM_COMPILES=0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-first-refuse-source
          path: .local/first-refuse-source/source.zip
          retention-days: 3
          if-no-files-found: error

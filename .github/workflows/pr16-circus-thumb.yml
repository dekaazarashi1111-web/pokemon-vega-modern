name: PR16 Circus typed Thumb repair
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-thumb.yml
      - scripts/pr16_circus_thumb_record.py
      - scripts/pr16_circus_thumb.py
      - tests/test_pr16_circus_thumb*.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-thumb-repair
  cancel-in-progress: false
jobs:
  thumb-repair:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: exact HEADの限定patchを検証して適用
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-circus-thumb-run
          python3 scripts/pr16_circus_thumb_record.py apply > .local/pr16-circus-thumb-run/apply.stdout 2> .local/pr16-circus-thumb-run/apply.stderr
      - name: 新規Thumb契約10件と固定取消原本だけを取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-circus-thumb-run
          python3 -m unittest discover -s tests -p test_pr16_circus_thumb.py -v > "$out/tests.stdout" 2> "$out/tests.stderr"
          gh api repos/${{ github.repository }}/actions/artifacts/10555159622/zip > .local/pr16-circus-prefix-original.zip
      - name: 固定compilerとStage84親入力を復元
        run: |
          set -euo pipefail
          out=.local/pr16-circus-thumb-run
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
      - name: 固定private入力とcharmapだけを復元
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-circus-thumb-run
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          cfg=json.loads((root/'config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          archive=root/'.local/pr16-bp-trial-native-inputs'/name;raw=archive.read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          member='vendor/upstream/CFRU-JP/charmap.tbl'
          with zipfile.ZipFile(archive) as z:data=z.read(member)
          path=root/member
          assert not any(p.is_symlink() for p in (path,*path.parents))
          if path.exists():assert path.read_bytes()==data
          else:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);path.chmod(0o444)
          PY
      - name: 新候補作成のためだけに固定親を再構成（受入native再実行なし）
        run: |
          set -euo pipefail
          out=.local/pr16-circus-thumb-run
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 scripts/pr16_circus_entry.py > "$out/build.stdout" 2> "$out/build.stderr"
          python3 scripts/pr16_circus_thumb.py > "$out/proof.stdout" 2> "$out/proof.stderr"
      - name: 新しい記録契約と固定再開を検査し同branchへ非force commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-circus-thumb-run
          python3 scripts/pr16_circus_thumb_record.py record > "$out/record.stdout" 2> "$out/record.stderr"
      - name: ROM save ELFを除外して検証原本とsourceを保持
        if: always()
        run: |
          python3 - <<'PYEND'
          import hashlib,json,pathlib,re
          out=pathlib.Path('.local/pr16-circus-thumb-evidence');out.mkdir(parents=True,exist_ok=True)
          members={}
          def save(name,p):
              assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes();raw.decode('utf-8');assert len(raw)<2000000 and b'\0' not in raw
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----',raw)
              dst=out/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(raw)
              members[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          for prefix in ('pr16-circus-thumb-run','pr16-circus-entry'):
              source=pathlib.Path('.local')/prefix
              for p in sorted(source.rglob('*')):
                  if p.is_file() and p.suffix in {'.json','.md','.txt','.stdout','.stderr','.log','.ld','.S'}:save(prefix+'/'+p.relative_to(source).as_posix(),p)
          for name in ('scripts/pr16_circus_entry.py','scripts/pr16_circus_thumb.py','scripts/pr16_circus_thumb_record.py',
                       'tests/test_pr16_circus_thumb.py','tests/test_pr16_circus_thumb_record.py','.github/workflows/pr16-circus-thumb.yml'):
              save('source/'+name,pathlib.Path(name))
          (out/'members.json').write_text(json.dumps(members,indent=2)+'\n')
          PYEND
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-thumb
          path: .local/pr16-circus-thumb-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

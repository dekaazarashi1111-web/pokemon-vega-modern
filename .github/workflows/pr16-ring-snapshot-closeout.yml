name: pr16-ring-snapshot-closeout
run-name: Saved caller coverage and completed CI (no emulator)
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-snapshot-closeout.yml
      - scripts/pr16_ring_snapshot_closeout.py
      - tests/test_pr16_ring_snapshot_closeout.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-snapshot-closeout
  cancel-in-progress: false
jobs:
  closeout:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Project saved coverage, verify CI, record and non-force push
        run: python3 scripts/pr16_ring_snapshot_closeout.py
      - name: Check text-only export
        if: always()
        id: export
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.local/pr16-ring-snapshot-closeout');assert root.is_dir()
          for p in root.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt'}
              raw=p.read_bytes();raw.decode('utf8');assert b'\0' not in raw and len(raw)<2000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----',raw)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: pr16-ring-snapshot-closeout
          path: .local/pr16-ring-snapshot-closeout/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: PR16 candidate wiki
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-candidate-wiki.yml
      - scripts/build_pr16_candidate_wiki.py
      - scripts/pr16_candidate_wiki_*.py
      - tests/test_pr16_candidate_wiki.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: pr16-candidate-wiki
  cancel-in-progress: false
jobs:
  wiki:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ID・供給CSV・runtime metadataだけを補足（旧取得source/native再実行なし）
        run: |
          mkdir -p /tmp/pr16-wiki-context
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          allowed = {'manifests', 'overlays', 'vendor', 'generated'}
          suffixes = {'.py', '.json', '.jsonl', '.md', '.yml', '.yaml', '.h', '.c', '.s', '.S', '.sh', '.toml', '.txt', '.tbl', '.csv', '.inc', '.ld'}
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          manifest = {}
          pathlib.Path('/tmp/pr16-wiki-context/workspace.json').write_text(json.dumps({'root': sorted(p.name for p in pathlib.Path('.').iterdir()), 'anchor_present': pathlib.Path('build/stages/80_modernization_runtime_boundary_repair.gba').is_file(), 'generated_files': sorted(str(p) for p in pathlib.Path('generated').rglob('*') if p.is_file()), 'report_files': sorted(str(p) for p in pathlib.Path('reports/generated').glob('*.json') if p.is_file())}, indent=2))
          with zipfile.ZipFile('/tmp/pr16-wiki-context/tracked-text.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  p = pathlib.Path(name)
                  if not name or not p.is_file() or p.is_symlink():
                      continue
                  selected = (p.parts[0] in allowed and p.suffix in suffixes) or (p.parts[0] in {'content','config'} and p.suffix == '.csv') or name.endswith('AGENTS.md')
                  if not selected:
                      continue
                  data = p.read_bytes()
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  if b'\0' in data:
                      continue
                  archive.writestr(name, data)
                  manifest[name] = {'size': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          pathlib.Path('/tmp/pr16-wiki-context/manifest.json').write_text(json.dumps({'head': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'files': manifest}, sort_keys=True, indent=2)+'\n')
          print('supplemental tracked text files:', len(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-wiki-source-supplement
          path: /tmp/pr16-wiki-context/
          retention-days: 3
          if-no-files-found: error

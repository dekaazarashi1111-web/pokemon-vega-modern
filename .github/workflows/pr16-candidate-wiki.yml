name: PR16 candidate wiki
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-candidate-wiki.yml
      - scripts/build_pr16_candidate_wiki.py
      - scripts/pr16_candidate_wiki_*.py
      - tests/test_pr16_candidate_wiki*.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr16-candidate-wiki
  cancel-in-progress: false
jobs:
  wiki:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wiki限定unit（native再実行なし）
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-wiki
          git rev-parse HEAD > .local/pr16-wiki/source-head.txt
          python3 -B -m unittest discover -s tests -p 'test_pr16_candidate_wiki*.py' -v 2>&1 | tee .local/pr16-wiki/unit.log
      - name: 保存済み候補byteから詳細projectionを読取（旧builder・ARM・nativeなし）
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_candidate_wiki_details.py --output .local/pr16-wiki/details.json 2> >(tee .local/pr16-wiki/details.stderr.txt >&2) | tee .local/pr16-wiki/details.stdout.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-wiki-details
          path: .local/pr16-wiki/
          retention-days: 3
          if-no-files-found: error

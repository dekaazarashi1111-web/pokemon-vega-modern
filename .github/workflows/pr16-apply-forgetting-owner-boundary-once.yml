name: PR16 apply forgetting owner boundary once

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-apply-forgetting-owner-boundary-once.yml
      - scripts/pr16_apply_forgetting_owner_boundary_once.py

permissions:
  contents: write

concurrency:
  group: pr16-forgetting-owner-boundary-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/modernization-followup-20260908
          fetch-depth: 0

      - name: Apply idempotent owner-boundary repair
        run: python3 scripts/pr16_apply_forgetting_owner_boundary_once.py

      - name: Validate source, original evidence and canonical overview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/pr16_apply_forgetting_owner_boundary_once.py \
            scripts/record_modernization_p03_forgetting.py \
            tests/test_modernization_p08_forgetting_evidence.py
          python3 -m unittest discover -s tests -p 'test_modernization_remaining_routes.py'
          python3 -m unittest discover -s tests -p 'test_modernization_p08_forgetting_evidence.py'
          python3 scripts/record_modernization_p03_forgetting.py
          python3 scripts/validate_task_graph.py
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(scripts/record_modernization_p03_forgetting.py|tests/test_modernization_p08_forgetting_evidence.py)$' || true)"
          test -z "$unexpected"

      - name: Commit validated source-only repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              scripts/record_modernization_p03_forgetting.py \
              tests/test_modernization_p08_forgetting_evidence.py; then
            echo 'Owner-boundary repair is already applied.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/record_modernization_p03_forgetting.py \
            tests/test_modernization_p08_forgetting_evidence.py
          git diff --cached --check
          git commit -m 'USER-MODERNIZATION: preserve remaining-work owner projections'
          git pull --rebase origin codex/modernization-followup-20260908
          git push origin HEAD:codex/modernization-followup-20260908

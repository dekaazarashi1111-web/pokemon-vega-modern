name: pr16-ring-story-initializer-contracts
run-name: field初期化資源とcallback終了の限定検証
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-story-initializer-contracts.yml
      - scripts/pr16_ring_story_initializer_contracts.py
      - tests/test_pr16_ring_story_initializer_contracts.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-story-initializer-contracts
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: callback部分書込と初期化境界を検証し同branchへ記録
        run: python3 scripts/pr16_ring_story_initializer_contracts.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-story-initializer-contracts
          path: |
            .local/pr16-ring-story-initializer-contracts/analysis.json
            .local/pr16-ring-story-initializer-contracts/tests.json
            .local/pr16-ring-story-initializer-contracts/tests.txt
            .local/pr16-ring-story-initializer-contracts/guard.json
            .local/pr16-ring-story-initializer-contracts/recorded-result.json
            .local/pr16-ring-story-initializer-contracts/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: PR16 Wiki resume identity sync
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-wiki-resume-identity.yml
      - scripts/pr16_wiki_resume_identity.py
      - tests/test_pr16_wiki_resume_identity.py
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr16-candidate-wiki
  cancel-in-progress: false
jobs:
  identity:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 表示同期8境界だけを検証
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-wiki-resume-identity
          python3 -B -m unittest discover -s tests -p test_pr16_wiki_resume_identity.py -v 2>&1 | tee .local/pr16-wiki-resume-identity/unit.txt
      - name: 完了済みWiki原本へMD・JSONを同期し同branchへ非force反映
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_wiki_resume_identity.py
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          git diff --check
          git diff --exit-code -- docs/wiki content/modernization/pr16_candidate_wiki_acceptance.json content/modernization/pr16_candidate_wiki_completed_runs_20260921.json config/active_play_baseline.json CHATGPT_RESUME.md AGENTS.md state/source-lock.json
          git add -- content/modernization/pr16_native_supply_resume_20260913.json docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md design/run_log.md design/version_log.md
          python3 -B scripts/pr16_wiki_saved_link_reconcile.py guard
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260921-P08-CANDIDATE-WIKI: 完了Wikiの検証HEADへ固定引継ぎ冒頭を同期し履歴・両ログを保存'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          git rev-parse HEAD > .local/pr16-wiki-resume-identity/reflected-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-wiki-resume-identity
          path: .local/pr16-wiki-resume-identity/
          retention-days: 3
          if-no-files-found: error

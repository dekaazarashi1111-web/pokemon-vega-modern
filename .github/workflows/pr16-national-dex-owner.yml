name: pr16-national-dex-owner
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-national-dex-owner.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-national-dex-owner
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit new rooted owner and record without native replay
        run: python3 -B scripts/pr16_national_dex_owner.py record
      - name: Task graph and scoped final index
        run: |
          python3 -B scripts/validate_task_graph.py --check
          python3 -B scripts/pr16_national_dex_owner.py guard
      - name: Non-force commit and remote text readback
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260929-NATIONAL-DEX-OWNER: 正規grant ownerと14検査、引継ぎ・両ログを記録 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/$branch
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          python3 -B scripts/pr16_national_dex_owner.py snapshot
          echo "RESULT=DONE TASK=USER-20260929-NATIONAL-DEX-OWNER VERIFY=PASS_SCOPED COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-national-dex-owner
          path: .local/pr16-national-dex-owner/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-three-win-source-bootstrap
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-three-win-source-bootstrap.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-three-win-source-bootstrap
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify, test, commit, and non-force push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          remote_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)
          test "$remote_head" = "$GITHUB_SHA"
          for path in \
            scripts/pr16_bp_three_win_reward_native.py \
            tests/test_pr16_bp_three_win_reward_native.py \
            tools/mgba_pr16_bp_three_win_reward.c
          do
            test ! -e "$path"
          done
          tr -d '\n' < .github/repairs/pr16-three-win-source.tar.gz.b64 | base64 -d > /tmp/pr16-three-win-source.tar.gz
          echo '4ef07c7a74d81238416216d79fec8e51ba620a5ef97a5f193484f197f8bf41df  /tmp/pr16-three-win-source.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import pathlib, tarfile
          expected = {
              'scripts/pr16_bp_three_win_reward_native.py',
              'tests/test_pr16_bp_three_win_reward_native.py',
              'tools/mgba_pr16_bp_three_win_reward.c',
          }
          with tarfile.open('/tmp/pr16-three-win-source.tar.gz', 'r:gz') as handle:
              members = handle.getmembers()
              assert {member.name for member in members} == expected
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
              handle.extractall(pathlib.Path('.'), filter='data')
          PY
          sha256sum -c <<'SUMS'
          8f1872f962e4f84b2124ff86527bb256d5c89c7db9814da25bcb01e20c9fe23b  scripts/pr16_bp_three_win_reward_native.py
          a49ccad2958f5f3d15742fdadef927136993fffd580715a1b5d507b753b12955  tests/test_pr16_bp_three_win_reward_native.py
          8633eea9d7ecb32d0b0bd3c90e033c6700ec6952ec36fbc1c0fb9d9eda2decfa  tools/mgba_pr16_bp_three_win_reward.c
          SUMS
          python3 -m py_compile scripts/pr16_bp_three_win_reward_native.py tests/test_pr16_bp_three_win_reward_native.py
          python3 -m unittest discover -s tests -p 'test_pr16_bp_three_win_reward_native.py' -v
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'scripts/pr16_bp_three_win_reward_native.py',
              'tests/test_pr16_bp_three_win_reward_native.py',
              'tools/mgba_pr16_bp_three_win_reward.c',
          ):
              raw = Path(name).read_bytes()
              assert raw.endswith(b'\n') and b'\0' not in raw and b'\r' not in raw
              assert not raw.startswith(b'\xef\xbb\xbf')
              raw.decode('utf-8')
          PY
          git diff --check
          git add \
            scripts/pr16_bp_three_win_reward_native.py \
            tests/test_pr16_bp_three_win_reward_native.py \
            tools/mgba_pr16_bp_three_win_reward.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: extend PR16 through native three-win reward' \
            -m 'Build: continue the retained candidate through battles two and three using only native input.' \
            -m 'Verify: fail closed on the two-win ledger, three-win pending state, exact 9 BP, result 9, and 600-byte original-party restoration.'
          remote_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)
          test "$remote_head" = "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${branch}"

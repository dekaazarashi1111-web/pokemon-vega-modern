name: pr16-bp-spending-closeout
run-name: BP通常購入の原本照合・受入記録・非force反映
on:
  workflow_dispatch:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-bp-spending-closeout.yml
      - scripts/pr16_bp_spending_closeout.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-bp-spending-closeout
  cancel-in-progress: false
jobs:
  closeout:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch only pinned original artifacts and Actions metadata
        shell: bash
        run: |
          set -euo pipefail
          base=.local/pr16-bp-spending-closeout/originals
          mkdir -p "$base"
          while read -r run artifact; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$base/$run.run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=20" > "$base/$run.jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$base/$run.artifact.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$base/$run.zip"
          done <<'PINS'
          34933733445 10383085559
          34945660762 10387360949
          34946969126 10386754174
          PINS
      - name: Verify originals and migrate exact resume schema; no emulator
        run: python3 scripts/pr16_bp_spending_closeout.py prepare
      - name: Focused acceptance and authoritative handoff tests
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-spending-closeout
          python3 -m unittest discover -s tests -p test_pr16_resume.py -v > "$out/resume.stdout" 2> "$out/resume.stderr"
          python3 -m unittest discover -s tests -p test_pr16_bp_spending_resume.py -v > "$out/spending-resume.stdout" 2> "$out/spending-resume.stderr"
          python3 scripts/pr16_resume.py check
          python3 scripts/validate_task_graph.py > "$out/task-graph.stdout" 2> "$out/task-graph.stderr"
          git diff --check
      - name: Append both logs and guard the explicit final index
        run: |
          set -euo pipefail
          python3 scripts/pr16_bp_spending_closeout.py logs
          python3 scripts/pr16_resume.py check
          python3 scripts/pr16_bp_spending_closeout.py stage
          git diff --cached --check
          python3 scripts/pr16_bp_spending_closeout.py guard
      - name: Commit and non-force fast-forward the same branch
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/pulls/16" > .local/pr16-bp-spending-closeout/pr-before-push.json
          python3 - <<'PY'
          import json,os,pathlib
          pr=json.loads(pathlib.Path('.local/pr16-bp-spending-closeout/pr-before-push.json').read_text())
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==os.environ['GITHUB_SHA']
          assert pr['head']['ref']=='codex/modernization-followup-20260908'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR-P08-6: 稼得BPの通常購入・保存再開を受入し引継ぎを更新'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,zipfile
          from scripts import pr16_bp_spending_closeout as c
          out=pathlib.Path('.local/pr16-bp-spending-closeout')
          head=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          result={'status':'PASS_RECORDED_AND_NONFORCE_PUSHED','input_head':os.environ['GITHUB_SHA'],
                  'commit':head,'branch':c.BRANCH,'native_run':c.RUN,'native_head':c.HEAD,
                  'new_emulator_processes':0,'release_ready':False,'merge_performed':False}
          (out/'result.json').write_bytes(c.stable(result))
          with zipfile.ZipFile(out/'recorded-text.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in c.PATHS: z.write(name,name)
          print(json.dumps(result))
          PY
      - name: Export source-only closeout result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-bp-spending-closeout
          path: |
            .local/pr16-bp-spending-closeout/*.json
            .local/pr16-bp-spending-closeout/*.stdout
            .local/pr16-bp-spending-closeout/*.stderr
            .local/pr16-bp-spending-closeout/recorded-text.zip
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

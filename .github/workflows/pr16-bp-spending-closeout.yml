name: pr16-bp-spending-closeout
run-name: BP購入の正本照合・source-only記録
on:
  workflow_dispatch:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-bp-spending-closeout.yml
      - scripts/pr16_bp_spending_closeout.py
permissions:
  contents: read
concurrency:
  group: pr16-bp-spending-closeout
  cancel-in-progress: false
jobs:
  closeout:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Existing handoff and focused observer contracts without native replay
        run: |
          python3 scripts/pr16_resume.py check
          python3 -m unittest discover -s tests -p test_pr16_bp_spending_native.py -v
      - name: Exact tracked text snapshot for source-only closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess,zipfile
          root=pathlib.Path('.')
          out=root/'.local/pr16-bp-spending-closeout'
          out.mkdir(parents=True,exist_ok=True)
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          state=json.loads((root/'content/modernization/pr16_native_supply_resume_20260913.json').read_text())
          paths=[
              'AGENTS.md','CHATGPT_RESUME.md','Makefile',
              'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
              'content/modernization/pr16_native_supply_resume_20260913.json',
              'content/modernization/pr16_bp_chooser_checkpoint.json',
              'content/modernization/pr16_bp_chooser_receipt.json',
              'content/modernization/pr16_bp_three_win_reward_verified.json',
              'content/modernization/p08_remaining_work.json',
              'scripts/pr16_resume.py','tests/test_pr16_resume.py',
              'scripts/pr16_bp_spending_native.py','scripts/pr16_bp_spending_native_impl.py',
              'tools/mgba_pr16_bp_spending.c','tests/test_pr16_bp_spending_native.py',
              'tests/test_pr16_bp_shop_observer_abi.py',
              '.github/workflows/pr16-bp-spending-native.yml',
              '.github/workflows/pr16-bp-spending-closeout.yml',
              'scripts/pr16_bp_progress_closeout.py','scripts/pr16_bp_battle_return_closeout.py',
              'scripts/guard_private_files.py','scripts/validate_task_graph.py',
              'overlays/qol_production/qol_production.c',
              'overlays/qol_production/hook_contract_stage35.json',
              'config/qol_production_supply_catalog.csv',
              'scripts/build_qol_production.py','manifests/item_ids.csv',
              'scripts/pr16_gear_originals.py','scripts/pr16_apply_gear_policy_boundary.py',
              'content/modernization/pr16_p05_supply_owner_findings.json',
              'design/run_log.md','design/version_log.md',
              *state['source_bindings'],*state['next_action']['read_paths'],
          ]
          paths=sorted(set(paths))
          manifest={}
          with zipfile.ZipFile(out/'tracked-text.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  assert name in tracked
                  p=root/name
                  assert p.is_file() and not p.is_symlink()
                  raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw
                  assert len(raw)<12000000
                  assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',raw)
                  z.writestr(name,raw)
                  manifest[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'manifest.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'sources':manifest},indent=2)+'\n')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-bp-spending-closeout
          path: .local/pr16-bp-spending-closeout/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

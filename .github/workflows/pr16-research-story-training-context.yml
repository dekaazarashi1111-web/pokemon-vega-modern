name: pr16-research-story-training-context
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-story-training-context.yml]
permissions:
  contents: read
  actions: read
jobs:
  context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Export current scoped source without replaying accepted work
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd();out=root/'.local/pr16-story-training-context';out.mkdir(parents=True)
          start='0019e5c05e1decb52e23bddc7b1a2e7652b36a40'
          assert subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()==start
          cp=json.loads(Path('content/modernization/pr16_research_story_growth_checkpoint.json').read_text())
          assert cp['actions_completion_confirmed'] is True and cp['retained_artifact_id']==10944976226
          assert cp['output_save']=={'size':131088,'sha256':'f36faf0e82cf1c57c8a2c2a5e4bcf30ea6a53432b4d7828c79f1ee2f67cdd8d9'}
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          required={'AGENTS.md','CHATGPT_RESUME.md','README.md','Makefile','.gitignore','design/current_state.md','design/agent_context_map.md','design/tasks_next.md','design/active_play_baseline.md','design/run_log.md','design/version_log.md','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md','content/modernization/pr16_native_supply_resume_20260913.json','content/modernization/pr16_bp_chooser_checkpoint.json','content/modernization/p08_remaining_work.json','state/source-lock.json','config/active_play_baseline.json','tasks/task_graph.json'}
          def ident(raw):return {'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          def selected(name):
              p=Path(name)
              return (name in required or (p.suffix=='.py' and p.parts[0] in ('scripts','tools')) or name.startswith(('tests/test_pr16_research','content/modernization/pr16_research_story_growth','docs/PR16_RESEARCH_STORY_','.github/workflows/pr16-research-story-')) or (p.parent==Path('content/modernization') and name.startswith('content/modernization/pr16_research_') and p.suffix=='.json') or (p.parent==Path('.github') and p.suffix=='.json'))
          manifest={};total=0
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(filter(None,names)):
                  if not selected(name):continue
                  p=Path(name);assert not p.is_symlink() and p.is_file()
                  raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw
                  total+=len(raw);assert total<150000000
                  z.writestr(name,raw);manifest[name]=ident(raw)
              z.writestr('source-head.txt',os.environ['GITHUB_SHA']+'\n')
              z.writestr('source-manifest.json',json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          receipt={'schema_version':1,'status':'SCOPED_SOURCE_ONLY_NOT_NEW_NATIVE_ACCEPTANCE','source_head':os.environ['GITHUB_SHA'],'start_head':start,'run_id':int(os.environ['GITHUB_RUN_ID']),'source_archive':ident((out/'source.zip').read_bytes()),'source_files':len(manifest),'parent_artifact':10944976226,'native_processes':0,'accepted_case_reruns':0,'rom_changes':0,'host_compiles':0,'arm_compiles':0,'release_ready':False,'active_baseline_changed':False}
          (out/'preparation.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-story-training-source
          path: .local/pr16-story-training-context
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: Apply PR16 generic FORM proven entry ordering

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-entry-matrix-apply.yml

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-entry-matrix-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact evidence-derived source patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import zlib

          expected_before = {
              "tools/mgba_pr16_generic_form_carry.c": "8080b1a1e6168ae5c9e1eb680714cf16e62628b72e197b9bb062a9c790a09042",
              "tests/test_pr16_generic_form_carry.py": "1eec5a318269536126bec51f52372dfec768ce5879ae73619baf2edd98c62c25",
          }
          expected_after = {
              "tools/mgba_pr16_generic_form_carry.c": "32542b9c53d93eeefb7487486882bfb0734e1d12eac0e3880b44439a1d192418",
              "tests/test_pr16_generic_form_carry.py": "d6f148f4c64d043857e44641013cb045808b21a37aad81778b39491398669679",
          }
          for path, digest in expected_before.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"preimage differs: {path}: {actual}")
          patch = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          if hashlib.sha256(patch).hexdigest() != "9c9b5fc0b1844e57d39b0c4ca1d57e33a501d31491f0bbbef4d62a3424a63b4c":
              raise SystemExit("embedded patch digest differs")
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          for path, digest in expected_after.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"postimage differs: {path}: {actual}")
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != set(expected_after):
              raise SystemExit(f"unexpected changed paths: {sorted(changed)}")
          PY
      - name: Run focused checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py
          python3 -m unittest discover -s tests -p 'test_pr16_generic_form_carry.py' -v
          git diff --check
      - name: Commit one evidence-derived checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/mgba_pr16_generic_form_carry.c tests/test_pr16_generic_form_carry.py
          git diff --cached --check
          git commit -m "USER-MODERNIZATION: use proven pre-map FORM entry state"
          git push origin "HEAD:${GITHUB_REF_NAME}"

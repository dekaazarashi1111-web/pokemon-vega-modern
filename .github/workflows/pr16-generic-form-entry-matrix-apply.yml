name: Apply PR16 native FORM menu scan

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-entry-matrix-apply.yml

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-entry-matrix-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded input-only native menu scan
        shell: bash
        env:
          PATCH_B64: >-
            ù
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import zlib

          expected_before = {
              "tools/mgba_pr16_generic_form_carry.c": "1f889e25a9ebc543721fc1e985bdc8b68fb82e23878d067a545f1b4d2b57a763",
              "scripts/pr16_generic_form_carry.py": "ef569788d11d9ffc4f39b82a7ed17cc0cba10ec1e47cbb64967f95139ed7e430",
              "tests/test_pr16_generic_form_carry.py": "ef5a16d43c61b444fd7845198641f6fe65ba6cd59c7c229edf7dddaacb356164",
          }
          expected_after = {
              "tools/mgba_pr16_generic_form_carry.c": "274990b12120b7fd653d227a65b87173a61d41e2f9aa1fb4869d5c09509a9aff",
              "scripts/pr16_generic_form_carry.py": "93887b123489db47472bd8d5d3f0a1867858824aa149f5931ea910088b08bd03",
              "tests/test_pr16_generic_form_carry.py": "e40e932f13da6c48411bfbee548649c6efaf4381a558c9a63e539fd88f1ebe31",
          }
          for path, digest in expected_before.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"preimage differs: {path}: {actual}")
          patch = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          if hashlib.sha256(patch).hexdigest() != "25ba5d62212cfdc52a19912f7f68ff842e98975ed814ba8b5d5e61b77f3e0acf":
              raise SystemExit("embedded patch digest differs")
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          for path, digest in expected_after.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"postimage differs* {path}: {actual}")
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != set(expected_after):
              raise SystemExit(f"unexpected changed paths: {sorted(changed)}")
          PYCODE
      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py
          python3 -m unittest discover -s tests -p 'test_pr16_generic_form_carry.py' -v
          git diff --check
      - name: Commit native menu scan checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/mgba_pr16_generic_form_carry.c scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py
          git diff --cached --check
          git commit -m "USER-MODERNIZATION: scan native FORM menu for Shaymin"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Apply PR16 final-league Shaymin row unlock

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-entry-matrix-apply.yml

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-entry-matrix-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact runtime-mapping patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import zlib

          expected_before = {
              "tools/mgba_pr16_generic_form_carry.c": "32542b9c53d93eeefb7487486882bfb0734e1d12eac0e3880b44439a1d192418",
              "tests/test_pr16_generic_form_carry.py": "d6f148f4c64d043857e44641013cb045808b21a37aad81778b39491398669679",
          }
          expected_after = {
              "tools/mgba_pr16_generic_form_carry.c": "1f889e25a9ebc543721fc1e985bdc8b68fb82e23878d067a545f1b4d2b57a763",
              "tests/test_pr16_generic_form_carry.py": "ef5a16d43c61b444fd7845198641f6fe65ba6cd59c7c229edf7dddaacb356164",
          }
          for path, digest in expected_before.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"preimage differs: {path}: {actual}")
          patch = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          if hashlib.sha256(patch).hexdigest() != "776b7b4d8ba5928b11402fea0dee91539a2efcffa24661a98894cd92d03d2b64":
              raise SystemExit("embedded patch digest differs")
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          for path, digest in expected_after.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"postimage differs: {path}: {actual}")
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != set(expected_after):
              raise SystemExit(f"unexpected changed paths: {sorted(changed)}")
          PY
      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py
          python3 -m unittest discover -s tests -p 'test_pr16_generic_form_carry.py' -v
          git diff --check
      - name: Commit one source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/mgba_pr16_generic_form_carry.c tests/test_pr16_generic_form_carry.py
          git diff --cached --check
          git commit -m "USER-MODERNIZATION: unlock final-league Shaymin row"
          git push origin "HEAD:${GITHUB_REF_NAME}"

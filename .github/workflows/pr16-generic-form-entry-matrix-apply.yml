name: Apply PR16 generic FORM entry diagnostic

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-entry-matrix-apply.yml

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-entry-matrix-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import zlib

          expected_before = {
              "scripts/pr16_generic_form_carry.py": "28b563fdca58ce890df4d073c5cc6e5e79fa9fe002754615966d6db47b28d3cf",
              "tests/test_pr16_generic_form_carry.py": "138a0b003a4d9f38806a14d7f4b74ed32ba73ff8450cf19ad3edfdb2f3a31203",
              "tools/mgba_pr16_generic_form_carry.c": "065c05ed8e1a24dc73bc128186c06a69f5daa00f82837f95c6088d31bffe9d7e",
          }
          expected_after = {
              "scripts/pr16_generic_form_carry.py": "ef569788d11d9ffc4f39b82a7ed17cc0cba10ec1e47cbb64967f95139ed7e430",
              "tests/test_pr16_generic_form_carry.py": "1683f12e2d8f48ecab4965cc26c8f921e594b721f5e821189e33cbda4ee1a309",
              "tools/mgba_pr16_generic_form_carry.c": "8080b1a1e6168ae5c9e1eb680714cf16e62628b72e197b9bb062a9c790a09042",
          }
          for path, digest in expected_before.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"preimage differs: {path}: {actual}")
          patch = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          if hashlib.sha256(patch).hexdigest() != "68296b840619297c63981cce37a0ab036af7f86f37198be3c590d4115e8ead66":
              raise SystemExit("embedded patch digest differs")
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          for path, digest in expected_after.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"postimage differs: {path}: {actual}")
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != set(expected_after):
              raise SystemExit(f"unexpected changed paths: {sorted(changed)}")
          PY
      - name: Check Python syntax and whitespace
        shell: bash
        run: |
          python3 -m py_compile scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py
          git diff --check
      - name: Commit one source checkpoint
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py tools/mgba_pr16_generic_form_carry.c
          git diff --cached --check
          git commit -m "USER-MODERNIZATION: diagnose generic FORM entry prerequisites"
          git push origin "HEAD:${GITHUB_REF_NAME}"

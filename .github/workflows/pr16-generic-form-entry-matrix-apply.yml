name: Apply PR16 native FORM menu scan
run-name: Apply verified native FORM scan patches

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-entry-matrix-apply.yml

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-entry-matrix-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify preimages and apply normalized patches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/preimages.sha256 <<'EOF'
          1f889e25cc8f9b212e3a94f97840b2fce93710129f6242402ab54080a7a50b16  tools/mgba_pr16_generic_form_carry.c
          ef56978880bc456d5c3e75af64e2c76d9fd077bcb00c11881cde1957b8bae6b8  scripts/pr16_generic_form_carry.py
          ef5a16d459ba08e0870f047e10cc8a36e13ab6e1573e45a206a37a8b3c306455  tests/test_pr16_generic_form_carry.py
          EOF
          sha256sum -c /tmp/preimages.sha256

          cat > /tmp/patches.sha256 <<'EOF'
          0c1677d6173078d5cb05353d28f3c8c334887592e7dab17373a6765607a59f75  .chatgpt/patches/pr16-generic-form-native-scan-c.patch
          7ff6720fb420263b784b72e2fac1a5cf3064199db57757720fd566ea56390a15  .chatgpt/patches/pr16-generic-form-native-scan-py.patch
          59551792201137a340286c765fee213d5cd0302e10592e1eee60bb37633feb4e  .chatgpt/patches/pr16-generic-form-native-scan-tests.patch
          EOF
          sha256sum -c /tmp/patches.sha256

          for patch in \
            .chatgpt/patches/pr16-generic-form-native-scan-c.patch \
            .chatgpt/patches/pr16-generic-form-native-scan-py.patch \
            .chatgpt/patches/pr16-generic-form-native-scan-tests.patch
          do
            git apply --check --whitespace=error-all "$patch"
            git apply --whitespace=error-all "$patch"
          done

          python3 - <<'PY'
          import subprocess
          expected = {
              'tools/mgba_pr16_generic_form_carry.c',
              'scripts/pr16_generic_form_carry.py',
              'tests/test_pr16_generic_form_carry.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '--'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected patch paths: {sorted(changed)}')
          PY
          sha256sum \
            tools/mgba_pr16_generic_form_carry.c \
            scripts/pr16_generic_form_carry.py \
            tests/test_pr16_generic_form_carry.py

      - name: Compile and run complete focused unit file
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/pr16_generic_form_carry.py \
            tests/test_pr16_generic_form_carry.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_pr16_generic_form_carry.py' \
            -v
          git diff --check

      - name: Record verified application checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat >> design/run_log.md <<EOF

          ## 2026-09-12 — USER-MODERNIZATION PR #16 native FORM menu scan

          - Replaced the rejected embedded-payload workflow with three normalized tracked patches after exact source preimage and patch-digest verification.
          - Applied bounded, input-only native FORM menu discovery to the controller, receipt parser, and focused tests.
          - Passed Python compilation, the complete test_pr16_generic_form_carry.py unit file, and git diff --check in Actions run ${GITHUB_RUN_ID}.
          - The earlier bridge run 34669355733 reached patch READY but could not commit because guard_private_files.py reports pre-existing repository-wide tracked ROM/BPS and machine-path findings unrelated to these three source files.
          - This checkpoint closes patch application only; real-ROM generic acceptance and all later fixed-form/P05/Circus/P08/release work remain open.
          EOF
          cat >> design/version_log.md <<EOF

          ## 2026-09-12 — PR #16 bounded native FORM discovery

          - Removed the fixed page=1/cursor=1 assumption for Shaymin form index 43.
          - Added at-most-20-page, five-row native A/B probing and receipt witnesses menu_page, menu_cursor, probe_count, pages_scanned, and menu_discovery.
          - Preserved no-direct-form-write and no-post-guard-host-write boundaries; temporary apply files are removed in the verified source commit.
          EOF
          git diff --check

      - name: Commit verified source and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .chatgpt/patches/pr16-generic-form-native-scan.patch \
            .chatgpt/patches/pr16-generic-form-native-scan-c.patch \
            .chatgpt/patches/pr16-generic-form-native-scan-py.patch \
            .chatgpt/patches/pr16-generic-form-native-scan-tests.patch \
            .github/workflows/pr16-generic-form-entry-matrix-apply.yml
          git add -- \
            tools/mgba_pr16_generic_form_carry.c \
            scripts/pr16_generic_form_carry.py \
            tests/test_pr16_generic_form_carry.py \
            design/run_log.md \
            design/version_log.md

          python3 - <<'PY'
          import subprocess
          expected = {
              '.chatgpt/patches/pr16-generic-form-native-scan.patch',
              '.chatgpt/patches/pr16-generic-form-native-scan-c.patch',
              '.chatgpt/patches/pr16-generic-form-native-scan-py.patch',
              '.chatgpt/patches/pr16-generic-form-native-scan-tests.patch',
              '.github/workflows/pr16-generic-form-entry-matrix-apply.yml',
              'design/run_log.md',
              'design/version_log.md',
              'scripts/pr16_generic_form_carry.py',
              'tests/test_pr16_generic_form_carry.py',
              'tools/mgba_pr16_generic_form_carry.c',
          }
          staged = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          if staged != expected:
              raise SystemExit(f'unexpected staged paths: {sorted(staged)}')
          unstaged = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          if unstaged:
              raise SystemExit(f'unexpected unstaged paths: {unstaged}')
          PY

          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'USER-MODERNIZATION: apply native FORM menu scan'
          git push origin "HEAD:${GITHUB_REF_NAME}"

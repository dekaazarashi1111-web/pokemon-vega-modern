name: pr16-bp-battle-progress
run-name: Native first move PP consumption and next action on bffd; no BP acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-bp-battle-progress.yml
      - scripts/pr16_bp_battle_progress.py
      - tools/mgba_pr16_bp_battle_progress.c
      - tests/test_pr16_bp_battle_progress.py
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-bp-battle-progress
  cancel-in-progress: false
jobs:
  battle-progress:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate new progress contracts and retain historical evidence without emulator replay
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-battle-progress-workflow
          mkdir -p "$out"
          git rev-parse HEAD > "$out/tested-head.txt"
          python3 -m unittest tests.test_pr16_bp_battle_progress -v > "$out/unit.stdout" 2> "$out/unit.stderr"
          python3 scripts/pr16_bp_chooser_checkpoint.py > "$out/retained-cancel.json"
          python3 scripts/pr16_resume.py check > "$out/resume-check.json"
          python3 scripts/validate_task_graph.py > "$out/task-graph.txt"
          python3 scripts/pr16_fixed_form_closeout.py --check > "$out/fixed-form-retained.json"
      - name: Restore pinned compiler and unchanged Stage84 input
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-battle-progress-workflow
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
      - name: Restore pinned inputs and character map
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-bp-battle-progress-workflow
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.');cfg=json.loads((root/'config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          archive=root/'.local/pr16-bp-trial-native-inputs'/name;raw=archive.read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          member='vendor/upstream/CFRU-JP/charmap.tbl'
          with zipfile.ZipFile(archive) as z:data=z.read(member)
          path=root/member;assert not any(p.is_symlink() for p in (path,*path.parents))
          if path.exists():assert path.read_bytes()==data
          else:path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);path.chmod(0o444)
          (root/'.local/pr16-bp-battle-progress-workflow/charmap-binding.json').write_text(json.dumps({'archive_sha256':bound['sha256'],'member':member,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()},sort_keys=True)+'\n')
          PY
      - name: Rebuild exact candidate parents without historical native case replay
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-battle-progress-workflow
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
      - name: Extend real battle action through first native turn without accepting BP earning
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-battle-progress-workflow
          python3 scripts/pr16_bp_battle_progress.py > "$out/native.stdout" 2> "$out/native.stderr"
          git diff --exit-code
      - name: Preserve bounded completion adapter chain for exact candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,struct,subprocess,tempfile,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-bp-battle-progress-workflow'
          rom=root/'.local/pr16-bp-chooser-successor/candidate.gba'
          if not rom.is_file():raise SystemExit(0)
          raw=rom.read_bytes();assert len(raw)==33554432 and hashlib.sha256(raw).hexdigest()=='bffd0b83e3724c2fba216052a3ff45afd3ab194ca2168244874746ce0e4a9e92'
          names=set()
          for pat in ('overlays/factory_special_event_runtime/*.[ch]','overlays/research_economy*/*.[ch]','overlays/factory_shiny_memorial_runtime/*.[ch]','overlays/facility_runtime/*.[ch]','scripts/build_factory_special_event_runtime.py','scripts/build_research_economy*.py'):
              names.update(str(p) for p in root.glob(pat) if p.is_file())
          bound={}
          with zipfile.ZipFile(out/'completion-chain-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in sorted(names):
                  p=root/n;data=p.read_bytes();data.decode('utf-8');assert not p.is_symlink() and b'\0' not in data and len(data)<2000000
                  bound[n]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()};z.writestr(n,data)
          spans={};texts=[]
          with tempfile.TemporaryDirectory(dir='.local') as d:
              for ptr in (0x093C42C9,0x092DE351,0x092DDCE9,0x092CEA09):
                  a=ptr&~1;data=raw[a-0x08000000:a-0x08000000+384]
                  spans[f'{ptr:08X}']={'address':a,'hex':data.hex(),'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
                  p=pathlib.Path(d)/'code.bin';p.write_bytes(data)
                  texts.append(subprocess.check_output(['arm-none-eabi-objdump','-D','-b','binary','-m','arm','-M','force-thumb','--adjust-vma='+str(a),str(p)],text=True).replace(str(p),'bounded-code-excerpt'))
          (out/'completion-chain-bindings.json').write_text(json.dumps({'sources':bound,'native_code':spans,'completion_pointer':struct.unpack_from('<I',raw,0x12CF791)[0],'candidate_sha256':hashlib.sha256(raw).hexdigest(),'new_emulator_processes':0,'rom_changes':0},sort_keys=True,indent=2)+'\n')
          (out/'completion-chain-disassembly.txt').write_text('\n'.join(texts))
          PY
      - name: Reject ROM save patch private inputs and unsafe source archives
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,stat,zipfile
          roots=[pathlib.Path('.local/pr16-bp-battle-progress-workflow'),pathlib.Path('.local/pr16-bp-battle-progress')]
          forbidden={'.gba','.gb','.gbc','.srm','.sav','.ips','.ups','.bps','.bin','.exe'};bound={}
          for root in roots:
              if not root.exists():continue
              for path in root.rglob('*'):
                  assert not path.is_symlink()
                  if not path.is_file():continue
                  assert path.suffix.lower() not in forbidden and 'private-env' not in path.name
                  raw=path.read_bytes()
                  if path.suffix.lower()=='.zip':
                      with zipfile.ZipFile(path) as z:
                          assert len(z.namelist())==len(set(z.namelist()))<=1000
                          assert sum(i.file_size for i in z.infolist())<=32000000
                          for i in z.infolist():
                              name=pathlib.PurePosixPath(i.filename)
                              assert not name.is_absolute() and '..' not in name.parts and '\\' not in i.filename
                              assert name.suffix.lower() not in forbidden|{'.zip'} and not stat.S_ISLNK(i.external_attr>>16)
                              data=z.read(i);data.decode('utf-8');assert b'\0' not in data
                  elif path.suffix.lower()=='.ppm':assert raw.startswith(b'P6\n240 160\n255\n') and len(raw)==115215
                  else:raw.decode('utf-8');assert b'\0' not in raw and len(raw)<16000000
                  bound[path.relative_to('.local').as_posix()]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          pathlib.Path('.local/pr16-bp-battle-progress-workflow/artifact-members.json').write_text(json.dumps(bound,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-bp-battle-progress
          path: |
            .local/pr16-bp-battle-progress-workflow/
            .local/pr16-bp-battle-progress/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

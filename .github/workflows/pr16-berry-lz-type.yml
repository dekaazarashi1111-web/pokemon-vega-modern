name: pr16-berry-lz-type
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_berry_lz_type.py
      - scripts/pr16_berry_lz_type_actions.py
      - tests/test_pr16_berry_lz_type.py
      - .github/workflows/pr16-berry-lz-type.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-berry-lz-type
  cancel-in-progress: false
jobs:
  singleton-type:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 完了LZ原本から単一型差分だけを検証して記録
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_berry_lz_type_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-berry-lz-type-public-text
          path: .local/pr16-berry-lz-type/public/
          if-no-files-found: error
          retention-days: 90

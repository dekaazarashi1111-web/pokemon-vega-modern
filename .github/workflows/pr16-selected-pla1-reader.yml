name: pr16-selected-pla1-reader
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_selected_pla1_reader.py
      - scripts/pr16_selected_pla1_reader_actions.py
      - tests/test_pr16_selected_pla1_reader.py
      - .github/workflows/pr16-selected-pla1-reader.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-selected-pla1-reader
  cancel-in-progress: false
jobs:
  pla1-reader:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新scope候補復元用toolchainのみ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev gcc g++ make
      - name: 新PLA1全4byteの境界と実consumerのみ検証
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_selected_pla1_reader_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-selected-pla1-reader-public-text
          path: .local/pr16-selected-pla1-reader/public/
          if-no-files-found: error
          retention-days: 90

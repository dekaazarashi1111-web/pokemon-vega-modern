name: pr16-happiny-breeding
run-name: New physical Happiny incense, hatch and cold saves on frozen candidate
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-happiny-breeding.yml
      - scripts/pr16_happiny_breeding.py
      - tests/test_pr16_happiny_breeding.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr16-happiny-breeding
  cancel-in-progress: false
jobs:
  happiny-breeding:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve exact HEAD and fixed Stage84 parent
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-happiny-evidence
          git rev-parse HEAD > .local/pr16-happiny-evidence/tested-head.txt
          bash infra/setup_github_actions.sh --install > .local/pr16-happiny-evidence/toolchain.log 2>&1
          python3 scripts/modernization_final_integration.py prepare > .local/pr16-happiny-evidence/stage84.json
      - name: Restore only the exact adopted V4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-inputs
          gh release download private-environment-v1 --pattern pokemon-vega-private-env-v1-inputs.zip --dir .local/pr16-inputs
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          cfg=json.loads((root/'config/github_private_environment.json').read_text())
          model=next(a for a in cfg['archives'] if a['name']=='pokemon-vega-private-env-v1-inputs.zip')
          archive=root/'.local/pr16-inputs'/model['name'];raw=archive.read_bytes()
          assert len(raw)==model['size'] and hashlib.sha256(raw).hexdigest()==model['sha256']
          name='userfile/imports/Pokemon-Vega_MOVE-DISTRIBUTION-V4_IMPLEMENTATION-READY.zip'
          with zipfile.ZipFile(archive) as z:data=z.read(name)
          assert hashlib.sha256(data).hexdigest()=='4022cd6e1358f58dffc5ebc38b756166f0a1072f948af6934298f65bd82678b2'
          target=root/name
          assert not any(p.is_symlink() for p in (target,*target.parents))
          if target.exists():assert target.read_bytes()==data
          else:
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(0o444)
          PY
      - name: Frozen candidate and fail-closed tests, prior Pichu suite unchanged
        run: |
          set -euo pipefail
          out=.local/pr16-happiny-evidence
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 -m unittest discover -s tests -p test_pr16_happiny_breeding.py -v > "$out/unit.log" 2>&1
          python3 -m unittest discover -s tests -p test_pr16_breeding_delta.py -v >> "$out/unit.log" 2>&1
          cp .local/pr16-evolution-repair/candidate.json "$out/candidate.json"
      - name: Actual daycare, conditional species, retained moves, hatch and cold saves
        run: |
          set -euo pipefail
          python3 scripts/pr16_happiny_breeding.py > .local/pr16-happiny-evidence/native.stdout 2> .local/pr16-happiny-evidence/native.stderr
          git diff --exit-code
      - name: Preserve exact sources and original results, never ROM or save
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-happiny-evidence';out.mkdir(parents=True,exist_ok=True)
          names=['scripts/pr16_happiny_breeding.py','tests/test_pr16_happiny_breeding.py','scripts/pr16_breeding_delta.py','scripts/pr16_repaired_acceptance.py','scripts/run_modernization_p03_breeding_e2e.py','tools/mgba_modernization_p03_breeding_e2e.c','.github/workflows/pr16-happiny-breeding.yml']
          bindings={}
          with zipfile.ZipFile(out/'sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=root/name;raw=p.read_bytes();raw.decode('utf8');assert not p.is_symlink() and b'\0' not in raw
                  z.writestr(name,raw);bindings[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'source-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          (out/'tested-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-happiny-breeding-acceptance
          path: |
            .local/pr16-happiny-evidence/
            .local/pr16-happiny-breeding/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: pr16-story-safe-training
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-safe-training.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-safe-training
  cancel-in-progress: false
jobs:
  training:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure only new training interval and independent Continue
        run: python3 -B scripts/pr16_story_safe_training_actions.py measure
      - name: Record measured originals and fixed handoff
        run: python3 -B scripts/pr16_story_safe_training_actions.py record
      - name: Validate task graph and exact staged text boundary
        run: |
          python3 -B scripts/validate_task_graph.py --check
          python3 -B scripts/pr16_story_safe_training_actions.py guard
      - name: Commit verified text and non-force push same branch
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260928-STORY-SAFE-TRAINING: 野生3勝・Lv8/Save8・独立Continue・93検査を限定受入 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/$branch
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=DONE TASK=USER-20260928-STORY-SAFE-TRAINING VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - name: Read back committed text and retain completion identity
        run: python3 -B scripts/pr16_story_safe_training_actions.py snapshot
      - name: Preserve partial native originals without replay
        if: always()
        run: python3 -B scripts/pr16_story_safe_training_actions.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-safe-training-checkpoint
          path: .local/pr16-story-safe-training/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

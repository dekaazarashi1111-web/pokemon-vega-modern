name: p01-runtime-validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: p01-runtime-14
  cancel-in-progress: false
jobs:
  baseline-and-restore:
    if: >-
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/user-modernization-p01-20260908' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 復元保全・ROM参照parserのfocused回帰と既存guard
        run: |
          python3 scripts/validate_task_graph.py
          python3 scripts/guard_private_files.py
          python3 -m unittest -v tests.test_p01_restore tests.test_p01_rom_audit tests.test_github_private_environment
      - name: 固定toolchainを導入
        run: bash infra/setup_github_actions.sh --install
      - name: 既存固定資材をephemeral runnerへ取得（新規公開なし）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          mkdir -p .local/github-private-environment/assets
          gh release download "$tag" --pattern 'pokemon-vega-private-env-v1-*.zip' --dir .local/github-private-environment/assets
      - name: 固定hash復元・衝突reportの両版保全
        run: |
          python3 scripts/restore_p01_environment.py --archive-dir .local/github-private-environment/assets
          git diff --exit-code
      - name: P01 現行ROMの参照・容量をread-only実測
        run: python3 scripts/audit_p01_rom.py
      - name: Stage62 baselineを同一HEADでcheck（新ROM候補の検証とは別）
        id: baseline_check
        run: python3 scripts/run_p01_baseline_gate.py stage62-check
      - name: Stage62 baselineの独立2 process mGBA
        run: python3 scripts/run_p01_baseline_gate.py stage62-mgba
      - name: Git管理sourceの不変を確認
        run: git diff --exit-code

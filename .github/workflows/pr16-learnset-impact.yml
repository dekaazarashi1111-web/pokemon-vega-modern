name: pr16-learnset-impact
# v2: accepted battle completion only; no accepted native/ARM/Wiki reruns.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-impact.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-impact
  cancel-in-progress: false
jobs:
  impact:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新規14境界試験と戦闘原本の完了照合のみ
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-learnset-impact/proof
          python3 -B -m unittest tests.test_pr16_learnset_impact -v 2>&1 | tee .local/pr16-learnset-impact/proof/unit.txt
          python3 -B scripts/pr16_learnset_impact.py execute
          python3 -B scripts/pr16_learnset_impact.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_impact.py paths | tr '\n' '\0' >.local/pr16-learnset-impact/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-impact/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_learnset_impact.py guard
      - name: 同branchへ非force commit/pushし最新refを照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260923-LEARNSET-IMPACT: 通常戦闘の完了Actionsを原本照合し固定引継ぎ・両ログへ記録'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-learnset-impact/proof/reflected-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-impact-proof
          path: .local/pr16-learnset-impact/proof/
          retention-days: 30
          if-no-files-found: error

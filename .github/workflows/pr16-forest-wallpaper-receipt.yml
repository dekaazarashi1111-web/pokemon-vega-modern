name: pr16-forest-wallpaper-receipt
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_forest_wallpaper_receipt.py
      - scripts/pr16_forest_wallpaper_receipt_actions.py
      - tests/test_pr16_forest_wallpaper_receipt.py
      - .github/workflows/pr16-forest-wallpaper-receipt.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-forest-wallpaper-receipt
  cancel-in-progress: false
jobs:
  forest-receipt:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forest original receipt, singleton validation and nonforce recording
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_forest_wallpaper_receipt_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-forest-receipt-public-text
          path: .local/pr16-forest-receipt/public/
          if-no-files-found: error
          retention-days: 90

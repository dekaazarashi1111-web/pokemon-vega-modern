name: pr16-research-counter-accept
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-counter-accept.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-counter-accept
  cancel-in-progress: false
jobs:
  accept-counter:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover immutable inputs and accept recorded numeric observations
        run: python3 -B scripts/pr16_research_counter_accept.py record
      - name: Task graph, resume and entire task final-index guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/validate_task_graph.py
          mapfile -t owned < <(python3 -B scripts/pr16_research_counter_accept.py paths)
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_counter_accept.py guard
      - name: Non-force numeric acceptance checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260927-RESEARCH-COUNTER: 受付数値2境界の実装・独立受入・引継ぎを確定'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=DONE TASK=USER-20260927-RESEARCH-COUNTER VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - name: Preserve acceptance evidence without private binary inputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-counter-acceptance
          path: |
            .local/pr16-research-counter-accept/public/
            .local/pr16-research-counter-accept/owned.json
            content/modernization/pr16_research_counter_checkpoint.json
            content/modernization/pr16_research_counter_acceptance/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

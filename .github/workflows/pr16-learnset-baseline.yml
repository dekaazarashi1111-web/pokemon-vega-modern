name: pr16-learnset-baseline
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - '.github/pr16-learnset-baseline-run.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr16-learnset-baseline
  cancel-in-progress: false
jobs:
  baseline-verify:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 指定sourceと入力原本だけを固定
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-learnset-baseline/proof .local/pr16-learnset-baseline/assets
          python3 - <<'PY'
          import json, subprocess
          request=json.load(open('.github/pr16-learnset-baseline-run.json'))
          assert request['task']=='USER-20260921-LEARNSET-BASELINE-RESET' and request['mode']=='verify-official'
          for path, expected in request['expected_blobs'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==expected, path
          PY
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --dir .local/pr16-learnset-baseline/assets
          python3 - <<'PY' > .local/pr16-learnset-baseline/proof/input-restore.json
          import json, pathlib, sys
          sys.path.insert(0,'scripts')
          from github_private_environment import restore_archive
          root=pathlib.Path('.').resolve()
          cfg=json.loads((root/'config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-modernization-inputs.zip'
          bound=next(a for a in cfg['archives'] if a['name']==name)
          print(json.dumps(restore_archive(root,root/'.local/pr16-learnset-baseline/assets'/name,bound,False),ensure_ascii=False,sort_keys=True))
          PY
      - name: 今回の39境界試験だけを実行
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_pr16_learnset_baseline -v 2>&1 | tee .local/pr16-learnset-baseline/proof/unit.log
      - name: 固定ZIPから独立2プロセス生成
        shell: bash
        run: |
          set -euo pipefail
          source='userfile/imports/modernization_p01/Pokemon_Vega_Stage61_技習得品質改善版_v1.3.0_20260905.zip'
          PYTHONHASHSEED=11 python3 -B scripts/pr16_learnset_baseline.py prepare --zip "$source" --output .local/pr16-learnset-baseline/build11 > .local/pr16-learnset-baseline/proof/build11.json
          PYTHONHASHSEED=29 python3 -B scripts/pr16_learnset_baseline.py prepare --zip "$source" --output .local/pr16-learnset-baseline/build29 > .local/pr16-learnset-baseline/proof/build29.json
      - name: 全hash一致・実CLI check純読取・tracked不変
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, subprocess, sys
          from tools.pr16_learnset_baseline import file_identity
          root=pathlib.Path('.').resolve(); work=root/'.local/pr16-learnset-baseline'; proof=work/'proof'
          def snapshot(path):
              return {p.name:dict(file_identity(p),mtime_ns=p.stat().st_mtime_ns) for p in path.iterdir()}
          first={p.name:file_identity(p) for p in (work/'build11').iterdir()}
          second={p.name:file_identity(p) for p in (work/'build29').iterdir()}
          assert first==second
          before=snapshot(work/'build11')
          command=[sys.executable,'-B','scripts/pr16_learnset_baseline.py','check','--output',str(work/'build11')]
          result=subprocess.run(command,text=True,capture_output=True,check=True)
          assert result.stderr=='' and before==snapshot(work/'build11')
          (proof/'check.json').write_text(result.stdout)
          request=json.loads((root/'.github/pr16-learnset-baseline-run.json').read_bytes())
          expected=request['local_verification']
          assert first['official_baseline.jsonl']=={'size':expected['official_baseline_size'],'sha256':expected['official_baseline_sha256']}
          log=(proof/'unit.log').read_text()
          assert re.findall(r'^Ran (\d+) tests? in ',log,re.M)==['39'] and re.search(r'\nOK\s*$',log)
          subprocess.run(['python3','-B','scripts/validate_task_graph.py'],check=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          shutil.copytree(work/'build11',proof/'outputs')
          report={'status':'PASS_OFFICIAL_SOURCE_ISOLATION','task':request['task'],'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']), 'focused_tests':39,'two_process_builds_identical':True,'readonly_check_byte_mtime_unchanged':True,'tracked_tree_unchanged':True,'local_and_actions_output_identical':True,'files':first,'rom_changes':0,'new_native_runs':0,'accepted_native_reruns':0,'issue19_complete':False,'release_ready':False}
          (proof/'verify.json').write_text(json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-baseline-verified
          path: .local/pr16-learnset-baseline/proof/
          if-no-files-found: error
          retention-days: 30

name: pr16-generic-form-guard-apply
run-name: Apply post-probe FORM observation guard repair

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-guard-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-guard-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/modernization-followup-20260908
          fetch-depth: 0

      - name: Verify preimages and apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "tools/mgba_pr16_generic_form_carry.c": "3e4677dc1647ab27f85d54fa85c943c2bd2519435914243b8bc971b2d48588cb",
              "tests/test_pr16_generic_form_carry.py": "e977c35e952b18f954a8d60bfe414f8680c0f7cb24143b095306a5d986350949",
          }
          for name, digest in expected.items():
              raw = Path(name).read_bytes()
              assert sha256(raw).hexdigest() == digest, (name, sha256(raw).hexdigest())
              raw.decode("utf-8")

          cpath = Path("tools/mgba_pr16_generic_form_carry.c")
          text = cpath.read_text()
          old = '''    if(v->action==1U){b_press(c,QOL_KEY_B,180);b_wait(c);t.returned=b_frames;t.species_after=b_data(c,M_TARGET,11U);return t;}
              for(unsigned k=0;k<8U && read8(c,M_PARTY_SLOT)!=1U;++k)b_press(c,QOL_KEY_DOWN,30);
              a_require(read8(c,M_PARTY_SLOT)==1U,"generic native picker did not select second individual");
              t.selection=b_frames+1U;b_press(c,QOL_KEY_A,180);b_wait(c);t.returned=b_frames;t.species_after=b_data(c,M_TARGET,11U);
              m_shot(prefix,round,"returned");m_state(c,"returned");return t;
          '''
          new = '''    if(v->action==1U){b_press(c,QOL_KEY_B,180);b_wait(c);t.returned=b_frames;return t;}
              for(unsigned k=0;k<8U && read8(c,M_PARTY_SLOT)!=1U;++k)b_press(c,QOL_KEY_DOWN,30);
              a_require(read8(c,M_PARTY_SLOT)==1U,"generic native picker did not select second individual");
              t.selection=b_frames+1U;b_press(c,QOL_KEY_A,180);b_wait(c);t.returned=b_frames;
              m_shot(prefix,round,"returned");m_state(c,"returned");return t;
          '''
          assert text.count(old) == 1 and new not in text
          text = text.replace(old, new, 1)
          old = '''        a_require(result==(v->action==0U?0U:20U),"generic physical form result differs");
                  a_require(read32(c,P03_SAVE_COUNTER)==counter+autos,"generic form automatic persistence differs");expected_auto+=autos;
                  a_restore(c,&saved);final_species=v->action==0U?(r==0U?M_TARGET_SPECIES:M_BASE_SPECIES):M_BASE_SPECIES;
                  a_require(traces[r].species_after==final_species,"generic observed species differs");m_check(c,final_species,decoy,pid,ot);
          '''
          new = '''        a_require(result==(v->action==0U?0U:20U),"generic physical form result differs");
                  a_require(read32(c,P03_SAVE_COUNTER)==counter+autos,"generic form automatic persistence differs");expected_auto+=autos;
                  /* End the native-input guard before the read-only GetMonData call. */
                  a_restore(c,&saved);traces[r].species_after=b_data(c,M_TARGET,11U);
                  final_species=v->action==0U?(r==0U?M_TARGET_SPECIES:M_BASE_SPECIES):M_BASE_SPECIES;
                  a_require(traces[r].species_after==final_species,"generic observed species differs");m_check(c,final_species,decoy,pid,ot);
          '''
          assert text.count(old) == 1 and new not in text
          cpath.write_text(text.replace(old, new, 1))

          tpath = Path("tests/test_pr16_generic_form_carry.py")
          text = tpath.read_text()
          old = '''        self.assertNotIn("#define M_PAGE ", text)
                  self.assertNotIn("#define M_PAGE_CURSOR ", text)
                  self.assertIn("a_guard(c);a_require(b_save(c)", text)
          '''
          new = '''        self.assertNotIn("#define M_PAGE ", text)
                  self.assertNotIn("#define M_PAGE_CURSOR ", text)
                  service = text.split("static struct MTrace m_service", 1)[1].split(
                      "static void m_check", 1
                  )[0]
                  self.assertNotIn("b_data(", service)
                  self.assertIn(
                      "a_restore(c,&saved);traces[r].species_after=b_data(c,M_TARGET,11U);",
                      text,
                  )
                  self.assertIn("a_guard(c);a_require(b_save(c)", text)
          '''
          assert text.count(old) == 1 and new not in text
          tpath.write_text(text.replace(old, new, 1))

          post = {
              "tools/mgba_pr16_generic_form_carry.c": "24955152d2866a7b83011cfc8a9ed1386c0901ecda86637dbc684cc717a73d89",
              "tests/test_pr16_generic_form_carry.py": "6a5bf28056eeab7727ef7abcd8ceb2bb711faadd56f19dc799edab1f1c622fbc",
          }
          for name, digest in post.items():
              assert sha256(Path(name).read_bytes()).hexdigest() == digest
          PY

      - name: Compile Python and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py
          python3 -m unittest discover -s tests -p 'test_pr16_generic_form_carry.py' -v
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "tests/test_pr16_generic_form_carry.py tools/mgba_pr16_generic_form_carry.c "

      - name: Commit and push product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/mgba_pr16_generic_form_carry.c tests/test_pr16_generic_form_carry.py
          git commit -m 'USER-MODERNIZATION: end FORM guard before species read'
          git push origin HEAD:codex/modernization-followup-20260908

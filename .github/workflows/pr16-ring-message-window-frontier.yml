name: pr16-ring-message-window-frontier
run-name: message状態0/1の属性0・palette・frame境界を限定保存
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-message-window-frontier.yml
      - scripts/pr16_ring_message_window_frontier.py
      - tests/test_pr16_ring_message_window_frontier.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-message-window-frontier
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 属性0一wordと指定calleeを検証し同branchへ記録
        run: python3 scripts/pr16_ring_message_window_frontier.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-message-window-frontier
          path: |
            .local/pr16-ring-message-window-frontier/export/
            .local/pr16-ring-message-window-frontier/analysis.json
            .local/pr16-ring-message-window-frontier/tests.json
            .local/pr16-ring-message-window-frontier/tests.txt
            .local/pr16-ring-message-window-frontier/recorded-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

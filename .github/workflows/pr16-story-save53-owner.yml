name: pr16-story-save53-owner
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save53-owner.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save53-owner
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  continuation:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Source guard for unread Miru healing owner only
        run: python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_save53_owner as m; import pr16_learnset_runtime_record as g; g.START=m.BASE; g.CODE=m.CODE; g.OWNED=set(); g.guard()"
      - name: Inspect second candidate healing owner and five new terrain cells; reuse saved town map
        run: python3 -B scripts/pr16_story_save53_owner.py
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save53-owner-checkpoint
          path: .local/pr16-story-save53-owner
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error



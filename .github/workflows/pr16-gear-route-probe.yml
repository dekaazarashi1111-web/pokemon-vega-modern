name: pr16-gear-route-probe
run-name: Inspect physical route from purchased gear without relabelling old acceptance
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-gear-route-probe.yml
      - scripts/pr16_gear_route_probe.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr16-gear-route-probe
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve tracked development text for scoped offline inspection
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-gear-route-probe
          git rev-parse HEAD > .local/pr16-gear-route-probe/tested-head.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-gear-route-probe';bindings={}
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed={'scripts','tools','tests','overlays','config','content','docs','design','infra','.github','tasks','state'}
          with zipfile.ZipFile(out/'sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(filter(None,names)):
                  p=pathlib.Path(name)
                  if p.parts[0] not in allowed and name not in ('README.md','AGENTS.md','MASTER_PLAN.md','Makefile'):continue
                  if p.suffix not in ('.py','.c','.h','.json','.md','.yml','.yaml','.toml','.sh','.csv','.tbl') and name!='Makefile':continue
                  if any(t in name.lower() for t in ('credential','secret','private_key','.env')):continue
                  if p.is_symlink():continue
                  raw=p.read_bytes()
                  if b'\0' in raw:continue
                  try:raw.decode('utf8')
                  except UnicodeDecodeError:continue
                  z.writestr(name,raw);bindings[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'source-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          PY
      - name: Restore pinned compiler and Stage84 without baseline writes
        run: |
          set -euo pipefail
          out=.local/pr16-gear-route-probe
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json"
      - name: Restore adopted V4 and character map with exact archive hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-inputs
          gh release download private-environment-v1 --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir .local/pr16-inputs
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.');cfg=json.loads((root/'config/github_private_environment.json').read_bytes());bindings={}
          for archive,member,digest in (('pokemon-vega-private-env-v1-inputs.zip','userfile/imports/Pokemon-Vega_MOVE-DISTRIBUTION-V4_IMPLEMENTATION-READY.zip','4022cd6e1358f58dffc5ebc38b756166f0a1072f948af6934298f65bd82678b2'),('pokemon-vega-private-env-v1-state.zip','vendor/upstream/CFRU-JP/charmap.tbl',None)):
              model=next(a for a in cfg['archives'] if a['name']==archive);raw=(root/'.local/pr16-inputs'/archive).read_bytes()
              assert len(raw)==model['size'] and hashlib.sha256(raw).hexdigest()==model['sha256']
              with zipfile.ZipFile(root/'.local/pr16-inputs'/archive) as z:data=z.read(member)
              if digest:assert hashlib.sha256(data).hexdigest()==digest
              target=root/member;assert not any(p.is_symlink() for p in (target,*target.parents))
              if target.exists():assert target.read_bytes()==data
              else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(0o444)
              bindings[member]={'archive':archive,'archive_sha256':model['sha256'],'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (root/'.local/pr16-gear-route-probe/input-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          PY
      - name: Build unchanged candidate and inspect bounded physical map graph
        run: |
          set -euo pipefail
          out=.local/pr16-gear-route-probe
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/evolution.stdout" 2> "$out/evolution.stderr"
          python3 scripts/pr16_gear_route_probe.py > "$out/probe.stdout" 2> "$out/probe.stderr"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-gear-route-probe
          path: .local/pr16-gear-route-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

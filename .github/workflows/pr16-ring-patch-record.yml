name: pr16-ring-patch-record
run-name: Ring patch先・handler検証の固定記録／再buildとnativeなし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-patch-record.yml
      - scripts/pr16_ring_patch_record.py
      - tests/test_pr16_ring_patch_record.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-patch-record
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 成功済みrun・job・artifactを固定identityで照合
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,subprocess,sys,zipfile
          sys.path.insert(0,'scripts');import pr16_ring_patch_record as r
          out=r.OUT;out.mkdir(parents=True,exist_ok=True)
          def api(p):return subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+p])
          pr=json.loads(api('pulls/16'));head=os.environ['GITHUB_SHA']
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==head and pr['head']['ref']=='codex/modernization-followup-20260908'
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert json.loads(api('git/ref/heads/codex/modernization-followup-20260908'))['object']['sha']==head
          run=json.loads(api('actions/runs/'+str(r.RUN)))
          job=json.loads(api('actions/jobs/'+str(r.JOB)))
          assert run['head_sha']==r.HEAD and job['run_id']==r.RUN
          assert run['status']==job['status']=='completed' and run['conclusion']==job['conclusion']=='success'
          assert all(s['conclusion']=='success' for s in job['steps'])
          artifact=json.loads(api('actions/artifacts/'+str(r.ARTIFACT)))
          assert artifact['digest']=='sha256:'+r.DIGEST and not artifact['expired']
          assert artifact['workflow_run']['id']==r.RUN and artifact['workflow_run']['head_sha']==r.HEAD
          raw=api('actions/artifacts/'+str(r.ARTIFACT)+'/zip')
          assert len(raw)==r.ZIP_SIZE and hashlib.sha256(raw).hexdigest()==r.DIGEST
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert len(z.namelist())==len(set(z.namelist()))
              members=json.loads(z.read('members.json'))
              for name in ('audit.json','tests.json'):
                  assert r.owner.identity(z.read(name))==members[name]
              assert r.owner.identity(z.read('audit.json'))==r.AUDIT
              tests=json.loads(z.read('tests.json'))
              assert tests=={'tests_run':18,'successful':True,'failures':0,'errors':0,'skips':0}
              value=json.loads(z.read('audit.json'))
          value['verification']={'run':{k:run[k] for k in ('id','head_sha','status','conclusion')},
              'job':{k:job[k] for k in ('id','run_id','status','conclusion')},
              'artifact':{'id':r.ARTIFACT,'run_id':r.RUN,'head_sha':r.HEAD,'sha256':r.DIGEST,'size':len(raw)},
              'focused_tests':tests}
          runs=json.loads(api('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=20'))['workflow_runs']
          value['actions_observed_before_record']=[{k:v[k] for k in ('id','name','head_sha','status','conclusion')} for v in runs]
          (out/'receipt-input.json').write_bytes(r.owner.stable(value))
          PY
          python3 scripts/pr16_ring_patch_record.py prepare --receipt .local/pr16-ring-patch-record/receipt-input.json
      - name: 記録と固定resumeだけ検証し両ログを追記
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,unittest
          out=pathlib.Path('.local/pr16-ring-patch-record')
          suite=unittest.TestSuite()
          for pattern in ('test_pr16_ring_patch_record.py','test_pr16_resume.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          with (out/'tests.txt').open('w') as stream:
              result=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
          value={'tests_run':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'successful':result.wasSuccessful() and not result.skipped}
          (out/'tests.json').write_text(json.dumps(value,indent=2)+'\n');print(value);assert value['successful']
          PY
          python3 scripts/pr16_ring_patch_record.py logs
          python3 scripts/pr16_ring_patch_record.py check
          python3 scripts/pr16_resume.py check
          python3 scripts/validate_task_graph.py
          python3 - <<'PY'
          import subprocess,sys
          sys.path.insert(0,'scripts');import pr16_ring_patch_record as r
          subprocess.run(['git','add','--',*r.OUTPUTS],check=True)
          PY
          python3 scripts/pr16_ring_patch_record.py guard
          git diff --cached --check
      - name: 完了記録をcommitし同branchへ非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os,subprocess
          pr=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/pulls/16']))
          assert pr['state']=='open' and pr['draft'] and not pr['merged'] and pr['head']['sha']==os.environ['GITHUB_SHA']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR-P08-7: Ring patch先・標準handler限定検証と未解決境界を記録'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,subprocess,sys
          sys.path.insert(0,'scripts');import pr16_ring_patch_record as r
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for name in r.OUTPUTS:
              assert subprocess.check_output(['git','show','HEAD:'+name])==(r.ROOT/name).read_bytes()
          assert subprocess.check_output(['git','status','--porcelain','--untracked-files=no'])==b''
          value={'status':'PASS_PATCH_HANDLER_RECORDED_NONFORCE_PUSHED','commit':commit,
              'record_source_head':os.environ['GITHUB_SHA'],'record_run_id':int(os.environ['GITHUB_RUN_ID']),
              'audit_run_id':r.RUN,'audit_source_head':r.HEAD,
              'tests':json.loads((r.OUT/'tests.json').read_bytes()),'guard':json.loads((r.OUT/'guard.json').read_bytes()),
              'committed_outputs_byte_verified':list(r.OUTPUTS),
              'new_emulator_processes':0,'accepted_native_cases_replayed':0,'rom_changes':0,
              'ring_acquisition_accepted':False,'release_ready':False}
          (r.OUT/'recorded-result.json').write_bytes(r.owner.stable(value))
          print('RESULT=DONE TASK='+r.owner.TASK+' VERIFY=PASS COMMIT='+commit)
          print(json.dumps(value))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-patch-record
          path: .local/pr16-ring-patch-record/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-supply-followup-20260925
# BG契約修復の検証・保存。native/ROM生成/旧受入再実行は0。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-supply-followup-20260925.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-supply-followup-20260925
  cancel-in-progress: false
jobs:
  collection-bg-repair:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 固定source修復・影響7試験・引継ぎ両ログ・index検査
        run: python3 -B scripts/pr16_collection_bg_prepare.py
      - name: 修復を同branchへ非force commit/push
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-COLLECTION-BG-REPAIR: BG受付と接近契約を修復・影響7試験と引継ぎを保存'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-collection-bg-repair/reflected-head.txt
          echo "RESULT=DONE TASK=USER-20260925-COLLECTION-BG-REPAIR VERIFY=PASS COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-collection-bg-repair
          path: .local/pr16-collection-bg-repair/
          retention-days: 30
          if-no-files-found: error

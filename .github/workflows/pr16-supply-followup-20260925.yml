name: pr16-supply-followup-20260925
# 後継の限定入力。前回取得済みPython/状態JSONやnativeは再実行しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-supply-followup-20260925.yml]
permissions:
  contents: read
concurrency:
  group: pr16-supply-followup-20260925
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 未取得のC本体・局所依存だけをHEAD固定
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','-z']).decode().rstrip('\0').split('\0')
          out=Path('.local/pr16-supply-followup');out.mkdir(parents=True)
          members={};total=0
          with zipfile.ZipFile(out/'source-bundle.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p=Path(name)
                  chosen=p.parts[0] in ('tools','src','overlays','tests') and p.suffix in ('.c','.h')
                  chosen |= p.parts[0]=='tools' and len(p.parts)>2 and p.suffix=='.py'
                  chosen |= p.parts[0]=='manifests' and p.suffix=='.csv'
                  chosen |= name in ('tests/__init__.py','content/normalized/shared_captures.csv','scripts/lib/__init__.py')
                  if not chosen or p.is_symlink():continue
                  raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw,name
                  assert len(raw)<16*1024*1024,name
                  total+=len(raw);assert total<96*1024*1024,'限定text入力の容量超過'
                  z.writestr(name,raw);members[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              z.writestr('source-index-extra.json',json.dumps({'source_head':os.environ['GITHUB_SHA'],'members':members},sort_keys=True,indent=2)+'\n')
          result={'source_head':os.environ['GITHUB_SHA'],'accepted_native_reruns':0,'arm_compiles':0,'rom_changes':0,'wiki_generations':0,'source_files':len(members),'source_bytes':total,'bundle_sha256':hashlib.sha256((out/'source-bundle.zip').read_bytes()).hexdigest()}
          (out/'bootstrap.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-supply-followup-source-extra
          path: .local/pr16-supply-followup/
          retention-days: 7
          if-no-files-found: error

name: pr16-supply-followup-20260925
# 17受入の終端・目視原本だけ照合。native/旧unit/compile/ROM生成0。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-supply-followup-20260925.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-supply-followup-20260925
  cancel-in-progress: false
jobs:
  collection-terminal:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 17受入原本・42画像・Actions終端・成果commitを照合
        run: python3 -B scripts/pr16_collection_closeout.py
      - name: 引継ぎ整合・task graph・final-index scoped guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_collection_gift_observation.py paths | tr '\n' '\0' >.local/pr16-collection-gifts/paths.z
          git add --pathspec-from-file=.local/pr16-collection-gifts/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_collection_gift_observation.py guard
      - name: 完了記録を同branchへ非force commit/push
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-COLLECTION-GIFTS: 学習owner17件の受入と42画面原本・Actions終端を確定'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-collection-gifts/proof/reflected-head.txt
          echo "RESULT=DONE TASK=USER-20260925-COLLECTION-GIFTS VERIFY=PASS COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-collection-gifts-terminal
          path: .local/pr16-collection-gifts/proof/
          retention-days: 30
          if-no-files-found: error

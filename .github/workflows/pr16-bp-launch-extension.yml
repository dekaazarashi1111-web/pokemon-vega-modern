name: pr16-bp-launch-extension
run-name: PR16 native count observer with staged and committed evidence checks
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-bp-launch-extension.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: pr16-bp-launch-extension
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Execute pinned reviewed installer with index-order correction only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          pin='c42396ba501a785fd4a858d314e2398139eeb943'
          raw=subprocess.check_output(['git','show',pin+':.github/workflows/pr16-bp-launch-extension.yml'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='4f65344916749de2b7f6516a62be38ed5445772d'
          lines=raw.decode().splitlines();blocks=[]
          for i,line in enumerate(lines):
              if line!='        run: |':continue
              body=[]
              for following in lines[i+1:]:
                  if following.startswith('          '):body.append(following[10:])
                  elif not following:body.append('')
                  else:break
              blocks.append('\n'.join(body)+'\n')
          assert len(blocks)==4
          def replace(index,old,new):
              assert blocks[index].count(old)==1,(index,old)
              blocks[index]=blocks[index].replace(old,new)
          replace(0,'test "$(git rev-parse HEAD^)" = 9bf3abe5e0fbef23f8c5727c658ba31a4d556473',
                    'test "$(git rev-parse HEAD^)" = '+pin)
          replace(2,'python3 scripts/pr16_bp_chooser_checkpoint.py > .local/pr16-bp-count-fix/retained-cancel.json',
                    'git add -- content/modernization/p08_remaining_work.json\npython3 scripts/pr16_bp_chooser_checkpoint.py --index > .local/pr16-bp-count-fix/retained-cancel.json')
          replace(2,"p.dump(p.ROOT/p.STATE,s);p.install_routing(p.ROOT)",
                    "s['checkpoint_index_order_failure']={'run_id':34739159633,'job_id':103675775748,'native_processes':0,'reason':'HEAD check before staging modified P08; use staged --index then committed HEAD check','original_conclusion':'failure'}\np.dump(p.ROOT/p.STATE,s);p.install_routing(p.ROOT)")
          replace(2,"for name in ('design/run_log.md','design/version_log.md'):",
                    "note += '\\n- Checkpoint failure retained: run34739159633/job103675775748, native0; focused14/resume18 passed. Only verification order changed: stage P08 and check --index, then verify committed HEAD before native dispatch.\\n'\nfor name in ('design/run_log.md','design/version_log.md'):")
          replace(3,'git diff --exit-code HEAD\n',
                    'git diff --exit-code HEAD\npython3 scripts/pr16_bp_chooser_checkpoint.py > .local/pr16-bp-count-fix/committed-cancel.json\npython3 scripts/pr16_fixed_form_closeout.py --check > .local/pr16-bp-count-fix/committed-fixed-form.json\n')
          out=pathlib.Path('.local/pr16-bp-count-fix');out.mkdir(parents=True,exist_ok=True)
          for i,block in enumerate(blocks):
              script=out/f'reviewed-step-{i+1}.sh';script.write_text(block)
              print(f'Executing reviewed checkpoint phase {i+1}/4',flush=True)
              subprocess.run(['bash','-euo','pipefail',str(script)],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-bp-count-fix
          path: .local/pr16-bp-count-fix/
          retention-days: 30
          if-no-files-found: error

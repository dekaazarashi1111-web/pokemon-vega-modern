name: PR16 wiki followup
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-wiki-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr16-wiki-followup
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 最新の残件関連tracked textだけを取得（受入済みsource取得・build・nativeは反復しない）
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import fnmatch,hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-wiki-followup';out.mkdir(parents=True,exist_ok=True)
          tracked=list(filter(None,subprocess.check_output(['git','ls-files','-z']).decode().split('\0')))
          patterns=['AGENTS.md','CHATGPT_RESUME.md','Makefile','state/source-lock.json',
            'scripts/*wiki*.py','tests/*wiki*.py','scripts/pr16_resume.py','scripts/validate_task_graph.py','scripts/guard_private_files.py',
            'content/modernization/pr16_candidate_wiki*.json','content/modernization/pr16_wiki_remaining_source_inventory.json',
            'content/modernization/pr16_native_supply_resume_20260913.json','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
            'content/modernization/pr16_bp_chooser_checkpoint.json','content/modernization/p08_remaining_work.json',
            'content/modernization/pr16_p08_candidate_transfer.json','content/modernization/pr16_p08_candidate_impact.json',
            'content/collection_supply_v1/canonical_model.json','config/modernization_*.json','config/battle_core.json','config/*wild*.json',
            'manifests/species_ids.csv','manifests/move_ids.csv','manifests/item_ids.csv','manifests/ability_ids.csv',
            'overlays/cfru/*.c','overlays/cfru/*.h','overlays/collection_supply_v1/*.c','overlays/collection_supply_v1/*.h',
            'overlays/modernization_p03_stage74_supply_runtime/*.c','overlays/modernization_p03_stage74_supply_runtime/*.h',
            'overlays/modernization_p05_ability_rom_runtime/*.c','overlays/modernization_p05_ability_rom_runtime/*.h',
            'overlays/wild_overlay/*.c','overlays/wild_overlay/*.h','overlays/*rockruff*/*.c','overlays/*rockruff*/*.h',
            'overlays/stage59_wild_identity_npc_regression_repair/*.c','overlays/stage60_wild_species_root_repair/*.c',
            'scripts/build_battle_core.py','scripts/build_*wild*.py','scripts/build_*rockruff*.py','scripts/build_modernization_floette_gift.py',
            'tools/modernization_floette_gift.py','docs/wiki/README.md',
            'docs/wiki/p08-candidate-46487d98/README.md','docs/wiki/p08-candidate-46487d98/RUNTIME_LIMITATIONS.md',
            '.github/workflows/pr16-candidate-wiki.yml','.github/workflows/pr16-wiki-followup.yml']
          payload={};bindings={};total=0
          for name in sorted(n for n in tracked if any(fnmatch.fnmatchcase(n,p) for p in patterns)):
              p=root/name
              assert p.is_file() and not p.is_symlink(),name
              assert p.suffix in ('.c','.h','.py','.json','.jsonl','.csv','.md','.yml',''),name
              data=p.read_bytes();data.decode('utf-8-sig');assert b'\0' not in data and len(data)<8*1024*1024,name
              total+=len(data);assert total<64*1024*1024
              payload['local/'+name]=data
              bindings[name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          manifest={'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
            'source_bindings':bindings,'tracked_source_paths':[n for n in tracked if n.endswith(('.py','.c','.h','.json','.csv')) and n.split('/')[0] in ('scripts','tests','overlays','config','content','manifests','vendor')],
            'accepted_source_artifacts_reused':[10612238406,10612114273],
            'new_native_runs':0,'accepted_native_reruns':0,'arm_builds':0,'rom_changes':0,'snapshot_rebuilds':0}
          payload['current-source-manifest.json']=(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
          with zipfile.ZipFile(out/'current-sources.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for name,data in sorted(payload.items()):
                  info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  z.writestr(info,data)
          print(json.dumps({'status':'PASS_CURRENT_TRACKED_SOURCE_INPUTS','files':len(bindings),'bytes':total,'source_head':os.environ['GITHUB_SHA'],'new_native_runs':0,'rom_changes':0},sort_keys=True))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-wiki-current-sources
          path: .local/pr16-wiki-followup/current-sources.zip
          retention-days: 3
          if-no-files-found: error

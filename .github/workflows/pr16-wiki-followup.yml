name: PR16 wiki followup
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-wiki-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr16-wiki-followup
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kapibarasan000/CFRU-JP
          ref: e24a16fe39e27ae162faf5b78596d1f3df18489d
          path: .local/pr16-cfru-source
          persist-credentials: false
          sparse-checkout: |
            src
            include
            assembly/battle_scripts
      - name: 追加の読取専用sourceだけをexport（ビルド・nativeなし）
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import fnmatch,hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-wiki-followup';out.mkdir(parents=True,exist_ok=True)
          upstream=root/'.local/pr16-cfru-source';locked='e24a16fe39e27ae162faf5b78596d1f3df18489d'
          assert subprocess.check_output(['git','-C',str(upstream),'rev-parse','HEAD']).decode().strip()==locked
          source=next(s for s in json.loads((root/'state/source-lock.json').read_bytes())['sources'] if s['name']=='cfru')
          assert source['resolved_commit']==locked
          lists=lambda p:subprocess.check_output(['git','-C',str(p),'ls-files','-z']).decode().split('\0')
          up_patterns=['src/build_pokemon.c','src/config.h','src/Tables/raid_encounters.h','src/dynamax.c',
            'src/battle_script_util.c','src/damage_calc.c','include/constants/hold_effects.h','include/config*.h',
            'assembly/battle_scripts/*.s','include/new/build_pokemon.h','include/new/mega.h']
          local_patterns=['overlays/cfru/*.c','overlays/cfru/*.h','tools/modernization_floette_gift.py',
            'scripts/*wiki*.py','scripts/build_*wild*.py','scripts/pr16_p08_impact.py','scripts/pr16_saved_recipe.py',
            'config/*wild*.json','config/battle_core*.json','content/battle_core/*.json','content/moves/*.json',
            'content/vega_moves/*.json','content/collection_supply_v1/canonical_model.json',
            'overlays/modernization_rockruff_own_tempo/*.c','overlays/modernization_rockruff_own_tempo/*.h',
            'scripts/build_modernization_rockruff_own_tempo.py','tools/*wiki*.py','Makefile',
            'content/modernization/pr16_native_supply_resume_20260913.json','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
            'content/modernization/pr16_candidate_wiki_acceptance.json','content/modernization/pr16_candidate_wiki_followup.json',
            'tests/test_pr16_wiki_followup*.py','.github/workflows/pr16-wiki-followup.yml']
          manifest={};total=0;payload={}
          for prefix,base,patterns,commit in [('upstream/CFRU-JP/',upstream,up_patterns,locked),('local/',root,local_patterns,os.environ['GITHUB_SHA'])]:
              names=lists(base)
              for name in sorted(n for n in names if n and any(fnmatch.fnmatchcase(n,p) for p in patterns)):
                  p=base/name;assert p.is_file() and not p.is_symlink(),name
                  assert p.suffix in ('.c','.h','.s','.py','.json','.md','.yml',''),name
                  data=p.read_bytes();data.decode('utf-8-sig');assert b'\0' not in data and len(data)<4*1024*1024,name
                  total+=len(data);assert total<32*1024*1024
                  key=prefix+name;payload[key]=data
                  manifest[key]={'path':name,'commit':commit,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          payload['additional-source-manifest.json']=(json.dumps({'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_bindings':manifest,'new_native_runs':0,'arm_builds':0,'rom_changes':0,
              'local_source_paths':[n for n in lists(root) if n.endswith(('.py','.c','.h','.json')) and any(k in n for k in ('battle','move','wild','wiki','floette'))]},ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
          with zipfile.ZipFile(out/'additional-sources.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for name,data in sorted(payload.items()):z.writestr(name,data)
          print(json.dumps({'status':'PASS_ADDITIONAL_SOURCE_INPUTS','files':len(manifest),'bytes':total,'new_native_runs':0,'rom_changes':0},sort_keys=True))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-wiki-additional-sources
          path: .local/pr16-wiki-followup/additional-sources.zip
          retention-days: 3
          if-no-files-found: error

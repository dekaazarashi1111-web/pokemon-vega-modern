name: PR16 wiki followup
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-wiki-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr16-wiki-followup
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Z consumerの既存link情報・保存symbol表だけを取得（再build/実行なし）
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,struct,subprocess,sys,zipfile
          sys.dont_write_bytecode=True;sys.path.insert(0,'scripts')
          from pr16_candidate_wiki_inputs import Inputs,Rom,candidate_bytes,identity,stable,need,digest
          inp=Inputs();root=inp.root;out=root/'.local/pr16-wiki-followup';out.mkdir(parents=True,exist_ok=True)
          name='build/stages/06_battle_core.json';meta_raw=inp.raw(name);meta=json.loads(meta_raw)
          symbols={};symbol_sources={}
          wanted=('CanUseZMove','GetTypeBasedZMove','CalcMoveSplit','GetSpecialZMove','SetZEffect','ReplaceWithZMoveRuntime','VegaBattlePolicyCanZ','VegaBattlePolicyMarkZ','HandleInputChooseMove','gMovesThatChangePhysicality','GiveBoxMonInitialMoveset','GiveMoveToBoxMon','CreateBoxMon','CreateMon','GetHiddenAbility','GetAbility1','GetAbility2','GetMonAbility','FieldUseFunc_AbilityCapsule')
          def walk(node,path=''):
              if isinstance(node,dict):
                  for key,value in node.items():
                      target=path+'/'+key
                      if key in wanted and type(value) is int and 0x08000000<=value<0x0A000000:
                          symbols.setdefault(key,set()).add(value);symbol_sources.setdefault(key,[]).append(target)
                      walk(value,target)
              elif isinstance(node,list):
                  for i,value in enumerate(node):walk(value,path+'/'+str(i))
          walk(meta)
          tracked=list(filter(None,subprocess.check_output(['git','ls-files','-z']).decode().split('\0')))
          matches=[n for n in tracked if n.endswith(('offsets.ini','linked.o')) and n.startswith(('build/battle-core/','generated/engine/battle_core/'))]
          candidates=[p for p in (root/'build/battle-core').glob('*/run-1/offsets.ini')] if (root/'build/battle-core').exists() else []
          files={};offset_bindings=[]
          for path in sorted(set(candidates+[root/n for n in matches if n.endswith('offsets.ini')])):
              need(path.is_file() and not path.is_symlink(),'bad offset source');raw=path.read_bytes()
              wanted_hashes={r['offsets']['sha256'] for r in meta['upstream_runs']}
              need(digest(raw) in wanted_hashes,'offset source does not match saved metadata')
              for line in raw.decode().splitlines():
                  match=re.match(r'^\s*(\w+)\s*[:=]\s*(?:0x)?([0-9A-Fa-f]+)\s*$',line)
                  if match and match[1] in wanted:
                      symbols.setdefault(match[1],set()).add(int(match[2],16));symbol_sources.setdefault(match[1],[]).append(path.relative_to(root).as_posix())
              logical=path.relative_to(root).as_posix();offset_bindings.append({'path':logical,'sha256':digest(raw),'size':len(raw)})
              files['offsets/'+str(len(offset_bindings))+'.ini']=raw
          raw=candidate_bytes(inp);rom=Rom(raw);stage06_path=root/'build/stages/06_battle_core.gba'
          old=stage06_path.read_bytes() if stage06_path.is_file() else None
          rows=[]
          for symbol,values in sorted(symbols.items()):
              for at in sorted(values):
                  address=at&~1;unit=rom.read(address,256)
                  rows.append({'symbol':symbol,'address':hex(address),'metadata_paths':symbol_sources[symbol],
                    'window_size':len(unit),'candidate_window_sha256':digest(unit),
                    'same_256_byte_window_as_saved_stage06':None if old is None else old[address-0x08000000:address-0x08000000+256]==unit,
                    'symbol_extent':'NOT_PROVEN_WITHOUT_ELF_SIZE','native_acceptance':'DEFERRED_AUDIT'})
          meta_view={'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
              'metadata':{'path':name,'size':len(meta_raw),'sha256':digest(meta_raw),'keys':sorted(meta)},
              'candidate':identity(raw),'stage06_identity':None if old is None else identity(old),
              'payload':meta.get('payload'),'upstream_runs':[{k:r.get(k) for k in ('run','offsets','linked_object','output_bin')} for r in meta['upstream_runs']],
              'symbol_windows':rows,'offset_bindings':offset_bindings,'available_link_paths':matches,
              'missing_symbols':[n for n in wanted if n not in symbols],
              'no_pattern_guessing':True,'new_native_runs':0,'arm_builds':0,'rom_changes':0,'snapshot_rebuilds':0}
          files['link-inventory.json']=stable(meta_view)
          for n in ('content/modernization/pr16_candidate_wiki_acceptance.json','content/modernization/pr16_native_supply_resume_20260913.json','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md','docs/wiki/p08-candidate-46487d98/data/creation_audit.json','docs/wiki/p08-candidate-46487d98/data/runtime_z_audit.json'):
              files['local/'+n]=inp.raw(n)
          files['manifest.json']=stable({'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'files':{n:{'size':len(v),'sha256':digest(v)} for n,v in sorted(files.items())},'new_native_runs':0,'rom_changes':0})
          with zipfile.ZipFile(out/'link-sources.zip','w',compression=zipfile.ZIP_DEFLATED) as archive:
              for n,data in sorted(files.items()):
                  data.decode();need(b'\0' not in data,'nontext payload');entry=zipfile.ZipInfo(n);entry.compress_type=zipfile.ZIP_DEFLATED;archive.writestr(entry,data)
          print(json.dumps({'status':'PASS_SAVED_LINK_INVENTORY','symbol_windows':len(rows),'offset_sources':len(offset_bindings),'missing_symbols':meta_view['missing_symbols'],'new_native_runs':0,'rom_changes':0},sort_keys=True))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-wiki-link-sources
          path: .local/pr16-wiki-followup/link-sources.zip
          retention-days: 3
          if-no-files-found: error

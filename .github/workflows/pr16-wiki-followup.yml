name: PR16 wiki followup
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-wiki-followup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: pr16-wiki-followup
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 未監査consumerの固定textだけを取得（生成・native・pushなし）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-wiki-followup
          python3 -B - <<'PY'
          import base64,fnmatch,hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-wiki-followup'
          def api(path):return json.loads(subprocess.check_output(['gh','api',path]))
          lock=json.loads((root/'state/source-lock.json').read_bytes())
          src=next(s for s in lock['sources'] if s['name']=='cfru')
          repo='kapibarasan000/CFRU-JP';commit=src['resolved_commit']
          assert src['repository']=='https://github.com/'+repo+'.git' and commit=='e24a16fe39e27ae162faf5b78596d1f3df18489d'
          tree=api('repos/'+repo+'/git/trees/'+commit+'?recursive=1');assert not tree.get('truncated')
          patterns=['src/set_z_effect.c','src/pokemon*.c','src/wild*.c','src/daycare*.c','src/item*.c','src/dexnav*.c',
            'src/catching*.c','src/raid*.c','src/mega.c','src/battle_start_turn_start.c','src/battle_util.c',
            'include/new/z_move_effects.h','include/new/set_z_effect.h','include/constants/moves.h',
            'include/constants/pokemon.h','include/constants/items.h','include/constants/abilities.h',
            'include/constants/battle_move_effects.h','assembly/data/battle_scripts.s','assembly/data/battle_scripts_tables.s',
            'assembly/data/battle_effects.s','src/Tables/battle_moves.c','src/Tables/ability_tables.c',
            'src/defines.h','src/defines_battle.h','include/new/pokemon.h','include/new/dexnav.h']
          paths=sorted(r['path'] for r in tree['tree'] if r['type']=='blob' and any(fnmatch.fnmatchcase(r['path'],p) for p in patterns))
          assert 'src/set_z_effect.c' in paths and len(paths)<80
          payload={};bindings={};total=0
          existing=json.loads((root/'content/modernization/pr16_candidate_wiki_source_model.json').read_bytes())['source_bindings']
          for name in paths:
              obj=api('repos/'+repo+'/contents/'+name+'?ref='+commit)
              assert obj['encoding']=='base64' and obj['size']<=1024*1024
              raw=base64.b64decode(obj['content'],validate=False);raw.decode('utf-8-sig');assert b'\0' not in raw and len(raw)==obj['size']
              sha=hashlib.sha256(raw).hexdigest()
              if name in existing:assert existing[name]['sha256']==sha and existing[name]['size']==len(raw)
              key='upstream/CFRU-JP/'+name;payload[key]=raw
              bindings[key]={'repository':repo,'commit':commit,'path':name,'size':len(raw),'sha256':sha,'git_blob':obj['sha']}
              total+=len(raw);assert total<=16*1024*1024
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          local_patterns=['overlays/collection_supply_v1/*.c','overlays/collection_supply_v1/*.h',
            'overlays/modernization_p03_stage74_supply_runtime/*','overlays/wild_overlay/*',
            'overlays/modernization_p05_ability_rom_runtime/*','overlays/stage60_wild_species_root_repair/*.c',
            'overlays/stage59_wild_identity_npc_regression_repair/*.c','config/stage61_wild_overlay_rate_policy.json',
            'scripts/build_stage61_wild_overlay_rate_policy.py','scripts/build_modernization_floette_gift.py',
            'scripts/pr16_resume.py','content/modernization/pr16_candidate_wiki_followup.json',
            'content/modernization/pr16_candidate_wiki_acceptance.json','content/modernization/pr16_native_supply_resume_20260913.json',
            'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md','.github/workflows/pr16-wiki-followup.yml']
          for name in sorted(n for n in tracked if n and any(fnmatch.fnmatchcase(n,p) for p in local_patterns)):
              p=root/name;assert not p.is_symlink() and p.suffix in ('.c','.h','.py','.json','.md','.yml')
              raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw and len(raw)<=1024*1024
              key='local/'+name;payload[key]=raw;bindings[key]={'path':name,'commit':os.environ['GITHUB_SHA'],'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          issue=api('repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/18')
          payload['issue18.md']=issue['body'].encode()
          manifest={'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
             'source_bindings':bindings,'upstream_tree_paths':[r['path'] for r in tree['tree'] if r['type']=='blob'],
             'snapshot_rebuilds':0,'new_native_runs':0,'arm_builds':0,'rom_changes':0}
          payload['consumer-source-manifest.json']=(json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode()
          with zipfile.ZipFile(out/'consumer-sources.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for name,raw in sorted(payload.items()):z.writestr(name,raw)
          print(json.dumps({'status':'PASS_PINNED_CONSUMER_SOURCE_INPUTS','upstream_files':len(paths),'local_files':len(bindings)-len(paths),'source_head':os.environ['GITHUB_SHA'],'new_native_runs':0,'snapshot_rebuilds':0},sort_keys=True))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-wiki-consumer-sources
          path: .local/pr16-wiki-followup/consumer-sources.zip
          retention-days: 3
          if-no-files-found: error

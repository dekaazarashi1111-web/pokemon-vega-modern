name: pr16-p03-form-gap-inventory
run-name: Extract exact generic/fixed/Rotom P03 form owners from pinned source

on:
  workflow_dispatch:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-p03-form-gap-inventory.yml
      - scripts/pr16_p03_form_gap_inventory.py
      - tests/test_pr16_p03_form_gap_inventory.py

permissions:
  contents: read

concurrency:
  group: pr16-p03-form-gap-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record source identity and run fail-closed unit tests
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-p03-form-gap-inventory
          mkdir -p "$out"
          git rev-parse HEAD > "$out/tested-head.txt"
          python3 -m unittest discover \
            -s tests \
            -p 'test_pr16_p03_form_gap_inventory.py' \
            -v > "$out/unit.log" 2>&1

      - name: Download only the two required pinned private archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          assets=.local/github-private-environment/assets
          mkdir -p "$assets"
          gh release download "$tag" \
            --pattern 'pokemon-vega-private-env-v1-inputs.zip' \
            --pattern 'pokemon-vega-private-env-v1-modernization-inputs.zip' \
            --dir "$assets"

      - name: Hash-check and restore the exact P03 source archive
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-p03-form-gap-inventory
          python3 scripts/github_private_environment.py restore \
            --archive-dir .local/github-private-environment/assets \
            --archive pokemon-vega-private-env-v1-inputs.zip \
            --archive pokemon-vega-private-env-v1-modernization-inputs.zip \
            > "$out/private-restore.json"

      - name: Build exact 70-route owner inventory
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-p03-form-gap-inventory
          python3 scripts/pr16_p03_form_gap_inventory.py \
            --output "$out/inventory.json" \
            > "$out/stdout.json" \
            2> "$out/stderr.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('.local/pr16-p03-form-gap-inventory')
          value=json.loads((out/'inventory.json').read_text())
          assert value['status']=='PASS_FINITE_FORM_OWNER_INVENTORY'
          assert value['expected_owner_counts']=={
              'generic_carry':61,
              'fixed_transition':4,
              'rotom_transition':5,
          }
          assert value['native_acceptance_claimed'] is False
          assert value['rom_or_save_modified'] is False
          (out/'summary.json').write_text(json.dumps({
              'status':'PASS',
              'tested_head':(out/'tested-head.txt').read_text().strip(),
              'owners':{
                  key:{
                      'route_count':row['route_count'],
                      'species_count':row['species_count'],
                      'rows_sha256':row['rows_sha256'],
                      'physical_form_service_target_count':len(row['physical_form_service_targets']),
                  }
                  for key,row in value['owners'].items()
              },
              'native_acceptance_claimed':False,
          },sort_keys=True,indent=2)+'\n')
          PY
          git diff --exit-code

      - name: Preserve inventory and source identities, never private archive or ROM
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-p03-form-gap-inventory
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          out=root/'.local/pr16-p03-form-gap-inventory'
          names=[
              'scripts/pr16_p03_form_gap_inventory.py',
              'tests/test_pr16_p03_form_gap_inventory.py',
              '.github/workflows/pr16-p03-form-gap-inventory.yml',
              'tools/modernization_learnsets.py',
              'tools/modernization_p03_stage73_consumers.py',
              'config/modernization_p03_stage73_consumers.json',
              'content/collection_supply_v1/canonical_model.json',
          ]
          bindings={}
          for name in names:
              path=root/name
              raw=path.read_bytes()
              bindings[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'source-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          PY

      - name: Upload exact read-only diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-p03-form-gap-inventory
          path: .local/pr16-p03-form-gap-inventory/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

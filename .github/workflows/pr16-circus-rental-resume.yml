name: PR16 Circus rental contract resume
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-rental-resume.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  rental-resume:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: native0失敗の受付契約だけを修復して記録
        id: prepare
        run: python3 scripts/pr16_circus_rental_resume.py prepare
      - name: 構築済み候補を再linkせず未実行nativeを検証
        run: python3 scripts/pr16_circus_rental_resume.py pipeline
      - name: 成否を区別して固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_rental_resume.py finish
      - name: ROMとsaveを除外して証跡を収録
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_rental_resume.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-rental-resume
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: pr16-dex-hof-failure
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-hof-failure
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  hof:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact HOF sources and prior terminal state
        run: python3 -B scripts/pr16_dex_hof_failure_actions.py guard
      - name: Official Ubuntu ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libmgba-dev
      - name: New HOF caller isolated contract and full owner preservation
        run: python3 -B scripts/pr16_dex_hof_failure_actions.py run
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Closed HOF text publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_hof_failure_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-hof-failure-text-only
          path: public-dex-hof-failure
          retention-days: 90
          if-no-files-found: error
# Host executable is distinct from the ARM link directory.
# Compare byte views of mGBA word-addressed RAM arrays.

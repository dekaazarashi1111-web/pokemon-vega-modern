name: pr16-p05-root-continuation
run-name: P05 bounded root diagnostics on exact PR16 candidate (not native acceptance)
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-p05-root-continuation.yml
      - scripts/pr16_p05_root_diagnostics.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve exact tracked source context without ROM or save
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-receiver-audit
          git rev-parse HEAD > .local/pr16-receiver-audit/tested-head.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.'); out=root/'.local/pr16-receiver-audit'; bindings={}
          entries={'AGENTS.md','README.md','design/current_state.md','design/agent_context_map.md','design/tasks_next.md','design/run_log.md','design/version_log.md','docs/CHATGPT_WEB_GITHUB_ENVIRONMENT_JA.md'}
          with zipfile.ZipFile(out/'tracked-source-context.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z'],text=True).split('\0'):
                  p=root/name
                  selected=(name in entries or name.startswith(('scripts/','tools/','tests/')) and p.suffix=='.py' or name.startswith(('config/','content/modernization/')) and p.suffix=='.json' or name.startswith('.github/workflows/') and p.suffix in ('.yml','.yaml'))
                  if not selected:continue
                  assert p.is_file() and not p.is_symlink()
                  raw=p.read_bytes();raw.decode('utf8');assert b'\0' not in raw
                  z.writestr(name,raw);bindings[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'tracked-source-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          PY
      - name: Prepare hash-fixed Stage84 parent
        run: |
          set -euo pipefail
          bash infra/setup_github_actions.sh --install > .local/pr16-receiver-audit/toolchain.log 2>&1
          python3 scripts/modernization_final_integration.py prepare > .local/pr16-receiver-audit/stage84.json
      - name: Restore fixed adopted V4 and map catalogue archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-inputs
          gh release download private-environment-v1 --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir .local/pr16-inputs
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.');cfg=json.loads((root/'config/github_private_environment.json').read_text())
          for name in ('pokemon-vega-private-env-v1-inputs.zip','pokemon-vega-private-env-v1-state.zip'):
              expected=next(a for a in cfg['archives'] if a['name']==name);raw=(root/'.local/pr16-inputs'/name).read_bytes()
              assert len(raw)==expected['size'] and hashlib.sha256(raw).hexdigest()==expected['sha256']
          with zipfile.ZipFile(root/'.local/pr16-inputs/pokemon-vega-private-env-v1-inputs.zip') as z:
              name='userfile/imports/Pokemon-Vega_MOVE-DISTRIBUTION-V4_IMPLEMENTATION-READY.zip';raw=z.read(name)
              assert hashlib.sha256(raw).hexdigest()=='4022cd6e1358f58dffc5ebc38b756166f0a1072f948af6934298f65bd82678b2'
              target=root/name;assert not any(p.is_symlink() for p in (target,*target.parents))
              if target.exists():assert target.read_bytes()==raw
              else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw);target.chmod(0o444)
          PY
      - name: Validate diagnostic behavior and inspect exact candidate roots
        run: |
          set -euo pipefail
          out=.local/pr16-receiver-audit
          python3 -m unittest tests.test_pr16_receiver_audit tests.test_pr16_p05_root_diagnostics -v > "$out/unit.stdout" 2> "$out/unit.stderr"
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 scripts/pr16_p05_root_diagnostics.py > "$out/p05.stdout" 2> "$out/p05.stderr"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-p05-root-continuation
          path: .local/pr16-receiver-audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

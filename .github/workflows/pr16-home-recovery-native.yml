name: pr16-home-recovery-native
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-home-recovery-native.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-home-recovery-native
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure only new mother recovery and independent Continue
        run: python -B scripts/pr16_home_recovery_native_actions.py measure
      - name: Record immutable recovery evidence and fixed resume
        run: python -B scripts/pr16_home_recovery_native_actions.py record
      - name: Validate task graph resume and scoped index
        run: |
          python -B scripts/validate_task_graph.py --check
          python -B scripts/pr16_resume.py check
          python -B scripts/pr16_home_recovery_native_actions.py guard
          git diff --cached --check
      - name: Non-force same-branch completion commit
        run: |
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260928-HOME-RECOVERY: 母親の自然回復Saveと独立Continueを限定受入 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'RESULT=DONE TASK=USER-20260928-HOME-RECOVERY VERIFY=PASS COMMIT=%s\n' "$(git rev-parse HEAD)"
      - name: Preserve committed text and completion HEAD
        run: python -B scripts/pr16_home_recovery_native_actions.py snapshot
      - name: Preserve partial native progress without replay
        if: always()
        run: python -B scripts/pr16_home_recovery_native_actions.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-home-recovery-native-checkpoint
          path: .local/pr16-home-native-run/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-learnset-supply-rom
# v2: fixed saved-cache ELF acquisition; inherit first 14 tests without rerun.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-supply-rom.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-supply-rom
  cancel-in-progress: false
jobs:
  supply-rom:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新probe用host libraryだけ導入（ARM生成なし）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmgba-dev
      - name: 保存候補の新供給4hookだけ検証
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_supply_rom.py verify
      - name: 新native証拠と固定引継ぎを記録し限定guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_supply_rom.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_supply_rom.py paths | while IFS= read -r path; do git add -- "$path"; done
          python3 -B scripts/pr16_learnset_supply_rom.py guard
      - name: 同branchへ非force commit/pushし最新refを照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260922-LEARNSET-SUPPLY-NATIVE: 新供給4hook実ROM ABIの証拠・固定引継ぎ・両ログを確定'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "RESULT=DONE TASK=USER-20260922-LEARNSET-SUPPLY-NATIVE VERIFY=PASS COMMIT=$sha SCOPE=DIRECT_ROM_NOT_GAMEPLAY" | tee .local/pr16-learnset-supply-rom/proof/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-supply-rom-proof
          path: .local/pr16-learnset-supply-rom/proof/
          retention-days: 30
          if-no-files-found: error

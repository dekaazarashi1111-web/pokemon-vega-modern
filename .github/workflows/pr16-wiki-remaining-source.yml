name: PR16 Wiki remaining source checkpoint
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-wiki-remaining-source.yml
      - scripts/pr16_wiki_remaining_capture.py
      - tests/test_pr16_wiki_remaining_capture.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-candidate-wiki
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 新規source抽出試験のみ
        run: python3 -B -m unittest discover -s tests -p test_pr16_wiki_remaining_capture.py -v
      - name: 固定sourceと前回Actionsを照合
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_wiki_remaining_capture.py
      - name: 正本・ログを検証し同branchへ非force push
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          git diff --check
          git add -- content/modernization/pr16_wiki_remaining_source_inventory.json content/modernization/pr16_candidate_wiki_acceptance.json content/modernization/pr16_native_supply_resume_20260913.json docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md design/run_log.md design/version_log.md
          python3 -B scripts/pr16_wiki_remaining_capture.py guard
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260921-P08-CANDIDATE-WIKI: 残件source固定と前回Actions完了を照合'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908

name: pr16-learnset-progression-diagnose
# Last bounded read: identify the proven unhooked CFRU first-call entry.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-progression-diagnose.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  diagnose:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 逆アセンブラのみ導入
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi
      - name: 未接続入口とcallerの固定証拠（native再実行なし）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import array,json,os,pathlib,struct,subprocess,sys
          sys.path[:0]=['scripts','.']
          import pr16_learnset_battle as b
          import pr16_learnset_gameplay as m
          from pr16_learnset_wiki_actions import current
          head=current();root=pathlib.Path('.local/pr16-learnset-progression-diagnose');root.mkdir()
          proof=root/'proof';proof.mkdir();m.PROOF=proof;b.WORK=root/'restore-root';b.WORK.mkdir()
          cp=m.load(m.ROOT/'content/modernization/pr16_learnset_progression_checkpoint.json')
          m.need(cp['run_id']==35852603289 and cp['status']=='FAIL' and len(cp['results'])==8,'preserved trace checkpoint changed')
          rom=b.restore();m.need(m.identity(rom)==m.CANDIDATE,'candidate changed')
          refs=[];words=array.array('H',rom)
          if sys.byteorder!='little':words.byteswap()
          for i,h in enumerate(words[:-1]):
              if h&0xf800!=0xf000:continue
              lo=words[i+1]
              if lo&0xf800!=0xf800:continue
              hi=h&0x7ff
              if hi&0x400:hi-=0x800
              target=0x08000000+i*2+4+(hi<<12)+((lo&0x7ff)<<1)
              if 0x09114000<=target<0x09114058:refs.append({'kind':'thumb-bl','offset':i*2,'target':target})
          saved={}
          def walk(obj,path):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      if 'MonTryLearningNewMove' in str(k):saved[path+'/'+k]=v
                      else:walk(v,path+'/'+str(k))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):walk(v,path+'/'+str(i))
          for name in ('content/modernization/pr16_candidate_wiki_saved_link_sources.json','content/modernization/pr16_candidate_wiki_creation_sources.json'):
              walk(json.loads(pathlib.Path(name).read_text()),name)
          # Also resolve pointer callers to each exact observed BL destination.
          targets={r['target'] for r in refs}
          for target in targets:
              at=rom.find(struct.pack('<I',target|1))
              while at>=0:
                  refs.append({'kind':'literal','offset':at,'target':target});at=rom.find(struct.pack('<I',target|1),at+4)
          m.need(1<=len(refs)<=128,'unhooked caller count')
          ranges={(r['offset']&~63)-64 for r in refs};ranges.add(0x1140000)
          manifest={'source_head':head,'run_id':int(os.environ['GITHUB_RUN_ID']),'candidate':m.CANDIDATE,'native_processes':0,'arm_compiles':0,'old_test_reruns':0,'trace_run':35852603289,'xrefs':refs,'saved_symbols':saved,'ranges':[]}
          for start in sorted(ranges):
              end=start+384;m.need(0<=start<end<=len(rom),'bounded entry/caller span')
              name='unhooked-'+hex(start);raw=rom[start:end];tmp=root/(name+'.bin');tmp.write_bytes(raw)
              cmd=['arm-none-eabi-objdump','-D','-b','binary','-m','arm','-M','force-thumb','--adjust-vma='+str(start+0x08000000),str(tmp)]
              (proof/(name+'.asm.txt')).write_text(subprocess.check_output(cmd).decode().replace(str(tmp),name))
              manifest['ranges'].append({'name':name,'address':hex(start+0x08000000),'bytes':m.identity(raw),'first32_hex':raw[:32].hex()})
          (proof/'diagnosis.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('READONLY_UNHOOKED_ENTRY',len(refs),'native=0 ARM=0 accepted-reruns=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-progression-diagnosis
          path: .local/pr16-learnset-progression-diagnose/proof/
          retention-days: 30
          if-no-files-found: error

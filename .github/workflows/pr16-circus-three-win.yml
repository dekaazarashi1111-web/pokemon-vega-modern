name: PR16 Circus three real wins
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-three-win.yml
      - scripts/pr16_circus_three_win.py
      - tests/test_pr16_circus_three_win.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-three-win:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 敗北受入を固定し新方策と契約を保存
        id: prepare
        run: python3 scripts/pr16_circus_three_win.py prepare
      - name: 同一3b候補の未受入3勝を入力専用で検証
        run: python3 scripts/pr16_circus_three_win.py pipeline
      - name: 原本と引継ぎを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_three_win.py finish
      - name: ROM save credentialを除外して証跡を保存
        if: always()
        run: python3 scripts/pr16_circus_three_win.py pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-three-win
          path: .local/pr16-three-win-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

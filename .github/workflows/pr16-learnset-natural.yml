name: pr16-learnset-natural
# 診断v2。補助symbol欠損は受入条件と分離。25境界試験は保存結果継承・新規実行0。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-natural.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-natural
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 診断用host mGBA libraryのみ導入
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmgba-dev
      - name: 保存25試験を継承し失敗1件の自然生成だけ受動trace
        id: diagnostic
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_natural_trace.py
      - name: native失敗原本を保持し固定引継ぎ・両ログへ記録
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_natural.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_natural.py paths | tr '\n' '\0' >.local/pr16-learnset-natural/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-natural/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_learnset_natural.py guard
      - name: 同branchへ非force commit/pushして最新refと照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-LEARNSET-NATURAL: 自然初期技の受動trace・失敗原本・引継ぎを保存'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-learnset-natural/proof/reflected-head.txt
          echo "RESULT=DONE TASK=USER-20260925-LEARNSET-NATURAL-TRACE VERIFY=PASS COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-natural-proof
          path: .local/pr16-learnset-natural/proof/
          retention-days: 30
          if-no-files-found: error
      - name: 診断自体の失敗を保持
        if: steps.diagnostic.outcome == 'failure'
        run: exit 1

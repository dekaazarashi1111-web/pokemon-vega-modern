name: pr16-fixed-form-checkpoint-apply
run-name: Preserve fixed FORM run 34694218218 and apply bounded controller correction
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-fixed-form-checkpoint-apply.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-fixed-form-checkpoint-apply
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Retain exact original evidence without promoting failed cases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/fixed-checkpoint
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34694218218" > .local/fixed-checkpoint/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34694218218/jobs" > .local/fixed-checkpoint/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10297554037" > .local/fixed-checkpoint/artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10297554037/zip" > .local/fixed-checkpoint/original.zip
          python3 - <<'PY'
          import hashlib,io,json,pathlib,stat,zipfile
          base=pathlib.Path('.local/fixed-checkpoint')
          raw=(base/'original.zip').read_bytes()
          digest='45fbc581ec17cf7e0504d2c8d3150072e44a9099e4deed04da759d8b3a6328c7'
          head='a9ec7ab9d93d8013139698242802826278aaf667'
          assert len(raw)==802643 and hashlib.sha256(raw).hexdigest()==digest
          run=json.loads((base/'run.json').read_bytes());jobs=json.loads((base/'jobs.json').read_bytes());artifact=json.loads((base/'artifact.json').read_bytes())
          assert run['id']==34694218218 and run['head_sha']==head and run['conclusion']=='failure'
          assert len(jobs['jobs'])==1 and jobs['jobs'][0]['id']==103554787890 and jobs['jobs'][0]['conclusion']=='failure'
          assert artifact['id']==10297554037 and artifact['digest']=='sha256:'+digest
          assert artifact['workflow_run']['head_sha']==head and not artifact['expired']
          denied={'.gba','.sav','.srm','.ips','.ups','.bps','.bin'}
          def verify_zip(z,inner=False):
              names=z.namelist();assert len(names)==len(set(names)) and len(names)<1000
              assert sum(i.file_size for i in z.infolist())<32000000
              for info in z.infolist():
                  p=pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr>>16) and p.suffix.lower() not in denied
                  data=z.read(info)
                  if p.suffix=='.zip':
                      assert not inner and p.name in {'sources.zip','entry-sources.zip','generated-controller.zip'}
                      with zipfile.ZipFile(io.BytesIO(data)) as nested: verify_zip(nested,True)
                  elif p.suffix=='.ppm':
                      assert not inner and data.startswith(b'P6\n240 160\n255\n') and len(data)==115215
                  else:
                      data.decode('utf-8');assert b'\0' not in data
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              verify_zip(z)
              prefix='pr16-fixed-form-acceptance/'
              receipt=json.loads(z.read(prefix+'receipt.json'));result=json.loads(z.read(prefix+'result.json'))
              assert receipt['tested_head']==head and receipt['p03_fixed_form_gap_closed'] is False
              for name,bound in receipt['members'].items():
                  data=z.read(prefix+name)
                  assert bound=={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              assert result['status']=='FAIL' and result['actual_new_processes']==5 and len(result['failures'])==4
              assert [r['name'] for r in result['results']]==['necrozma-decline-unchanged']
              source_bytes=z.read(prefix+'sources.zip')
              with zipfile.ZipFile(io.BytesIO(source_bytes)) as sources:
                  assert set(sources.namelist())==set(result['sources'])
                  for name,bound in result['sources'].items():
                      data=sources.read(name)
                      assert bound=={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              failures=[]
              for row in result['failures']:
                  text=z.read(prefix+row['name']+'.stderr').decode()
                  failures.append(dict(name=row['name'],process=row['process'],stderr=text))
          dest=pathlib.Path('content/modernization/pr16_fixed_form_acceptance_evidence/34694218218')
          assert not dest.exists();dest.mkdir(parents=True)
          (dest/'original.zip').write_bytes(raw)
          record=dict(schema_version=1,run=run,jobs=jobs,artifact=artifact,download={'size':len(raw),'sha256':digest},original_path=(dest/'original.zip').as_posix())
          (dest/'actions.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          checkpoint=dict(schema_version=1,status='FAIL_NATIVE_LIFECYCLE_CHECKPOINT',tested_head=head,run_id=run['id'],job_id=103554787890,artifact_id=artifact['id'],artifact_sha256=digest,candidate=result['candidate'],actual_new_processes=5,accepted_cases=result['results'],failures=failures,guard_checks=result['guard_checks'],native_acceptance_claimed=False,p03_fixed_form_gap_closed=False,full_p03_acceptance=False,release_ready=False,original_path=(dest/'original.zip').as_posix(),next_action='修正済みcontrollerで失敗経路だけを追跡する。Necrozmaは専用技解決、Crownedは技実行後の戦闘終了境界。generic FORM、P07、成功済み取消を無条件に再実行しない。')
          pathlib.Path('content/modernization/pr16_fixed_form_acceptance.json').write_text(json.dumps(checkpoint,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          pathlib.Path('content/modernization/pr16_fixed_form_acceptance_receipt.json').write_text(json.dumps(dict(schema_version=1,tested_head=head,run_id=run['id'],job_id=103554787890,artifact_id=artifact['id'],original={'path':(dest/'original.zip').as_posix(),'size':len(raw),'sha256':digest},actions_path=(dest/'actions.json').as_posix(),inner_receipt=receipt,p03_fixed_form_gap_closed=False,release_ready=False),sort_keys=True,indent=2)+'\n')
          PY
      - name: Apply only the inspected three-source patch and test its validator
        shell: bash
        run: |
          set -euo pipefail
          echo '2a4adc752cc5eee1ed5ca7e7920a71e11e037d51cc06999bd3077d99a078947b  .chatgpt/patches/pr16-fixed-form-native-controls.patch' | sha256sum -c -
          echo '7ced1703d920c7a5801a70e516e5da9cbf72f3686c6cb2b0e912becc94cb0357  tools/mgba_pr16_fixed_form_acceptance.c' | sha256sum -c -
          echo '53b9e16012515c5aa8df0446c45ae9aa746ed22aa919006e9994e4a18d4fad2a  scripts/pr16_fixed_form_acceptance.py' | sha256sum -c -
          echo '5cf21faac3302bb8d0409be94724ae4e36c65e25ecc35e6bf88549a19faf225c  tests/test_pr16_fixed_form_acceptance.py' | sha256sum -c -
          git apply --check .chatgpt/patches/pr16-fixed-form-native-controls.patch
          git apply .chatgpt/patches/pr16-fixed-form-native-controls.patch
          python3 -m unittest discover -s tests -p 'test_pr16_fixed_form_acceptance.py' -v > .local/fixed-checkpoint/unit.log 2>&1
          python3 scripts/validate_task_graph.py
      - name: Append durable Japanese resume notes and collect finite runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,subprocess,zipfile
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          note=f'\n## {now}\n- Task: USER-MODERNIZATION / fixed-form正式5ケース初回実行と原本保持\n- Status: STOPPED（正式gapは未完。次のcontroller修正へ継続）\n- Summary: run 34694218218 / job 103554787890でC strict compileと7 write barrierをPASS、5 processを実行。Necrozma取消は両行・party bytes不変・save counter 2→2をPASS。Necrozma 2形態は専用技解決、Crowned 2種は技実行後のaction controller境界でFAIL。\n- Files changed: fixed_form_acceptanceのC／Python／tests、acceptance JSON／receipt、原本ZIP／Actions記録。\n- Verify: source-only 14 tests PASS。controller修正後の実ROMはまだ未実行。\n- Commit: この追記を含むcheckpoint commit。受入実行HEAD a9ec7ab9d93d8013139698242802826278aaf667。\n- Network: GitHub Actions artifact APIのみ。原本SHA-256 45fbc581ec17cf7e0504d2c8d3150072e44a9099e4deed04da759d8b3a6328c7。\n- 再開: 複製runを避け、--caseで失敗経路だけ実行。generic FORM／P07／active baselineは不変。release-ready=false。\n'
          with pathlib.Path('design/run_log.md').open('a') as f:f.write(note)
          with pathlib.Path('design/version_log.md').open('a') as f:f.write(f'\n## {now}\n- Version: PR16 fixed-form acceptance checkpoint\n- Commit: この追記を含むcommit\n- Task: USER-MODERNIZATION\n- Summary: 正式runnerを初めて5 process実行。成功1／失敗4を改変せず原本保持。Crownedの自然勝利終端とaction復帰を区別し、集約validatorでprocess／payloadを再検証する修正を追加。\n- Verify: 14 focused unit tests PASS。修正後nativeは未実行、P03 gap未閉鎖。\n')
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[p for p in paths if p and (p.startswith('overlays/collection_supply_v1/') or p.startswith(('tools/collection_supply','scripts/build_collection_supply')) or p in ('tools/modernization_p03_stage73_consumers.py','tools/modernization_p03_native_pp_repair.py','scripts/pr16_fixed_form_acceptance.py','tools/mgba_pr16_fixed_form_acceptance.c','tests/test_pr16_fixed_form_acceptance.py'))]
          with zipfile.ZipFile('.local/fixed-checkpoint/finite-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in selected:
                  p=pathlib.Path(name);data=p.read_bytes();data.decode('utf-8');assert not p.is_symlink() and b'\0' not in data
                  z.writestr(name,data)
          PY
      - name: Commit bounded checkpoint; never overwrite a concurrent branch update
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- config/active_play_baseline.json design/active_play_baseline.md content/modernization/p08_remaining_work.json
          git add tools/mgba_pr16_fixed_form_acceptance.c scripts/pr16_fixed_form_acceptance.py tests/test_pr16_fixed_form_acceptance.py
          git add content/modernization/pr16_fixed_form_acceptance_evidence/34694218218 content/modernization/pr16_fixed_form_acceptance.json content/modernization/pr16_fixed_form_acceptance_receipt.json
          git add design/run_log.md design/version_log.md
          git rm .chatgpt/patches/pr16-fixed-form-native-controls.patch .github/workflows/pr16-fixed-form-checkpoint-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git commit -m 'USER-MODERNIZATION: retain fixed FORM first native run and correct battle termination controller'
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD > .local/fixed-checkpoint/checkpoint-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-fixed-form-checkpoint-sources
          path: .local/fixed-checkpoint/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

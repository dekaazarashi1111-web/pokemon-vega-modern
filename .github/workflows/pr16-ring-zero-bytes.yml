name: pr16-ring-zero-bytes
run-name: Ring未読zero継続一根の保存・既読graphとnative再実行なし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-zero-bytes.yml
      - scripts/pr16_ring_zero_bytes.py
      - tests/test_pr16_ring_zero_bytes.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-zero-bytes
  cancel-in-progress: false
jobs:
  collect-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact HEAD・正本・最新Actions・18tests・重複実行防止
        run: python3 scripts/pr16_ring_zero_bytes.py preflight
      - name: 既存candidate復元stepのみ再利用
        run: python3 scripts/pr16_ring_zero_bytes.py restore
      - name: 未読zero継続だけ採取・固定引継ぎ・index guard
        run: python3 scripts/pr16_ring_zero_bytes.py record .local/pr16-bp-party-retention-successor/candidate.gba
      - name: 最新HEAD再確認・checkpoint commit・非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os,subprocess
          pr=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/pulls/16']))
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==os.environ['GITHUB_SHA']
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR-P08-7: WIP 未読zero継続のbytesと固定引継ぎを保存'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,subprocess,sys
          sys.path.insert(0,'scripts');import pr16_ring_zero_bytes as a
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for p in a.OUTPUTS:
              assert subprocess.check_output(['git','show','HEAD:'+p])==(a.ROOT/p).read_bytes()
          assert subprocess.check_output(['git','status','--porcelain','--untracked-files=no'])==b''
          result={'status':'PASS_ZERO_BYTES_CHECKPOINT_NONFORCE_PUSHED','commit':commit,
              'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
              'tests':json.loads((a.OUT/'tests.json').read_bytes()),
              'guard':json.loads((a.OUT/'guard.json').read_bytes()),
              'committed_outputs_byte_verified':list(a.OUTPUTS),
              'rom_changes':0,'new_emulator_processes':0,'candidate_reconstructions':1,
              'accepted_native_cases_replayed':0,'ring_acquisition_accepted':False,'release_ready':False}
          (a.OUT/'recorded-result.json').write_bytes(a.stable(result))
          print('RESULT=STOPPED TASK='+a.TASK+' VERIFY=PASS COMMIT='+commit)
          print(json.dumps(result))
          PY
      - name: 限定UTF-8結果のみexport検査
        if: always()
        id: export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.local/pr16-ring-zero-bytes')
          for p in root.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt'}
              data=p.read_bytes();data.decode('utf-8')
              assert b'\0' not in data and len(data)<4000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----',data)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: pr16-ring-zero-bytes
          path: .local/pr16-ring-zero-bytes/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

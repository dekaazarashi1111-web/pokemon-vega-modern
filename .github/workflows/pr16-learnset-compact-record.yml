name: pr16-learnset-compact-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-compact-record.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-compact-record
  cancel-in-progress: false
jobs:
  compact-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 固定入口の記録退行をexact sourceへ修復
        shell: bash
        run: |
          set -euo pipefail
          patch='.chatgpt/patches/pr16-compact-stable-resume.patch'
          test "$(git hash-object scripts/pr16_learnset_compact_record.py)" = '5190ac59dc6fa6a50311da9bb4c20dd959532e1a'
          test "$(git hash-object tests/test_pr16_learnset_compact_record.py)" = '7f220809ad589ec6cc9269e4fadaa0a1b5c9a020'
          git apply --check --unidiff-zero "$patch"
          git apply --unidiff-zero "$patch"
          git rm -- "$patch"
          mkdir -p .local/pr16-learnset-compact-record/proof
          python3 -B -m unittest tests.test_pr16_learnset_compact_record.ResumePublicationTests -v 2>&1 | tee .local/pr16-learnset-compact-record/proof/resume-publication-tests.txt
      - name: 完了済み四条件入口の証拠照合と固定引継ぎ更新
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_compact_record.py record | tee .local/pr16-learnset-compact-record/proof/record.json
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-learnset-compact-record/proof/resume.json
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-learnset-compact-record/proof/task-graph.txt
          git diff --exit-code -- CHATGPT_RESUME.md
      - name: final index限定guardと同branch非force push
        shell: bash
        run: |
          set -euo pipefail
          git add -- scripts/pr16_learnset_compact_record.py tests/test_pr16_learnset_compact_record.py
          python3 -B scripts/pr16_learnset_compact_record.py paths | while IFS= read -r path; do git add -- "$path"; done
          python3 -B scripts/pr16_learnset_compact_record.py guard | tee .local/pr16-learnset-compact-record/proof/guard.json
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260922-LEARNSET-COMPACT: 固定入口の記録退行を修復し四条件受入・引継ぎ・両ログを確定'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "RESULT=DONE TASK=USER-20260922-LEARNSET-COMPACT VERIFY=PASS COMMIT=$sha" | tee .local/pr16-learnset-compact-record/proof/result.txt
          python3 -B scripts/pr16_learnset_runtime_record.py snapshot | tee .local/pr16-learnset-compact-record/proof/context.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-compact-record-proof
          path: .local/pr16-learnset-compact-record/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr16-learnset-compact-source-context
          path: .local/pr16-learnset-runtime-record/context.zip
          retention-days: 30
          if-no-files-found: error

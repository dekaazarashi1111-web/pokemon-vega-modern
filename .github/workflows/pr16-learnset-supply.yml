name: pr16-learnset-supply
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-supply.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-supply
  cancel-in-progress: false
jobs:
  supply-host:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 保存archiveからPLA1と新規consumerだけを検証
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_supply_verify.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-supply-proof
          path: .local/pr16-learnset-supply/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr16-learnset-supply-data
          path: .local/pr16-learnset-supply/data/
          retention-days: 30
          if-no-files-found: error

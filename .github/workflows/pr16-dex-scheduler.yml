name: pr16-dex-scheduler
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_dex_scheduler.py
      - scripts/pr16_dex_scheduler_actions.py
      - overlays/dex_owner/dex_stage61_scheduler.h
      - tests/test_pr16_dex_scheduler.py
      - .github/workflows/pr16-dex-scheduler.yml
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-scheduler
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  scheduler:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Exact new scheduler and retained source guard
        run: python3 -B scripts/pr16_dex_scheduler_actions.py guard
      - name: Official Ubuntu ARM compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev
      - name: Build save-only candidate with fixed exports and original non-save bytes
        run: python3 -B scripts/pr16_dex_scheduler_actions.py run
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Strict text-only publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_scheduler_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-scheduler-text-only
          path: public-dex-scheduler
          retention-days: 90
          if-no-files-found: warn

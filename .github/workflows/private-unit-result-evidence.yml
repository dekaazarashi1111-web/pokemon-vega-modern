name: private-unit-result-evidence
on:
  pull_request:
    types: [edited]
permissions:
  contents: read
jobs:
  collect:
    if: >-
      github.event.repository.private == true &&
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/fix-private-full-unit-20260905-r2' &&
      contains(github.event.pull_request.body, '<!-- collect-unit ')
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 取得器の全件・秘密出力境界を検証
        run: python3 -m unittest tests.test_collect_full_unit_evidence
      - name: コメント起動した指定HEADの全unit結果を生ログから取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.collect_full_unit_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-unit-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: build/private-full-unit-evidence/result.json
          retention-days: 1
          if-no-files-found: error

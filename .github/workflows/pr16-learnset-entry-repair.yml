name: pr16-learnset-entry-repair
# Only the first-call entry changes. No unrelated accepted scope is rerun.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-entry-repair.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-entry-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ローカル検証済みsourceの転送identityを照合
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          expected={
            'scripts/pr16_learnset_entry_repair.py':'61e7d5459fdea592d4ef3275c64166c3cd44fb3aab0b76bc236c2afd8c605a3c',
            'tests/test_pr16_learnset_entry_repair.py':'e72106dce9d715b0ad7c965cbabb1b62fbba4219be28bfbda41a7453294c433a',
            'overlays/modernization_pr16_learnset_entry/entry.s':'cbc0b5ea5d01bf6bfa78c760f9d1d1ed6112b21e41e071051e5319e4806461fe',
            'tools/mgba_pr16_learnset_progression.c':'e6dd7435386707c65fdd5c945c2bb66cdec7b499c1d3d0a9ee4d69105cf992a0'}
          for name,wanted in expected.items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()!=wanted: raise RuntimeError('source transfer mismatch: '+name)
          print('PASS exact entry repair/controller/test/assembly transfer')
          PY
      - name: 限定host libraryと8byte assemblerだけ導入
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmgba-dev binutils-arm-none-eabi
      - name: 原本原因照合・新26境界試験・影響11経路の実操作
        id: native
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_entry_repair.py execute
      - name: recipe・実測原本・固定引継ぎ・両ログを記録
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_entry_repair.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_entry_repair.py paths | tr '\n' '\0' >.local/pr16-learnset-entry-repair/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-entry-repair/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_learnset_entry_repair.py guard
      - name: 同branchへ非force commit/pushして最新refと照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260923-LEARNSET-PROGRESSION: CFRU初回入口修復・変更影響11case・固定引継ぎ・両ログを記録'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-learnset-entry-repair/proof/reflected-head.txt
          echo "TASK=USER-20260923-LEARNSET-PROGRESSION CHECKPOINT=REFLECTED COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-entry-repair-proof
          path: .local/pr16-learnset-entry-repair/proof/
          retention-days: 30
          if-no-files-found: error
      - name: 実測FAILを成功へ読み替えない
        if: steps.native.outcome != 'success'
        run: exit 1

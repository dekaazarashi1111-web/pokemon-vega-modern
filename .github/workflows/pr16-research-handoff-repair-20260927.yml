name: pr16-research-handoff-repair-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-handoff-repair-20260927.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-handoff-repair-20260927
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 保存済みpatchの一度だけ適用・旧失敗維持・固定再開整合性
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import datetime,json,os,subprocess,sys
          from pathlib import Path
          sys.path[:0]=['scripts','.']
          import pr16_research_lifecycle_actions as d
          import pr16_resume as resume
          from pr16_learnset_compact_record import publish_resume
          d.current()
          start='c4d2d69b9b639e3ae9d8efa332b4b4b47fe39002'
          patch='.chatgpt/patches/pr16-game-corner-handoff-20260927.patch'
          wf='.github/workflows/pr16-research-handoff-repair-20260927.yml'
          context='.github/workflows/pr16-research-local-context-20260927.yml'
          receipt='content/modernization/pr16_research_handoff_repair.json'
          out=Path('.local/pr16-research-handoff-repair');out.mkdir(parents=True)
          d.need(not Path(receipt).exists(),'記録済み工程の再実行禁止')
          d.need(d.read(d.STATE)['bp']['current_stop']=='PASS_FISHING_ECOLOGY_REAL_EARNING_SCOPED','旧停止点を要求')
          subprocess.run(['git','merge-base','--is-ancestor',start,'HEAD'],check=True)
          d.need(Path(patch).read_bytes()==d.git('show',start+':'+patch),'保存patchを改作しない')
          protected={p:d.identity(Path(p).read_bytes()) for p in [resume.BACKLOG,resume.CHECKPOINT,'CHATGPT_RESUME.md','config/active_play_baseline.json','content/modernization/pr16_research_game_corner_checkpoint.json','docs/PR16_RESEARCH_GAME_CORNER_JA.md']}
          before_logs={p:Path(p).read_bytes() for p in d.LOGS}
          failed=d.inputs.api('actions/runs/36281697084')
          d.need(failed['status']=='completed' and failed['conclusion']=='failure','旧bridge failure維持')
          job=d.inputs.api('actions/jobs/108514655602')
          steps={s['name']:s['conclusion'] for s in job['steps']}
          d.need(job['run_id']==36281697084 and steps['小さいtracked patchを検査して適用']=='success' and steps['tracked source境界を検証']=='failure' and steps['指定された単一unittest IDを実行']=='skipped' and steps['検証済みpatchをcommitして同じPR branchへpush']=='skipped','旧停止工程を厳密照合')
          subprocess.run(['git','apply','--check',patch],check=True)
          subprocess.run(['git','apply',patch],check=True)
          d.need(set(d.git('diff','--name-only').decode().splitlines())=={d.STATE,d.DOC,*d.LOGS},'patchは4正本のみ')
          state=d.read(d.STATE)
          # contextの変更は受入codeではなく、読取専用exportの末尾コメント1行だけ。
          old=d.git('show',start+':'+context)
          new=Path(context).read_bytes()
          d.need(new.startswith(old) and new[len(old):].startswith(b'# USER-20260927-RESEARCH-CONNECTION:') and new[len(old):].count(b'\n')==1,'contextの実行意味不変')
          for p in (context,wf):state['source_bindings'][p]=d.identity(Path(p).read_bytes())
          publish_resume(state)
          test='tests.test_pr16_research_game_corner_record.RecordTests.test_updated_handoff'
          unit=subprocess.run([sys.executable,'-B','-m','unittest',test,'-v'],capture_output=True,timeout=120)
          (out/'handoff-test.stdout.txt').write_bytes(unit.stdout)
          (out/'handoff-test.stderr.txt').write_bytes(unit.stderr)
          d.need(unit.returncode==0 and unit.stderr.count(b' ... ok\n')==1,'未実行のhandoff検証1件PASS')
          runs=[]
          for head in (start,os.environ['GITHUB_SHA']):
              rows=d.inputs.api('actions/runs?head_sha='+head+'&per_page=50')
              d.need(rows['total_count']<=50,'Actionsページ完全性')
              runs.extend(d.run_summary(r) for r in rows['workflow_runs'])
          source=d.inputs.api('actions/runs/36283596928')
          d.need(source['status']=='completed' and source['conclusion']=='success' and source['head_sha']=='b1cecbe42a3dbd5f4d9c685666b9f0999aeb0f08','source export成功')
          record=dict(schema_version=1,task='USER-20260927-RESEARCH-HANDOFF',status='PASS_PREVIOUSLY_UNAPPLIED_HANDOFF',source_head=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),original_patch_commit=start,patch_path=patch,patch_identity=d.identity(Path(patch).read_bytes()),failed_bridge=d.run_summary(failed),failed_job=dict(id=job['id'],conclusion=job['conclusion'],steps=steps),failure_reason_ja='既存tracked原本の全体private guardで停止。旧failureは不変、原本削除/guard変更なし。',source_export=d.run_summary(source),observed_runs=runs,new_handoff_tests=1,test_id=test,test_result=dict(returncode=unit.returncode,stdout=d.identity(unit.stdout),stderr=d.identity(unit.stderr)),native_processes=0,arm_compiles=0,host_compiles=0,accepted_case_reruns=0,full_historical_guard_pass_claimed=False,protected_bindings=protected,release_ready=False,active_baseline_changed=False,own_run_completion_confirmed=False)
          d.write(receipt,record)
          state['research_handoff_repair']={'path':receipt,'status':record['status'],'source_head':record['source_head'],'run_id':record['run_id']}
          state['observed_head_checks']={'scope_head':os.environ['GITHUB_SHA'],'runs':runs,'reconciliation':receipt,'reason_ja':'GAME_CORNERは固定ローカル実測の限定受入。旧bridge36281697084は全体guardでfailure・unittest/push skippedを保持し、未適用4正本を本runで同期。未実行handoff検査1件のみPASS、native/ARM/受入済み再実行0。一般CIと専用記録を区別し、全CI成功/全体guard成功/自己run終端成功は主張しない。'}
          state['pending_runs']=[dict(run_id=r['id'],tested_head=r['head_sha'],status=r['status']) for r in runs if r['status'] in ('queued','in_progress')]
          state['source_bindings'][receipt]=d.identity(Path(receipt).read_bytes())
          publish_resume(state)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          log=f'\n## {now}\n- Timestamp: {now}\n- Task: USER-20260927-RESEARCH-HANDOFF / 未適用4正本の同期と再実行防止\n- Version: research-handoff-repair-v1\n- Status: DONE\n- Summary: 保存済みpatchを一度だけ適用しGAME_CORNER限定受入を固定入口へ反映。旧bridge36281697084は既存原本guard failureのまま保持。次は通常受付/ショップ接続・native文言。\n- Files changed: 専用workflow/receipt、固定再開MD/JSON、両ログ。既存原本/候補/基準は不変。\n- Verify: 未実行handoff契約1PASS、全source binding、task graph、最終index scoped guard。native/ARM/host compile/受入済み再実行0。全体guard PASSは主張しない。\n- Commit: source={os.environ["GITHUB_SHA"]}; 自己SHAはgit log参照。同branchへ非force push。\n- Network: GitHub PR/HEAD/Actionsのみ。merge/release/baseline変更なし。\n'
          for p in d.LOGS:
              d.need(Path(p).read_bytes().startswith(before_logs[p]),'過去ログappend-only')
              with Path(p).open('a',encoding='utf-8') as f:f.write(log)
          d.need(d.bindings(protected)==protected,'原本不変')
          resume.validate(Path('.').resolve())
          owned={d.STATE,d.DOC,receipt,*d.LOGS}
          subprocess.run(['git','add','--',*sorted(owned)],check=True)
          import pr16_learnset_runtime_record as g
          g.START=start;g.CODE={wf,context};g.OWNED=owned;g.guard()
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          python3 -B scripts/validate_task_graph.py
      - name: 現HEAD一致・commit・同branchへの非force push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python3 -B -c 'import sys;sys.path[:0]=["scripts","."];import pr16_research_lifecycle_actions as d;d.current()'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260927-RESEARCH-HANDOFF: ゲームコーナー受入の未適用引継ぎを検証して確定"
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=DONE TASK=USER-20260927-RESEARCH-HANDOFF VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-handoff-repair
          path: |
            .local/pr16-research-handoff-repair/
            content/modernization/pr16_research_handoff_repair.json
            content/modernization/pr16_native_supply_resume_20260913.json
            docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md
            design/run_log.md
            design/version_log.md
          retention-days: 14
          if-no-files-found: warn

name: pr16-ring-message-tile-leaves
run-name: message矩形描画のindex・tile値書込2leafを限定保存
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-message-tile-leaves.yml
      - scripts/pr16_ring_message_tile_leaves.py
      - tests/test_pr16_ring_message_tile_leaves.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-message-tile-leaves
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 矩形2leafを検証し同branchへ記録
        run: python3 scripts/pr16_ring_message_tile_leaves.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-message-tile-leaves
          path: |
            .local/pr16-ring-message-tile-leaves/export/
            .local/pr16-ring-message-tile-leaves/analysis.json
            .local/pr16-ring-message-tile-leaves/tests.json
            .local/pr16-ring-message-tile-leaves/tests.txt
            .local/pr16-ring-message-tile-leaves/recorded-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

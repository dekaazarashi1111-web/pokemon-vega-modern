name: pr16-ring-caller-compose
run-name: Ring保存caller契約結合・限定検証・非force記録
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_ring_caller_compose.py
      - tests/test_pr16_ring_caller_compose.py
      - .github/workflows/pr16-ring-caller-compose.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-caller-compose
  cancel-in-progress: false
jobs:
  verify-and-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保存ABIとcallerを結合し限定検証・記録
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FORCE_TTY: '0'
          NO_COLOR: '1'
        run: python3 scripts/pr16_ring_caller_compose.py
      - name: 診断と記録receiptのみ保存（ROM/nativeなし）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-ring-caller-compose-${{ github.run_id }}
          path: |
            .local/pr16-ring-caller-compose/tests.txt
            .local/pr16-ring-caller-compose/tests.json
            .local/pr16-ring-caller-compose/recorded-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

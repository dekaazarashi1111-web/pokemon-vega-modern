name: pr16-ring-caller-compose
run-name: Ring外側caller結合の限定source取得（native再実行なし）
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-caller-compose.yml
permissions:
  contents: read
concurrency:
  group: pr16-ring-caller-compose
  cancel-in-progress: false
jobs:
  source-context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: 保存済み契約と限定sourceだけを取得
        shell: bash
        run: |
          mkdir -p .local/pr16-ring-caller-compose
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          names = subprocess.check_output(['git', 'ls-files', '--',
              'scripts/pr16_ring*.py', 'tests/test_pr16_ring*.py',
              'content/modernization/pr16_ring*.json',
              'scripts/pr16_resume.py', 'scripts/guard_private_files.py',
              'scripts/validate_task_graph.py',
              'content/modernization/pr16_native_supply_resume_20260913.json',
              'content/modernization/pr16_bp_chooser_checkpoint.json',
              'content/modernization/p08_remaining_work.json',
              'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md'], text=True).splitlines()
          manifest = {'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'files': {}}
          with zipfile.ZipFile('.local/pr16-ring-caller-compose/source-context.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p = root / name
                  if p.is_symlink() or p.suffix not in ('.py', '.json', '.md'):
                      raise ValueError('regular tracked text only')
                  raw = p.read_bytes()
                  raw.decode('utf-8')
                  if len(raw) > 2000000:
                      raise ValueError('oversize text')
                  manifest['files'][name] = {'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
                  z.writestr(name, raw)
              z.writestr('SOURCE_CONTEXT_IDENTITY.json', json.dumps(manifest, indent=2))
          print('限定tracked text取得:', len(names), 'native/ROM生成/旧ABI再実行=0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-ring-caller-source-context
          path: .local/pr16-ring-caller-compose/source-context.zip
          include-hidden-files: true
          retention-days: 1

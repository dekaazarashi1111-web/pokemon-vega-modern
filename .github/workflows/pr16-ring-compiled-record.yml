name: pr16-ring-compiled-record
run-name: Ring compiled監査成功原本の限定記録・再build/nativeなし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-compiled-record.yml
      - scripts/pr16_ring_compiled_record.py
      - tests/test_pr16_ring_compiled_record.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-compiled-record
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 完了済みActions・artifact digest・sourceを照合して記録入力を作成
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,subprocess,sys,zipfile
          sys.path.insert(0,'scripts');import pr16_ring_compiled_owner as r
          out=pathlib.Path('.local/pr16-ring-compiled-record');out.mkdir(parents=True,exist_ok=True)
          def api(p):return subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+p])
          pr=json.loads(api('pulls/16'));head=os.environ['GITHUB_SHA']
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==head and pr['head']['ref']=='codex/modernization-followup-20260908'
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert json.loads(api('git/ref/heads/codex/modernization-followup-20260908'))['object']['sha']==head
          run=json.loads(api('actions/runs/34956919982'));job=json.loads(api('actions/jobs/104341086832'))
          assert run['head_sha']=='2a9728ac4e3531f2a595da6b3d95ba12f842e44a'
          assert run['status']==job['status']=='completed' and run['conclusion']==job['conclusion']=='success'
          assert job['run_id']==run['id'] and all(s['conclusion']=='success' for s in job['steps'])
          artifact=json.loads(api('actions/artifacts/10391238659'))
          digest='c6a915be88ccfd6a5410cad5917914ebfe75a555b24b8e42a5e872a3f73bb598'
          assert artifact['digest']=='sha256:'+digest and not artifact['expired']
          assert artifact['workflow_run']['id']==run['id'] and artifact['workflow_run']['head_sha']==run['head_sha']
          raw=api('actions/artifacts/10391238659/zip');assert hashlib.sha256(raw).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              members=json.loads(z.read('members.json'))
              for name in ('audit.json','tests.stderr','native-disassembly.txt'):
                  data=z.read(name);bound=members[name];assert r.identity(data)==bound
              stderr=z.read('tests.stderr').decode();assert re.search(r'Ran 24 tests in [0-9.]+s\s+OK\s*$',stderr)
              value=json.loads(z.read('audit.json'))
              assert value['schedule']['preexisting_transition_native'] is None
              assert len(value['script_nodes'])==70 and sum(len(n['hex'])//2 for n in value['script_nodes'])==332
              (out/'native-disassembly.txt').write_bytes(z.read('native-disassembly.txt'))
          failed=json.loads(api('actions/runs/34956435284'))
          assert failed['conclusion']=='failure' and failed['head_sha']=='fcca33745d484210c335951199b9e08f3d570008'
          value['verification']={'run':{k:run[k] for k in ('id','head_sha','status','conclusion')},
              'job':{k:job[k] for k in ('id','run_id','status','conclusion')},
              'artifact':{'id':artifact['id'],'run_id':run['id'],'head_sha':run['head_sha'],'sha256':digest,'size':len(raw)},
              'focused_tests':{'tests_run':24,'successful':True,'failures':0,'errors':0,'skips':0},
              'initial_failure_preserved':{'run_id':failed['id'],'source_head':failed['head_sha'],'conclusion':'failure','reason':'CLI import path; no audit acceptance'},
              'initial_artifact':{'id':10392005208,'sha256':'525924a34618a5bd082e7c6b384662dbfaa742a06cee275c34aa0bafddc2fd60'}}
          runs=json.loads(api('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=20'))['workflow_runs']
          value['actions_observed_before_record']=[{k:r[k] for k in ('id','name','head_sha','status','conclusion')} for r in runs]
          (out/'receipt-input.json').write_bytes(r.stable(value))
          PY
          python3 scripts/pr16_ring_compiled_record.py prepare --receipt .local/pr16-ring-compiled-record/receipt-input.json
      - name: 変更した記録・固定引継ぎのみ検証（compiled24件とnative成功は再実行しない）
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,unittest
          out=pathlib.Path('.local/pr16-ring-compiled-record')
          suite=unittest.TestSuite()
          for pattern in ('test_pr16_ring_compiled_record.py','test_pr16_resume.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=pattern))
          with (out/'tests.txt').open('w') as stream:result=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
          value={'tests_run':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'successful':result.wasSuccessful() and not result.skipped}
          (out/'tests.json').write_text(json.dumps(value,indent=2)+'\n');print(json.dumps(value))
          assert value['successful']
          PY
          python3 scripts/pr16_ring_compiled_record.py logs
          python3 scripts/pr16_ring_compiled_record.py check
          python3 scripts/pr16_resume.py check
          python3 scripts/validate_task_graph.py
          python3 - <<'PY'
          import subprocess,sys
          sys.path.insert(0,'scripts');import pr16_ring_compiled_record as r
          subprocess.run(['git','add','--',*r.OUTPUTS],check=True)
          PY
          python3 scripts/pr16_ring_compiled_record.py guard
          git diff --cached --check
      - name: 完了記録をcommitし同branchへ非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os,subprocess
          pr=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/pulls/16']))
          assert pr['state']=='open' and pr['draft'] and not pr['merged'] and pr['head']['sha']==os.environ['GITHUB_SHA']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR-P08-7: Ring compiled ownerのbyte照合完了と未解決境界を記録'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'scripts');import pr16_ring_compiled_record as r
          out=r.OUT;guard=json.loads((out/'guard.json').read_text())
          value={'status':'PASS_COMPILED_OWNER_RECORDED_NONFORCE_PUSHED','commit':r.git('rev-parse','HEAD').decode().strip(),
              'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
              'compiled_run_id':34956919982,'compiled_tested_head':'2a9728ac4e3531f2a595da6b3d95ba12f842e44a',
              'tests':json.loads((out/'tests.json').read_text()),'guard':guard,
              'new_emulator_processes':0,'accepted_native_cases_replayed':0,'rom_changes':0,
              'ring_acquisition_accepted':False,'release_ready':False}
          (out/'recorded-result.json').write_bytes(r.owner.stable(value))
          with zipfile.ZipFile(out/'recorded-text.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in guard['changed_paths']:
                  raw=r.git('show','HEAD:'+name);assert raw==pathlib.Path(name).read_bytes()
                  raw.decode('utf-8');assert b'\0' not in raw;z.writestr(name,raw)
          print(json.dumps(value))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-compiled-record
          path: .local/pr16-ring-compiled-record/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: p01-target-validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  current-target-consumer:
    if: >-
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/user-modernization-p01-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 現行ID・対象集合・実C consumerを検証
        run: |
          python3 scripts/validate_task_graph.py
          python3 scripts/guard_private_files.py
          python3 -m unittest -v tests.test_modernization_ids tests.test_modernization_targets tests.test_p01_collection_consumer
          python3 scripts/build_modernization_catalog.py build
          python3 scripts/build_modernization_catalog.py check
          python3 scripts/build_modernization_targets.py build
          python3 scripts/build_modernization_targets.py check
          python3 scripts/build_p01_collection_table.py build
          python3 scripts/build_p01_collection_table.py check
          git diff --exit-code
      - name: 検証範囲を記録
        env:
          TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '検証HEAD: %s\n' "$TESTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
          printf '現行対象consumer・対象集合・実C save処理: PASS\nROM反映: 未実施\n' >> "$GITHUB_STEP_SUMMARY"
  rom-reference-inspection:
    needs: current-target-consumer
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: 参照parserと保全処理の回帰
        run: python3 -m unittest -v tests.test_p01_restore tests.test_p01_rom_audit
      - name: 既存hash固定資材の取得と両report保全復元
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          mkdir -p .local/github-private-environment/assets
          gh release download "$tag" --pattern 'pokemon-vega-private-env-v1-*.zip' --dir .local/github-private-environment/assets
          python3 scripts/restore_p01_environment.py --archive-dir .local/github-private-environment/assets
          git diff --exit-code
      - name: 現行Stage62の参照・容量をread-only実測（mGBAとは独立）
        run: |
          python3 scripts/audit_p01_rom.py
          git diff --exit-code

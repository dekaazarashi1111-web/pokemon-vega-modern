name: pr16-learnset-boundaries
# WIP bootstrap: saved native success is reconciled, never replayed.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-boundaries.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-boundaries
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 保存済み成功のActions終端のみ照合・固定MDと両ログへ反映
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_wild_repair.py complete
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_learnset_wild_repair.py paths | tr '\n' '\0' >.local/pr16-learnset-natural/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-natural/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_learnset_wild_repair.py guard
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-LEARNSET-WILD-REPAIR: 保存成功のActions終端を再実行なしで照合'
          git push origin "HEAD:$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=DONE TASK=USER-20260925-LEARNSET-WILD-REPAIR VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - name: 次の限定実装用tracked text snapshot（私有入力・ROM・save除外）
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.'); out=root/'.local/pr16-boundaries-bootstrap';out.mkdir(parents=True,exist_ok=True)
          records={}
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in names:
              p=root/name
              selected=(name in ('AGENTS.md','CHATGPT_RESUME.md','README.md','Makefile','.gitignore','package.json') or name.endswith('/AGENTS.md') or name.startswith(('scripts/','src/modernization/','config/','infra/','state/source-lock.json','tasks/')) or name.startswith('tools/') and p.suffix in ('.py','.c','.h') or name.startswith('tests/') and ('pr16' in name or p.name in ('__init__.py','common.py')) or name.startswith('docs/PR16') and '/wiki/' not in name or name in ('design/current_state.md','design/agent_context_map.md','design/active_play_baseline.md') or name.startswith('content/modernization/') and (len(p.parts)==3 or p.parts[2].startswith('pr16_learnset')))
              if not name or not selected or not p.is_file() or p.is_symlink() or p.suffix not in ('.py','.c','.h','.md','.json','.jsonl','.yml','.yaml','.toml','.txt','.sh','') and p.name not in ('Makefile','.gitignore'):continue
              raw=p.read_bytes()
              if b'\0' in raw:continue
              try:raw.decode('utf-8')
              except UnicodeDecodeError:continue
              z.writestr(name,raw);records[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'manifest.json').write_text(json.dumps({'source_head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':records},sort_keys=True,indent=2)+'\n')
          print('tracked text files:',len(records))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-boundaries-source
          path: .local/pr16-boundaries-bootstrap/
          retention-days: 7
          if-no-files-found: error

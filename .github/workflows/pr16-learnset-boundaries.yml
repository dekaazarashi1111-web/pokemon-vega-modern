name: pr16-learnset-boundaries
# 保存3成功と不変oracle19は再実行しない。失敗1caseのHP fixtureを修正。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-boundaries.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-boundaries
  cancel-in-progress: false
jobs:
  boundaries:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新source転送identity
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          expected={'scripts/pr16_exp_multilevel.py':'f4ee5e21a9a181ec75a1551ae9a601500825e442622207a9f387bb88f260349e','tools/pr16_exp_multilevel_trace.h':'aefdffa269bba6cf5c360d2a6944f122bc423d327ceeaf4a45d59584f024eaa6','tools/mgba_pr16_learnset_boundaries.c':'970e40c18717c0fd92d4e04aac2c30c8a7157912739c31a687492a869028c724','tests/test_pr16_exp_multilevel.py':'f83d024dd0a0f173f1146cd289c0f36fbe6daeb4124e51564113d76ffa3623e3'}
          for path,digest in expected.items():assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest,path
          print('PASS source transfer')
          PY
      - name: host mGBAのみ準備（ARM compiler不要）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmgba-dev
      - name: 構造1試験・新HP8試験・失敗multilevel1case
        id: native
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_exp_multilevel.py execute
      - name: 保存3成功を維持・新HP証拠・固定引継ぎ・両ログ
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_exp_multilevel.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_exp_multilevel.py paths | tr '\n' '\0' >.local/pr16-learnset-boundaries/paths.z
          git add --pathspec-from-file=.local/pr16-learnset-boundaries/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_exp_multilevel.py guard
      - name: 同branchへ非force commit/push・remote refを照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-LEARNSET-BOUNDARIES: 複数EXPのHP境界修復・原本・引継ぎ・両ログ'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-learnset-boundaries/proof/reflected-head.txt
          echo "RESULT=RECORDED TASK=USER-20260925-LEARNSET-BOUNDARIES COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-boundaries-proof
          path: .local/pr16-learnset-boundaries/proof/
          retention-days: 30
          if-no-files-found: error
      - name: native失敗を成功へ読み替えない
        if: steps.native.outcome == 'failure'
        run: exit 1

name: Repair PR16 final record transport
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-party-retention-transport-repair.yml]
permissions:
  contents: write
concurrency:
  group: pr16-party-retention-transport-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reassemble hash-verified transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          cat .github/pr16-finalize/part-02-*.b64 > .github/pr16-finalize/part-02.b64
          cat .github/pr16-finalize/part-04-*.b64 > .github/pr16-finalize/part-04.b64
          cat \
            .github/pr16-finalize/part-01.b64 \
            .github/pr16-finalize/part-02.b64 \
            .github/pr16-finalize/part-03.b64 \
            .github/pr16-finalize/part-04.b64 \
            | base64 -d > /tmp/finalize_action.py
          echo 'fac5689d6f1b07a4e0f504a6bcf218aa7d92fc03a58a3ca7c96e13c36af3d5f6  /tmp/finalize_action.py' | sha256sum -c -
          python3 -m py_compile /tmp/finalize_action.py
          rm .github/pr16-finalize/part-02-*.b64 .github/pr16-finalize/part-04-*.b64
          rm .github/workflows/pr16-party-retention-transport-repair.yml
          printf '\n# transport repaired: fac5689d6f1b07a4e0f504a6bcf218aa7d92fc03a58a3ca7c96e13c36af3d5f6\n' >> .github/workflows/pr16-party-retention-record-finalize.yml
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' .github/workflows/pr16-party-retention-record-finalize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- .github/pr16-finalize .github/workflows/pr16-party-retention-record-finalize.yml .github/workflows/pr16-party-retention-transport-repair.yml
          git commit -m 'USER-PR16: final record transportを修復'
          echo "REPAIRED_COMMIT=$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git push origin "HEAD:$branch"
          rc=$?
          set -e
          echo "PUSH_RC=$rc"
          exit 0

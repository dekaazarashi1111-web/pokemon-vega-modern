name: pr16-fixed-form-probe-evidence-retention
run-name: Retain fixed FORM native probe artifact before expiry
# One-shot, fail-closed retention bridge. It may only preserve the already
# successful run 34681725548 artifact on the exact PR branch. It does not run
# new emulator acceptance and never promotes the diagnostic result to P03.

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-fixed-form-probe-evidence-retention.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pr16-fixed-form-probe-evidence-retention
  cancel-in-progress: false

jobs:
  retain-original:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download, verify and inspect the immutable artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact_id=10294094459
          run_id=34681725548
          job_id=103521455738
          artifact_head=d308bf867ff04fba8cca7f08500cfc6e0972dd82
          expected_size=221634
          expected_sha=4b7606ab66dfd57a6cd0b4c5c301f34f63dd5f90a9374b543f889152217def5e
          destination=content/modernization/pr16_fixed_form_probe_evidence/${run_id}
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          git merge-base --is-ancestor "$artifact_head" "$GITHUB_SHA"
          gh api "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp/original.zip"
          test "$(stat -c %s "$tmp/original.zip")" = "$expected_size"
          echo "${expected_sha}  $tmp/original.zip" | sha256sum -c -

          mkdir -p "$destination"
          cp "$tmp/original.zip" "$destination/original.zip"
          python3 - "$tmp/original.zip" "$destination/actions.json" <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          expected = {
              "artifact_id": 10294094459,
              "artifact_name": "pr16-fixed-form-native-probe",
              "artifact_size": 221634,
              "artifact_sha256": "4b7606ab66dfd57a6cd0b4c5c301f34f63dd5f90a9374b543f889152217def5e",
              "artifact_created_at": "2026-09-12T07:50:56Z",
              "artifact_expires_at": "2026-10-12T07:50:56Z",
              "run_id": 34681725548,
              "job_id": 103521455738,
              "artifact_head": "d308bf867ff04fba8cca7f08500cfc6e0972dd82",
          }
          forbidden_suffixes = (
              ".gba", ".srm", ".sav", ".sa1", ".dsv", ".ips", ".ups", ".bps"
          )
          forbidden_names = {
              "pokemon-vega-private-env-v1-inputs.zip",
              "pokemon-vega-private-env-v1-modernization-inputs.zip",
          }

          def inspect_zip(raw: bytes, label: str, allow_sources_zip: bool) -> list[dict]:
              rows = []
              with zipfile.ZipFile(io.BytesIO(raw)) as bundle:
                  for info in bundle.infolist():
                      name = info.filename
                      path = PurePosixPath(name)
                      if path.is_absolute() or ".." in path.parts or "\\" in name:
                          raise SystemExit(f"unsafe archive path: {label}:{name}")
                      mode = info.external_attr >> 16
                      if stat.S_ISLNK(mode):
                          raise SystemExit(f"symlink in evidence archive: {label}:{name}")
                      if info.is_dir():
                          continue
                      lowered = path.name.lower()
                      if lowered in forbidden_names or lowered.endswith(forbidden_suffixes):
                          raise SystemExit(f"private/binary product input in evidence: {label}:{name}")
                      payload = bundle.read(info)
                      row = {
                          "path": name,
                          "size": len(payload),
                          "sha256": hashlib.sha256(payload).hexdigest(),
                      }
                      if lowered.endswith(".zip"):
                          if not allow_sources_zip or lowered != "sources.zip":
                              raise SystemExit(f"unexpected nested archive: {label}:{name}")
                          nested = inspect_zip(payload, f"{label}:{name}", False)
                          row["nested_entries"] = nested
                      rows.append(row)
              return rows

          raw = archive.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          if len(raw) != expected["artifact_size"] or digest != expected["artifact_sha256"]:
              raise SystemExit("downloaded artifact identity differs")
          entries = inspect_zip(raw, "original.zip", True)
          if len(entries) != 63:
              raise SystemExit(f"artifact entry count differs: {len(entries)}")
          record = {
              "schema_version": 1,
              "scope": "PR16_P03_FIXED_FORM_TRANSITION_NATIVE_PROBE_RETENTION",
              "status": "PASS_ORIGINAL_ARTIFACT_RETAINED",
              **expected,
              "repository_path": "content/modernization/pr16_fixed_form_probe_evidence/34681725548/original.zip",
              "entry_count": len(entries),
              "entries": entries,
              "claims": {
                  "new_emulator_runs": 0,
                  "native_acceptance_claimed": False,
                  "p03_fixed_form_gap_closed": False,
                  "release_ready": False,
              },
          }
          output.write_text(json.dumps(record, ensure_ascii=False, sort_keys=True, indent=2) + "\n")
          PY

      - name: Commit only the verified original and manifest
        shell: bash
        run: |
          set -euo pipefail
          destination=content/modernization/pr16_fixed_form_probe_evidence/34681725548
          git status --short
          git add "$destination/actions.json"
          # Evidence archives are intentionally ignored globally; this exact,
          # digest-verified original is the audited exception.
          git add -f "$destination/original.zip"
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" = 2
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "USER-MODERNIZATION: retain fixed FORM probe original"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: pr16-vega-original-baseline
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - '.github/workflows/pr16-vega-original-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr16-vega-original-baseline
  cancel-in-progress: false
jobs:
  capture-original:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 原作専用の19境界だけを検証
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-vega-original-proof .local/pr16-vega-original-assets
          python3 -B -m unittest tests.test_pr16_vega_original_baseline -v 2>&1 | tee .local/pr16-vega-original-proof/unit.log
      - name: 固定archiveから原作Vegaだけを読みWikiと一度だけ採取
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-build-stages.zip --dir .local/pr16-vega-original-assets
          python3 -B scripts/pr16_vega_original_collect.py --archive .local/pr16-vega-original-assets/pokemon-vega-private-env-v1-build-stages.zip --output .local/pr16-vega-original-proof/capture
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-vega-original-capture
          path: .local/pr16-vega-original-proof/
          if-no-files-found: error
          retention-days: 30

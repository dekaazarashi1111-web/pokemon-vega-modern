name: pr16-ring-patch-owner
run-name: Ring patch先・標準handler限定追跡／既存入口とnative再実行なし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-patch-owner.yml
      - scripts/pr16_ring_patch_owner.py
      - tests/test_pr16_ring_patch_owner.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-patch-owner
  cancel-in-progress: false
jobs:
  scoped-owner:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact HEAD・最新Actions・既存受入の照合と新規18テスト
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-ring-patch-owner
          python3 - <<'PY'
          import json,os,pathlib,subprocess,unittest
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA']
          def api(p):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+p]))
          pr=api('pulls/16')
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==head and pr['head']['ref']=='codex/modernization-followup-20260908'
          assert pr['head']['repo']['full_name']==repo
          assert api('git/ref/heads/codex/modernization-followup-20260908')['object']['sha']==head
          for run_id,source in [(34960361700,'41debb1dc1ac3c8fddefe7fa97898e7ecd2943b7'),(34946969126,'0b7497b575a3180a045f2be377386490f192a012')]:
              r=api('actions/runs/'+str(run_id))
              assert r['status']=='completed' and r['conclusion']=='success' and r['head_sha']==source
          out=pathlib.Path('.local/pr16-ring-patch-owner')
          runs=api('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=20')['workflow_runs']
          (out/'actions-before.json').write_text(json.dumps([{k:r[k] for k in ('id','name','head_sha','status','conclusion')} for r in runs],indent=2)+'\n')
          with (out/'tests.txt').open('w') as stream:
              result=unittest.TextTestRunner(stream=stream,verbosity=2).run(unittest.defaultTestLoader.discover('tests',pattern='test_pr16_ring_patch_owner.py'))
          value={'tests_run':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'successful':result.wasSuccessful() and not result.skipped}
          (out/'tests.json').write_text(json.dumps(value,indent=2)+'\n');print(value);assert value['successful'] and value['tests_run']==18
          PY
          python3 scripts/pr16_resume.py check > .local/pr16-ring-patch-owner/resume-before.txt
      - name: 同一candidateの未観測byte入力のみ復元
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-patch-owner
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json;print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          cfg=json.loads(pathlib.Path('config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          raw=(pathlib.Path('.local/pr16-bp-trial-native-inputs')/name).read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          p=pathlib.Path('vendor/upstream/CFRU-JP/charmap.tbl')
          assert not any(q.is_symlink() for q in (p,*p.parents))
          with zipfile.ZipFile(pathlib.Path('.local/pr16-bp-trial-native-inputs')/name) as z:data=z.read(p.as_posix())
          if p.exists():assert p.read_bytes()==data
          else:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data);p.chmod(0o444)
          PY
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 scripts/pr16_bp_party_retention_successor.py > "$out/candidate.stdout" 2> "$out/candidate.stderr"
      - name: patch先・handler・未解決calleeだけ有限検証
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr16_ring_patch_owner.py --rom .local/pr16-bp-party-retention-successor/candidate.gba
          python3 scripts/validate_task_graph.py > .local/pr16-ring-patch-owner/task-graph.txt
          git diff --exit-code
          git diff --check
      - name: 限定UTF-8証拠のみexport・秘密とROM/saveの混入禁止
        id: export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          out=pathlib.Path('.local/pr16-ring-patch-owner');bound={}
          for p in out.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt','.stdout','.stderr','.log'}
              data=p.read_bytes();data.decode('utf-8');assert b'\0' not in data and len(data)<4000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----',data)
              bound[p.name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (out/'members.json').write_text(json.dumps(bound,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: pr16-ring-patch-owner
          path: .local/pr16-ring-patch-owner/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

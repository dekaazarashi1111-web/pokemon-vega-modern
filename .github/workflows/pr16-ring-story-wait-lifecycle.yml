name: pr16-ring-story-wait-lifecycle
run-name: 実wait callbackとscript連続tickの限定検証
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-story-wait-lifecycle.yml
      - scripts/pr16_ring_story_wait_lifecycle.py
      - tests/test_pr16_ring_story_wait_lifecycle.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-story-wait-lifecycle
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 実waitとfield状態を検証し同branchへ記録
        run: python3 scripts/pr16_ring_story_wait_lifecycle.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-story-wait-lifecycle
          path: |
            .local/pr16-ring-story-wait-lifecycle/analysis.json
            .local/pr16-ring-story-wait-lifecycle/tests.json
            .local/pr16-ring-story-wait-lifecycle/tests.txt
            .local/pr16-ring-story-wait-lifecycle/guard.json
            .local/pr16-ring-story-wait-lifecycle/recorded-result.json
            .local/pr16-ring-story-wait-lifecycle/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

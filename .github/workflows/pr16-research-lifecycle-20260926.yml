name: pr16-research-lifecycle-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-lifecycle-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-lifecycle-20260926
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 未受入の初期化V1限定5件だけを実行
        run: python3 -B scripts/pr16_research_lifecycle_actions.py measure
      - name: 原本と成功失敗scopeを固定引継ぎへ記録
        run: python3 -B scripts/pr16_research_lifecycle_actions.py record
      - name: 再開正本とtask graphの整合性
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-research-lifecycle/public/resume-check.txt
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-research-lifecycle/public/task-graph.txt
      - name: 最終indexの限定private guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_research_lifecycle_actions.py paths > .local/pr16-research-lifecycle/paths.txt
          mapfile -t owned < .local/pr16-research-lifecycle/paths.txt
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_lifecycle_actions.py guard | tee .local/pr16-research-lifecycle/public/index-guard.txt
      - name: 同branchへcommitと非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260926-RESEARCH-LIFECYCLE: 初期化V1限定原本と次工程を記録'
          git push origin "HEAD:refs/heads/$branch"
          reflected=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$reflected"
          printf '%s\n' "$reflected" > .local/pr16-research-lifecycle/public/reflected-head.txt
      - name: 失敗原本を成功へ変更しない
        run: |
          python3 -c "import json; c=json.load(open('content/modernization/pr16_research_lifecycle_checkpoint.json')); assert not c['failed_cases'], c['failed_cases']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-lifecycle
          path: .local/pr16-research-lifecycle/public/
          retention-days: 30
          if-no-files-found: error

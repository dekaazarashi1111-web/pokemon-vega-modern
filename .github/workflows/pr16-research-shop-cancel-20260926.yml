name: pr16-research-shop-cancel-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-shop-cancel-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-shop-cancel-20260926
  cancel-in-progress: false
jobs:
  shop-cancel:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MODE: measure
      REUSE_UNIT_RUN: '36246971189'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: exact source転送照合
        shell: python
        run: |
          import subprocess
          bindings = {
            'scripts/pr16_research_shop_cancel.py': 'c82a47aa47f7a491ae92dbaac0e8524d60c28d84',
            'scripts/pr16_research_shop_cancel_actions.py': '20ee8ada9afed17d2b90deddaa4db3dd3559433c',
            'scripts/pr16_research_shop_cancel_followup.py': 'cb47fed109c9e6f3f55fab70a97c40d4202071f4',
            'tests/test_pr16_research_shop_cancel.py': 'fbd894c45a782bc2af5bc15c454c6c15b764312c',
            'tools/mgba_pr16_research_shop_cancel.c': '61d4ecc868a0cd2e81f4356dc0b6826b22c8bd73',
          }
          for path, sha in bindings.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip() == sha, path
          print('PASS_EXACT_SHOP_CANCEL_SOURCE_TRANSFER')
      - name: 新規native取消とoracleのみ計測記録
        run: python3 -B scripts/pr16_research_shop_cancel_followup.py "$MODE"
      - name: 引継ぎとtask graphと最終index
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-research-lifecycle/public/resume-check.txt
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-research-lifecycle/public/task-graph.txt
          python3 -B scripts/pr16_research_shop_cancel_followup.py guard | tee .local/pr16-research-lifecycle/public/index-guard.txt
      - name: 同branchへcommitと非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260926-RESEARCH-SHOP-CANCEL: 実取消の限定${MODE}と引継ぎ記録"
          git push origin "HEAD:refs/heads/$branch"
          reflected=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$reflected"
          printf '%s\n' "$reflected" > .local/pr16-research-lifecycle/public/reflected-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-shop-cancel
          path: .local/pr16-research-lifecycle/public/
          retention-days: 30
          if-no-files-found: error

name: pr16-research-connection-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-connection-20260927.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-connection-20260927
  cancel-in-progress: false
jobs:
  measure-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 固定資材・変更影響だけの4入口計測・旧受入再実行なし
        run: python3 -B scripts/pr16_research_connection_actions.py measure
      - name: UTF8原本・停止点・固定引継ぎ・両ログを保存
        run: python3 -B scripts/pr16_research_connection_actions.py record
      - name: task graph・最終index・source binding・原本保全
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/validate_task_graph.py
          mapfile -t owned < <(python3 -B scripts/pr16_research_connection_actions.py paths)
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_connection_actions.py guard
      - name: 現HEAD一致・commit・同branchへ非force push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260927-RESEARCH-CONNECTION: 新4入口の測定原本と未受入境界を固定"
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=STOPPED TASK=USER-20260927-RESEARCH-CONNECTION VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-connection-measurement
          path: |
            .local/pr16-research-connection/public/
            content/modernization/pr16_research_connection_checkpoint.json
          if-no-files-found: warn
          retention-days: 14
# 前run36284738523はfixture tuple展開前で停止、native/compile/guardは0。修正済みsourceで新規4入口を測定。

name: pr16-ring-tail-ci-closeout
run-name: 保存末尾ABI成功照合とP05残件テスト修正・記録・非force push
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_ring_tail_ci_closeout.py
      - tests/test_pr16_ring_tail_ci_closeout.py
      - .github/workflows/pr16-ring-tail-ci-closeout.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-tail-ci-closeout
  cancel-in-progress: false
jobs:
  verify-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保存末尾成功照合・限定P05期待と正本・両ログ・guard・非force push
        run: python3 scripts/pr16_ring_tail_ci_closeout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-tail-ci-closeout
          path: |
            .local/pr16-ring-tail-ci-closeout/tests.json
            .local/pr16-ring-tail-ci-closeout/tests.txt
            .local/pr16-ring-tail-ci-closeout/recorded-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

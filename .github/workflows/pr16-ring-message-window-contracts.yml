name: pr16-ring-message-window-contracts
run-name: message状態0進行・実r8 frameとBIOS停止の724条件を結合
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-message-window-contracts.yml
      - scripts/pr16_ring_message_window_contracts.py
      - tests/test_pr16_ring_message_window_contracts.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-message-window-contracts
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保存命令の724条件を一回検証し同branchへ記録
        run: python3 scripts/pr16_ring_message_window_contracts.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-message-window-contracts
          path: |
            .local/pr16-ring-message-window-contracts/export/
            .local/pr16-ring-message-window-contracts/analysis.json
            .local/pr16-ring-message-window-contracts/tests.json
            .local/pr16-ring-message-window-contracts/tests.txt
            .local/pr16-ring-message-window-contracts/recorded-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: PR16 Vega adjudication record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/pr16-vega-adjudication-record.json
      - .github/workflows/pr16-vega-adjudication-record.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-vega-adjudication-record
  cancel-in-progress: false
jobs:
  record-adjudication:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 記録契約12境界だけを検証
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-vega-adjudication-record
          python3 -B -m unittest discover -s tests -p test_pr16_vega_adjudication_record.py -v 2>&1 | tee .local/pr16-vega-adjudication-record/recording-unit.txt
      - name: 完了証拠だけを照合し後継台帳と引継ぎへ記録
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_vega_adjudication_record.py record
          python3 -B scripts/pr16_resume.py check
          git diff --check
          git add content/modernization/pr16_vega_adjudication content/modernization/pr16_vega_breeding_evidence content/modernization/pr16_vega_adjudication_checkpoint.json content/modernization/pr16_native_supply_resume_20260913.json docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md docs/PR16_VEGA_SOURCE_ADJUDICATION_JA.md design/run_log.md design/version_log.md
          git diff --cached --check
          python3 -B scripts/pr16_vega_adjudication_record.py guard --base "$GITHUB_SHA"
          git diff --exit-code
      - name: 最終indexを同じbranchへ非force commitとpush
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260921-LEARNSET-BASELINE-RESET: 原本衝突5行と非直接egg2394行の裁定を検証記録しruntime再開点を確定'
          git push origin "HEAD:refs/heads/$branch"
          new=$(git rev-parse HEAD)
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$new" = "$remote"
          printf 'RESULT=DONE TASK=USER-20260921-LEARNSET-BASELINE-RESET VERIFY=PASS COMMIT=%s\n' "$new" | tee .local/pr16-vega-adjudication-record/result.txt
          git status --porcelain --untracked-files=no > .local/pr16-vega-adjudication-record/tracked-status.txt
          test ! -s .local/pr16-vega-adjudication-record/tracked-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-vega-adjudication-recorded
          path: |
            .local/pr16-vega-adjudication-record/recording-unit.txt
            .local/pr16-vega-adjudication-record/result.txt
            .local/pr16-vega-adjudication-record/tracked-status.txt
          retention-days: 30
          if-no-files-found: error

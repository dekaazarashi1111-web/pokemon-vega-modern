name: pr16-ring-transitive-owner
run-name: Ring未解決callee限定検証・既受入native再実行なし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-transitive-owner.yml
      - scripts/pr16_ring_transitive_owner.py
      - tests/test_pr16_ring_transitive_owner.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-transitive-owner
  cancel-in-progress: false
jobs:
  scoped-owner:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 未解決境界のtracked sourceのみ固定・nativeもcompileも行わない
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-ring-transitive-owner';out.mkdir(parents=True,exist_ok=True)
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path]))
          head=os.environ['GITHUB_SHA'];pr=api('pulls/16')
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==head and pr['head']['ref']=='codex/modernization-followup-20260908'
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          wanted=['CHATGPT_RESUME.md','scripts/pr16_resume.py','scripts/pr16_ring_compiled_owner.py','scripts/pr16_ring_compiled_record.py','scripts/build_event_design_stage.py','scripts/build_save_migration.py','scripts/build_qol_runtime.py','scripts/guard_private_files.py','scripts/validate_task_graph.py','tests/test_pr16_resume.py','tests/test_pr16_ring_compiled_owner.py','tests/test_pr16_ring_compiled_record.py','content/modernization/pr16_native_supply_resume_20260913.json','content/modernization/pr16_bp_chooser_checkpoint.json','content/modernization/p08_remaining_work.json','content/modernization/pr16_ring_compiled_owner.json','content/modernization/pr16_ring_owner_resolution.json','config/event_design_bindings.csv','state/source-lock.json','.github/workflows/pr16-ring-compiled-record.yml']
          wanted+=sorted(p for p in tracked if p.endswith('/AGENTS.md') or p=='AGENTS.md')
          wanted+=sorted(p for p in tracked if p.startswith(('overlays/event_design/','overlays/save_migration/','overlays/qol/','overlays/qol_runtime/')) and p.endswith(('.c','.h')))
          members={};missing=[]
          with zipfile.ZipFile(out/'tracked-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(wanted)):
                  if name not in tracked:missing.append(name);continue
                  p=root/name;assert p.is_file() and not p.is_symlink()
                  data=p.read_bytes();data.decode('utf-8');assert b'\0' not in data and len(data)<1500000
                  z.writestr(name,data);members[name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              oracle='tools/stage61_interaction_oracle.py'
              if oracle in tracked:
                  lines=(root/oracle).read_text().splitlines();hits=set()
                  for i,line in enumerate(lines):
                      if re.search(r'(?i)std.?script|callstd|0x0806DEC5|0x0806DE75|SCRIPT_CMD|script_command_table',line):hits.update(range(max(0,i-4),min(len(lines),i+7)))
                  z.writestr('oracle-std-excerpts.txt','\n'.join(f'{i+1}: {lines[i]}' for i in sorted(hits)))
          runs=api('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=30')['workflow_runs']
          observation={'source_head':head,'run_id':int(os.environ['GITHUB_RUN_ID']),'pr':{'state':pr['state'],'draft':pr['draft'],'merged':pr['merged'],'head':pr['head']['sha']},'runs':[{k:r[k] for k in ('id','name','head_sha','status','conclusion')} for r in runs],'members':members,'missing':missing,'candidate_reconstructions':0,'new_emulator_processes':0,'rom_changes':0,'accepted_native_cases_replayed':0}
          (out/'source-observation.json').write_text(json.dumps(observation,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'source_head':head,'files':len(members),'missing':missing,'new_emulator_processes':0}))
          PY
          git diff --exit-code
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-ring-transitive-source
          path: .local/pr16-ring-transitive-owner/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-ring-transitive-owner
run-name: Ring callstd4・推移的native限定byte検証・既受入再実行なし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-transitive-owner.yml
      - scripts/pr16_ring_transitive_owner.py
      - tests/test_pr16_ring_transitive_owner.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-transitive-owner
  cancel-in-progress: false
jobs:
  scoped-owner:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact HEAD・受入境界と変更したfocused testsのみ
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-transitive-owner
          mkdir -p "$out"
          python3 - <<'PY'
          import json,os,pathlib,subprocess,unittest
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA']
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          pr=api('pulls/16')
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==head and pr['head']['ref']=='codex/modernization-followup-20260908'
          assert pr['head']['repo']['full_name']==repo
          assert api('git/ref/heads/codex/modernization-followup-20260908')['object']['sha']==head
          old=api('actions/runs/34956919982');native=api('actions/runs/34946969126')
          assert old['status']==native['status']=='completed' and old['conclusion']==native['conclusion']=='success'
          assert old['head_sha']=='2a9728ac4e3531f2a595da6b3d95ba12f842e44a'
          assert native['head_sha']=='0b7497b575a3180a045f2be377386490f192a012'
          out=pathlib.Path('.local/pr16-ring-transitive-owner')
          runs=api('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=20')['workflow_runs']
          (out/'actions-before.json').write_text(json.dumps({'source_head':head,'run_id':int(os.environ['GITHUB_RUN_ID']),'runs':[{k:r[k] for k in ('id','name','head_sha','status','conclusion')} for r in runs]},ensure_ascii=False,indent=2)+'\n')
          with (out/'tests.txt').open('w') as stream:
              result=unittest.TextTestRunner(stream=stream,verbosity=2).run(unittest.defaultTestLoader.discover('tests',pattern='test_pr16_ring_transitive_owner.py'))
          value={'tests_run':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'successful':result.wasSuccessful() and not result.skipped}
          (out/'tests.json').write_text(json.dumps(value,indent=2)+'\n');print(value);assert value['successful']
          PY
          python3 scripts/pr16_resume.py check > "$out/resume-before.json"
      - name: 固定toolchainと同一Stage84入力のみ復元
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-transitive-owner
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
      - name: 固定private入力と以前検証した生成headerを復元
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-transitive-owner
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          cfg=json.loads(pathlib.Path('config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          source=pathlib.Path('.local/pr16-bp-trial-native-inputs')/name;raw=source.read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          evidence={}
          with zipfile.ZipFile(source) as z:
              for member,dest in [('vendor/upstream/CFRU-JP/charmap.tbl','vendor/upstream/CFRU-JP/charmap.tbl'),('generated/runtime/event_design_generated.h','.local/pr16-ring-transitive-inputs/event_design_generated.h')]:
                  data=z.read(member);p=pathlib.Path(dest)
                  assert not any(q.is_symlink() for q in (p,*p.parents))
                  if p.exists():assert p.read_bytes()==data
                  else:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data);p.chmod(0o444)
                  evidence[member]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          pathlib.Path('.local/pr16-ring-transitive-owner/restored-bindings.json').write_text(json.dumps({'archive_sha256':bound['sha256'],'members':evidence},indent=2)+'\n')
          PY
      - name: 新規未観測calleeのbyte入力のみ再構築・old compiled監査とnativeは再実行しない
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-transitive-owner
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 scripts/pr16_bp_party_retention_successor.py > "$out/candidate.stdout" 2> "$out/candidate.stderr"
      - name: callstd4と外部nativeのみ有限検証・不明な副作用を受入に昇格しない
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-transitive-owner
          python3 scripts/pr16_ring_transitive_owner.py --rom .local/pr16-bp-party-retention-successor/candidate.gba --header .local/pr16-ring-transitive-inputs/event_design_generated.h > "$out/audit.stdout" 2> "$out/audit.stderr"
          python3 scripts/validate_task_graph.py > "$out/task-graph.stdout" 2> "$out/task-graph.stderr"
          git diff --exit-code
          git diff --check
      - name: UTF-8限定証拠guard・ROM/save/private入力の公開禁止
        id: export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          out=pathlib.Path('.local/pr16-ring-transitive-owner');bound={}
          for p in out.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt','.stdout','.stderr','.log'}
              data=p.read_bytes();data.decode('utf-8');assert b'\0' not in data and len(data)<4000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',data)
              bound[p.name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (out/'members.json').write_text(json.dumps(bound,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: pr16-ring-transitive-owner
          path: .local/pr16-ring-transitive-owner/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

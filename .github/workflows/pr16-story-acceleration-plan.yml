name: pr16-story-acceleration-plan
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-acceleration-plan.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-acceleration-plan
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable decision base
        run: |
          set -euo pipefail
          echo "DECISION_BASE_HEAD=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          test "$(git branch --show-current)" = "codex/modernization-followup-20260908"
      - name: Record owner-approved accelerated acceptance plan
        run: |
          python3 - <<'PY'

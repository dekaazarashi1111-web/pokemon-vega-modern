name: pr16-resume-bootstrap
run-name: PR16 fixed handoff install and source-only verification
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-resume-bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: pr16-resume-bootstrap
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore exact reviewed UTF-8 sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-resume-bootstrap .local/pr16-resume
          gh api repos/dekaazarashi1111-web/pokemon-vega-modern/git/blobs/861f7d68f29a7eebf31bfca5a580dd5a1233f0ec > .local/pr16-resume-bootstrap/blob.json
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          root = pathlib.Path.cwd()
          blob = json.loads((root/'.local/pr16-resume-bootstrap/blob.json').read_text())
          raw = bytearray(base64.b64decode(blob['content']))
          assert len(raw) == 15353
          assert hashlib.sha256(raw).hexdigest() == '88a3ba3c1736f8162a86d0145af67ab58299abdb25532dd1d0bd5c77560397b7'
          # Restore the one known transport-byte typo, then verify the reviewed bundle.
          assert raw[165] == 80
          raw[165] = 212
          assert hashlib.sha256(raw).hexdigest() == 'bc55cdaebad4062ab8236918dba2ca92dd8d1ddfb4fe80d270c6f76f860d918b'
          decoder = zlib.decompressobj()
          decoded = decoder.decompress(bytes(raw), 262144)
          assert decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
          bundle = json.loads(decoded)
          expected = {'CHATGPT_RESUME.md', 'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md', 'content/modernization/pr16_native_supply_resume_20260913.json', 'content/modernization/pr16_bp_selection_diagnostic.json', 'scripts/pr16_resume.py', 'tests/test_pr16_resume.py', '.github/workflows/pr16-resume-maintenance.yml'}
          assert bundle['schema_version'] == 1 and set(bundle['files']) == expected and set(bundle['manifest']) == expected
          for name, text in bundle['files'].items():
              path = root/name
              assert not any(p.is_symlink() for p in (path, *path.parents))
              content = text.encode('utf-8')
              meta = bundle['manifest'][name]
              assert b'\0' not in content and len(content) == meta['size'] and hashlib.sha256(content).hexdigest() == meta['sha256']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          (root/'.local/pr16-resume/source-manifest.json').write_text(json.dumps(bundle['manifest'], indent=2)+'\n')
          print('Reviewed source bundle: 7 exact UTF-8 files restored; no ROM/save/private input.')
          PY
      - name: Install routing and verify actual repository
        run: |
          set -euo pipefail
          sed -i 's/[[:blank:]]*$//' scripts/pr16_resume.py
          python3 scripts/pr16_resume.py install-routing
          python3 -m unittest discover -s tests -p test_pr16_resume.py -v 2>&1 | tee .local/pr16-resume/focused-tests.txt
          python3 scripts/pr16_resume.py check
          python3 scripts/validate_task_graph.py
          git diff --check
          python3 scripts/pr16_resume.py record-logs --source-head "$GITHUB_SHA" --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path.cwd()
          def original(name):
              return subprocess.check_output(['git','show','HEAD:'+name]).decode('utf-8')
          name = 'content/modernization/p08_remaining_work.json'
          before, after = json.loads(original(name)), json.loads((root/name).read_text())
          for data in (before, after):
              data.pop('current_resume_doc', None)
              for row in data['remaining_conditions']:
                  if row['id'] in ('NATURAL_CAPTURE_GEAR','FINAL_NATIVE_ACCEPTANCE'):
                      row.pop('resume',None)
          assert before == after, 'P08 acceptance/conditions unexpectedly changed'
          for name in ('design/run_log.md','design/version_log.md'):
              assert (root/name).read_text().startswith(original(name)), 'log is not append-only'
          print('P08 acceptance unchanged; both logs append-only.')
          PY
          git add -- CHATGPT_RESUME.md docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md content/modernization/pr16_native_supply_resume_20260913.json content/modernization/pr16_bp_selection_diagnostic.json scripts/pr16_resume.py tests/test_pr16_resume.py AGENTS.md README.md design/current_state.md design/agent_context_map.md docs/PR16_BP_TRIAL_RESUME_20260913_JA.md docs/PR16_NATIVE_SUPPLY_RESUME_20260912_JA.md content/modernization/p08_remaining_work.json design/run_log.md design/version_log.md
          python3 scripts/pr16_resume.py guard --base "$GITHUB_SHA"
          python3 scripts/pr16_resume.py check
          git diff --cached --check
      - name: Commit verified handoff without overwriting concurrent work
        run: |
          set -euo pipefail
          ref=refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$ref" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260913-RESUME-OPTIMIZATION: unify persistent handoff and validate latest diagnostic'
          git push origin "HEAD:$ref"
          test "$(git ls-remote origin "$ref" | cut -f1)" = "$(git rev-parse HEAD)"
          git rev-parse HEAD > .local/pr16-resume/pushed-head.txt
          python3 scripts/pr16_resume.py check
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-resume-maintenance
          path: .local/pr16-resume/
          retention-days: 30
          if-no-files-found: error

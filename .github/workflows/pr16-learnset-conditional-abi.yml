name: pr16-learnset-conditional-abi
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-conditional-abi.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  conditional-abi:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 保存親の入口だけ読取り（host/ARM/native再実行0）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_conditional_abi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-abi
          path: .local/pr16-learnset-conditional-abi/proof/
          retention-days: 30
          if-no-files-found: error

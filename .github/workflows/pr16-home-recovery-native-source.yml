name: pr16-home-recovery-native-source
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-home-recovery-native-source.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  source:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SHA-bound UTF-8 sources and measurement originals
        shell: python
        run: |
          import base64, datetime, hashlib, json, os, pathlib, sys, zlib
          sys.path[:0]=['scripts','.']
          import pr16_research_story_route_actions as h
          from pr16_learnset_compact_record import publish_resume
          h.d.current();state=h.source_check()
          # Transport only reviewed UTF-8 Python/JSON/TXT. No ROM/Save/executable/image.
          encoded=(
          ''
          ''
          ''
          ''
          )
          decoder=zlib.decompressobj();raw=decoder.decompress(base64.b64decode(encoded,validate=True),100001)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(raw)==82518 and hashlib.sha256(raw).hexdigest()=='69d6b47972650771a85487d4736e8e6c89e0f80c92a1892761239d419ee4c717'
          payload=json.loads(raw);assert len(payload)==15
          code={'scripts/pr16_home_recovery_native.py','scripts/pr16_home_recovery_native_actions.py','tests/test_pr16_home_recovery_native.py'}
          for name,text in payload.items():
              p=pathlib.Path(name)
              assert name in code or p.parent==pathlib.Path('content/modernization/pr16_home_recovery_native_development')
              assert p.suffix in {'.py','.json','.txt'} and not p.exists() and '\0' not in text
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
              if p.suffix=='.py':compile(text,name,'exec')
          import pr16_home_recovery_native_actions as n
          proof=n.dev_verified()
          assert h.d.bindings(set(state['source_bindings']))==state['source_bindings']
          own=set(payload)|{n.SOURCE_WF,n.GUIDE,h.d.STATE,h.d.DOC}|h.d.LOGS
          goal='母親回復の新oracle73検査と81/cold34入力の開発原本を固定。source52検査は再利用。次は通常compile済みbuild artifact10946449847を照合し、pr16-home-recovery-native.ymlで新区間2processのみ正式測定。旧194/367/301/114入力を再生しない。'
          with open(n.GUIDE,'a') as f:f.write('\n## 新規回復oracle準備\n\n'+goal+'\n\n初回73試験のうち、不完全schemaの例外2件と実入力未結合1件を修正後73全成功。初期探索の実行ファイル文字列更新方式は正式採用せず、source通常compile版で独立測定する。冷起動開発はその通常compile版を使用。native正式受入は未完。\n')
          state['bp']['current_stop']='HOME_RECOVERY_NATIVE_ORACLE_READY';state['bp']['next_step']=goal
          state['next_action']=dict(state['next_action'],id='HOME_RECOVERY_NATIVE_ACTIONS_NEXT',goal_ja=goal,read_paths=[n.GUIDE,n.SOURCE_CP,n.SELF,'content/modernization/pr16_home_recovery_native_development/verification.json'],stop_rule_ja='新native runが存在したらartifact回収のみ。存在しない場合だけ通常compile runnerで新区間を測定。成功Save原本は不変。merge/release/baseline変更禁止。')
          for name in own-{h.d.STATE,h.d.DOC}-h.d.LOGS:state['source_bindings'][name]=h.m.identity(pathlib.Path(name).read_bytes())
          state['logs_synchronized']=True;publish_resume(state)
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          entry=f'\n## {stamp}\n- Timestamp: {stamp}\n- Task: USER-20260928-HOME-RECOVERY\n- Version: home-recovery-native-oracle-v1\n- Status: DONE（新73oracle準備のみ、正式native未受入）\n- Summary: {goal}\n- Files changed: 新oracle/actions/test/開発原本text/MD/固定引継ぎ/両ログ。\n- Verify: 新73検査原本/source binding照合PASS。input/画面/party回復3bytes/597bytes不変/Save/時計差分を検証。ここでnative/unit/compile再実行0。\n- Commit: source={os.environ["GITHUB_SHA"]}; same branch non-force。\n- Network: GitHub source/API only。release/baseline/global private guard PASSを主張しない。\n'
          for name in h.d.LOGS:
              with open(name,'a') as f:f.write(entry)
          out=pathlib.Path('.local/pr16-home-native-source');out.mkdir(parents=True)
          h.d.write(out/'owned.json',sorted(own))
          h.d.write(out/'transfer.json',dict(files=15,source_sha256=hashlib.sha256(raw).hexdigest(),unit_tests_reused=73,native_processes=0,source_head=os.environ['GITHUB_SHA']))
      - name: Verify and non-force commit source checkpoint
        shell: bash
        run: |
          python scripts/validate_task_graph.py --check
          python scripts/pr16_resume.py check
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path[:0]=['scripts','.']
          import pr16_learnset_runtime_record as g
          paths=json.loads(Path('.local/pr16-home-native-source/owned.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          g.START='26e413850e149b9a311e3017ad841676c124e8c0';g.CODE=set();g.OWNED=set(paths);g.guard()
          PY
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260928-HOME-RECOVERY: 新73oracleと回復入力原本を固定、正式測定へ'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          git rev-parse HEAD > .local/pr16-home-native-source/completion-head.txt
          python - <<'PY'
          import json,pathlib,zipfile
          out=pathlib.Path('.local/pr16-home-native-source')
          with zipfile.ZipFile(out/'record.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in json.loads((out/'owned.json').read_text()):z.write(n,n)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-home-recovery-native-source
          path: .local/pr16-home-native-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

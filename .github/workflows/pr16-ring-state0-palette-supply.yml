name: pr16-ring-state0-palette-supply
run-name: state0の32byte供給と二重コピーの独立oracleを検証
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-state0-palette-supply.yml
      - scripts/pr16_ring_state0_palette_supply.py
      - tests/test_pr16_ring_state0_palette_supply.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-state0-palette-supply
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 新規32byteとcaller suffixを検証し同branchへ記録
        run: python3 scripts/pr16_ring_state0_palette_supply.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-state0-palette-supply
          path: |
            .local/pr16-ring-state0-palette-supply/analysis.json
            .local/pr16-ring-state0-palette-supply/tests.json
            .local/pr16-ring-state0-palette-supply/tests.txt
            .local/pr16-ring-state0-palette-supply/preflight.json
            .local/pr16-ring-state0-palette-supply/guard.json
            .local/pr16-ring-state0-palette-supply/recorded-result.json
            .local/pr16-ring-state0-palette-supply/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-bp-three-win-reward-native
run-name: 同一保持candidateのnative 2・3戦目と正確な9 BP報酬検証
on:
  workflow_dispatch:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-bp-three-win-reward-native.yml
      - scripts/pr16_bp_three_win_reward_native.py
      - tests/test_pr16_bp_three_win_reward_native.py
      - tools/mgba_pr16_bp_three_win_reward.c
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-bp-three-win-reward-native
  cancel-in-progress: false
jobs:
  three-win-reward:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Focused fail-closed tests and fixed remote reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-three-win-reward-native-run
          mkdir -p "$out"
          python3 -m py_compile scripts/pr16_bp_three_win_reward_native.py
          python3 -m unittest discover -s tests -p 'test_pr16_bp_three_win_reward_native.py' -v > "$out/unit.stdout" 2> "$out/unit.stderr"
          python3 scripts/pr16_resume.py check > "$out/resume-before.json"
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA'];branch='codex/modernization-followup-20260908'
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          def small(row):return {k:row[k] for k in ('id','name','head_sha','path','status','conclusion','event')}
          assert api('git/ref/heads/'+branch)['object']['sha']==head,'branch advanced'
          pr=api('pulls/16');assert pr['state']=='open' and pr['draft'] and not pr['merged'] and pr['head']['sha']==head
          retained=api('actions/runs/34825059791')
          assert retained['id']==34825059791 and retained['status']=='completed' \
              and retained['path']=='.github/workflows/pr16-bp-party-retention-native.yml' \
              and retained['head_sha']=='10e535a046441dd3b797918106259b5c57b69716','fixed retention run changed'
          # Bind the accepted prefix by immutable run/artifact IDs instead of assuming
          # that it remains the newest run after unrelated branch pushes.
          artifact=api('actions/runs/34825059791/artifacts')['artifacts']
          assert any(a['id']==10339976783 and not a['expired'] for a in artifact),'fixed retention artifact missing'
          current=api('actions/workflows/pr16-bp-three-win-reward-native.yml/runs?branch=codex%2Fmodernization-followup-20260908&per_page=1')['workflow_runs']
          assert len(current)==1 and current[0]['id']==int(os.environ['GITHUB_RUN_ID']),'newer three-win request exists'
          pathlib.Path('.local/pr16-bp-three-win-reward-native-run/actions-before.json').write_text(json.dumps({
              'retention':small(retained),'retention_artifact_id':10339976783,
              'tested_head':head,'pr_open_draft':True,'accepted_native_cases_replayed':0,
          },sort_keys=True,indent=2)+'\n')
          PYCODE
      - name: Restore pinned compiler and unchanged Stage84 input
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-three-win-reward-native-run
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
      - name: Restore pinned private inputs and character map
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-bp-three-win-reward-native-run
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.');cfg=json.loads((root/'config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          archive=root/'.local/pr16-bp-trial-native-inputs'/name;raw=archive.read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          member='vendor/upstream/CFRU-JP/charmap.tbl'
          with zipfile.ZipFile(archive) as z:data=z.read(member)
          path=root/member;assert not any(p.is_symlink() for p in (path,*path.parents))
          if path.exists():assert path.read_bytes()==data
          else:path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);path.chmod(0o444)
          (root/'.local/pr16-bp-three-win-reward-native-run/charmap-binding.json').write_text(json.dumps({
              'archive_sha256':bound['sha256'],'member':member,'size':len(data),
              'sha256':hashlib.sha256(data).hexdigest(),
          },sort_keys=True)+'\n')
          PYCODE
      - name: Rebuild exact retained candidate parents without accepted-case replay
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-three-win-reward-native-run
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
      - name: Run one-process native battles 2 and 3 through exact reward completion
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-three-win-reward-native-run
          sudo apt-get update > "$out/apt-update.log" 2>&1
          sudo apt-get install -y libmgba-dev > "$out/apt-mgba.log" 2>&1
          python3 scripts/pr16_bp_three_win_reward_native.py > "$out/native.stdout" 2> "$out/native.stderr"
          git diff --exit-code
      - name: Guard scoped text evidence; never publish ROM save or patch bytes
        id: guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,re,shutil,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-bp-three-win-reward-native-run';out.mkdir(parents=True,exist_ok=True)
          state_path=root/'content/modernization/pr16_native_supply_resume_20260913.json'
          state=json.loads(state_path.read_bytes())
          tracked={
              '.github/workflows/pr16-bp-three-win-reward-native.yml','AGENTS.md','CHATGPT_RESUME.md',
              'scripts/pr16_bp_three_win_reward_native.py','tests/test_pr16_bp_three_win_reward_native.py',
              'tools/mgba_pr16_bp_three_win_reward.c','scripts/pr16_resume.py','tests/test_pr16_resume.py',
              'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
              'content/modernization/pr16_native_supply_resume_20260913.json',
              'content/modernization/pr16_bp_chooser_checkpoint.json',
              'content/modernization/pr16_bp_party_retention_verified.json',
              'content/modernization/pr16_bp_party_retention_wip.json',
              'content/modernization/p08_remaining_work.json','design/run_log.md','design/version_log.md',
          }
          tracked.update(state.get('source_bindings',{}))
          snapshot={}
          for name in sorted(tracked):
              path=root/name
              assert path.is_file() and not path.is_symlink(),name
              raw=path.read_bytes();raw.decode('utf-8');assert b'\0' not in raw
              snapshot[name]=raw.decode('utf-8')
          (out/'tracked-snapshot.json').write_text(json.dumps(snapshot,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          successor=root/'.local/pr16-bp-party-retention-successor'
          if (successor/'candidate.json').exists():shutil.copyfile(successor/'candidate.json',out/'successor-candidate.json')
          for compile_dir in sorted(successor.glob('compile-*')):
              for name in ('runtime-disassembly.txt','runtime-symbols.txt'):
                  source=compile_dir/name
                  if source.exists():shutil.copyfile(source,out/(compile_dir.name+'-'+name))
          bound={}
          for p in sorted(out.iterdir()):
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt','.stdout','.stderr','.log'}
              raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw and len(raw)<8000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',raw)
              bound[p.name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          native=root/'.local/pr16-bp-three-win-reward-native'
          if native.exists():
              for p in sorted(native.iterdir()):
                  assert p.is_file() and not p.is_symlink()
                  assert p.suffix in {'.json','.txt','.stdout','.stderr','.ppm','.zip'}
                  raw=p.read_bytes();assert len(raw)<12000000
                  if p.suffix=='.zip':
                      with zipfile.ZipFile(p) as z:
                          for name in z.namelist():
                              assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
                              data=z.read(name);data.decode('utf-8');assert b'\0' not in data
                  elif p.suffix=='.ppm':assert raw.startswith(b'P6') or raw.startswith(b'P3')
                  else:raw.decode('utf-8');assert b'\0' not in raw
                  assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',raw)
                  bound['native/'+p.name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'members.json').write_text(json.dumps(bound,sort_keys=True,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outcome == 'success'
        with:
          name: pr16-bp-three-win-reward-native
          path: |
            .local/pr16-bp-three-win-reward-native-run/
            .local/pr16-bp-three-win-reward-native/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

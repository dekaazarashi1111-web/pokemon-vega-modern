name: pr16-fusion-scene-checkpoint
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-fusion-scene-checkpoint.yml]
permissions:
  contents: write
  actions: read
jobs:
  checkpoint:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Retain raw native failure, binding every source to its tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,sys
          sys.path.insert(0,'scripts');import pr16_fixed_form_checkpoint as keep
          pin=dict(run_id=34697100492,job_id=103562346678,artifact_id=10299570880,head='c38d5dae3ac1c73d65b891e5b2f525267caa7b2d',size=978963,sha256='8d2e0461baec89b8082ce8af7715efd38e7c4c07525931f4d26381e06100d2a6',cases=list(keep.fixed.CASES)[:2],conclusion='failure')
          record=keep.retain(pin,'初回Nアイテムnative2ケース。相方選択、フォーム遷移、4枠確認、summary選択後に0811CF35/0811D259の文字送り待ちで時間制限。ROM書換なし、保存未実行、正式3/5は不変。')
          subprocess.run(['git','add','-f',record['original']['path']],check=True)
          keep.git_check(record,'INDEX')
          pathlib.Path('content/modernization/pr16_fixed_form_latest_execution.json').write_bytes(keep.fixed.stable(record))
          PY
      - name: Advance only native text messages, keep move/counter assertions intact
        shell: bash
        run: |
          set -euo pipefail
          echo '4ccfd59cdb8d01365def80d61f58a6c142fec40c12c7fef85503d8b6cd5792d9  tools/mgba_pr16_necrozma_fusion_acceptance.c' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tools/mgba_pr16_necrozma_fusion_acceptance.c');s=path.read_text()
          old='''        } else if (callback == P02S_CB2_PARTY && frame % 120U == 0U) {
                      key = QOL_KEY_A;
                  }
          '''
          # Match literal source indentation, not YAML presentation indentation.
          old='        } else if (callback == P02S_CB2_PARTY && frame % 120U == 0U) {\n            key = QOL_KEY_A;\n        }\n'
          new='        } else if (callback == P02S_CB2_PARTY && frame % 120U == 0U) {\n            key = QOL_KEY_A;\n        } else if (!f_live_field(core) && frame % 120U == 0U) {\n            /* Native post-Summary replacement text has its own callback,\n             * observed as 0811CF35 in run 34697100492. B advances that text\n             * without confirming a new party/item selection. */\n            key = QOL_KEY_B;\n        }\n'
          assert s.count(old)==1;s=s.replace(old,new,1)
          old='                    ut.replacement_selection = b_frames + 1U;\n'
          new=old+'                    fprintf(stderr, "FUSION_CHOICE cursor=%u frame=%u\\n",\n                            cursor, ut.replacement_selection);\n                    f_shot(core, "fusion-chosen-slot");\n'
          assert s.count(old)==1;s=s.replace(old,new,1);path.write_text(s)
          PY
          python3 -m unittest discover -s tests -p test_pr16_fixed_form_acceptance.py -v
          python3 scripts/pr16_fixed_form_originals.py
          python3 scripts/validate_task_graph.py
      - name: Commit evidence and exact next stopping point without acceptance inflation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,pathlib
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          text=f'\n## {stamp}\n- Task: USER-MODERNIZATION / native Necrozma post-Summary controller\n- Status: FAIL_RETAINED_CONTROLLER_CORRECTED_NATIVE_PENDING\n- Summary: run34697100492/job103562346678でstrictC、7writeguards、native2processを実行。Nアイテム使用→Necrozma/相方選択→固有フォーム→4枠技選択を実測。選択後の1、2、ポカン表示（cb0811CF35/task0811D259）をcontrollerが送らず停止。Bでnative文字送りを追加し、実選択cursor/画像を記録する。\n- Verify: 18 unit tests PASS、旧4原本HEAD一致、新失敗ZIP978963bytes SHA2568d2e0461baec89b8082ce8af7715efd38e7c4c07525931f4d26381e06100d2a6をGit index byte一致確認。source ZIP全員を実行HEADのGit objectへ照合。\n- Files changed: fusionC、原本/Actions/checkpoint/latest_execution、logs。\n- Commit: この追記を含むcommit。原本実行HEADc38d5dae3ac1c73d65b891e5b2f525267caa7b2d。\n- Counts: これまでnative13attempts=5+4+2+2。別のpreflight失敗は0、static/retentionは0。受入は3/5のまま。\n- Next: 修正後のNecrozma2ケースだけ再実行。通常Save/freshContinueはまだ未受入。Crowned/取消/generic/P07やROM/active baselineを変更しない。\n'
          for name in ('design/run_log.md','design/version_log.md'):
              with pathlib.Path(name).open('a') as f:f.write(text)
          PY
          git diff --exit-code -- config/active_play_baseline.json design/active_play_baseline.md content/modernization/p08_remaining_work.json content/modernization/pr16_fixed_form_acceptance.json tools/mgba_pr16_fixed_form_acceptance.c
          git add tools/mgba_pr16_necrozma_fusion_acceptance.c content/modernization/pr16_fixed_form_acceptance_evidence/34697100492 content/modernization/pr16_fixed_form_latest_execution.json design/run_log.md design/version_log.md
          git rm .github/workflows/pr16-fusion-scene-checkpoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git commit -m 'USER-MODERNIZATION: preserve first native fusion choice and advance native post-summary messages (3/5 stays open)'
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts');import pr16_fixed_form_checkpoint as keep
          keep.git_check(json.load(open('content/modernization/pr16_fixed_form_latest_execution.json')),'HEAD')
          PY
          git push origin "HEAD:$GITHUB_REF_NAME"

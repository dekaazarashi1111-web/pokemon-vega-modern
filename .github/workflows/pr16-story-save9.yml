name: pr16-story-save9
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save9.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save9
  cancel-in-progress: false
jobs:
  training:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure only new training interval and independent Continue
        run: |
          python3 -B - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('scripts/pr16_story_save9_actions.py').read_bytes()
          assert len(p)==24885 and hashlib.sha256(p).hexdigest()=='c9f5b451b484618fc831c7e325fa7872166c9f7ab640b8a01abaf576b644f61e'
          PY
          python3 -B scripts/pr16_story_save9_actions.py measure
      - name: Record measured originals and fixed handoff
        run: python3 -B scripts/pr16_story_save9_actions.py record
      - name: Validate task graph and exact staged text boundary
        run: |
          python3 -B scripts/validate_task_graph.py --check
          python3 -B scripts/pr16_story_save9_actions.py guard
      - name: Commit verified text and non-force push same branch
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260928-STORY-SAVE9: 野生3勝2逃走・Lv9/Save9・独立Continue・76検査を限定受入 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/$branch
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=DONE TASK=USER-20260928-STORY-SAVE9 VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - name: Read back committed text and retain completion identity
        run: python3 -B scripts/pr16_story_save9_actions.py snapshot
      - name: Preserve partial native originals without replay
        if: always()
        run: python3 -B scripts/pr16_story_save9_actions.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save9-checkpoint
          path: .local/pr16-story-save9/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

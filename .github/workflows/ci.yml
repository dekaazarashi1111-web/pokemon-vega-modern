name: source-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Git管理内の整合性とP01のfocused回帰
        run: |
          python3 scripts/validate_task_graph.py
          python3 scripts/guard_private_files.py
          python3 -m unittest \
            tests.test_github_private_environment \
            tests.test_github_comment_control \
            tests.test_github_large_file_bridge \
            tests.test_github_result_summary \
            tests.test_run_github_battle_command \
            tests.test_modernization_ids \
            tests.test_modernization_targets \
            tests.test_p01_collection_consumer \
            tests.test_p01_restore \
            tests.test_p01_rom_audit \
            tests.test_p01_rom_build \
            tests.test_p01_references \
            tests.test_p01_baseline_reuse
      - name: P01現行用generatorと実consumerの決定的再照合
        run: |
          python3 scripts/build_modernization_catalog.py build
          python3 scripts/build_modernization_catalog.py check
          python3 scripts/build_modernization_targets.py build
          python3 scripts/build_modernization_targets.py check
          python3 scripts/build_p01_collection_table.py build
          python3 scripts/build_p01_collection_table.py check
          git diff --exit-code

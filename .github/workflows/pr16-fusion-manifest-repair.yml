name: pr16-fusion-manifest-repair
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-fusion-manifest-repair.yml]
permissions:
  contents: write
  actions: read
jobs:
  checkpoint:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve two exact originals, deduplicating against tracked ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'scripts');import pr16_fixed_form_originals as originals
          ident=originals.identity
          def api(p):return subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/'+p])
          pins=[
            (34681725548,103521455738,10294094459,'d308bf867ff04fba8cca7f08500cfc6e0972dd82',221634,'4b7606ab66dfd57a6cd0b4c5c301f34f63dd5f90a9374b543f889152217def5e','success','diagnostic'),
            (34696793115,103561540443,10299126927,'e78550ef8d98e0bf2c486a50594ca54e25789e85',211354,'e3c7584d6eb3066df6d3ae2bf53a3d14deec6552a73e0c9fd89a433602b4df5d','failure','preflight'),
          ]
          tracked=[p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p.endswith('.zip') and 'fixed_form' in p]
          recovered=[]
          for run_id,job_id,artifact_id,head,size,sha,conclusion,kind in pins:
              run=json.loads(api(f'actions/runs/{run_id}'));jobs=json.loads(api(f'actions/runs/{run_id}/jobs'));meta=json.loads(api(f'actions/artifacts/{artifact_id}'));raw=api(f'actions/artifacts/{artifact_id}/zip')
              assert ident(raw)=={'size':size,'sha256':sha}
              assert run['id']==run_id and run['head_sha']==head and run['conclusion']==conclusion and run['run_attempt']==1
              assert len(jobs['jobs'])==1 and jobs['jobs'][0]['id']==job_id and jobs['jobs'][0]['conclusion']==conclusion
              assert meta['id']==artifact_id and meta['digest']=='sha256:'+sha and meta['workflow_run']['head_sha']==head and not meta['expired']
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  originals.scan(z)
                  if kind=='diagnostic':
                      prefix='pr16-fixed-form-probe/'
                      report=json.loads(z.read(prefix+'result.json'))
                      assert z.read('pr16-fixed-form-evidence/tested-head.txt').decode().strip()==head
                      assert report['status']=='PASS_DIAGNOSTIC_ONLY' and report['actual_new_processes']==4
                      assert len(report['observations'])==4 and report['failures']==[]
                      bindings=json.loads(z.read('pr16-fixed-form-evidence/source-bindings.json'))
                      with zipfile.ZipFile(io.BytesIO(z.read('pr16-fixed-form-evidence/sources.zip'))) as sources:
                          assert set(sources.namelist())==set(bindings)
                          for name,bound in bindings.items():assert ident(sources.read(name))==bound
                      for row in report['observations']:
                          result=row['result'];name=row['name']
                          assert json.loads(z.read(prefix+name+'.stdout'))==result
                          assert json.loads(z.read(prefix+name+'.process.json'))==row['process']==dict(schema_version=1,returncode=0,spawn_error=None,timed_out=False)
                          assert result['acceptance_claimed'] is False and result['save_counter_before']==result['save_counter_after']==2
                  else:
                      prefix='pr16-fixed-form-acceptance/'
                      report=json.loads(z.read(prefix+'result.json'));receipt=json.loads(z.read(prefix+'receipt.json'))
                      assert receipt['tested_head']==head
                      for name,bound in receipt['members'].items():assert ident(z.read(prefix+name))==bound
                      assert report['status']=='FAIL' and report['actual_new_processes']==0 and report['results']==[]
                      assert report['failures']==[dict(stage='setup-or-execution',error="'cfru_symbol'")]
                  assert report['p03_fixed_form_gap_closed'] is False and report['native_acceptance_claimed'] is False and report['release_ready'] is False
              matches=[p for p in tracked if ident(pathlib.Path(p).read_bytes())==ident(raw)]
              assert len(matches)<=1
              dest=pathlib.Path(originals.BASE)/str(run_id)
              assert not dest.exists();dest.mkdir(parents=True)
              original=pathlib.Path(matches[0]) if matches else dest/'original.zip'
              if not matches:original.write_bytes(raw)
              (dest/'actions.json').write_text(json.dumps(dict(schema_version=1,run=run,jobs=jobs,artifact=meta,download=ident(raw),original_path=str(original)),sort_keys=True,indent=2)+'\n')
              record=dict(schema_version=1,kind=kind,run_id=run_id,job_id=job_id,artifact_id=artifact_id,tested_head=head,original=dict(path=str(original),**ident(raw)),result=report,new_emulator_runs_during_retention=0,p03_fixed_form_gap_closed=False,release_ready=False)
              (dest/'checkpoint.json').write_text(json.dumps(record,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
              recovered.append(record['original'])
          pathlib.Path('content/modernization/pr16_fixed_form_probe_retention.json').write_text(json.dumps(dict(schema_version=1,status='RETAINED_DIAGNOSTIC_AND_FAILED_PREFLIGHT_NOT_ACCEPTANCE',originals=recovered,prior_diagnostic_expiry='2026-10-12T07:50:56Z',new_emulator_runs=0,p03_fixed_form_gap_closed=False,release_ready=False),sort_keys=True,indent=2)+'\n')
          PY
      - name: Use the actual item/CFRU and species/DPE columns, then test real manifests
        shell: bash
        run: |
          set -euo pipefail
          echo 'c79f438f34d026adb8490d0b342859558c2c90bdfb6bb2dfd90b1df087f924c5  scripts/pr16_fixed_form_acceptance.py' | sha256sum -c -
          echo '625bbc1108a24faf0d5b2709bb2014e3e68b66c8a29320a64f3ceff6ad548d71  tests/test_pr16_fixed_form_acceptance.py' | sha256sum -c -
          python3 - <<'PY'
          import pathlib
          path=pathlib.Path('scripts/pr16_fixed_form_acceptance.py');s=path.read_text()
          replacements=[
            ('for name, expected_ids in (', 'for name, symbol_column, expected_ids in ('),
            ("('item_ids.csv', {'ITEM_N_SOLARIZER'", "('item_ids.csv', 'cfru_symbol', {'ITEM_N_SOLARIZER'"),
            ("('species_ids.csv', {'SPECIES_SOLGALEO'", "('species_ids.csv', 'dpe_symbol', {'SPECIES_SOLGALEO'"),
            ("        for symbol, value in expected_ids.items():\n            found = [r for r in rows if r['cfru_symbol'] == symbol]", "        need(rows and all('id' in r and symbol_column in r for r in rows), 'fusion manifest schema differs: ' + name)\n        for symbol, value in expected_ids.items():\n            found = [r for r in rows if r[symbol_column] == symbol]"),
          ]
          for old,new in replacements:
              assert s.count(old)==1;s=s.replace(old,new,1)
          path.write_text(s)
          path=pathlib.Path('tests/test_pr16_fixed_form_acceptance.py');s=path.read_text()
          old="species.write_text('id,cfru_symbol\\n1189,SPECIES_SOLGALEO\\n1190,SPECIES_LUNALA\\n')"
          assert s.count(old)==1;s=s.replace(old,old.replace('cfru_symbol','dpe_symbol'),1)
          old='    def test_historical_probe_is_not_accepted(self):'
          assert s.count(old)==1;s=s.replace(old,'    def test_fusion_ids_match_actual_repository_manifests(self):\n        m.verify_fusion_ids(ROOT)\n\n'+old,1)
          path.write_text(s)
          PY
          python3 -m unittest discover -s tests -p test_pr16_fixed_form_acceptance.py -v
          python3 scripts/pr16_fixed_form_originals.py
          python3 scripts/validate_task_graph.py
      - name: Record correction and commit only bounded files and scanned ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess,sys
          sys.path.insert(0,'scripts');from pr16_fixed_form_originals import identity
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          text=f'\n## {stamp}\n- Task: USER-MODERNIZATION / fixed fusion manifest preflight correction and probe preservation\n- Status: SOURCE_PREFLIGHT_FIXED_NATIVE_PENDING\n- Summary: run34696793115はspecies manifestがdpe_symbolなのにcfru_symbolを参照してsetupで停止。新規native processは0。実manifestsを直接検査する18番目のunit testを追加し、CFRU item/DPE species別列へ修正。nativeCは未実行であり合格扱いしない。\n- Evidence: 初期diagnostic run34681725548（expiry2026-10-12T07:50:56Z）と今回preflight失敗原本をSHA/Actions/ソース付き保持。既存追跡ZIPをdigestで照合して重複保存しない。force-add後Git index byte一致確認。\n- Verify: 18 focused tests PASS、既存4原本HEAD一致。P03現行3/5、native gap/release false。\n- Files changed: Python/test、2runの原本/Actions/checkpoint、probe_retention、logs。\n- Commit: この追記を含むcommit。active baseline/ROM/旧成功は変更なし。\n- Next: 同じ2Necrozmaケースを正しいpreflight後に初回native実行。Crowned/取消/generic FORM/P07を再実行しない。\n'
          for name in ('design/run_log.md','design/version_log.md'):
              with pathlib.Path(name).open('a') as f:f.write(text)
          rows=json.loads(pathlib.Path('content/modernization/pr16_fixed_form_probe_retention.json').read_bytes())['originals']
          for row in rows:
              subprocess.run(['git','add','-f',row['path']],check=True)
              assert identity(subprocess.check_output(['git','show',':'+row['path']]))=={k:row[k] for k in ('size','sha256')}
          PY
          git diff --exit-code -- config/active_play_baseline.json design/active_play_baseline.md content/modernization/p08_remaining_work.json content/modernization/pr16_fixed_form_acceptance.json
          git add scripts/pr16_fixed_form_acceptance.py tests/test_pr16_fixed_form_acceptance.py content/modernization/pr16_fixed_form_acceptance_evidence/34681725548 content/modernization/pr16_fixed_form_acceptance_evidence/34696793115 content/modernization/pr16_fixed_form_probe_retention.json design/run_log.md design/version_log.md
          git rm .github/workflows/pr16-fusion-manifest-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git commit -m 'USER-MODERNIZATION: preserve original fixed-form diagnostic and preflight failure; verify real DPE/CFRU manifests'
          git push origin "HEAD:$GITHUB_REF_NAME"

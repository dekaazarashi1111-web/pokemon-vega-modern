name: pr16-abi-closeout-apply
run-name: PR16 ABI verified closeout apply and validate
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-abi-closeout-export.yml
permissions:
  contents: write
concurrency:
  group: pr16-abi-closeout-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact validated record patch, validate, and fast-forward push
        id: apply
        shell: bash
        env:
          BRANCH: codex/modernization-followup-20260908
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$TRIGGER_SHA"
          test "$(git hash-object scripts/pr16_bp_party_retention_abi_cache.py)" = ea8ea0f337bdf7b3760858ea143740137d878086
          test "$(git hash-object tests/test_pr16_bp_party_retention_abi_cache.py)" = b0917addd75b76e6edf2dba5b4650576bf966f61

          cat .github/pr16-closeout-patch.part00 \
              .github/pr16-closeout-patch.part01 \
              .github/pr16-closeout-patch.part02 \
              .github/pr16-closeout-patch.part03 \
            | tr -d '\n\r' | base64 -d | gzip -d > /tmp/pr16-final.patch
          test "$(sha256sum /tmp/pr16-final.patch | awk '{print $1}')" = ea22d576e64a8939fc3053fee77ca3343605bd7a4f225ca666e66a87ae6b1e74
          git apply --check /tmp/pr16-final.patch
          git apply /tmp/pr16-final.patch

          cat > /tmp/expected-paths.txt <<'EOF'
          content/modernization/pr16_bp_party_retention_wip.json
          content/modernization/pr16_bp_retention_abi_verified.json
          content/modernization/pr16_native_supply_resume_20260913.json
          design/run_log.md
          design/version_log.md
          docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md
          EOF
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          git status --short | sed 's/^...//' | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          python3 -m py_compile \
            scripts/pr16_bp_party_retention_abi_cache.py \
            scripts/pr16_bp_party_retention_abi.py \
            scripts/pr16_resume.py \
            scripts/validate_task_graph.py
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_pr16_bp_party_retention_abi_cache.py' -v
          python3 scripts/pr16_resume.py render
          python3 scripts/pr16_resume.py check
          python3 -m unittest discover -s tests -p 'test_pr16_resume.py' -v
          python3 scripts/validate_task_graph.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for path in sorted(Path('.').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              count += 1
          evidence = json.loads(Path('content/modernization/pr16_bp_retention_abi_verified.json').read_text(encoding='utf-8'))
          assert evidence['tested_head'] == '7bfbaeae42005ec6c133f316f07fb75dce438cad'
          assert evidence['target_callsite_verified'] is True
          assert evidence['target_abi_verified'] is True
          assert evidence['runtime_connected'] is False
          assert evidence['native_retention_verified'] is False
          assert evidence['native_bp_earning_accepted'] is False
          assert evidence['validation']['new_emulator_processes'] == 0
          assert evidence['validation']['accepted_native_cases_replayed'] == 0
          print(f'JSON/evidence validation: OK ({count} JSON files)')
          PY

          git status --short | sed 's/^...//' | sort > /tmp/actual-paths-after.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths-after.txt
          git diff --check
          git add -- \
            content/modernization/pr16_bp_party_retention_wip.json \
            content/modernization/pr16_bp_retention_abi_verified.json \
            content/modernization/pr16_native_supply_resume_20260913.json \
            design/run_log.md \
            design/version_log.md \
            docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/staged-paths.txt
          test -z "$(git status --porcelain | grep -v '^M  \|^A  ' || true)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260914-BP-RETENTION-ABI: 検証結果と引継ぎを記録'
          FINAL_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$TRIGGER_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'final_sha=%s\n' "$FINAL_SHA" >> "$GITHUB_OUTPUT"
          python3 - "$TRIGGER_SHA" "$FINAL_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys
          trigger, final = sys.argv[1:]
          Path('pr16-abi-closeout-result.json').write_text(
              json.dumps(
                  {
                      'status': 'PASS',
                      'trigger_sha': trigger,
                      'final_record_sha': final,
                      'implementation_sha': '7bfbaeae42005ec6c133f316f07fb75dce438cad',
                      'record_paths': 6,
                      'target_callsite_verified': True,
                      'target_abi_verified': True,
                      'runtime_connected': False,
                      'native_retention_verified': False,
                      'native_bp_earning_accepted': False,
                      'new_emulator_processes': 0,
                      'accepted_native_cases_replayed': 0,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-abi-closeout-result
          path: pr16-abi-closeout-result.json
          if-no-files-found: error
          retention-days: 7

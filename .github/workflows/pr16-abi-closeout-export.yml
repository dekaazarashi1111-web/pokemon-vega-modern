name: pr16-abi-closeout-export
run-name: PR16 ABI closeout tracked text export
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-abi-closeout-export.yml
permissions:
  contents: read
concurrency:
  group: pr16-abi-closeout-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package only tracked closeout text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          root = Path('.')
          state_path = Path('content/modernization/pr16_native_supply_resume_20260913.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          paths = {
              state_path.as_posix(),
              'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
              'content/modernization/p08_remaining_work.json',
              'content/modernization/pr16_bp_chooser_checkpoint.json',
              'content/modernization/pr16_bp_party_retention_wip.json',
              'design/run_log.md',
              'design/version_log.md',
              'scripts/pr16_resume.py',
              'tests/test_pr16_resume.py',
              'scripts/validate_task_graph.py',
              'CHATGPT_RESUME.md',
              'AGENTS.md',
          }
          paths.add(state['latest_native_evidence'])
          paths.update(state['source_bindings'])
          paths.update(state['next_action']['read_paths'])
          manifest = {}
          with zipfile.ZipFile('pr16-abi-closeout-text.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(paths):
                  path = root / name
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit(f'missing/nonregular closeout path: {name}')
                  raw = path.read_bytes()
                  raw.decode('utf-8')
                  archive.writestr(name, raw)
                  manifest[name] = {'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              manifest_raw = (json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n').encode()
              archive.writestr('closeout-export-manifest.json', manifest_raw)
          print(json.dumps({'path_count': len(manifest)}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-abi-closeout-text
          path: pr16-abi-closeout-text.zip
          if-no-files-found: error
          retention-days: 1

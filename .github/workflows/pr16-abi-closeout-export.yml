name: pr16-abi-closeout-export
run-name: PR16 ABI closeout full tracked text export
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-abi-closeout-export.yml
permissions:
  contents: read
concurrency:
  group: pr16-abi-closeout-export
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package all tracked UTF-8 text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import zipfile

          root = Path('.')
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          manifest = {}
          skipped = {}
          with zipfile.ZipFile('pr16-abi-closeout-full-text.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(filter(None, names)):
                  path = root / name
                  if not path.is_file() or path.is_symlink():
                      skipped[name] = 'missing/nonregular/symlink'
                      continue
                  raw = path.read_bytes()
                  if len(raw) > 5 * 1024 * 1024:
                      skipped[name] = f'oversize:{len(raw)}'
                      continue
                  try:
                      raw.decode('utf-8')
                  except UnicodeDecodeError:
                      skipped[name] = f'non_utf8:{len(raw)}'
                      continue
                  archive.writestr(name, raw)
                  manifest[name] = {'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              archive.writestr(
                  'closeout-full-export-manifest.json',
                  (json.dumps({'files': manifest, 'skipped': skipped}, ensure_ascii=False, indent=2, sort_keys=True) + '\n').encode(),
              )
          print(json.dumps({'text_path_count': len(manifest), 'skipped_count': len(skipped)}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-abi-closeout-full-text
          path: pr16-abi-closeout-full-text.zip
          if-no-files-found: error
          retention-days: 1

name: Recover exact PR16 native FORM patch
run-name: Recover and verify exact rejected FORM patch

on:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-exact-recovery.yml
      - scripts/pr16_recover_exact_form_patch.py

permissions:
  contents: write

concurrency:
  group: pr16-generic-form-exact-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recover unique applicable patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr16-form-preimage
          git worktree add --detach /tmp/pr16-form-preimage 1413e0a7381094d86d2ca1d4e4ef3ebfa5c893d0
          python3 scripts/pr16_recover_exact_form_patch.py \
            --worktree /tmp/pr16-form-preimage \
            --patch-output /tmp/pr16-exact-native-form.patch \
            --env-output /tmp/pr16-recovery.env

          git -C /tmp/pr16-form-preimage apply --check --whitespace=error-all /tmp/pr16-exact-native-form.patch
          git -C /tmp/pr16-form-preimage apply --whitespace=error-all /tmp/pr16-exact-native-form.patch
          test "$(git -C /tmp/pr16-form-preimage diff --name-only | sort)" = "$(printf '%s\n' scripts/pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py tools/mgba_pr16_generic_form_carry.c | sort)"

          sha256sum \
            /tmp/pr16-form-preimage/tools/mgba_pr16_generic_form_carry.c \
            /tmp/pr16-form-preimage/scripts/pr16_generic_form_carry.py \
            /tmp/pr16-form-preimage/tests/test_pr16_generic_form_carry.py \
            | tee /tmp/pr16-exact-postimages.sha256

          install -m 0644 /tmp/pr16-form-preimage/tools/mgba_pr16_generic_form_carry.c tools/mgba_pr16_generic_form_carry.c
          install -m 0644 /tmp/pr16-form-preimage/scripts/pr16_generic_form_carry.py scripts/pr16_generic_form_carry.py
          install -m 0644 /tmp/pr16-form-preimage/tests/test_pr16_generic_form_carry.py tests/test_pr16_generic_form_carry.py

          python3 - <<'PY'
          import subprocess
          allowed = {
              "tools/mgba_pr16_generic_form_carry.c",
              "scripts/pr16_generic_form_carry.py",
              "tests/test_pr16_generic_form_carry.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--"], text=True
          ).splitlines())
          if not changed <= allowed:
              raise SystemExit(f"unexpected exact-postimage replacement paths: {sorted(changed)}")
          print("exact postimages differing from provisional reconstruction:", sorted(changed))
          PY
          git diff --stat -- \
            tools/mgba_pr16_generic_form_carry.c \
            scripts/pr16_generic_form_carry.py \
            tests/test_pr16_generic_form_carry.py

      - name: Validate exact recovered implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/pr16_recover_exact_form_patch.py \
            scripts/pr16_generic_form_carry.py \
            tests/test_pr16_generic_form_carry.py
          python3 -m unittest discover \
            -s tests \
            -p 'test_pr16_generic_form_carry.py' \
            -v
          git diff --check

      - name: Record exact recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/pr16-recovery.env
          POST_C="$(sha256sum tools/mgba_pr16_generic_form_carry.c | cut -d' ' -f1)"
          POST_PY="$(sha256sum scripts/pr16_generic_form_carry.py | cut -d' ' -f1)"
          POST_TEST="$(sha256sum tests/test_pr16_generic_form_carry.py | cut -d' ' -f1)"
          cat >> design/run_log.md <<EOF

          ## 2026-09-12 — exact recovery of rejected native FORM patch

          - Recovered rejected workflow blob 520f756df53f4f9c369e15db80aacb2afebcedcb from invalid base64 byte offset(s) ${RECOVERED_INVALID_OFFSETS} (${RECOVERED_INVALID_HEX}); replacement group(s) ${RECOVERED_REPLACEMENTS_HEX}; codec ${RECOVERED_CODEC}.
          - Selected the unique candidate that expands to exactly the controller, parser, and focused-test paths and cleanly applies to authoritative preimage commit 1413e0a7381094d86d2ca1d4e4ef3ebfa5c893d0.
          - Recovered patch SHA-256 ${RECOVERED_PATCH_SHA256}; earlier reported value ${REPORTED_PATCH_SHA256}; match=${REPORTED_DIGEST_MATCH}.
          - Exact postimages: C ${POST_C}; Python ${POST_PY}; tests ${POST_TEST}.
          - Python compilation, all focused tests, and git diff --check passed in Actions run ${GITHUB_RUN_ID}.
          - Physical ROM acceptance remains pending and is not promoted by this source-recovery run.
          EOF
          cat >> design/version_log.md <<EOF

          ## 2026-09-12 — exact native FORM patch postimages

          - Replaced the provisional behavior-equivalent reconstruction with the unique applicable files recovered from the rejected compressed payload.
          - Bound recovery to the rejected Git blob, authoritative preimage Git blobs, exactly three allowed paths, clean patch application, and the complete focused unit contract.
          EOF
          git diff --check

      - name: Commit exact postimages and remove recovery infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/pr16-generic-form-exact-recovery.yml \
            scripts/pr16_recover_exact_form_patch.py
          git add -- \
            tools/mgba_pr16_generic_form_carry.c \
            scripts/pr16_generic_form_carry.py \
            tests/test_pr16_generic_form_carry.py \
            design/run_log.md \
            design/version_log.md

          python3 - <<'PY'
          import subprocess
          mandatory = {
              ".github/workflows/pr16-generic-form-exact-recovery.yml",
              "scripts/pr16_recover_exact_form_patch.py",
              "design/run_log.md",
              "design/version_log.md",
          }
          allowed = mandatory | {
              "scripts/pr16_generic_form_carry.py",
              "tests/test_pr16_generic_form_carry.py",
              "tools/mgba_pr16_generic_form_carry.c",
          }
          staged = set(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          if not mandatory <= staged or not staged <= allowed:
              raise SystemExit(f"unexpected staged paths: {sorted(staged)}")
          unstaged = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          if unstaged:
              raise SystemExit(f"unexpected unstaged tracked paths: {unstaged}")
          PY

          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'USER-MODERNIZATION: restore exact native FORM scan'
          git push origin "HEAD:${GITHUB_REF_NAME}"

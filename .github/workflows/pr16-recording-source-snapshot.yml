name: PR16 recording source snapshot
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-recording-source-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: pr16-recording-source-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Collect only bound tracked text sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re,shutil,subprocess
          root=pathlib.Path('.')
          state_path=pathlib.Path('content/modernization/pr16_native_supply_resume_20260913.json')
          state=json.loads(state_path.read_text())
          names={
              str(state_path),
              'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
              'content/modernization/p08_remaining_work.json',
              'content/modernization/pr16_bp_chooser_checkpoint.json',
              state['latest_native_evidence'],
              '.github/workflows/pr16-bp-party-retention-native.yml',
              'scripts/pr16_resume.py',
              'tests/test_pr16_resume.py',
              'scripts/pr16_bp_party_retention_successor.py',
              'scripts/pr16_bp_party_retention_native.py',
              'tests/test_pr16_bp_party_retention_successor.py',
              'tests/test_pr16_bp_party_retention_native.py',
              'content/modernization/pr16_bp_party_retention_wip.json',
              'design/run_log.md',
              'design/version_log.md',
          }
          names.update(state['source_bindings'])
          names.update(state['next_action']['read_paths'])
          out=root/'.local/pr16-recording-source-snapshot'
          out.mkdir(parents=True,exist_ok=True)
          manifest={}
          for name in sorted(names):
              rel=pathlib.PurePosixPath(name)
              assert name and not rel.is_absolute() and '..' not in rel.parts and '\\' not in name,name
              path=root/name
              assert path.is_file() and not path.is_symlink(),name
              raw=path.read_bytes()
              assert len(raw)<5_000_000 and b'\0' not in raw,name
              raw.decode('utf-8')
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',raw),name
              dst=out/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(raw)
              manifest[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          meta={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':manifest}
          (out/'snapshot-meta.json').write_text(json.dumps(meta,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-recording-source-snapshot
          path: .local/pr16-recording-source-snapshot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

name: pr16-research-save-impact-20260926
# 第1checkpoint: 実装・検証入力をexact HEADから固定。既受入native/ARMは実行しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-save-impact-20260926.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-save-impact-20260926
  cancel-in-progress: false
jobs:
  context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 研究取引の限定sourceと既存Actions終端を保存
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          root = pathlib.Path.cwd()
          out = root / '.local/pr16-research-save-impact'
          out.mkdir(parents=True)
          def get(path):
              req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path, headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def ident(raw):
              return {'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          exact = set('''AGENTS.md CHATGPT_RESUME.md README.md design/current_state.md design/agent_context_map.md design/run_log.md design/version_log.md design/active_play_baseline.md config/active_play_baseline.json content/modernization/pr16_bp_chooser_checkpoint.json content/modernization/p08_remaining_work.json content/modernization/pr16_native_supply_resume_20260913.json content/modernization/pr16_special_wild_ui_checkpoint.json docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md docs/PR16_SPECIAL_WILD_GAMEPLAY_JA.md scripts/pr16_resume.py scripts/pr16_learnset_compact_record.py scripts/pr16_learnset_wiki_actions.py scripts/pr16_wiki_reconcile.py scripts/pr16_special_wild_gameplay.py scripts/pr16_special_wild_ui_finish.py scripts/pr16_special_wild_gameplay_native.py scripts/validate_task_graph.py'''.split())
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected = sorted(p for p in paths if p and (p in exact or ('research' in p.lower() and p.split('/')[0] in {'overlays','scripts','tools','tests','config'}) or p == '.github/workflows/pr16-research-save-impact-20260926.yml'))
          assert exact <= set(selected), sorted(exact-set(selected))
          index = {}
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in selected:
                  p = root/name
                  assert not p.is_symlink() and p.is_file()
                  raw = p.read_bytes()
                  assert len(raw) < 16000000 and b'\0' not in raw
                  raw.decode('utf-8')
                  index[name] = ident(raw)
                  z.writestr(name,raw)
              z.writestr('index.json',json.dumps(index,sort_keys=True,indent=2)+'\n')
          pr = get('pulls/16')
          assert pr['state']=='open' and not pr['merged'] and pr['draft']
          assert pr['head']['sha']==os.environ['GITHUB_SHA'] and pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          cp = json.loads((root/'content/modernization/pr16_special_wild_ui_checkpoint.json').read_text())
          assert cp['actions_completion_confirmed'] and cp['gameplay_accepted'] and cp['capture_save_continue_accepted']
          run_id = cp['terminal_receipt']['run_id']
          run = get('actions/runs/'+str(run_id))
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==cp['terminal_receipt']['source_head']
          jobs = get('actions/runs/'+str(run_id)+'/jobs?per_page=100')['jobs']
          assert jobs and all(j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          keys = ('id','name','head_sha','head_branch','event','status','conclusion','path','created_at','updated_at')
          runs = get('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=30')['workflow_runs']
          proof = {'schema_version':1,'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_archive':ident((out/'source.zip').read_bytes()),'source_count':len(index),'previous_terminal':{k:run[k] for k in keys},'latest_runs':[{k:r[k] for k in keys} for r in runs],'new_native_processes':0,'arm_compiles':0,'accepted_case_reruns':0,'scope':'研究保存delegate影響検証の固定入力。取引受入は未完。'}
          (out/'context.json').write_text(json.dumps(proof,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('PASS: exact source context and prior terminal; native/ARM/accepted reruns=0')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-save-impact-context
          path: .local/pr16-research-save-impact/
          retention-days: 30
          if-no-files-found: error

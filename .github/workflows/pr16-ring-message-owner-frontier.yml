name: pr16-ring-message-owner-frontier
run-name: message実callerと未結合速度delegateの限定採取
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-message-owner-frontier.yml
      - scripts/pr16_ring_message_owner_frontier.py
      - tests/test_pr16_ring_message_owner_frontier.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-message-owner-frontier
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: caller出自・未読一根採取・限定tests・非force記録
        run: python3 scripts/pr16_ring_message_owner_frontier.py run
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-ring-message-owner-frontier
          path: .local/pr16-ring-message-owner-frontier/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

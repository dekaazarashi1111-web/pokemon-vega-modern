name: PR16 Vega missing breeding source
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-vega-breeding-source.yml]
permissions:
  contents: read
concurrency:
  group: pr16-vega-missing-breeding-source
  cancel-in-progress: false
jobs:
  missing-source:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 原作consumerの静的逆アセンブル環境
        run: sudo apt-get update -qq && sudo apt-get install -y binutils-arm-none-eabi
      - name: 不足していた原作進化表と孵化consumerだけを採取
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-vega-breeding-assets
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-build-stages.zip --dir .local/pr16-vega-breeding-assets
          python3 -B scripts/pr16_vega_breeding_collect.py --archive .local/pr16-vega-breeding-assets/pokemon-vega-private-env-v1-build-stages.zip --output .local/pr16-vega-breeding-source
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-vega-breeding-source
          path: .local/pr16-vega-breeding-source/
          retention-days: 30
          if-no-files-found: error

name: pr16-natural-supply-20260925
# 完了照合専用。保存成功3case/旧unit/host/ARM/Wikiを再実行しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-natural-supply-20260925.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-natural-supply-20260925
  cancel-in-progress: false
jobs:
  natural-supply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 完了専用source一致
        run: |
          python3 -B - <<'PY'
          import hashlib
          from pathlib import Path
          for path,expected in {
            'scripts/pr16_natural_supply_closeout.py':'7aeaa2c23a9967b26aebffd5b2745784fce6779e465157fa022b8271e99485bf',
            'tests/test_pr16_natural_supply_closeout.py':'e8f43987dfdc31dff92590653ba899ace21781d94a8884be70d19de2c0349433'
          }.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,path
          PY
      - name: 新規15unit・保存3case・全artifact・Actions終端・引継ぎ確定
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import pr16_natural_supply_closeout as c
          c.s.PROOF.mkdir(parents=True)
          c.s.m.PROOF=c.s.PROOF
          c.s.m.run([sys.executable,'-B','-m','unittest','tests.test_pr16_natural_supply_closeout','-v'],'closeout-unit')
          c.main()
          PY
      - name: 固定引継ぎ・task graph・今回10fileの最終guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_natural_supply_closeout.py paths | tr '\n' '\0' >.local/pr16-natural-supply/paths.z
          git add --pathspec-from-file=.local/pr16-natural-supply/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_natural_supply_closeout.py guard
      - name: 完了記録を同branchへ非force commit/push・remote照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-NATURAL-SUPPLY: 通常配布・初期技孵化3caseの終端受入と固定引継ぎ・両ログを確定'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-natural-supply/proof/reflected-head.txt
          echo "RESULT=DONE_SCOPED_3_CASES TASK=USER-20260925-NATURAL-SUPPLY COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-natural-supply-closeout
          path: .local/pr16-natural-supply/proof/
          retention-days: 30
          if-no-files-found: error

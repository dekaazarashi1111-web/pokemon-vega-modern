name: pr16-natural-supply-20260925
# 不足分のtracked textのみ。既取得source・旧検証・ROMを再生成しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-natural-supply-20260925.yml]
permissions:
  contents: read
concurrency:
  group: pr16-natural-supply-20260925
  cancel-in-progress: false
jobs:
  source-context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 既存nativeの不足補助sourceだけを固定HEADから収集
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import fnmatch, hashlib, json, os, subprocess, zipfile
          include=['tools/**','src/modernization/**','content/collection_supply_v1/canonical_model.json','config/modernization_floette_gift.json']
          exclude=['tools/mgba_pr16*','tools/mgba_p03*','tools/mgba_p08*','tools/mgba_stage61*','tools/pr16_*.py','tools/stage61_interaction_oracle.py','tools/mgba_native*.h','tools/mgba_native*.c']
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          out=Path('.local/pr16-natural-supply/source');out.mkdir(parents=True)
          manifest={'source_head':os.environ['GITHUB_SHA'],'scope':'ADDITIONAL_TRACKED_SOURCE_ONLY_NOT_RUNTIME_ACCEPTANCE','rom_changes':0,'native_processes':0,'accepted_test_reruns':0,'files':{}}
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  p=Path(name)
                  if not name or p.is_symlink() or not p.is_file():continue
                  if p.suffix not in ('.py','.c','.h','.json'):continue
                  if not any(fnmatch.fnmatchcase(name,pat) for pat in include) or any(fnmatch.fnmatchcase(name,pat) for pat in exclude):continue
                  raw=p.read_bytes();raw.decode('utf-8')
                  manifest['files'][name]={'sha256':hashlib.sha256(raw).hexdigest(),'size':len(raw)}
                  z.writestr(name,raw)
              z.writestr('SOURCE_MANIFEST.json',json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'source_head':manifest['source_head'],'files':len(manifest['files']),'native_processes':0,'accepted_test_reruns':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-natural-supply-source
          path: .local/pr16-natural-supply/source/source.zip
          retention-days: 7
          if-no-files-found: error

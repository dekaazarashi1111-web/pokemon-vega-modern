name: pr16-story-gym
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-gym.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-story-gym
  cancel-in-progress: false
jobs:
  continuation:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: New Save19 gym interval and independent Continue only
        run: python3 -B scripts/pr16_story_gym_measure.py
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-gym-checkpoint
          path: .local/pr16-story-gym/artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: PR16 Circus bounded win CPU witness
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-win-return-cpu.yml
      - scripts/pr16_circus_win_return_cpu.py
      - tests/test_pr16_circus_win_return_cpu.py
      - tools/mgba_pr16_circus_win_return_cpu.h
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: CPU読取専用契約と前回原本を検証し記録
        id: prepare
        run: python3 scripts/pr16_circus_win_return_cpu.py prepare
      - name: 正規入力の17戦目後だけCPUとweatherを600frame読取
        run: python3 scripts/pr16_circus_win_return_cpu.py pipeline
      - name: 成否原本と固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_win_return_cpu.py finish
      - name: ROMとsaveを除外して証跡を保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_win_return_cpu.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-win-return-cpu
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

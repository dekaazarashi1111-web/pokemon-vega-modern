name: pr16-story-live-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-live-record.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-live-record
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Exact new record source guard
        run: |
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_live_record as m; import pr16_learnset_runtime_record as g; g.START=m.BASE; g.CODE=m.CODE; g.OWNED=set(); g.guard()"
      - name: 原本照合と固定再開・ログ更新のみ
        run: python3 -B scripts/pr16_story_live_record.py record
      - name: Scoped final index guard and fixed resume
        run: python3 -B scripts/pr16_story_live_record.py guard
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20261004-STORY-LIVE: Save101実資源observerを限定受入し次施設準備へ'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: python3 -B scripts/pr16_story_live_record.py snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-live-record-receipts
          path: .local/pr16-story-live-record/receipts
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

name: pr16-learnset-floette-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/pr16-learnset-floette-record.json]
permissions:
  contents: write
concurrency:
  group: pr16-learnset-floette-record
  cancel-in-progress: false
jobs:
  floette-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 完了Actions原本だけで証拠と固定引継ぎを更新
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-learnset-floette/record-proof
          python3 -B scripts/pr16_learnset_floette_record.py record | tee .local/pr16-learnset-floette/record-proof/record.json
          python3 -B - <<'PYBIND'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from pr16_resume import STATE, DOC, load, dump, render
          from pr16_learnset_floette_record import REQUEST
          from tools.pr16_learnset_successor import bound
          root = Path.cwd()
          repair = load(root, REQUEST)['resume_fixture_repair']
          state = load(root, STATE)
          assert repair['path'] == 'tests/test_pr16_resume.py'
          assert state['source_bindings'][repair['path']] == repair['before']
          bound(root / repair['path'], repair['after'])
          state['source_bindings'][repair['path']] = repair['after']
          dump(root / STATE, state)
          (root / DOC).write_text(render(state), encoding='utf-8')
          note = '- Binding recovery: run35663855295は修正試験の固定hash未同期で停止。旧hash/新hashを明示照合して当該1件だけ同期し、全source検査を再実施。受入実装/44試験は再実行なし。\n'
          for name in ('design/run_log.md', 'design/version_log.md'):
              with (root/name).open('a', encoding='utf-8') as stream:
                  stream.write(note)
          PYBIND
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-learnset-floette/record-proof/resume.json
          python3 -B -m unittest tests.test_pr16_resume.ResumeTests.test_closed_physical_keeps_p08_gates -v 2>&1 | tee .local/pr16-learnset-floette/record-proof/resume-tests.txt
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-learnset-floette/record-proof/task-graph.txt
      - name: final index限定guardと同branch非force push
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_floette_record.py paths | while IFS= read -r path; do git add -- "$path"; done
          python3 -B scripts/pr16_learnset_floette_record.py guard | tee .local/pr16-learnset-floette/record-proof/guard.json
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260921-LEARNSET-BASELINE-RESET: Eternal37経路とhost owner gateを受入・再開点と両ログを同期'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "RESULT=DONE TASK=USER-20260921-LEARNSET-BASELINE-RESET VERIFY=FLOETTE44_C15039_RESUME_GUARD COMMIT=$sha" | tee .local/pr16-learnset-floette/record-proof/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-floette-record
          path: .local/pr16-learnset-floette/record-proof/
          retention-days: 30
          if-no-files-found: error

name: pr16-wiki-readability-close
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_wiki_readability_close.py
      - .github/workflows/pr16-wiki-readability-close.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-wiki-readability
  cancel-in-progress: false
jobs:
  close-records:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新規の状態照合6回帰のみ
        run: python3 -B scripts/pr16_wiki_readability_close.py --self-test
      - name: 完了Actions照合と旧記録の分離を非force反映
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_wiki_readability_close.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-wiki-readability-close-proof
          path: .local/pr16-wiki-readability/proof/
          include-hidden-files: true
          if-no-files-found: error

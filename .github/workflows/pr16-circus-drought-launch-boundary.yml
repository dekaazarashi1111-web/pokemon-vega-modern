name: PR16 Circus Drought launch boundary trace
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-drought-launch-boundary.yml
      - scripts/pr16_circus_drought_launch_boundary.py
      - tests/test_pr16_circus_drought_launch_boundary.py
      - tools/mgba_pr16_circus_drought_launch_boundary.h
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  launch-boundary:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 既存失敗原本とreadonly境界scopeを非force保存
        id: prepare
        run: python3 scripts/pr16_circus_drought_launch_boundary.py prepare
      - name: 現候補の18戦目chooserからfield落下までだけを採取
        run: python3 scripts/pr16_circus_drought_launch_boundary.py pipeline
      - name: 境界traceと引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_drought_launch_boundary.py finish
      - name: ROMとsaveを除外した証跡
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_drought_launch_boundary.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-drought-launch-boundary
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

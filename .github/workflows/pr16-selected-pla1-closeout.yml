name: pr16-selected-pla1-closeout
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_selected_pla1_closeout.py
      - tests/test_pr16_selected_pla1_receipt.py
      - .github/workflows/pr16-selected-pla1-closeout.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-selected-pla1-closeout
  cancel-in-progress: false
jobs:
  receipt:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PLA1実reader原本と新14受領試験を検証して非force記録
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_selected_pla1_closeout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-selected-pla1-closeout-public-text
          path: .local/pr16-selected-pla1-closeout/public/
          if-no-files-found: error
          retention-days: 90

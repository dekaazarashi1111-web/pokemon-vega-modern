name: PR16 Circus ready-one task owner
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-win-return-owner.yml
      - scripts/pr16_circus_win_return_owner.py
      - tests/test_pr16_circus_win_return_owner.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 新原本のready1と80events完全一致を検証し記録
        id: prepare
        run: python3 scripts/pr16_circus_win_return_owner.py prepare
      - name: 固定候補のtask命令だけを照合しnativeは再実行しない
        run: python3 scripts/pr16_circus_win_return_owner.py pipeline
      - name: 限定命令と固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_win_return_owner.py finish
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-win-return-owner
          path: .local/pr16-circus-win-return-owner/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: pr16-learnset-conditional-native
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-conditional-native.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-conditional-native
  cancel-in-progress: false
jobs:
  conditional-native:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新規ARM/native限定依存
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libmgba-dev
      - name: 受入hostを継承し新4入口だけ配置・検証
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_conditional_native.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-native-proof
          path: .local/pr16-learnset-conditional-native/proof/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-native-data
          path: .local/pr16-learnset-conditional-native/data/
          retention-days: 30
          if-no-files-found: warn

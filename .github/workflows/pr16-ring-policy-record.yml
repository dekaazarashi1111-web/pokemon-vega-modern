name: PR16 Ring ordinary policy record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-policy-record.yml
      - scripts/pr16_ring_policy_record.py
      - tests/test_pr16_ring_policy_record.py
      - content/modernization/pr16_ring_policy_record_spec.json
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-ring-policy-record
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify original evidence and record without native replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-ring-policy-record
          python3 scripts/pr16_ring_policy_record.py > .local/pr16-ring-policy-record/run.stdout 2> .local/pr16-ring-policy-record/run.stderr
      - name: Export safe record receipt and canonical handoff
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          source=pathlib.Path('.local/pr16-ring-policy-record')
          target=pathlib.Path('.local/pr16-ring-policy-record-evidence')
          target.mkdir(parents=True,exist_ok=True)
          members={}
          for p in sorted(source.rglob('*')):
              if p.is_dir(): continue
              assert p.is_file() and not p.is_symlink()
              if p.suffix not in {'.json','.txt','.md','.stdout','.stderr'}: continue
              data=p.read_bytes();data.decode('utf-8')
              assert len(data)<2000000 and b'\0' not in data
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}',data)
              name=p.relative_to(source).as_posix()
              dest=target/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              members[name]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (target/'members.json').write_text(json.dumps(members,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-policy-record
          path: .local/pr16-ring-policy-record-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

# 前run37365137571はrunner未開始で終端。公式復旧後に同じ固定契約を新attempt1で検証。
name: pr16-dex-hof-runtime-closure
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-hof-runtime-closure
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  contract:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact new source set and retained parent evidence
        run: python3 -B scripts/pr16_dex_hof_runtime_closure_actions.py source_guard
      - name: Official Ubuntu ARM toolchain for exact prior link reconstruction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev
      - name: Current JP conditional consumer types and fail-closed partial lease capacity
        run: python3 -B scripts/pr16_dex_hof_runtime_closure_actions.py run
      - name: Record minimal consumer evidence and partial space refusal
        run: python3 -B scripts/pr16_dex_hof_runtime_closure_actions.py record
      - name: Scoped final index and fixed resume
        run: python3 -B scripts/pr16_dex_hof_runtime_closure_actions.py guard
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20261005-DEX-HOF-RUNTIME-CLOSURE: callback rootとlifetime・安全容量の記録'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: python3 -B scripts/pr16_dex_hof_runtime_closure_actions.py snapshot
      - name: Closed text publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_hof_runtime_closure_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-hof-runtime-closure-text-only
          path: public-dex-hof-runtime-closure
          retention-days: 90
          if-no-files-found: error

name: pr16-dex-save-failure-record
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-save-failure-record
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  codec:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact new source guard
        run: python3 -B scripts/pr16_dex_save_failure_record.py source_guard
      - name: Record non-destructive invalid-live UI and preserve diagnostic originals
        run: python3 -B scripts/pr16_dex_save_failure_record.py record
      - name: Scoped final index and fixed resume
        run: python3 -B scripts/pr16_dex_save_failure_record.py guard
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20261004-DEX-SAVE-FAILURE: record bounded non-destructive invalid-live error'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: python3 -B scripts/pr16_dex_save_failure_record.py snapshot
      - name: Publish only validated text receipt
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_save_failure_record.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-save-failure-record-receipts
          path: public-dex-save-failure-record
          retention-days: 90
          if-no-files-found: warn

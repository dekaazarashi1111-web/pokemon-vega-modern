name: pr16-ring-resource-frontier
run-name: 未読resource 8calleeだけを有限採取
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-resource-frontier.yml
      - scripts/pr16_ring_resource_frontier.py
      - tests/test_pr16_ring_resource_frontier.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-resource-frontier
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 新規40tests・8callee有限採取・非force保存
        run: python3 scripts/pr16_ring_resource_frontier.py run
      - name: 診断text exportの範囲検査
        if: always()
        id: export
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.local/pr16-ring-resource-frontier')
          assert root.is_dir()
          for p in root.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt'}
              raw=p.read_bytes();raw.decode('utf-8')
              assert b'\0' not in raw and len(raw)<=2000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----',raw)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: pr16-ring-resource-frontier
          path: .local/pr16-ring-resource-frontier/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-story-gym-closeout
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-gym-closeout.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-story-gym-closeout
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: New 32 record gates and scoped source guard only
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-story-gym-closeout/preflight .local/pr16-story-gym-closeout/public
          printf '%s\n' '7447c250f51e6d32a7889ea7cb0f5287920c0712ad498c492c0eaf2db111f0cd  scripts/pr16_story_gym_record.py' 'bc67698684ae0ec6745979bdb1fd3e8587ef924d7b85d100fd82e8dedf4fc919  tests/test_pr16_story_gym_record.py' | sha256sum --check
          python3 -B -m unittest discover -s tests -p test_pr16_story_gym_record.py -v > .local/pr16-story-gym-closeout/preflight/unit.stdout.txt 2> .local/pr16-story-gym-closeout/preflight/unit.stderr.txt
          cat .local/pr16-story-gym-closeout/preflight/unit.stderr.txt
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_gym_record as r; import pr16_learnset_runtime_record as g; g.START='50b87e638b96b8fd1c2def8c3455f3e60189c36d'; g.CODE={r.SELF,r.WF,r.TEST}; g.OWNED=set(); g.guard()"
      - name: Record completed Save19 without emulator or accepted suite reruns
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_story_gym_record.py record 2>&1 | tee .local/pr16-story-gym-closeout/public/record.log
      - name: Scoped final index private guard and fixed resume
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_story_gym_record.py guard 2>&1 | tee .local/pr16-story-gym-closeout/public/guard.log
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260929-STORY-GYM: アヤメジム2勝・badge1・通常報酬・全回復Save19と独立Continueを限定受入'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: |
          python3 -B scripts/pr16_story_gym_record.py snapshot
          cp .local/pr16-story-gym-closeout/preflight/unit.*.txt .local/pr16-story-gym-closeout/public/
          echo "RESULT=DONE TASK=USER-20260929-STORY-GYM VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-gym-closeout
          path: |
            .local/pr16-story-gym-closeout/public
            .local/pr16-story-gym-closeout/preflight
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

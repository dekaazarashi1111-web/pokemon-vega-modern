name: pr16-shop-routes
run-name: Physical six-stone shop acquisition and cold saves (not full P05 acceptance)
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-shop-routes.yml
      - scripts/pr16_shop_routes.py
      - tools/mgba_pr16_shop_routes.c
      - tests/test_pr16_shop_routes.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr16-shop-routes
  cancel-in-progress: false
jobs:
  shop-routes:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact HEAD and unchanged Stage84 input
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-shop-evidence
          git rev-parse HEAD > .local/pr16-shop-evidence/tested-head.txt
          bash infra/setup_github_actions.sh --install > .local/pr16-shop-evidence/toolchain.log 2>&1
          python3 scripts/modernization_final_integration.py prepare > .local/pr16-shop-evidence/stage84.json
      - name: Restore exact adopted V4 source without replacing originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-inputs
          gh release download private-environment-v1 --pattern pokemon-vega-private-env-v1-inputs.zip --dir .local/pr16-inputs
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.');cfg=json.loads((root/'config/github_private_environment.json').read_text())
          model=next(a for a in cfg['archives'] if a['name']=='pokemon-vega-private-env-v1-inputs.zip')
          raw=(root/'.local/pr16-inputs'/model['name']).read_bytes()
          assert len(raw)==model['size'] and hashlib.sha256(raw).hexdigest()==model['sha256']
          name='userfile/imports/Pokemon-Vega_MOVE-DISTRIBUTION-V4_IMPLEMENTATION-READY.zip'
          with zipfile.ZipFile(root/'.local/pr16-inputs'/model['name']) as z:data=z.read(name)
          assert hashlib.sha256(data).hexdigest()=='4022cd6e1358f58dffc5ebc38b756166f0a1072f948af6934298f65bd82678b2'
          target=root/name;assert not any(p.is_symlink() for p in (target,*target.parents))
          if target.exists():assert target.read_bytes()==data
          else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data);target.chmod(0o444)
          PY
      - name: Fixed candidate and fail-closed contract tests
        run: |
          set -euo pipefail
          out=.local/pr16-shop-evidence
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 -m unittest tests.test_pr16_shop_routes -v > "$out/unit.log" 2>&1
          cp .local/pr16-evolution-repair/candidate.json "$out/candidate.json"
      - name: Physical reception, paged purchase and fresh-core Continue
        run: |
          set -euo pipefail
          python3 scripts/pr16_shop_routes.py > .local/pr16-shop-evidence/native.stdout 2> .local/pr16-shop-evidence/native.stderr
          git diff --exit-code
      - name: Preserve exact tracked sources and execution images, never ROM or save
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.');out=root/'.local/pr16-shop-evidence';out.mkdir(parents=True,exist_ok=True)
          names={'scripts/pr16_shop_routes.py','tools/mgba_pr16_shop_routes.c','tests/test_pr16_shop_routes.py','scripts/pr16_breeding_delta.py','scripts/pr16_repaired_acceptance.py','scripts/run_modernization_p03_breeding_e2e.py','tools/mgba_modernization_p03_breeding_e2e.c','.github/workflows/pr16-shop-routes.yml'}
          result=root/'.local/pr16-shop-routes/result.json'
          if result.exists():names.update(json.loads(result.read_bytes())['sources'])
          tracked=set(subprocess.check_output(['git','ls-files','-z'],text=True).split('\0'));bindings={}
          with zipfile.ZipFile(out/'sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  assert name in tracked
                  p=root/name;raw=p.read_bytes();raw.decode('utf8');assert not p.is_symlink() and b'\0' not in raw
                  z.writestr(name,raw);bindings[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'source-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          (out/'tested-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-shop-routes-acceptance
          path: |
            .local/pr16-shop-evidence/
            .local/pr16-shop-routes/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

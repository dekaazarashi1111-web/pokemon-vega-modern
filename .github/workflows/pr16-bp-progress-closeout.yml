name: pr16-bp-progress-closeout
run-name: Retain native first-turn originals and update fixed handoff; zero emulator replay
on:
  workflow_dispatch:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-bp-progress-closeout.yml
      - scripts/pr16_bp_progress_closeout.py
      - scripts/pr16_bp_progress_checkpoint.py
      - tests/test_pr16_bp_progress_checkpoint.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-bp-progress-closeout
  cancel-in-progress: false
jobs:
  retain:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and retain three original diagnostic artifacts without native execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-progress-closeout
          mkdir -p "$out"
          python3 scripts/pr16_bp_chooser_checkpoint.py > "$out/accepted-cancel-before.json"
          python3 scripts/pr16_fixed_form_closeout.py --check > "$out/fixed-form-retained.json"
          python3 scripts/pr16_bp_progress_closeout.py retain > "$out/retention.json" 2> "$out/retention.stderr"
          python3 -m unittest tests.test_pr16_bp_battle_progress tests.test_pr16_resume tests.test_pr16_bp_progress_checkpoint -v > "$out/unit.stdout" 2> "$out/unit.stderr"
          python3 scripts/pr16_resume.py check > "$out/resume-check.txt"
          python3 scripts/validate_task_graph.py > "$out/task-graph.txt"
          python3 scripts/pr16_bp_progress_closeout.py logs > "$out/logs.stdout" 2> "$out/logs.stderr"
          python3 scripts/pr16_bp_progress_closeout.py stage
          python3 scripts/pr16_bp_progress_checkpoint.py --index > "$out/index-verification.json"
          python3 scripts/pr16_bp_chooser_checkpoint.py --index > "$out/accepted-cancel-retained.json"
          python3 scripts/pr16_bp_progress_closeout.py guard > "$out/guard.stdout" 2> "$out/guard.stderr"
          git diff --cached --check
          python3 scripts/pr16_resume.py check > "$out/final-resume-check.txt"
      - name: Fast-forward only after branch and staged original identities agree
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-bp-progress-closeout
          branch=codex/modernization-followup-20260908
          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260913-BP-REWARD-FIRST-TURN: retain exact originals and sync same handoff and both logs; BP pending'
          python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'scripts')
          import pr16_bp_progress_closeout as close
          for name in close.PATHS:
              assert close.git(close.ROOT,'show','HEAD:'+name)==(close.ROOT/name).read_bytes(), name
          print('COMMITTED_ORIGINALS_AND_HANDOFF_BYTE_EQUAL')
          PY
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$out/final-head.txt"
          python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'scripts')
          import pr16_bp_progress_closeout as close
          out=pathlib.Path('.local/pr16-bp-progress-closeout')
          for name in (close.resume.STATE,close.resume.DOC,close.c.REPORT):
              (out/pathlib.Path(name).name).write_bytes(pathlib.Path(name).read_bytes())
          for name in close.LOGS:
              (out/(pathlib.Path(name).stem+'-tail.txt')).write_text('\n'.join(pathlib.Path(name).read_text().splitlines()[-35:])+'\n')
          PY
      - name: Reject executable or private closeout output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          out=pathlib.Path('.local/pr16-bp-progress-closeout');members={}
          for p in out.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt','.md','.stdout','.stderr'}
              raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw and len(raw)<16000000
              members[p.name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'members.json').write_text(json.dumps(members,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-bp-progress-closeout
          path: .local/pr16-bp-progress-closeout/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

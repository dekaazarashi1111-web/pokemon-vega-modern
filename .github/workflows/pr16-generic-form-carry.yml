name: pr16-generic-form-carry
run-name: Real non-Rotom Shaymin form carry, cancel, save and cold Continue
# Entry-order diagnosis: run 34662054112 / artifact 10287985514 / ZIP SHA-256
# 1fef860d80bf4c012913447fd44250b7ea651408258157d47326cc87a13d8550.
# Row-visibility failure: run 34662546662 / artifact 10288111178 / ZIP SHA-256
# 74e08d06c3ae14a164b53317c2e1f9b8887991f4d663fd14aac4d5785951d239.
# Runtime FINAL_LEAGUE requires League II backing plus Hall of Fame flag/mirror;
# ledger byte 20 is not read. Acceptance sets the exact backing fields before
# the one pre-map finalize and verifies them again after map load.
# Bounded native menu scan source: commit 7a380d43a086ea4110c4f82736968f50f0f6e28c.
# Dedicated compile/unit verification: run 34669671377, 13 tests PASS.
# This workflow-only checkpoint triggers physical acceptance without changing product sources.

on:
  workflow_dispatch:
  push:
    branches:
      - codex/modernization-followup-20260908
    paths:
      - .github/workflows/pr16-generic-form-carry.yml
      - scripts/pr16_generic_form_carry.py
      - tools/mgba_pr16_generic_form_carry.c
      - tests/test_pr16_generic_form_carry.py
      - scripts/pr16_p03_form_gap_inventory.py
      - content/modernization/pr16_p03_p07_route_coverage.json

permissions:
  contents: read

concurrency:
  group: pr16-generic-form-carry
  cancel-in-progress: false

jobs:
  generic-form-carry:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact HEAD, pinned toolchain and unchanged Stage84 parent
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-generic-form-evidence
          mkdir -p "$out"
          git rev-parse HEAD > "$out/tested-head.txt"
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare \
            > "$out/stage84.json" \
            2> "$out/stage84.stderr"

      - name: Download and hash-check both pinned private source archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-generic-form-evidence
          assets=.local/github-private-environment/assets
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" \
            --pattern 'pokemon-vega-private-env-v1-inputs.zip' \
            --pattern 'pokemon-vega-private-env-v1-modernization-inputs.zip' \
            --dir "$assets"
          python3 scripts/github_private_environment.py restore \
            --archive-dir "$assets" \
            --archive pokemon-vega-private-env-v1-inputs.zip \
            --archive pokemon-vega-private-env-v1-modernization-inputs.zip \
            > "$out/private-restore.json"

      - name: Rebuild fixed parent and run fail-closed focused tests
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-generic-form-evidence
          python3 scripts/pr16_p07_preserved_layer.py \
            > "$out/p07.stdout" \
            2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py \
            > "$out/repair.stdout" \
            2> "$out/repair.stderr"
          python3 -m unittest discover \
            -s tests \
            -p 'test_pr16_generic_form_carry.py' \
            -v > "$out/unit.log" 2>&1
          cp .local/pr16-evolution-repair/candidate.json "$out/candidate.json"

      - name: Actual FORM host, page navigation, party picker, carry, cancel and cold Continue
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-generic-form-evidence
          python3 scripts/pr16_generic_form_carry.py \
            > "$out/native.stdout" \
            2> "$out/native.stderr"
          git diff --exit-code

      - name: Preserve exact sources and raw evidence, never ROM, save or private archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import zipfile

          root = pathlib.Path('.')
          out = root / '.local/pr16-generic-form-evidence'
          out.mkdir(parents=True, exist_ok=True)
          names = [
              'scripts/pr16_generic_form_carry.py',
              'tools/mgba_pr16_generic_form_carry.c',
              'tests/test_pr16_generic_form_carry.py',
              '.github/workflows/pr16-generic-form-carry.yml',
              'scripts/pr16_p03_form_gap_inventory.py',
              'tests/test_pr16_p03_form_gap_inventory.py',
              'content/modernization/pr16_p03_p07_route_coverage.json',
              'scripts/pr16_breeding_delta.py',
              'scripts/pr16_repaired_acceptance.py',
              'scripts/pr16_p07_preserved_layer.py',
              'scripts/pr16_evolution_learning_repair.py',
              'scripts/run_modernization_p03_breeding_e2e.py',
              'tools/mgba_modernization_p03_breeding_e2e.c',
              'tools/modernization_learnsets.py',
              'tools/modernization_p03_stage73_consumers.py',
              'config/modernization_p03_stage73_consumers.json',
              'content/collection_supply_v1/canonical_model.json',
          ]
          bindings = {}
          with zipfile.ZipFile(out / 'sources.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  path = root / name
                  raw = path.read_bytes()
                  raw.decode('utf-8')
                  assert not path.is_symlink() and b'\0' not in raw
                  archive.writestr(name, raw)
                  bindings[name] = {
                      'size': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                  }
          (out / 'source-bindings.json').write_text(
              json.dumps(bindings, sort_keys=True, indent=2) + '\n'
          )
          (out / 'tested-head.txt').write_text(
              subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True)
          )
          PY

      - name: Upload original process records, screenshots and validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-generic-form-carry-acceptance
          path: |
            .local/pr16-generic-form-evidence/
            .local/pr16-generic-form-carry/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: PR16 Circus Drought launch boundary resume
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-drought-launch-boundary-resume.yml
      - scripts/pr16_circus_drought_launch_boundary_resume.py
      - tests/test_pr16_circus_drought_launch_boundary_resume.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  launch-boundary-resume:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: source binding差分を親HEADとblobで固定して先行保存
        id: reconcile
        run: |
          python3 -m unittest tests/test_pr16_circus_drought_launch_boundary_resume.py -v
          python3 scripts/pr16_circus_drought_launch_boundary_resume.py reconcile
      - name: 既存失敗原本とreadonly境界scopeを非force保存
        id: prepare
        run: python3 scripts/pr16_circus_drought_launch_boundary.py prepare
      - name: 現候補の18戦目chooserからfield落下までだけを採取
        run: python3 scripts/pr16_circus_drought_launch_boundary.py pipeline
      - name: 境界traceと引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_drought_launch_boundary.py finish
      - name: ROMとsaveを除外した証跡
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_drought_launch_boundary.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-drought-launch-boundary-resume
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

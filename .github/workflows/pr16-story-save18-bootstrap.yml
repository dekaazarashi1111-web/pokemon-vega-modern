name: pr16-story-save18-bootstrap
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save18-bootstrap.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-story-save18-bootstrap
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 固定Save17後継用textと共有libraryだけを取得（native再走0）
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmgba0.10
          mkdir -p .local/pr16-story-save18-bootstrap
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          root = pathlib.Path.cwd()
          out = root / '.local/pr16-story-save18-bootstrap'
          assert os.environ['GITHUB_REF_NAME'] == 'codex/modernization-followup-20260908'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          def api(path):
              req = urllib.request.Request('https://api.github.com/repos/dekaazarashi1111-web/pokemon-vega-modern/' + path,
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          pr = api('pulls/16')
          assert pr['state'] == 'open' and pr['draft'] is True and not pr['merged']
          assert pr['head']['sha'] == os.environ['GITHUB_SHA']
          previous = api('actions/runs/36511503554')
          jobs = api('actions/runs/36511503554/jobs?per_page=100')
          assert previous['head_sha'] == 'c4095e34e024c9331fea32c0135a201b98395bbd'
          assert previous['status'] == 'completed' and previous['conclusion'] == 'success'
          assert jobs['total_count'] == len(jobs['jobs']) and len(jobs['jobs']) == 1
          assert all(j['status'] == 'completed' and j['conclusion'] == 'success' and
              all(s['status'] == 'completed' and s['conclusion'] == 'success' for s in j['steps']) for j in jobs['jobs'])
          recent = api('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=30')
          report = {'source_head':os.environ['GITHUB_SHA'], 'run_id':int(os.environ['GITHUB_RUN_ID']),
              'prior_record':{k:previous[k] for k in ('id','head_sha','status','conclusion','path','run_attempt')},
              'prior_jobs':jobs,
              'latest_runs_page':[{k:r.get(k) for k in ('id','head_sha','path','status','conclusion','created_at','run_attempt')} for r in recent['workflow_runs']],
              'latest_page_is_complete_history':False, 'native_processes':0, 'accepted_test_reruns':0,
              'rom_changes':0, 'release_ready':False, 'active_baseline_changed':False}
          (out/'reconciliation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected = []
          exact = {'AGENTS.md','CHATGPT_RESUME.md','README.md','Makefile','config/active_play_baseline.json',
              'infra/toolchain_manifest.json','state/source-lock.json','tasks/task_graph.json'}
          prefixes = ('scripts/','tools/','tests/','content/modernization/','design/')
          suffixes = {'.py','.c','.h','.json','.md','.txt','.yml','.yaml','.sh','.s','.S','.inc'}
          with zipfile.ZipFile(out/'source.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p = root/name
                  if not name or not p.is_file() or p.is_symlink(): continue
                  allowed = name in exact or (name.startswith(prefixes) and p.suffix in suffixes) or name.startswith('docs/PR16_') and p.suffix == '.md'
                  if not allowed or p.stat().st_size > 2000000: continue
                  data = p.read_bytes()
                  try: data.decode('utf-8')
                  except UnicodeDecodeError: continue
                  if b'\x00' in data: continue
                  z.writestr(name,data)
                  selected.append({'path':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              z.writestr('_export.json',json.dumps({'source_head':os.environ['GITHUB_SHA'],'files':selected},ensure_ascii=False,indent=2)+'\n')
          lib = pathlib.Path('/usr/lib/x86_64-linux-gnu/libmgba.so.0.10')
          assert lib.exists()
          listing = subprocess.check_output(['ldd',str(lib)],text=True)
          libs = {lib}
          for line in listing.splitlines():
              if '=>' in line:
                  target = line.split('=>',1)[1].strip().split()[0]
                  assert target.startswith('/') and pathlib.Path(target).is_file(), line
                  if pathlib.Path(target).name not in {'libc.so.6','libpthread.so.0','libm.so.6','libdl.so.2','librt.so.1'}:
                      libs.add(pathlib.Path(target))
          manifest = {}
          with zipfile.ZipFile(out/'runtime.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(libs):
                  data = p.read_bytes()
                  z.writestr(p.name,data)
                  manifest[p.name] = {'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              z.writestr('manifest.json',json.dumps(manifest,indent=2)+'\n')
          (out/'runtime-ldd.txt').write_text(listing)
          print(json.dumps({'files':len(selected),'native_processes':0,'accepted_test_reruns':0,'previous_record':'completed/success'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save18-bootstrap
          path: .local/pr16-story-save18-bootstrap
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

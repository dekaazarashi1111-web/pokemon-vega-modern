name: pr16-research-save-impact-native-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-save-impact-native-20260926.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-save-impact-native-20260926
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 固定候補・mGBAで16境界を採取（既受入case/ARM再実行なし）
        shell: python
        run: |
          import hashlib, io, json, os, pathlib, subprocess, sys, time, urllib.request, zipfile
          root=pathlib.Path.cwd(); work=root/'.local/pr16-research-save-impact-native'; public=work/'public'
          public.mkdir(parents=True)
          sys.path.insert(0,str(root/'scripts'))
          import pr16_research_save_delegate as repair
          def need(ok,why):
              if not ok: raise RuntimeError(why)
          def identity(raw): return {'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          def put(name,v): (public/name).write_text(json.dumps(v,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          def api(path,binary=False):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=120) as response: raw=response.read()
              return raw if binary else json.loads(raw)
          pr=api('pulls/16');need(pr['draft'] and not pr['merged'] and pr['state']=='open' and pr['head']['sha']==os.environ['GITHUB_SHA'],'exact open draft HEAD')
          cp=json.loads((root/'content/modernization/pr16_special_wild_ui_checkpoint.json').read_text())
          need(cp['candidate']==repair.CANDIDATE and cp['actions_completion_confirmed'] and cp['capture_save_continue_accepted'],'prior scoped identity')
          receipt=cp['terminal_receipt'];prior=api('actions/runs/'+str(receipt['run_id']))
          need(prior['status']=='completed' and prior['conclusion']=='success' and prior['head_sha']==receipt['source_head'],'prior terminal success')
          specs=[('runtime',10898620034,102586759,'a6aeccb72fa15411d956b418ca5f030aa5020a466303a25e0f8814ba2eeb5c4d',333,240469427),('data',10898510128,17366330,'7d3de78d4e852583eb35551076021630c1343aa623e91fe1529d73f4cf1471ed',3,33685811)]
          artifacts=[]
          for name,number,size,digest,count,total in specs:
              meta=api('actions/artifacts/'+str(number));need(not meta['expired'] and meta['size_in_bytes']==size and meta['digest']=='sha256:'+digest and meta['workflow_run']['id']==36218655601,'fixed artifact metadata')
              raw=api('actions/artifacts/'+str(number)+'/zip',True);need(identity(raw)=={'size':size,'sha256':digest},'fixed artifact bytes')
              dest=work/name;dest.mkdir()
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  need(len(z.infolist())==count and len(set(z.namelist()))==count and sum(i.file_size for i in z.infolist())==total,'archive exact member bounds')
                  for entry in z.infolist():
                      p=pathlib.PurePosixPath(entry.filename);need(not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and entry.external_attr>>28!=10 and not entry.is_dir(),'safe regular archive member')
                      f=dest/str(p);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(z.read(entry))
              artifacts.append({'id':number,'name':meta['name'],'binding':identity(raw),'source_head':meta['workflow_run']['head_sha']})
          runtime=work/'runtime';data=work/'data'
          parent=(data/'candidate.gba').read_bytes();candidate,delta=repair.apply(parent);(data/'candidate.gba').write_bytes(candidate);put('repair.json',delta)
          seed=(data/'seed.srm').read_bytes();need(identity(seed)=={'size':131072,'sha256':'f6bfdb107196ca22b012c1d12ee4bcdc8f5add309bbd3538447cd6e39c449bcb'},'fixed seed')
          need(identity((runtime/'lib/libmgba.so').read_bytes())=={'size':1968536,'sha256':'0c87a12341640e6a2d325e59e76eb4b002947771ad4d8814b216e3b99817d68d'},'fixed libmgba')
          (runtime/'ld.so').chmod(0o755);(runtime/'lib/libmgba.so.0.10').symlink_to('libmgba.so')
          code=['tools/mgba_pr16_research_save_impact.c','scripts/pr16_research_save_delegate.py','config/research_economy_v1.json','overlays/research_economy_v1/research_economy_v1.c','overlays/research_economy_v1/research_economy_v1.h','.github/workflows/pr16-research-save-impact-native-20260926.yml']
          helpers=['tools/mgba_qol_production_smoke.c','tools/mgba_battle_core_smoke.c','tools/mgba_ai_fixture_runner.c']
          for path in helpers: need(identity((root/path).read_bytes())==cp['source_bindings'][path],'unchanged helper '+path)
          bindings={p:identity((root/p).read_bytes()) for p in code+helpers}
          put('inputs.json',{'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'candidate':identity(candidate),'seed':identity(seed),'artifacts':artifacts,'source_bindings':bindings,'prior_terminal':{k:prior[k] for k in ('id','head_sha','status','conclusion')}})
          exe=work/'runner';cmd=['cc','-std=c11','-O2','-Wall','-Wextra','-Werror','-Wno-misleading-indentation','-Itools','-I'+str(runtime/'include'),'tools/mgba_pr16_research_save_impact.c','-L'+str(runtime/'lib'),'-lmgba','-lm','-Wl,--allow-shlib-undefined','-o',str(exe)]
          compile=subprocess.run(cmd,capture_output=True,timeout=120)
          (public/'compile.stdout.txt').write_bytes(compile.stdout);(public/'compile.stderr.txt').write_bytes(compile.stderr)
          put('compile.json',{'returncode':compile.returncode,'command':cmd,'compiler':subprocess.check_output(['cc','--version']).decode(),'source_bindings':bindings,'executable':identity(exe.read_bytes()) if exe.exists() else None})
          need(compile.returncode==0,'host compile')
          prefix=[str(runtime/'ld.so'),'--library-path',str(runtime/'lib'),str(exe)]
          failures={};guards={}
          for mode in ('bus8','bus16','bus32','raw8','raw16','raw32','register'):
              p=subprocess.run(prefix+['--guard-check',mode],capture_output=True,timeout=10)
              (public/('guard-'+mode+'.stdout.txt')).write_bytes(p.stdout);(public/('guard-'+mode+'.stderr.txt')).write_bytes(p.stderr)
              guards[mode]={'returncode':p.returncode,'stdout':identity(p.stdout),'stderr':identity(p.stderr)}
              need(p.returncode==1 and not p.stdout and p.stderr==b'research-save-impact: host write after observation barrier\n','write barrier '+mode)
          put('guards.json',guards)
          cases={}
          for op in ('existing-earn','simple-earn','spend','rank'):
              for phase in range(4):
                  key=op+'-'+str(phase);save=work/(key+'.srm');save.write_bytes(seed);started=time.monotonic()
                  try:
                      p=subprocess.run(prefix+[str(data/'candidate.gba'),str(save),op,str(phase)],capture_output=True,timeout=150)
                      result={'returncode':p.returncode,'timeout':False};stdout,stderr=p.stdout,p.stderr
                  except subprocess.TimeoutExpired as exc:
                      result={'returncode':None,'timeout':True};stdout,stderr=exc.stdout or b'',exc.stderr or b''
                  for suffix,raw in (('stdout.txt',stdout),('stderr.txt',stderr)): (public/(key+'.'+suffix)).write_bytes(raw)
                  result.update(elapsed_seconds=round(time.monotonic()-started,3),stdout=identity(stdout),stderr=identity(stderr),private_final_save=identity(save.read_bytes()),source_head=os.environ['GITHUB_SHA'],seed=identity(seed))
                  cases[key]=result;put(key+'.process.json',result)
                  if result['returncode']!=0 or result['timeout']: failures[key]=result
                  print(key,json.dumps(result),flush=True)
          report={'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'cases':cases,'failures':failures,'native_processes':16,'guard_processes':7,'host_compiles':1,'arm_compiles':0,'accepted_case_reruns':0,'normal_transaction_ui_accepted':False,'status':'MEASURED_NOT_YET_ACCEPTED'}
          put('measurement.json',report)
          need(identity((data/'seed.srm').read_bytes())==identity(seed) and identity((data/'candidate.gba').read_bytes())==repair.CANDIDATE,'read-only seed/candidate')
          need(not failures,'native failures retained')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-save-impact-native
          path: .local/pr16-research-save-impact-native/public/
          retention-days: 30
          if-no-files-found: error

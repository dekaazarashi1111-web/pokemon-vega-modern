name: pr16-ring-flagset-continuation
run-name: Ring未読FlagSet継続1根の採取・検証・記録／受入済みnative再実行なし
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-flagset-continuation.yml
      - scripts/pr16_ring_flagset_continuation.py
      - tests/test_pr16_ring_flagset_continuation.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-flagset-continuation
  cancel-in-progress: false
jobs:
  collect-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact HEAD・固定正本・最新Actions・完了済みABIとBPの照合
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr16_ring_flagset_continuation.py preflight
      - name: 未読byte取得のため同一hashのcandidateのみ復元
        shell: bash
        run: |
          set -euo pipefail
          out=.local/pr16-ring-flagset-private
          mkdir -p "$out"
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json;print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          cfg=json.loads(pathlib.Path('config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          archive=pathlib.Path('.local/pr16-bp-trial-native-inputs')/name
          raw=archive.read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          p=pathlib.Path('vendor/upstream/CFRU-JP/charmap.tbl')
          assert not any(q.is_symlink() for q in (p,*p.parents))
          with zipfile.ZipFile(archive) as z:data=z.read(p.as_posix())
          if p.exists():assert p.read_bytes()==data
          else:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data);p.chmod(0o444)
          PY
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 scripts/pr16_bp_party_retention_successor.py > "$out/candidate.stdout" 2> "$out/candidate.stderr"
          git diff --exit-code
      - name: 0x0806DE7Dだけ採取、新規異常系・固定resume・両ログ・最終index guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr16_ring_flagset_continuation.py record .local/pr16-bp-party-retention-successor/candidate.gba
      - name: 最新HEADを再確認して完了commit・同branchへ非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,os,subprocess
          pr=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/pulls/16']))
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==os.environ['GITHUB_SHA']
          assert pr['head']['repo']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'PR-P08-7: FlagSet未読継続1根の採取・検証・固定引継ぎを記録'
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json,os,subprocess,sys
          sys.path.insert(0,'scripts');import pr16_ring_flagset_continuation as a
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for p in a.OUTPUTS:
              assert subprocess.check_output(['git','show','HEAD:'+p])==(a.ROOT/p).read_bytes()
          assert subprocess.check_output(['git','status','--porcelain','--untracked-files=no'])==b''
          value={'status':'PASS_FLAGSET_CONTINUATION_RECORDED_NONFORCE_PUSHED','commit':commit,
                 'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
                 'tests':json.loads((a.OUT/'tests.json').read_bytes()),
                 'guard':json.loads((a.OUT/'guard.json').read_bytes()),
                 'summary':json.loads((a.OUT/'summary.json').read_bytes()),
                 'committed_outputs_byte_verified':list(a.OUTPUTS),
                 'rom_changes':0,'new_emulator_processes':0,'accepted_native_cases_replayed':0,
                 'ring_acquisition_accepted':False,'release_ready':False}
          (a.OUT/'recorded-result.json').write_bytes(a.stable(value))
          print('RESULT=DONE TASK='+a.TASK+' VERIFY=PASS COMMIT='+commit)
          print(json.dumps(value))
          PY
      - name: 限定UTF-8診断結果のみexport検査（ROM/save/private復元ログを除外）
        if: always()
        id: export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('.local/pr16-ring-flagset-continuation')
          for p in root.iterdir():
              assert p.is_file() and not p.is_symlink() and p.suffix in {'.json','.txt'}
              data=p.read_bytes();data.decode('utf-8')
              assert b'\0' not in data and len(data)<4000000
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN [A-Z ]*PRIVATE KEY-----',data)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: pr16-ring-flagset-continuation
          path: .local/pr16-ring-flagset-continuation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

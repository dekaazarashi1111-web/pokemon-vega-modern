name: pr16-special-wild-bound-terminal-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-special-wild-bound-terminal-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-special-wild-bound-terminal-20260926
  cancel-in-progress: false
jobs:
  terminal:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新規terminal境界8試験だけ・ROMと旧試験の実行なし
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-special-wild-bound-terminal/proof
          python3 -B -m unittest tests.test_pr16_special_wild_bound_terminal -v >.local/pr16-special-wild-bound-terminal/proof/terminal-unit.stdout.txt 2>.local/pr16-special-wild-bound-terminal/proof/terminal-unit.stderr.txt
          cat .local/pr16-special-wild-bound-terminal/proof/terminal-unit.stderr.txt
      - name: 完了Actions・原本44ファイル・7caseを照合し引継ぎと両ログを確定
        run: python3 -B scripts/pr16_special_wild_bound_terminal.py execute
      - name: 引継ぎ整合・task graph・限定index guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_special_wild_bound_terminal.py paths | tr '\n' '\0' >.local/pr16-special-wild-bound-terminal/paths.z
          git add --pathspec-from-file=.local/pr16-special-wild-bound-terminal/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_special_wild_bound_terminal.py guard
      - name: 同branch非force commit/push・remote HEAD照合
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_special_wild_bound_terminal.py guard
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260926-SPECIAL-WILD: 2callsite修復の完了Actions・原本を確定し固定引継ぎと両ログへ反映（再実行0）'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-special-wild-bound-terminal/proof/reflected-head.txt
          echo "RESULT=DONE TASK=USER-20260926-SPECIAL-WILD VERIFY=PASS COMMIT=$sha"
      - name: 確定ファイルだけ転送・再検証や再実行なし
        if: always()
        run: |
          python3 -B - <<'PY'
          import pathlib, sys, zipfile
          sys.path.insert(0,'scripts')
          import pr16_special_wild_bound_terminal as t
          out=t.WORK/'context';out.mkdir(parents=True,exist_ok=True)
          index={}
          with zipfile.ZipFile(out/'context.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for name in sorted(t.CODE|t.owned()):
                  p=pathlib.Path(name)
                  if not p.is_file():continue
                  raw=p.read_bytes();raw.decode('utf-8');assert b'\0' not in raw
                  z.writestr(name,raw);index[name]=t.identity(raw)
              z.writestr('index.json',t.encode(index))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-bound-terminal-proof
          path: .local/pr16-special-wild-bound-terminal/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-bound-terminal-context
          path: .local/pr16-special-wild-bound-terminal/context/
          retention-days: 7
          if-no-files-found: error

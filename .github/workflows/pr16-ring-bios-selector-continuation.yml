name: pr16-ring-bios-selector-continuation
run-name: BIOS後の2属性slotと未読分岐先だけを継続
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-bios-selector-continuation.yml
      - scripts/pr16_ring_bios_selector_continuation.py
      - tests/test_pr16_ring_bios_selector_continuation.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-bios-selector-continuation
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 新規2slotとsuffixを検証し同branchへ記録
        run: python3 scripts/pr16_ring_bios_selector_continuation.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-bios-selector-continuation
          path: |
            .local/pr16-ring-bios-selector-continuation/analysis.json
            .local/pr16-ring-bios-selector-continuation/tests.json
            .local/pr16-ring-bios-selector-continuation/tests.txt
            .local/pr16-ring-bios-selector-continuation/preflight.json
            .local/pr16-ring-bios-selector-continuation/guard.json
            .local/pr16-ring-bios-selector-continuation/recorded-result.json
            .local/pr16-ring-bios-selector-continuation/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

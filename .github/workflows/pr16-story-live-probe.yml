name: pr16-story-live-probe
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-live-probe.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-live-observer
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  observer:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: 新observerの実HP/PPと進行byteをSave101に照合
        run: python3 -B scripts/pr16_story_live_probe.py
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-live-observer-save101
          path: .local/pr16-story-live-probe/artifact
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

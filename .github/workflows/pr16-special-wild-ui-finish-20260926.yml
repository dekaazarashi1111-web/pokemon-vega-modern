name: pr16-special-wild-ui-finish-20260926
# phase1: 成功原本の記録だけ復旧。native/既存unit/host/ARM再実行なし。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-special-wild-ui-finish-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-special-wild-ui-finish-20260926
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 検証済みsourceの完全hash転送（実行なし）
        run: python3 -B scripts/pr16_special_wild_ui_v2_upgrade.py
      - name: 新しい記録guardだけを検証
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-special-wild-ui-finish
          python3 -B -m unittest discover -s tests -p test_pr16_special_wild_ui_finish.py -v 2>&1 | tee .local/pr16-special-wild-ui-finish/new-unit.txt
      - name: 成功native原本・source・config・引継ぎ・両ログを復旧
        run: python3 -B scripts/pr16_special_wild_ui_finish.py recover
      - name: 引継ぎ・task graph・final index限定guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_special_wild_ui_finish.py paths | tr '\n' '\0' >.local/pr16-special-wild-ui-finish/paths.z
          git add --pathspec-from-file=.local/pr16-special-wild-ui-finish/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_special_wild_ui_finish.py guard
      - name: 同branchへ非force commit/push・remote照合
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_special_wild_ui_finish.py guard
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260926-SPECIAL-WILD-UI: 通常UI2件と研究保存delegate修正の記録を再実測せず復旧'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-special-wild-ui-finish/reflected-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-ui-finish-proof
          path: .local/pr16-special-wild-ui-finish/
          retention-days: 30
          if-no-files-found: error

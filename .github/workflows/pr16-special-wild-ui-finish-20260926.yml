name: pr16-special-wild-ui-finish-20260926
# phase2: 記録復旧runの終端成功を照合。native/unit/host/ARMは実行しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-special-wild-ui-finish-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-special-wild-ui-finish-20260926
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 復旧Actions全step・成果commit親子・原本を終端照合
        run: python3 -B scripts/pr16_special_wild_ui_finish.py finalize
      - name: 引継ぎ・task graph・final index限定guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_special_wild_ui_finish.py paths | tr '\n' '\0' >.local/pr16-special-wild-ui-finish/paths.z
          git add --pathspec-from-file=.local/pr16-special-wild-ui-finish/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_special_wild_ui_finish.py guard
      - name: 同branchへ非force commit/push・remote照合
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_special_wild_ui_finish.py guard
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260926-SPECIAL-WILD-UI: 通常UI2件の終端・共有保存delegate修正・次工程を確定'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-special-wild-ui-finish/reflected-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-ui-finish-proof
          path: .local/pr16-special-wild-ui-finish/
          retention-days: 30
          if-no-files-found: error

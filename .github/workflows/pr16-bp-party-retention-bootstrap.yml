name: Install scoped PR16 party-retention implementation
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-bp-party-retention-bootstrap.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: pr16-bp-party-retention-bootstrap
  cancel-in-progress: false
jobs:
  install:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore and verify implementation transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          rows=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/issues/16/comments?per_page=100']))
          marker='pr16-retention-bootstrap-9a79a276-part-'
          found=[]
          for row in rows:
              body=row.get('body','')
              match=re.match(r'<!-- '+re.escape(marker)+r'(\d)-of-4 -->\n([A-Za-z0-9+/=]+)\Z',body)
              if match:found.append((int(match.group(1)),row['id'],match.group(2)))
          assert [n for n,_,_ in sorted(found)]==[1,2,3,4],found
          raw=base64.b64decode(''.join(data for _,_,data in sorted(found)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='9a79a27629b4943d61578d4c8f8f421bca4bd7af353ad3ec1dd0272aae7b3f4c'
          pathlib.Path('/tmp/pr16-retention.tar.xz').write_bytes(raw)
          pathlib.Path('/tmp/comment-ids.json').write_text(json.dumps([ident for _,ident,_ in sorted(found)]))
          PY
          expected=$'.github/workflows/pr16-bp-party-retention-native.yml\nscripts/pr16_bp_party_retention_native.py\nscripts/pr16_bp_party_retention_successor.py\ntests/test_pr16_bp_party_retention_native.py\ntests/test_pr16_bp_party_retention_successor.py'
          actual=$(tar -tJf /tmp/pr16-retention.tar.xz | sort)
          test "$actual" = "$expected"
          test -z "$(printf '%s\n' "$actual" | grep -E '(^/|(^|/)\.\.(/|$))' || true)"
          tar -xJf /tmp/pr16-retention.tar.xz
          rm .github/workflows/pr16-bp-party-retention-bootstrap.yml
          python3 -m py_compile scripts/pr16_bp_party_retention_successor.py scripts/pr16_bp_party_retention_native.py tests/test_pr16_bp_party_retention_successor.py tests/test_pr16_bp_party_retention_native.py
          python3 -m unittest discover -s tests -p 'test_pr16_bp_party_retention_successor.py' -v
          python3 -m unittest discover -s tests -p 'test_pr16_bp_party_retention_native.py' -v
          git diff --check
      - name: Commit implementation and fast-forward branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr16-bp-party-retention-bootstrap.yml .github/workflows/pr16-bp-party-retention-native.yml scripts/pr16_bp_party_retention_successor.py scripts/pr16_bp_party_retention_native.py tests/test_pr16_bp_party_retention_successor.py tests/test_pr16_bp_party_retention_native.py
          git commit -m 'wip: connect PR16 party retention runtime' -m 'Build: verified callsite, near trampoline, deterministic read-only wrapper, and dedicated native runner.\nVerify: py_compile and focused 10 tests passed; native acceptance runs next.'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$branch"
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          for ident in json.load(open('/tmp/comment-ids.json')):
              subprocess.check_call(['gh','api','-X','DELETE',f'repos/{repo}/issues/comments/{ident}'])
          PY

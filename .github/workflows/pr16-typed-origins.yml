name: pr16-typed-origins
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_typed_origins.py
      - scripts/pr16_typed_origins_actions.py
      - tests/test_pr16_typed_origins.py
      - .github/workflows/pr16-typed-origins.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-typed-origins
  cancel-in-progress: false
jobs:
  typed-origins:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped ARM reconstruction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev
      - name: Execute new typed origin readers and receive prior bounds without replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_typed_origins_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-typed-origins-public-text
          path: .local/pr16-typed-origins/public/
          if-no-files-found: error
          retention-days: 90

name: pr16-story-save21-source
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save21-source.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save21-source
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  source:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Scoped source guard and task graph
        run: |
          set -euo pipefail
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_learnset_runtime_record as g; g.START='e517baa451b613283ca87bc05304bed42b75ded9'; g.CODE={'.github/workflows/pr16-story-save21-source.yml'}; g.OWNED=set(); g.guard()"
          python3 -B scripts/validate_task_graph.py --check
      - name: Export exact tracked text and live Actions only
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root=pathlib.Path.cwd(); out=root/'.local/pr16-story-save21-source'; out.mkdir(parents=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/dekaazarashi1111-web/pokemon-vega-modern/'+path]))
          pr=api('pulls/16')
          assert pr['state']=='open' and pr['draft'] and not pr['merged']
          assert pr['head']['sha']==head and pr['head']['ref']=='codex/modernization-followup-20260908'
          assert pr['head']['repo']['full_name']=='dekaazarashi1111-web/pokemon-vega-modern'
          snapshot={'source_head':head,'parent_head':'e517baa451b613283ca87bc05304bed42b75ded9','pr':{'number':16,'state':pr['state'],'draft':pr['draft'],'merged':pr['merged']},'runs':[],'record':{},'new_native_processes':0,'accepted_test_reruns':0}
          for number in (36572961114,36573749814):
              run=api(f'actions/runs/{number}'); jobs=api(f'actions/runs/{number}/jobs?per_page=100')
              assert jobs['total_count']==len(jobs['jobs'])
              snapshot['record'][str(number)]={'run':{k:run[k] for k in ('id','head_sha','path','status','conclusion','run_attempt')},'jobs':[{k:j[k] for k in ('id','name','status','conclusion','steps')} for j in jobs['jobs']],'artifacts':api(f'actions/runs/{number}/artifacts?per_page=100')}
          # 最新runと並行実行を別々に観測。旧caseや一般CIは起動しない。
          for query in ('branch=codex%2Fmodernization-followup-20260908&per_page=10','status=in_progress&per_page=100','status=queued&per_page=100'):
              result=api('actions/runs?'+query)
              snapshot['runs'].append({'query':query,'total_count':result['total_count'],'observed':[{k:r[k] for k in ('id','head_sha','head_branch','path','event','status','conclusion','created_at','updated_at')} for r in result['workflow_runs']]})
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          manifest={}
          allowed={'.py','.c','.h','.json','.md','.txt','.yml','.yaml','.sh'}
          prefixes=('scripts/','tools/','tests/','content/modernization/','config/','infra/','tasks/')
          fixed={'AGENTS.md','CHATGPT_RESUME.md','README.md','.gitignore','design/run_log.md','design/version_log.md','design/current_state.md','design/active_play_baseline.md','design/agent_context_map.md','design/tasks_next.md','state/source-lock.json'}
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p=root/name
                  chosen=name in fixed or (name.startswith(prefixes) and p.suffix in allowed) or (name.startswith('docs/PR16_') and p.suffix=='.md')
                  if not chosen: continue
                  assert p.is_file() and not p.is_symlink()
                  raw=p.read_bytes(); raw.decode('utf-8'); assert b'\0' not in raw
                  manifest[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
                  z.writestr(name,raw)
              z.writestr('SOURCE_MANIFEST.json',json.dumps({'source_head':head,'files':manifest},sort_keys=True,indent=2)+'\n')
          (out/'actions.json').write_text(json.dumps(snapshot,sort_keys=True,indent=2)+'\n')
          (out/'transfer.json').write_text(json.dumps({'source_head':head,'tracked_text_files':len(manifest),'new_native_processes':0,'accepted_test_reruns':0,'rom_rebuilds':0},sort_keys=True,indent=2)+'\n')
          print('PASS 固定HEADのtracked text転送のみ。ROM/save/private入力の転送・native・旧受入再走0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save21-source
          path: .local/pr16-story-save21-source
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

name: pr16-fusion-wiring-apply
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-fusion-wiring-apply.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply source-only changes; workflow edits use the authorized connector
        shell: bash
        run: |
          set -euo pipefail
          echo '248a7019c359c9276a9d837ec6f8690e61b90007b632b8a492003ee33a206638  .chatgpt/patches/pr16-fusion-wiring.patch' | sha256sum -c -
          echo '4ccfd59cdb8d01365def80d61f58a6c142fec40c12c7fef85503d8b6cd5792d9  tools/mgba_pr16_necrozma_fusion_acceptance.c' | sha256sum -c -
          echo '2aa621cdcc13011449589650986965bdd12c8994f542e07ece6f5a28979b150a  tools/mgba_pr16_fixed_form_acceptance.c' | sha256sum -c -
          echo '6263665ce27e5da52ba01c1459cb60fb3a470ebe942282d6aa31120af7bda292  scripts/pr16_fixed_form_acceptance.py' | sha256sum -c -
          echo '53297b2d1c1d05ab462310fc5efe66c3d40b646fcfd9ca18b78c71daa358a356  tests/test_pr16_fixed_form_acceptance.py' | sha256sum -c -
          echo '1171ddabcb58cf52a0bc9fb83fa140deebc1a4a2d1073247e535186251afe71b  .github/workflows/pr16-fixed-form-acceptance.yml' | sha256sum -c -
          python3 scripts/pr16_fixed_form_originals.py
          git apply --exclude=.github/workflows/pr16-fixed-form-acceptance.yml --check .chatgpt/patches/pr16-fusion-wiring.patch
          git apply --exclude=.github/workflows/pr16-fixed-form-acceptance.yml .chatgpt/patches/pr16-fusion-wiring.patch
          python3 -m unittest discover -s tests -p test_pr16_fixed_form_acceptance.py -v
          python3 scripts/validate_task_graph.py
      - name: Record exact stopping point, without advancing acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,pathlib
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          text=f'\n## {stamp}\n- Task: USER-MODERNIZATION / Necrozma native fusion controller\n- Status: IMPLEMENTED_NATIVE_NOT_RUN\n- Summary: 既存Crowned/取消controllerをそのまま埋め込み、Necrozma2ケースだけをN-Solarizer697/N-Lunarizer698→手持ち相方1189/1190→4枠技選択→保存/Continue→解除/専用技削除/圧縮→保存/Continueの別controllerへ接続。Photon733を選んで忘れた後に自動復元されるという旧誤想定は拒否。FORM行選択の実行とは明示的に区別。\n- Verify: 17 focused source-only tests PASS、既存4原本のGit HEAD bytes/digest一致。新Cの実compile/nativeは次の明示的Necrozma2ケースrunで検証。\n- Files changed: fusion C、Python validator、tests。既存native workflowは変更せず、.github/pr16-fixed-form-run.jsonの明示更新で起動。\n- Commit: この追記を含むcommit。固定ROM e630f7f199194fb4b531ff3a561da866902aea200770a832aec5c276e1636267 は変更なし。\n- Network: checkoutのみ。新規emulator0。Crowned成功と取消成功を再実行しない。\n- Prior attempt: run34696667882はsource/checks成功後、botのworkflow更新pushだけが拒否されcommit未反映。今回はsource-onlyに限定し、workflow権限を持つGitHub connectorとbotを混同しない。\n- Next: .github/pr16-fixed-form-run.jsonをNecrozma2ケースへ更新し1回実行、raw originalを判定。3/5という現行受入は変更せずP03 gap/release-ready=false。\n'
          for name in ('design/run_log.md','design/version_log.md'):
              with pathlib.Path(name).open('a') as f:f.write(text)
          PY
          git diff --exit-code -- .github/workflows/pr16-fixed-form-acceptance.yml tools/mgba_pr16_fixed_form_acceptance.c config/active_play_baseline.json design/active_play_baseline.md content/modernization/p08_remaining_work.json content/modernization/pr16_fixed_form_acceptance.json
          git add scripts/pr16_fixed_form_acceptance.py tests/test_pr16_fixed_form_acceptance.py design/run_log.md design/version_log.md
          git rm .chatgpt/patches/pr16-fusion-wiring.patch .github/workflows/pr16-fusion-wiring-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git commit -m 'USER-MODERNIZATION: wire native Necrozma fusion lifecycle with 17 fail-closed tests; keep accepted Crowned unchanged'
          git push origin "HEAD:$GITHUB_REF_NAME"

name: pr16-ring-text-export-recovery
run-name: Ring保存記録の独立照合と上限内text分割export
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-text-export-recovery.yml
      - scripts/pr16_ring_text_export_recovery.py
      - tests/test_pr16_ring_text_export_recovery.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-text-export-recovery
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保存証拠照合・分割export検証・非force記録
        run: python3 scripts/pr16_ring_text_export_recovery.py run
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-ring-text-export-recovery
          path: .local/pr16-ring-text-export-recovery/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: private-unit-focused-r2
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.event.repository.private == true &&
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/fix-private-full-unit-20260905-r2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: source境界とexact HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 scripts/validate_task_graph.py
          python3 scripts/guard_private_files.py
          python3 -m unittest tests.test_regenerate_stage61_unit_state
      - name: Toolchain
        run: bash infra/setup_github_actions.sh --install
      - name: Private Release 4 ZIPを取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/github-private-environment/assets
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          mapfile -t archives < <(python3 -c 'import json; print("\n".join(row["name"] for row in json.load(open("config/github_private_environment.json"))["archives"]))')
          for name in "${archives[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir .local/github-private-environment/assets
          done
      - name: 外側と全member hashを維持して復元
        run: python3 scripts/github_private_environment.py restore --archive-dir .local/github-private-environment/assets
      - name: 既存ROMを保護して現行Stage61生成元を再実行
        run: python3 scripts/regenerate_stage61_unit_state.py
      - name: 非秘密hashの状態を採取
        run: python3 -m scripts.probe_private_unit_state > /dev/null 2>&1
      - name: focused unit実行（生の出力は破棄、許可した結果だけ保存）
        run: |
          status=0
          python3 scripts/run_private_unit_focus.py > /dev/null 2>&1 || status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/private-unit-focus/result.json')
          if not p.is_file():
              raise SystemExit('focused runner did not produce a complete result')
          result = json.loads(p.read_text())
          print(json.dumps({key: value for key, value in result.items() if key not in {'details', 'skip_records'}}, sort_keys=True))
          PY
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-unit-focus-${{ github.event.pull_request.head.sha }}
          path: build/private-unit-focus/*.json
          retention-days: 1
          if-no-files-found: error

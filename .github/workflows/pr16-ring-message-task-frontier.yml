name: pr16-ring-message-task-frontier
run-name: 登録message taskの限定byte採取と保存caller照合
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-message-task-frontier.yml
      - scripts/pr16_ring_message_task_frontier.py
      - tests/test_pr16_ring_message_task_frontier.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-message-task-frontier
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 未読task一根と保存callerを検証して同branchへ記録
        run: python3 scripts/pr16_ring_message_task_frontier.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-message-task-frontier
          path: |
            .local/pr16-ring-message-task-frontier/export/
            .local/pr16-ring-message-task-frontier/analysis.json
            .local/pr16-ring-message-task-frontier/tests.json
            .local/pr16-ring-message-task-frontier/tests.txt
            .local/pr16-ring-message-task-frontier/recorded-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

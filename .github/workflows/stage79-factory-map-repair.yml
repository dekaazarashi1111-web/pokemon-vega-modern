name: stage79-factory-map-repair
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/stage79-factory-map-repair.yml
      - .github/scripts/stage79_factory_map_repair.py
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: stage79-factory-map-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned mGBA toolchain
        run: bash infra/setup_github_actions.sh --install
      - name: Prove the stale Stage68 map argument before repair
        run: |
          set -euo pipefail
          mkdir -p .local/stage79-factory-map-repair
          if ! grep -q 'Stage79 Factory map provenance/count contract mismatch' scripts/run_modernization_stage79_cumulative_mgba.py; then
            status=0
            python3 -m unittest tests.test_modernization_stage79_factory_map.FactoryMapContractTest.test_cumulative_map_relocation_preserves_shop_abi_and_price_inputs -v > .local/stage79-factory-map-repair/before.log 2>&1 || status=$?
            cat .local/stage79-factory-map-repair/before.log
            test "$status" = 1
            grep -q '155531192' .local/stage79-factory-map-repair/before.log
            grep -q '155595088' .local/stage79-factory-map-repair/before.log
          fi
      - name: Apply the exact cumulative map correction and refresh only READY evidence
        run: python3 .github/scripts/stage79_factory_map_repair.py > .local/stage79-factory-map-repair/apply.json
      - name: Require the new contract regressions and existing orchestrator tests to pass
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_modernization_stage79_factory_map tests.test_modernization_stage79_github_domain tests.test_modernization_stage79_cumulative_mgba -v > .local/stage79-factory-map-repair/after.log 2>&1
          cat .local/stage79-factory-map-repair/after.log
          python3 scripts/run_modernization_stage79_github_domain.py plan > .local/stage79-factory-map-repair/plan.json
          cc -std=c11 -O2 -Wall -Wextra -Werror -Itools tools/mgba_modernization_stage79_mega_shop_smoke.c -lmgba -o .local/stage79-factory-map-repair/shop
          cc -std=c11 -O2 -Wall -Wextra -Werror -Itools tools/mgba_modernization_mega_shop_smoke.c -lmgba -o .local/stage79-factory-map-repair/historical-shop
          git diff --check
      - name: Commit only validated harness, contract and unexecuted gate changes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          config = json.loads(pathlib.Path('config/modernization_stage79_cumulative_mgba.json').read_text())
          rom = config['input_identity']['rom']
          assert hashlib.sha256(pathlib.Path(rom['path']).read_bytes()).hexdigest() == rom['sha256']
          gate = json.loads(pathlib.Path(config['execution']['runtime_gate']).read_text())
          assert gate['status'] == 'READY_NOT_RUN' and gate['not_yet_executed'] is True
          assert gate['execution']['evidenced_domain_runs'] == 0
          targets = {'tools/mgba_modernization_mega_shop_smoke.c',
                     'tools/mgba_modernization_stage79_mega_shop_smoke.c',
                     'scripts/run_modernization_stage79_cumulative_mgba.py',
                     'config/modernization_stage79_cumulative_mgba.json',
                     config['execution']['runtime_gate']}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed <= targets and untracked <= targets, (changed, untracked)
          subprocess.run(['git', 'add', '--', *sorted(targets)], check=True)
          PY
          git diff --cached > .local/stage79-factory-map-repair/validated.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(stage79): validate the exact cumulative Factory graph without changing Stage68'
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
          git rev-parse HEAD > .local/stage79-factory-map-repair/committed-head.txt
      - name: Execute all seven domains on the committed HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.ref_name }}
        run: gh workflow run modernization-stage79-mgba.yml --ref "$HEAD_REF" -f domain=all
      - name: Remove local executables before preserving diagnostic evidence
        if: always()
        run: rm -f .local/stage79-factory-map-repair/shop .local/stage79-factory-map-repair/historical-shop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage79-factory-map-repair
          path: .local/stage79-factory-map-repair
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

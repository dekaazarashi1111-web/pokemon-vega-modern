name: pr16-learnset-baseline-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - '.github/pr16-learnset-baseline-record.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-learnset-baseline-record
  cancel-in-progress: false
jobs:
  baseline-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
      BRANCH: codex/modernization-followup-20260908
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 記録用sourceと12境界試験だけを確認
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-learnset-baseline-record
          python3 - <<'PY'
          import json, subprocess
          request=json.load(open('.github/pr16-learnset-baseline-record.json'))
          assert request['task']=='USER-20260921-LEARNSET-BASELINE-RESET' and request['mode']=='record-completed'
          for path, expected in request['expected_blobs'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==expected, path
          PY
          python3 -B -m unittest tests.test_pr16_learnset_baseline_record -v 2>&1 | tee .local/pr16-learnset-baseline-record/unit.log
      - name: 完了Actions原本を照合し固定引継ぎと両ログを記録
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_baseline_record.py record > .local/pr16-learnset-baseline-record/checkpoint.json
          python3 -B scripts/pr16_resume.py check > .local/pr16-learnset-baseline-record/resume-check.json
          python3 -B scripts/validate_task_graph.py > .local/pr16-learnset-baseline-record/task-graph.log
          git diff --check
      - name: 限定final-indexを検査して同じbranchへ非force push
        shell: bash
        run: |
          set -euo pipefail
          git add -- CHATGPT_RESUME.md docs/PR16_LEARNSET_BASELINE_RESET_JA.md docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md content/modernization/pr16_native_supply_resume_20260913.json content/modernization/pr16_learnset_baseline_checkpoint.json content/modernization/pr16_learnset_baseline_evidence design/run_log.md design/version_log.md
          base=$(python3 -c 'import json; print(json.load(open(".github/pr16-learnset-baseline-record.json"))["observed_start_head"])')
          python3 -B scripts/pr16_learnset_baseline_record.py guard --base "$base" > .local/pr16-learnset-baseline-record/final-index-guard.json
          git diff --cached --check
          git diff --exit-code
          git fetch --no-tags origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260921-LEARNSET-BASELINE-RESET: 公式原本隔離を受入し完了証拠と次工程を記録'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > .local/pr16-learnset-baseline-record/reflected-head.txt
          printf 'RESULT=PASS_OFFICIAL_SOURCE_ISOLATION TASK=USER-20260921-LEARNSET-BASELINE-RESET VERIFY=39+12_RECORD_AND_TWO_BUILD_READONLY COMMIT=%s\n' "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-baseline-recorded
          path: .local/pr16-learnset-baseline-record/
          if-no-files-found: error
          retention-days: 30

name: pr16-ring-story-caller-frontier
run-name: 保存原本からstory初期化callerとscript dispatchの未読接続を限定
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-ring-story-caller-frontier.yml
      - scripts/pr16_ring_story_caller_frontier.py
      - tests/test_pr16_ring_story_caller_frontier.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-story-caller-frontier
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 未読callerを限定・検証し同branchへ記録
        run: python3 scripts/pr16_ring_story_caller_frontier.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-story-caller-frontier
          path: |
            .local/pr16-ring-story-caller-frontier/analysis.json
            .local/pr16-ring-story-caller-frontier/tests.json
            .local/pr16-ring-story-caller-frontier/tests.txt
            .local/pr16-ring-story-caller-frontier/guard.json
            .local/pr16-ring-story-caller-frontier/recorded-result.json
            .local/pr16-ring-story-caller-frontier/export/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

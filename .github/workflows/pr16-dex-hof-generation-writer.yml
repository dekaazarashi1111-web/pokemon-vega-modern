name: pr16-dex-hof-generation-writer
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-dex-hof-generation-writer.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-hof-generation-writer
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  generation:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 24
      - name: Exact source and preserved evidence
        run: python3 -B scripts/pr16_dex_hof_generation_writer_actions.py guard
      - name: Official ARM compiler and fixed mGBA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libmgba-dev
      - name: Changed lower generation writer in current ROM
        run: python3 -B scripts/pr16_dex_hof_generation_writer_actions.py run
      - name: Closed publication guard
        id: publication_guard
        if: always()
        run: python3 -B scripts/pr16_dex_hof_generation_writer_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-dex-hof-generation-writer-text-only
          path: public-dex-hof-generation-writer
          retention-days: 90
          if-no-files-found: error

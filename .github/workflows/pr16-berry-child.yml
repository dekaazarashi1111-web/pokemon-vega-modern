name: pr16-berry-child
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_berry_child.py
      - scripts/pr16_berry_child_actions.py
      - tests/test_pr16_berry_child.py
      - tools/mgba_pr16_berry_child.c
      - .github/workflows/pr16-berry-child.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-berry-child
  cancel-in-progress: false
jobs:
  child-entry:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新しい子機scopeの固定nativeツール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libmgba-dev gcc g++ make
      - name: 親境界を再走せず子機entryを限定検証して保存
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_berry_child_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-berry-child-public-text
          path: .local/pr16-berry-child/public/
          if-no-files-found: error
          retention-days: 90

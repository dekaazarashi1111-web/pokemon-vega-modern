name: pr16-learnset-conditional
# 新規条件consumerだけを実行。旧30試験/318186照合/nativeは継承する。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-conditional.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-conditional
  cancel-in-progress: false
jobs:
  conditional-host:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 条件41試験と元span全owner全level照合
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_conditional_host.py host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-host-proof
          path: .local/pr16-learnset-conditional/proof/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-host-data
          path: .local/pr16-learnset-conditional/data/
          retention-days: 30
          if-no-files-found: warn
  conditional-context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 保存候補のABIと条件呼出しsourceを照合
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_conditional_host.py context
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-context
          path: .local/pr16-learnset-conditional/context/
          retention-days: 7
          if-no-files-found: warn

name: pr16-learnset-conditional
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-conditional.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-conditional
  cancel-in-progress: false
jobs:
  conditional-context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: 条件consumerの固定sourceとABIのみ取得
        run: |
          python3 -B - <<'PY'
          import hashlib, json, subprocess, urllib.request, zipfile
          from pathlib import Path
          root = Path('.local/pr16-conditional-context'); root.mkdir(parents=True)
          exact = {'tools/rom_allocator.py', 'tools/mgba_battle_core_smoke.c', 'tools/mgba_ai_fixture_runner.c', 'tools/__init__.py', 'config/rom_regions.csv', 'content/modernization/pr16_saved_reconstruction_recipes.json', 'content/modernization/pr16_circus_getter_followup.json', 'content/modernization/pr16_candidate_wiki_saved_link_sources.json', 'content/modernization/pr16_candidate_wiki_creation_sources.json'}
          prefixes = ('tools/pr16_learnset', 'tools/mgba_pr16_learnset', 'content/modernization/pr16_learnset', 'content/modernization/pr16_candidate_wiki')
          manifest = {}
          with zipfile.ZipFile(root/'source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p = Path(name)
                  if not name or not (name in exact or name.startswith(prefixes)) or p.suffix not in {'.py','.c','.h','.json','.jsonl','.txt','.md','.csv'}:
                      continue
                  if not p.is_file() or p.is_symlink():
                      continue
                  data=p.read_bytes(); data.decode('utf-8')
                  if b'\0' in data: raise ValueError('text-only')
                  z.writestr(name,data); manifest[name]={'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
              revision='e24a16fe39e27ae162faf5b78596d1f3df18489d'
              for path in ('src/learn_move.c','src/daycare.c','src/item.c','include/constants/pokemon.h','BPRJ.ld','src/config.h'):
                  with urllib.request.urlopen('https://raw.githubusercontent.com/kapibarasan000/CFRU-JP/'+revision+'/'+path,timeout=60) as response:
                      data=response.read()
                  data.decode('utf-8'); name='upstream/'+path; z.writestr(name,data)
                  manifest[name]={'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'upstream_commit':revision}
          (root/'context.json').write_text(json.dumps({'source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':manifest,'new_tests':0,'new_native_runs':0},ensure_ascii=False,indent=2)+'\n')
          print('text files:',len(manifest),'new native: 0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-conditional-context
          path: .local/pr16-conditional-context/
          retention-days: 7
          if-no-files-found: error

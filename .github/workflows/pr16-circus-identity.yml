name: PR16 Circus rental identity
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-identity.yml
      - scripts/pr16_circus_identity.py
      - tests/test_pr16_circus_identity.py
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-circus-identity
  cancel-in-progress: false
jobs:
  identity:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 個体継承契約20件のみ検証
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-circus-identity-run
          python3 -m unittest discover -s tests -p test_pr16_circus_identity.py -v > .local/pr16-circus-identity-run/tests.stdout 2> .local/pr16-circus-identity-run/tests.stderr
          python3 scripts/validate_task_graph.py
      - name: 固定compilerとStage84親入力を復元
        run: |
          set -euo pipefail
          out=.local/pr16-circus-identity-run
          bash infra/setup_github_actions.sh --install > "$out/toolchain.log" 2>&1
          python3 scripts/modernization_final_integration.py prepare > "$out/stage84.json" 2> "$out/stage84.stderr"
      - name: 固定private入力とcharmapだけを復元
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=.local/pr16-circus-identity-run
          assets=.local/pr16-bp-trial-native-inputs
          mkdir -p "$assets"
          tag=$(python3 -c 'import json; print(json.load(open("config/github_private_environment.json"))["release"]["tag"])')
          gh release download "$tag" --pattern pokemon-vega-private-env-v1-inputs.zip --pattern pokemon-vega-private-env-v1-modernization-inputs.zip --pattern pokemon-vega-private-env-v1-state.zip --dir "$assets"
          python3 scripts/github_private_environment.py restore --archive-dir "$assets" --archive pokemon-vega-private-env-v1-inputs.zip --archive pokemon-vega-private-env-v1-modernization-inputs.zip > "$out/private-restore.json"
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.')
          cfg=json.loads((root/'config/github_private_environment.json').read_bytes())
          name='pokemon-vega-private-env-v1-state.zip';bound=next(a for a in cfg['archives'] if a['name']==name)
          archive=root/'.local/pr16-bp-trial-native-inputs'/name;raw=archive.read_bytes()
          assert len(raw)==bound['size'] and hashlib.sha256(raw).hexdigest()==bound['sha256']
          member='vendor/upstream/CFRU-JP/charmap.tbl'
          with zipfile.ZipFile(archive) as z:data=z.read(member)
          path=root/member
          assert not any(p.is_symlink() for p in (path,*path.parents))
          if path.exists():assert path.read_bytes()==data
          else:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);path.chmod(0o444)
          PY
      - name: 受入済み候補を同SHAへ再構成しnativeは再実行しない
        run: |
          set -euo pipefail
          out=.local/pr16-circus-identity-run
          python3 scripts/pr16_resume.py check > "$out/resume-before.json"
          python3 scripts/pr16_p07_preserved_layer.py > "$out/p07.stdout" 2> "$out/p07.stderr"
          python3 scripts/pr16_evolution_learning_repair.py > "$out/repair.stdout" 2> "$out/repair.stderr"
          python3 scripts/pr16_circus_entry.py > "$out/build.stdout" 2> "$out/build.stderr"
          git diff --exit-code
      - name: 個体bytesを限定観測し初戦ターン前で停止
        run: |
          set -euo pipefail
          out=.local/pr16-circus-identity-run
          sudo apt-get update > "$out/apt-update.log" 2>&1
          sudo apt-get install -y libmgba-dev > "$out/apt-mgba.log" 2>&1
          python3 scripts/pr16_circus_identity.py > "$out/native.stdout" 2> "$out/native.stderr"
          git diff --exit-code
      - name: ROM save credentialを除外して限定原本と修復用sourceを保持
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path('.');out=root/'.local/pr16-circus-identity-evidence';out.mkdir(parents=True,exist_ok=True)
          members={}
          def save(name,p):
              assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes()
              if p.suffix=='.ppm':assert raw.startswith(b'P6\n240 160\n255\n') and len(raw)==115215
              else:
                  raw.decode('utf-8');assert len(raw)<2000000 and b'\0' not in raw
                  assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----',raw)
              dst=out/name;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(raw)
              members[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          for prefix in ('pr16-circus-identity-run','pr16-circus-identity','pr16-circus-entry'):
              for p in sorted((root/'.local'/prefix).rglob('*')):
                  if p.is_file() and p.suffix in {'.json','.txt','.stdout','.stderr','.log','.ld','.c','.h','.ppm','.S'}:save(prefix+'/'+p.relative_to(root/'.local'/prefix).as_posix(),p)
          names=['scripts/pr16_circus_identity.py','tests/test_pr16_circus_identity.py','.github/workflows/pr16-circus-identity.yml',
            'scripts/pr16_circus_entry.py','scripts/pr16_circus_native.py','scripts/pr16_resume.py','scripts/pr16_ring_followup_v2.py',
            'scripts/pr16_ring_compiled_record.py','scripts/pr16_circus_first_record.py','scripts/pr16_bp_party_retention_successor.py',
            'scripts/build_facility_runtime.py','overlays/save_migration/save_migration.h',
            'content/modernization/pr16_native_supply_resume_20260913.json','content/modernization/p08_remaining_work.json']
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          names+=sorted(n for n in tracked if n.startswith('overlays/') and ('facility' in n or 'circus' in n) and n.endswith(('.c','.h')))
          for name in sorted(set(names)):
              assert name in tracked
              save('source/'+name,root/name)
          (out/'members.json').write_text(json.dumps(members,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-identity
          path: .local/pr16-circus-identity-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

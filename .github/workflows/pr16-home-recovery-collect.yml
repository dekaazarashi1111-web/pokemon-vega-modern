name: pr16-home-recovery-collect
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-home-recovery-collect.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-home-recovery-native
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PR16_HOME_COLLECTION_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test only seven new immutable artifact cases
        run: |
          mkdir -p .local
          python -B -m unittest discover -s tests -p test_pr16_home_recovery_collect.py -v > .local/pr16-home-collection-unit.stdout.txt 2> .local/pr16-home-collection-unit.stderr.txt
      - name: Collect completed native processes without emulation or recompilation
        run: python -B scripts/pr16_home_recovery_collect.py collect
      - name: Validate task graph resume and scoped index
        run: |
          python -B scripts/validate_task_graph.py --check
          python -B scripts/pr16_resume.py check
          python -B scripts/pr16_home_recovery_native_actions.py guard
          git diff --cached --check
      - name: Non-force same-branch completion commit
        run: |
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260928-HOME-RECOVERY: 回復Saveと独立Continueの完走原本を回収、追加native0 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
          printf 'RESULT=DONE TASK=USER-20260928-HOME-RECOVERY VERIFY=PASS COMMIT=%s\n' "$(git rev-parse HEAD)"
      - name: Preserve committed text and completion HEAD
        run: python -B scripts/pr16_home_recovery_native_actions.py snapshot
      - name: Retain all collected originals even on publication failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('.local/pr16-home-native-run');art=out/'checkpoint';art.mkdir(parents=True,exist_ok=True)
          if (out/'public').exists():shutil.copytree(out/'public',art/'public',dirs_exist_ok=True)
          for name in ['unit.stdout.txt','unit.stderr.txt']:
              source=Path('.local/pr16-home-collection-'+name)
              if source.exists():shutil.copy2(source,art/('collection-'+name))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-home-recovery-native-checkpoint
          path: .local/pr16-home-native-run/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: pr16-research-wild-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-wild-20260927.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-wild-20260927
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 新規2経路だけ実装実測・成功失敗原本と再開点保存
        run: python3 -B scripts/pr16_research_wild_capture.py measure
      - name: 固定引継ぎ・task graph・最終index限定guard
        run: |
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_research_wild_capture.py guard
      - name: HEAD確認・実測checkpoint commit・同branch非force push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python3 -B -c 'import sys;sys.path[:0]=["scripts","."];import pr16_research_lifecycle_actions as d;d.current()'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260927-RESEARCH-WILD: 新規釣り生態の実装実測原本と正確な停止点を保存"
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=STOPPED TASK=USER-20260927-RESEARCH-WILD COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-wild-new-native
          path: .local/pr16-research-wild/public/
          retention-days: 14
          if-no-files-found: warn

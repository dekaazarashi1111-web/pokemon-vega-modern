name: pr16-research-bag-native-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-bag-native-20260926.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-bag-native-20260926
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 修正候補spend/rank限定10件とhost書込禁止を検証
        run: python3 -B scripts/pr16_research_bag_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-bag-native
          path: .local/pr16-research-bag/public/
          retention-days: 30
          if-no-files-found: error

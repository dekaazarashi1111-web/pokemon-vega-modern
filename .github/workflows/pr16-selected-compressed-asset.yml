name: pr16-selected-compressed-asset
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_selected_compressed_asset.py
      - scripts/pr16_selected_compressed_asset_actions.py
      - tests/test_pr16_selected_compressed_asset.py
      - .github/workflows/pr16-selected-compressed-asset.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-selected-compressed-asset
  cancel-in-progress: false
jobs:
  compressed-type1:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新scope ROM再構成に必要なARMツールのみ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev gcc g++ make
      - name: 新しいtype1境界試験のみ
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests -p 'test_pr16_selected_compressed_asset.py' -v
      - name: 軽量task graph
        run: python3 -B scripts/validate_task_graph.py
      - name: 保存済み73bankのtype1のみ新範囲測定
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_selected_compressed_asset_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-selected-compressed-asset-public-text
          path: .local/pr16-selected-compressed-asset/public/
          if-no-files-found: error
          retention-days: 90

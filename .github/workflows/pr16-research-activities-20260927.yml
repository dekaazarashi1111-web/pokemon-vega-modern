name: pr16-research-activities-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-activities-20260927.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-activities-20260927
  cancel-in-progress: false
jobs:
  context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 現在HEADの限定ソース束と最新Actionsを固定（既受入再実行0）
        run: python3 -B scripts/pr16_research_activities_context.py
      - name: native runnerのC include依存を追加取得（コンパイル・実行なし）
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,re,subprocess,zipfile
          from pathlib import Path
          tracked=set(subprocess.check_output(['git','ls-files']).decode().splitlines())
          selected={p for p in tracked if p.startswith('tools/mgba') and Path(p).suffix in ('.c','.h')}
          selected|={p for p in tracked if 'research_economy' in p and Path(p).suffix=='.py'}
          pending=list(selected)
          while pending:
              p=pending.pop()
              for name in re.findall(r'^\s*#\s*include\s*"([^"]+)"',Path(p).read_text(),re.M):
                  for q in (str(Path(p).parent/name),'tools/'+name,name):
                      if q in tracked and q not in selected:
                          selected.add(q);pending.append(q)
          out=Path('.local/pr16-research-activities/context')
          index={'source_head':os.environ['GITHUB_SHA'],'files':{},'native_runs':0,'compiles':0}
          with zipfile.ZipFile(out/'c-context.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(selected):
                  assert not Path(p).is_symlink()
                  data=Path(p).read_bytes();data.decode('utf-8');assert b'\0' not in data
                  index['files'][p]={'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':subprocess.check_output(['git','rev-parse','HEAD:'+p]).decode().strip()}
                  z.writestr(p,data)
              z.writestr('index.json',json.dumps(index,ensure_ascii=False,indent=2)+'\n')
          print('C_SOURCE_FILES='+str(len(selected)))
          PY
      - name: 読取専用であることを確認
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-activities-context
          path: .local/pr16-research-activities/context/
          retention-days: 7
          if-no-files-found: error

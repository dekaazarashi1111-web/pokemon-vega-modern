name: pr16-research-activities-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-activities-20260927.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-activities-20260927
  cancel-in-progress: false
jobs:
  context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 現在HEADの限定ソース束と最新Actionsを固定（既受入再実行0）
        run: python3 -B scripts/pr16_research_activities_context.py
      - name: 読取専用であることを確認
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-activities-context
          path: .local/pr16-research-activities/context/
          retention-days: 7
          if-no-files-found: error

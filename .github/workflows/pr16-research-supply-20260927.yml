name: pr16-research-supply-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-supply-20260927.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-supply-20260927
  cancel-in-progress: false
jobs:
  supply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: catalog正本と共通sourceの差分転送（検証再実行0）
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess,zipfile
          out=pathlib.Path('.local/research-supply-transfer');out.mkdir(parents=True)
          exact={'content/research_economy_v1/canonical_model.json','content/research_economy_v1/PROVENANCE_JA.md','manifests/item_ids.csv','tools/mgba_qol_production_smoke.c','tools/mgba_battle_core_smoke.c','tools/mgba_ai_fixture_runner.c','content/modernization/pr16_special_wild_ui_checkpoint.json'}
          tracked=subprocess.check_output(['git','ls-files']).decode().splitlines()
          exact|={p for p in tracked if p.startswith('tools/') and p.endswith('.py')}
          assert exact<=set(tracked)
          manifest={'source_head':os.environ['GITHUB_SHA'],'files':{},'unit_tests':0,'native_runs':0,'rom_changes':0}
          with zipfile.ZipFile(out/'tracked-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(exact):
                  f=pathlib.Path(p);assert not f.is_symlink();b=f.read_bytes();b.decode('utf-8');assert b'\0' not in b
                  z.writestr(p,b);manifest['files'][p]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print('SUPPLEMENTAL_TRACKED_SOURCE',len(exact),'accepted/native/ARM reruns=0')
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-supply-source
          path: .local/research-supply-transfer/
          retention-days: 7
          if-no-files-found: error

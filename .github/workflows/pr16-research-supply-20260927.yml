name: pr16-research-supply-20260927
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-supply-20260927.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-supply-20260927
  cancel-in-progress: false
jobs:
  supply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CATALOG_MODE: measure
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ローカル実装とtracked sourceの完全一致
        shell: python
        run: |
          import pathlib,subprocess
          expected={'scripts/pr16_research_catalog.py':'2e176483a69868e9fd80c662c947745487d4cdd8','tools/mgba_pr16_research_catalog.c':'25c1da2aceff774fb90f158670b6f025454a8406','tests/test_pr16_research_catalog.py':'2c11681fb836718d1c8e58a3d9097206869b17b1','scripts/pr16_research_catalog_actions.py':'78b2aecae76d8ca4feaa5677ae47c6aacc0908a3'}
          for path,sha in expected.items():
              assert pathlib.Path(path).is_file()
              assert subprocess.check_output(['git','hash-object',path]).decode().strip()==sha,path
          print('PASS_EXACT_CATALOG_SOURCE',len(expected))
      - name: 未受入catalogだけの実装検証と原本記録
        run: python3 -B scripts/pr16_research_catalog_actions.py "$CATALOG_MODE"
      - name: 引継ぎ・task graph・限定indexと履歴保全
        run: |
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_research_catalog_actions.py guard
      - name: 同branchへcommitと非force push
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260927-RESEARCH-SUPPLY: catalog限定検証と引継ぎを記録 ($CATALOG_MODE)"
          git push origin "HEAD:refs/heads/$branch"
          echo "RESULT=DONE TASK=USER-20260927-RESEARCH-SUPPLY VERIFY=PASS COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-catalog
          path: |
            .local/pr16-research-lifecycle/public/
            .local/pr16-research-lifecycle/catalog-screens/
          retention-days: 14
          if-no-files-found: error
      - name: 原本保存後に受入結論を確定
        run: python3 -B scripts/pr16_research_catalog_actions.py result

name: pr16-research-v1-load-20260926
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-v1-load-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-v1-load-20260926
  cancel-in-progress: false
jobs:
  v1-load:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      MODE: finalize
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: V1通常loadの限定測定と原本記録
        run: python3 -B scripts/pr16_research_v1_load_actions.py "$MODE"
      - name: 引継ぎとtask graphを照合
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check | tee .local/pr16-research-lifecycle/public/resume-check.txt
          python3 -B scripts/validate_task_graph.py | tee .local/pr16-research-lifecycle/public/task-graph.txt
      - name: 最終index限定guardと差分検査
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_research_v1_load_actions.py guard | tee .local/pr16-research-lifecycle/public/index-guard.txt
      - name: 同branchへcommitと非force push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260926-RESEARCH-V1-LOAD: 通常loadの${MODE}と引継ぎ記録"
          git push origin "HEAD:refs/heads/$branch"
          reflected=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$reflected"
          printf '%s\n' "$reflected" > .local/pr16-research-lifecycle/public/reflected-head.txt
      - name: 失敗を成功扱いしない
        if: env.MODE == 'measure'
        run: python3 -c "import json; c=json.load(open('content/modernization/pr16_research_v1_load_checkpoint.json')); assert not c['failed_cases'], c['failed_cases']"
      - name: 固定text sourceだけを作業用artifactへ保存
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('.')
          cp=json.loads((root/'content/modernization/pr16_research_v1_load_checkpoint.json').read_text())
          paths=set(cp['source_bindings'])|set(cp['protected_bindings'])|{'AGENTS.md','scripts/pr16_research_v1_load_actions.py','scripts/pr16_research_v1_load.py','scripts/pr16_resume.py','scripts/pr16_learnset_compact_record.py','scripts/pr16_learnset_runtime_record.py','scripts/validate_task_graph.py','content/modernization/pr16_native_supply_resume_20260913.json','content/modernization/pr16_research_v1_load_checkpoint.json','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md','docs/PR16_RESEARCH_V1_LOAD_JA.md'}
          allowed={'.py','.c','.h','.json','.md','.txt','.yml'}
          assert all((root/p).is_file() and pathlib.PurePosixPath(p).suffix in allowed and not p.startswith(('userfile/','inputs/','build/','.local/')) for p in paths)
          subprocess.run(['git','archive','--format=zip','-o','.local/pr16-research-lifecycle/source-context.zip','HEAD','--',*sorted(paths)],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-v1-load
          path: .local/pr16-research-lifecycle/public/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-v1-load-source-context
          path: .local/pr16-research-lifecycle/source-context.zip
          retention-days: 7
          if-no-files-found: error

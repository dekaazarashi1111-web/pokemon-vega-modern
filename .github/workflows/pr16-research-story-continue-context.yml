name: pr16-research-story-continue-context
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-story-continue-context.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export exact scoped text and live status without native replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import fnmatch,hashlib,json,os,pathlib,subprocess,urllib.request,zipfile
          root=pathlib.Path.cwd();out=root/'.local/pr16-story-continue-context';out.mkdir(parents=True)
          names=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))-{''}
          patterns=['AGENTS.md','CHATGPT_RESUME.md','scripts/pr16_*.py','scripts/validate_task_graph.py','scripts/guard_private_files.py','scripts/github_private_environment.py','tests/test_pr16_research*.py','tests/test_pr16_resume.py','tools/mgba_pr16_research*.c','tools/pr16_research*','content/modernization/pr16_research*.json','content/modernization/pr16_research*/*.json','content/modernization/pr16_research*/*.txt','content/modernization/pr16_research*/*/*.json','content/modernization/pr16_research*/*/*.txt','content/modernization/pr16_native_supply_resume_20260913.json','content/modernization/pr16_bp_chooser_checkpoint.json','content/modernization/p08_remaining_work.json','docs/PR16_RESEARCH*.md','docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md','design/run_log.md','design/version_log.md','design/active_play_baseline.md','config/active_play_baseline.json','config/*research*.json','infra/toolchain_manifest.json','tasks/task_graph.json','design/tasks_next.md','.github/workflows/pr16-research*.yml']
          selected={n for n in names if any(fnmatch.fnmatchcase(n,p) for p in patterns)}
          manifest={'source_head':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'files':{},'native_executions':0,'accepted_test_reruns':0}
          with zipfile.ZipFile(out/'context.zip','w',zipfile.ZIP_DEFLATED) as z:
            for n in sorted(selected):
              p=root/n
              if not p.is_file() or p.is_symlink():raise ValueError('regular tracked text required')
              b=p.read_bytes();b.decode('utf-8')
              if b'\0' in b:raise ValueError('NUL in text')
              manifest['files'][n]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()};z.writestr(n,b)
            z.writestr('context-manifest.json',json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          def get(path):
            q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(q) as r:return json.load(r)
          runs=get('actions/runs?branch=codex%2Fmodernization-followup-20260908&per_page=30')['workflow_runs'];pr=get('pulls/16')
          status={'source_head':manifest['source_head'],'remote_head':pr['head']['sha'],'pr':{k:pr[k] for k in ('number','state','draft','merged')},'runs':[{k:r[k] for k in ('id','name','head_sha','head_branch','status','conclusion','event','created_at','updated_at','run_attempt')} for r in runs]}
          for run in (36320959294,):
            r=get('actions/runs/'+str(run));status['starter_run']={k:r[k] for k in ('id','head_sha','status','conclusion','run_attempt')};status['starter_jobs']=get('actions/runs/'+str(run)+'/jobs')['jobs']
          status['starter_artifact']=get('actions/artifacts/10932059074')
          (out/'latest-actions.json').write_text(json.dumps(status,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({'source_head':manifest['source_head'],'files':len(selected),'native_executions':0,'accepted_test_reruns':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-research-story-continue-context
          path: .local/pr16-story-continue-context
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

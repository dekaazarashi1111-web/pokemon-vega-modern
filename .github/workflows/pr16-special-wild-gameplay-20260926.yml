name: pr16-special-wild-gameplay-20260926
# 保存candidate/通常UI入力だけを束縛。直接probe/既受入/ARMは再実行しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-special-wild-gameplay-20260926.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-special-wild-gameplay-20260926
  cancel-in-progress: false
jobs:
  gameplay:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 固定候補の保存recipeと未受入UI入力を照合
        run: python3 -B scripts/pr16_special_wild_gameplay.py execute
      - name: 成功と失敗を固定引継ぎ・両ログへ記録
        if: always()
        run: |
          set -euo pipefail
          test -f .local/pr16-special-wild-gameplay/proof/verification.json
          python3 -B scripts/pr16_special_wild_gameplay.py record
      - name: 引継ぎ整合・task graph・最終index限定guard
        if: always()
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_special_wild_gameplay.py paths | tr '\n' '\0' >.local/pr16-special-wild-gameplay/paths.z
          git add --pathspec-from-file=.local/pr16-special-wild-gameplay/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_special_wild_gameplay.py guard
      - name: 同branchへ非force commit/push・remote照合
        if: always()
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_special_wild_gameplay.py guard
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260926-SPECIAL-WILD-GAMEPLAY: 保存候補と通常UI入力bindingの実測・引継ぎ・両ログを保存'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-special-wild-gameplay/proof/reflected-head.txt
      - name: 限定sourceと最新Actionsを転送
        if: always()
        run: python3 -B scripts/pr16_special_wild_gameplay.py context
      - name: 次の通常操作専用mGBA環境を保存（emulator実行なし）
        if: always()
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmgba-dev
          d=.local/pr16-special-wild-gameplay/runtime
          mkdir -p "$d/lib" "$d/include"
          cp -r /usr/include/mgba /usr/include/mgba-util "$d/include/"
          cp -L /usr/lib/x86_64-linux-gnu/libmgba.so "$d/lib/libmgba.so"
          ldd /usr/lib/x86_64-linux-gnu/libmgba.so | awk '/=> \// {print $3} /^\s*\// {print $1}' | while read -r p; do cp -L "$p" "$d/lib/"; done
          cp -L /lib64/ld-linux-x86-64.so.2 "$d/ld.so"
          dpkg-query -W libmgba-dev libmgba0.10 >"$d/version.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-gameplay-proof
          path: .local/pr16-special-wild-gameplay/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-gameplay-context
          path: .local/pr16-special-wild-gameplay/context/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-gameplay-data
          path: .local/pr16-special-wild-gameplay/data/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-special-wild-gameplay-runtime
          path: .local/pr16-special-wild-gameplay/runtime/
          retention-days: 7
          if-no-files-found: error

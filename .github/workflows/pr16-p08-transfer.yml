name: PR16 P08 candidate evidence transfer
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_p08_transfer.py
      - tests/test_pr16_p08_transfer.py
      - .github/workflows/pr16-p08-transfer.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-p08-closeout
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 所有範囲CIに必要な固定原本だけ復元（native実行なし）
        run: python3 scripts/restore_modernization_final_originals.py
      - name: 6親受入・4代表とActionsを移送し限定検証・両ログ・非force記録
        run: python3 scripts/pr16_p08_transfer.py execute
      - name: 原本と移送receiptを保存
        if: always()
        run: python3 scripts/pr16_p08_transfer.py pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-p08-transfer
          path: .local/pr16-p08-transfer/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

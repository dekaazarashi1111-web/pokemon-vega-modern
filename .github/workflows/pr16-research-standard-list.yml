name: pr16-research-standard-list
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-standard-list.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-standard-list
  cancel-in-progress: false
jobs:
  standard-list:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source transfer identity
        id: source
        shell: python
        run: |
          import hashlib,pathlib
          expected={
            'scripts/pr16_research_standard_list_probe.py':'cdad160c3c4cf832b9bce3ec07f85800726f28c2a2c414ecdd74914cb8de7328',
            'scripts/pr16_research_standard_list_oracle.py':'6311cb7100da37d5819e6cac984f386db6cb47972427ca5b250ac96c95ed108a',
            'scripts/pr16_research_standard_list_actions.py':'24025e61286a5256c54c762c7c30fcb38f8c90f816812eab0693868bdd789ab2',
            'tests/test_pr16_research_standard_list_oracle.py':'6d57905b7d5cfc170733295c67f805ca17769dbd7b45bb75dca0f1da878953e0'}
          for name,digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          print('PASS: four exact transferred sources; saved C/builder/30 tests are separately bound')
      - name: New standard list selection cancellation and revisit only
        id: measure
        run: python3 -B scripts/pr16_research_standard_list_actions.py measure
      - name: Preserve immutable measurement and handoff
        id: record
        if: always() && steps.source.outcome == 'success' && hashFiles('.local/pr16-standard-list/public/invocation.json') != ''
        run: python3 -B scripts/pr16_research_standard_list_actions.py record
      - name: Task graph and exact scoped final index
        id: guard
        if: always() && steps.record.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/validate_task_graph.py
          mapfile -t owned < <(python3 -B scripts/pr16_research_standard_list_actions.py paths)
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_standard_list_actions.py guard
      - name: Non-force implementation and evidence checkpoint
        if: always() && steps.guard.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260927-RESEARCH-STANDARD-LIST: 標準list実測原本・固定引継ぎ・両ログを保存'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=STOPPED TASK=USER-20260927-RESEARCH-STANDARD-LIST VERIFY=SCOPED COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-standard-list-native
          path: |
            .local/pr16-standard-list/public/
            content/modernization/pr16_research_standard_list_checkpoint.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

name: pr16-research-standard-list
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-research-standard-list.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-standard-list
  cancel-in-progress: false
jobs:
  ui-native:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact source transfer
        id: source
        shell: python
        run: |
          import hashlib,pathlib
          assert hashlib.sha256(pathlib.Path('scripts/pr16_research_standard_list_ui_actions.py').read_bytes()).hexdigest()=='8ae23bf702c334b641fcbad4643fb76aaa1f834fed5b9d841772d6b8d8625f05'
      - name: Corrected window ownership frame and physical list interaction
        id: measure
        run: python3 -B scripts/pr16_research_standard_list_ui_actions.py measure
      - name: Preserve UI measurement and earlier failures separately
        id: record
        if: always() && steps.source.outcome == 'success' && hashFiles('.local/pr16-standard-list-ui-native/public/invocation.json') != ''
        run: python3 -B scripts/pr16_research_standard_list_ui_actions.py record
      - name: Task graph resume and entire task scoped index
        id: guard
        if: always() && steps.record.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/validate_task_graph.py
          mapfile -t owned < <(python3 -B scripts/pr16_research_standard_list_ui_actions.py paths)
          git add -- "${owned[@]}"
          python3 -B scripts/pr16_research_standard_list_ui_actions.py guard
      - name: Non-force UI evidence checkpoint
        if: always() && steps.guard.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260927-RESEARCH-STANDARD-LIST: UI資源修正後の限定実測・引継ぎを保存'
          git push origin HEAD:refs/heads/codex/modernization-followup-20260908
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "RESULT=STOPPED TASK=USER-20260927-RESEARCH-STANDARD-LIST VERIFY=SCOPED COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-standard-list-ui-native
          path: |
            .local/pr16-standard-list-ui-native/public/
            content/modernization/pr16_research_standard_list_ui_checkpoint.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

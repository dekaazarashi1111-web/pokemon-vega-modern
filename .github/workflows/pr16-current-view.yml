name: pr16-current-view
run-name: Regenerate current scope without rewriting historical acceptance
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-current-view.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-current-view
  cancel-in-progress: false
jobs:
  current-view:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore historical evidence only if absent, verify new retained originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-current-view
          python3 scripts/restore_modernization_final_originals.py > .local/pr16-current-view/restore.json
          python3 scripts/pr16_completion_checkpoint.py > .local/pr16-current-view/completion.json
      - name: Extend the exact generator and rebuild both current-view entry points
        run: |
          set -euo pipefail
          out=.local/pr16-current-view
          python3 scripts/pr16_refresh_current_view.py --write > "$out/refresh.json"
          python3 scripts/pr16_refresh_current_view.py > "$out/check.json"
          python3 scripts/record_modernization_final_acceptance.py > "$out/final-generator.json"
          python3 scripts/record_modernization_p03_forgetting.py > "$out/forgetting-generator.json"
          for pattern in test_pr16_completion_checkpoint.py test_pr16_current_view.py test_pr16_evolution_fullslots.py test_pr16_breeding_delta.py test_modernization_owner_policy.py test_modernization_final_integration.py; do
            python3 -m unittest discover -s tests -p "$pattern" -v >> "$out/unit.log" 2>&1
          done
      - name: Mark old handoff as historical and append run/version entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker='PR16-COMPLETION-7-NATIVE-CASES'
          p=Path('docs/FINAL_INTEGRATION_HANDOFF_JA.md');old=p.read_text()
          intro='''> **2026-09-11 現在の入口（PR16-COMPLETION-7-NATIVE-CASES）**
          > 現候補は `635fd890a8d1071560d3cb56c9c663425f7c988119ce098dedad6bf6554f973e`。
          > [現在の受入と実装再開点](PR16_COMPLETION_CHECKPOINT_JA.md)、`pr16_completion_acceptance.json`、再生成される `p08_remaining_work.json` を先に読む。
          > P06採用範囲は完了、進化満杯/取消2件とPichu実繁殖5件を新規受入済み。P07は1,073行追加・472+27行保持の照合/実装済みであり、配布表の承認待ちではない。
          > 以下のStage84説明・旧未受入範囲は当時の記録。現候補の未達はP03/P07の残る実経路、P05通常取得/実Circus入場、clean全工程再生成/配布。製品完成ではない。

          '''
          if marker not in old:p.write_text(intro+old)
          entry='''
          ## 2026-09-11 / PR16-COMPLETION-7-NATIVE-CASES

          - Task: USER-MODERNIZATION-P03-P06-P07-P08 / 同じPR #16で実操作受入と現在ビューを接続。
          - Candidate: 635fd890a8d1071560d3cb56c9c663425f7c988119ce098dedad6bf6554f973e、33,554,432 bytes、CRC32 5B8BFB51。ROM変更は今回なし。
          - New native: run 34552826501 進化満杯/取消2件4コア、run 34553503441 Pichu egg440実預入・生成・受取・孵化・保存5件15コア。今回計7プロセス19コア。
          - Preserved: run 34512326368 のP06採用3項目、技メモリー、レベル/進化、7領域を原本再検証。旧実行を今回の件数へ足さない。Stage82対照1件は現候補へ改称しない。
          - P06: 採用2種3項目のslot/stat/save、特性戦闘/対照、Summary表示を工程受入へ接続。未採用194行の調整はしない。
          - P07: 1,073歴史的採用追加と472+27既存保持を区別。新規一律配布・料金・解禁変更なし。
          - Evidence: content/modernization/pr16_completion_evidence の3原本ZIPを実取得・Git追跡。source/run/CRC/SHA/raw-validatorを再確認。原本保持commit b1215b03f03477ca24fe7fcb3efe0474467e5b64。
          - Current view: scripts/pr16_refresh_current_view.py、scripts/pr16_completion_checkpoint.py、docs/PR16_COMPLETION_CHECKPOINT_JA.md。旧Stage84受入JSONを変更せず再生成フックを追加。
          - Remaining: P03フォーム/該当供給、P07残る差分実経路、P05通常取得/実Circus、clean全工程再生成/配布。release_ready=false。
          - Protection: public/無料わざメモリーは承認済みで維持。Stage62、実プレイsave、原本、履歴、公開範囲、PR未マージを維持。
          - Verify: 専用mGBA 2run PASS、原本照合 PASS、両現在ビュー生成と関連否定unitを本workflowで検証。新規native実行と記録再検査を混同しない。
          '''
          for name in ('design/run_log.md','design/version_log.md'):
              p=Path(name);old=p.read_text()
              if marker not in old:p.write_text(old+entry)
          PY
      - name: Commit only current view, bounded generator hook and documentation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import subprocess
          names=['scripts/record_modernization_final_acceptance.py','content/modernization/p08_remaining_work.json','docs/FINAL_INTEGRATION_HANDOFF_JA.md','design/run_log.md','design/version_log.md']
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')))
          assert changed<=set(names),'unexpected tracked modification'
          for name in ['design/run_log.md','design/version_log.md']:
              from pathlib import Path
              old=subprocess.check_output(['git','show','HEAD:'+name]);assert Path(name).read_bytes().startswith(old),'append-only log changed'
          subprocess.run(['git','add','--',*names],check=True)
          staged=set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          assert staged<=set(names)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'USER-MODERNIZATION-P08: publish current scoped acceptance and exact AI resume'
            git push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD > .local/pr16-current-view/published-head.txt
          python3 scripts/pr16_refresh_current_view.py > .local/pr16-current-view/post-commit-check.json
          git diff --exit-code
      - name: Export resulting text view and verification, never ROM or saves
        if: always()
        run: |
          mkdir -p .local/pr16-current-view
          cp content/modernization/p08_remaining_work.json .local/pr16-current-view/current-view.json
          cp content/modernization/pr16_completion_acceptance.json .local/pr16-current-view/receipt.json
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          names=['scripts/pr16_completion_checkpoint.py','scripts/pr16_refresh_current_view.py','scripts/record_modernization_final_acceptance.py','tests/test_pr16_completion_checkpoint.py','tests/test_pr16_current_view.py','docs/PR16_COMPLETION_CHECKPOINT_JA.md','docs/FINAL_INTEGRATION_HANDOFF_JA.md','.github/workflows/pr16-current-view.yml']
          out=pathlib.Path('.local/pr16-current-view');bindings={}
          with zipfile.ZipFile(out/'executed-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name);raw=p.read_bytes();assert not p.is_symlink() and b'\0' not in raw;raw.decode('utf8')
                  z.writestr(name,raw);bindings[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'source-bindings.json').write_text(json.dumps(bindings,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-current-view-verified
          path: .local/pr16-current-view/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

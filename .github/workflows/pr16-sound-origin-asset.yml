name: pr16-sound-origin-asset
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_sound_origin_asset.py
      - scripts/pr16_sound_origin_asset_actions.py
      - tests/test_pr16_sound_origin_asset.py
      - .github/workflows/pr16-sound-origin-asset.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-sound-origin-asset
  cancel-in-progress: false
jobs:
  sound-origin-asset:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped ARM and PCM conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev g++ make
      - name: Bind fixed sound asset without replaying accepted readers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_sound_origin_asset_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-sound-origin-asset-public-text
          path: .local/pr16-sound-origin-asset/public/
          if-no-files-found: error
          retention-days: 90

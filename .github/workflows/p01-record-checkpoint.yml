name: p01-record-verified-checkpoint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: p01-checkpoint-record-14
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event.pull_request.number == 14 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chatgpt/user-modernization-p01-20260908' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: chatgpt/user-modernization-p01-20260908
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 既存focused testsと既存source gateを実行
        run: |
          python3 scripts/guard_private_files.py
          python3 scripts/validate_task_graph.py
          python3 - <<'PY'
          import hashlib, json, os, unittest
          from pathlib import Path
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_modernization_ids')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          evidence = {'tests':result.testsRun, 'failures':len(result.failures), 'errors':len(result.errors), 'skipped':len(result.skipped)}
          Path(os.environ['RUNNER_TEMP'], 'p01-focused.json').write_text(json.dumps(evidence))
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          inputs = json.loads(Path('config/modernization_inputs.json').read_text())
          pin = inputs['normalized_projection']
          raw = Path(pin['path']).read_bytes()
          if len(raw) != pin['size'] or hashlib.sha256(raw).hexdigest() != pin['sha256']:
              raise SystemExit('正規化投影の固定size/hashが不一致')
          candidate = json.loads(Path('config/modernization_candidate.json').read_text())
          baseline = json.loads(Path('config/active_play_baseline.json').read_text())
          if candidate['status'] != 'BLOCKED' or candidate['rom_generated'] or candidate['save_or_collection_bit_change'] or candidate['play_baseline_switch']:
              raise SystemExit('P01 checkpointの未完了・保全契約が不一致')
          if candidate['parent']['stage'] != baseline['stage'] or candidate['parent']['rom_path'] != baseline['rom']['path']:
              raise SystemExit('明示採用baselineと親候補が不一致')
          if any(candidate['parent'][key] != baseline['rom'][key] for key in ('size','sha256','crc32')):
              raise SystemExit('親ROMの既存記録identityが不一致')
          print('正規化投影hash・親候補の記録一致: PASS（ROM実測ではない）')
          PY
          python3 scripts/build_modernization_catalog.py build
          python3 scripts/build_modernization_catalog.py check
      - name: 実行結果だけをappendし、P01をBLOCKEDとして記録
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          marker = '<!-- USER-MODERNIZATION-P01-20260908-SOURCE-CHECKPOINT -->'
          result = json.loads(Path(os.environ['RUNNER_TEMP'], 'p01-focused.json').read_text())
          raw = Path('content/modernization/identity_contract.json').read_bytes()
          result['identity_contract_size'] = len(raw)
          result['identity_contract_sha256'] = hashlib.sha256(raw).hexdigest()
          text = '\n\n' + marker + '\n## 2026-09-08 USER-MODERNIZATION-P01 検証済みsource checkpoint\n\n'
          text += '- 結果: BLOCKED。P01受入未完了。P02/P03未開始。ROM/save/プレイ基準は未変更。\n'
          text += '- 検証source HEAD: `' + os.environ['EXPECTED_HEAD'] + '`\n'
          text += '- Actions: ' + os.environ['RUN_URL'] + '\n'
          text += '- 既存focused testsと既存カタログのbuild/check・guard・task整合性が成功。新投影の全consumer接続とROM検証の成功を意味しない。\n'
          text += '- 限定結果: `' + json.dumps(result, sort_keys=True) + '`\n'
          text += '- 採用入力・変更理由・親候補・残件・再開点: design/modernization_p01_checkpoint.md、config/modernization_inputs.json、config/modernization_candidate.json。\n'
          for name in ('design/run_log.md', 'design/version_log.md', 'design/modernization_handoff.md'):
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('記録先は既存の通常fileである必要があります')
              if marker not in path.read_text(encoding='utf-8'):
                  with path.open('a', encoding='utf-8') as f:
                      f.write(text)
          queue = Path('design/tasks_next.md')
          identity = '<!-- id:USER-MODERNIZATION-P01 -->'
          if identity not in queue.read_text(encoding='utf-8'):
              with queue.open('a', encoding='utf-8') as f:
                  f.write('\n- [!] USER-MODERNIZATION-P01 ID意味・対象区分監査: source checkpoint。consumer接続・非公開runner復元・現行ROM gateは未完了。 ' + identity + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
          python3 scripts/validate_task_graph.py
          python3 scripts/guard_private_files.py
      - name: HEAD再照合後に記録fileだけを通常commit・push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/14" --jq .head.sha)
          test "$actual" = "$EXPECTED_HEAD"
          ref_head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$ref_head" = "$EXPECTED_HEAD"
          git add -- design/run_log.md design/version_log.md design/modernization_handoff.md design/tasks_next.md
          python3 - <<'PY'
          import subprocess
          allowed = {'design/run_log.md','design/version_log.md','design/modernization_handoff.md','design/tasks_next.md'}
          staged = set(subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().rstrip('\0').split('\0')) - {''}
          if not staged <= allowed:
              raise SystemExit('記録file以外の変更はpush禁止')
          PY
          if git diff --cached --quiet; then
            echo '既に記録済み。再commitしません。'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'WIP USER-MODERNIZATION-P01: Actions検証済みcheckpointと未完了を追記'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          local_head=$(git rev-parse HEAD)
          # PR metadataはpush直後に旧SHAを返すことがある。正本のremote refを厳密照合する。
          matched=0
          for attempt in 1 2 3 4 5; do
            remote_head=$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
            if test "$local_head" = "$remote_head"; then
              matched=1
              break
            fi
            sleep 2
          done
          test "$matched" -eq 1
          printf '確認済みremote HEAD: %s\n' "$local_head"
          printf 'source-only検証HEAD: %s\nremote確認HEAD: %s\nROM検証: 未実施\n' "$EXPECTED_HEAD" "$local_head" >> "$GITHUB_STEP_SUMMARY"

name: pr16-exp-evolution-share
# 3case受入後の記録専用。unit/native/host/ARM再実行0。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-exp-evolution-share.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-exp-evolution-share
  cancel-in-progress: false
jobs:
  evolution-share:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 受入原本不変・終端Actions・再開日付・両ログ同期
        run: |
          python3 -B - <<'PY'
          import datetime
          import os
          import subprocess
          import sys
          from zoneinfo import ZoneInfo
          sys.path.insert(0, 'scripts')
          import pr16_exp_share_grass as g
          from pr16_learnset_compact_record import publish_resume
          from pr16_learnset_wiki_actions import current
          from pr16_wiki_reconcile import fetch
          e=g.e;g.configure();head=current()
          final='1adec9ac6095f0a31c7e9c147ae8b2cfb8195f78'
          changed=subprocess.check_output(['git','diff','--name-only',final,'HEAD'],text=True).splitlines()
          e.need(changed==[e.WF], 'record-only change since accepted completion')
          cp_bytes=(e.ROOT/e.CP).read_bytes();cp=e.load(e.ROOT/e.CP)
          e.need(cp['status']==e.STATUS and cp['actions_completion_confirmed'] and set(cp['accepted'])=={x[0] for x in e.CASES}, 'saved 3/3 terminal acceptance')
          for path,binding in (cp['source_bindings']|cp.get('compiled_sources',{})).items():
              if path!=e.WF:e.need(e.identity((e.ROOT/path).read_bytes())==binding, 'accepted source unchanged '+path)
          for sha in ('9f2e5a9d6dc5d60d7c6e309869f430e3bcb8f662','511e2200fc994e3e3a6bfb089f7e5dfe68681a94','e3027023931bdd5636d7ef9a91228322d8181936',final):
              subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          runs=[]
          for rid,sha,path,conclusion in (
              (36083695295,'7e416efb13b95448355e6bc151eff50aa3c25a3a',e.WF,'failure'),
              (36084083370,'b6b301e673483c01562cb56d69f8104b829a8afd',e.WF,'success'),
              (36084224210,'6dfc3ba9a99424d87e6b199fd536b4ae14609b93',e.WF,'success'),
              (36084224173,'6dfc3ba9a99424d87e6b199fd536b4ae14609b93','.github/workflows/ci.yml','success'),
              (36084448074,'fc0268add1627a7129122bb8ce89954be2300773',e.WF,'failure')):
              r=fetch('actions/runs/'+str(rid))
              e.need((r['head_sha'],r['path'],r['status'],r['conclusion'],r['head_branch'])==(sha,path,'completed',conclusion,'codex/modernization-followup-20260908'), 'exact original Actions terminal')
              jobs=fetch('actions/runs/'+str(rid)+'/jobs?per_page=100')
              e.need(jobs['total_count']==len(jobs['jobs'])==1, 'one complete job')
              j=jobs['jobs'][0];e.need(j['conclusion']==conclusion, 'job terminal agrees')
              if conclusion=='success':e.need(all(s['conclusion'] in ('success','skipped') for s in j['steps']), 'all successful terminal steps')
              if rid==36084448074:
                  steps={s['name']:s['conclusion'] for s in j['steps']}
                  e.need(steps['受入原本不変・終端Actions・再開日付・両ログ同期']=='success' and steps['引継ぎ・最終index検査']=='failure' and steps['同branchへ非force保存・remote照合']=='skipped' and steps['Run actions/upload-artifact@v4']=='success', 'record-only prior guard failure, no result push')
              runs.append(dict({k:r[k] for k in ('id','head_sha','path','status','conclusion')},job_id=j['id']))
          failed_artifact=fetch('actions/artifacts/10842523436')
          e.need((failed_artifact['size_in_bytes'],failed_artifact['digest'],failed_artifact['workflow_run']['id'])==(1586,'sha256:b367baeb0efe51df5e9ddda3edfddd67b890b308051aa45989c79ce45a7e3aaf',36084448074), 'unchanged pre-guard record artifact')
          stamp=datetime.datetime.now(datetime.timezone.utc)
          receipt={'schema_version':1,'task':e.TASK,'status':'PASS_EXP_EVOLUTION_SHARE_CLOSEOUT','source_head':head,'run_id':int(os.environ['GITHUB_RUN_ID']),'observed_at':stamp.isoformat(),'accepted_completion_head':final,'accepted_checkpoint':{'path':e.CP,**e.identity(cp_bytes)},'accepted_cases':{name:{'run_id':v['run_id'],'source_head':v['source_head']} for name,v in cp['accepted'].items()},'candidate':cp['candidate'],'observed_terminal_actions':runs,'preflight_failure':cp['preflight_failure_repaired'],'prior_record_failure':{'run_id':36084448074,'phase':'scoped_final_index','error':'final index変更集合不一致','unchanged_paths_wrongly_required':[e.CP,e.GUIDE],'new_unit_tests':0,'host_compiles':0,'native_processes':0,'result_pushes':0,'artifact':{k:failed_artifact[k] for k in ('id','name','size_in_bytes','digest')}},'new_unit_tests':0,'host_compiles':0,'arm_compiles':0,'native_processes':0,'accepted_native_reruns':0,'rom_changes':0,'issue19_complete':False,'release_ready':False,'active_baseline_changed':False,'next_action_ja':e.NEXT}
          dest=e.ROOT/e.EVIDENCE/os.environ['GITHUB_RUN_ID'];e.need(not dest.exists(), 'unique closeout record');dest.mkdir(parents=True)
          e.write(dest/'closeout.json',receipt)
          state=e.load(e.ROOT/e.x.m.STATE)
          state['observed_date_jst']=stamp.astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat()
          state['observed_head']=head
          state['observed_head_semantics']='受入済み戦闘EXP進化/共有3caseの記録終端。native・unit・host・ARM再実行0。成功と準備/記録失敗は別HEADの原本として保持。'
          relative=(dest/'closeout.json').relative_to(e.ROOT).as_posix()
          state['learnset_exp_evolution_share_closeout']={'path':relative,'run_id':receipt['run_id'],'source_head':head,'accepted_completion_head':final,'accepted_native_reruns':0}
          state['source_bindings'][e.WF]=e.identity((e.ROOT/e.WF).read_bytes())
          state['source_bindings'][relative]=e.identity((dest/'closeout.json').read_bytes())
          state['observed_head_checks']['reason_ja']='保存native成功・受入記録成功・source-validation成功を別HEADで照合。準備/記録失敗はfailureのまま。詳細はlearnset_exp_evolution_share_closeout。最新記録HEADでnativeを再実行したとは主張しない。'
          state['logs_synchronized']=True;publish_resume(state)
          note=f"\n## {stamp.isoformat()}\n- Timestamp: {stamp.isoformat()}\n- Task: {e.TASK} / 受入終端・再開日付同期\n- Version: issue19-exp-evolution-share-closeout-v2\n- Status: DONE（限定3case、Issue19全体未完）\n- Summary: 3/3受入不変。準備失敗36083695295はderived C未追跡でunit/compile/native0、artifact/push0。511e220で生成Cを補完、36084083370で新6unit/1host/1native成功、e302702に原本保存。36084224210で再実行なしの終端照合、1adec9aに受入確定。source-validation36084224173も成功。記録run36084448074はCP/guide不変と7file必須guardの不一致で停止・push0、artifact保持。記録専用5fileとCP/guide不変を併せて検証し、同じprivate/append-only guardを使用。\n- Files changed: 記録専用workflow、closeout.json、固定MD/JSON、両ログ。受入CP/driver/C/tests/guide/旧原本は不変。\n- Verify: run/head/path/branch/job/全成功step・source hashes・commit祖先・MD/JSON・task graph・staged guard。今回unit/native/host/ARM再実行0、ROM変更0。\n- Commit: 同branchへ非force pushし、reflected-head.txtとremote refで照合。\n- Network: GitHub Actionsの終端metadataだけ。保存成功の再実行・原本再生成・merge・release・baseline切替なし。\n"
          for path in ('design/run_log.md','design/version_log.md'):
              with (e.ROOT/path).open('a') as out:out.write(note)
          e.need((e.ROOT/e.CP).read_bytes()==cp_bytes, 'accepted checkpoint immutable')
          e.PROOF.mkdir(parents=True,exist_ok=True);e.write(e.PROOF/'closeout.json',receipt)
          print('3/3原本不変、native/記録/source-validation成功を照合、失敗はfailure維持。再実行0。')
          PY
      - name: 引継ぎ・記録専用5fileの最終index検査
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_exp_share_grass.py paths | tr '\n' '\0' >.local/pr16-exp-evolution-share/paths.z
          git add --pathspec-from-file=.local/pr16-exp-evolution-share/paths.z --pathspec-file-nul
          python3 -B - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0,'scripts')
          import pr16_exp_share_grass as g
          import pr16_learnset_runtime_record as guard
          g.configure();e=g.e
          subprocess.run(['git','diff','--exit-code','HEAD','--',e.CP,e.GUIDE],check=True)
          expected={e.x.m.STATE,e.x.m.DOC,'design/run_log.md','design/version_log.md',e.EVIDENCE+'/'+os.environ['GITHUB_RUN_ID']+'/closeout.json'}
          e.need(e.x.owned()-{e.CP,e.GUIDE}==expected and len(expected)==5, 'explicit five record-only paths')
          guard.START=os.environ['GITHUB_SHA'];guard.CODE=set();guard.OWNED=expected;guard.guard()
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - name: 同branchへ非force保存・remote照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-LEARNSET-EXP-EVOLUTION-SHARE: 最終Actions・途中失敗・再開日付を原本不変で同期'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-exp-evolution-share/proof/reflected-head.txt
          echo "RESULT=DONE TASK=USER-20260925-LEARNSET-EXP-EVOLUTION-SHARE VERIFY=PASS COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-exp-evolution-share-closeout
          path: .local/pr16-exp-evolution-share/proof/
          retention-days: 30
          if-no-files-found: error

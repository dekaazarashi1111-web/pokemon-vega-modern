name: pr16-exp-evolution-share
# 保存済み51unit・進化2caseを再実行せず、保存共有Cのコンパイル経路のみ修復。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-exp-evolution-share.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-exp-evolution-share
  cancel-in-progress: false
jobs:
  evolution-share:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 固定source・旧受入原本の不変照合
        run: |
          set -euo pipefail
          git diff --exit-code e5ec0fb9ae705168e404e16ec51abb0fc806346c HEAD -- scripts/pr16_exp_share_saved.py tests/test_pr16_exp_share_saved.py
          git diff --exit-code 6942bfc0e1ceac900a4a925d19e12c1892ffc24a HEAD -- scripts/pr16_exp_share_route.py tests/test_pr16_exp_share_route.py scripts/pr16_exp_evolution_share.py tools/mgba_pr16_exp_evolution_share.c tests/test_pr16_exp_evolution_share.py scripts/pr16_exp_evolution_sync.py tools/mgba_pr16_exp_evolution_sync.c tests/test_pr16_exp_evolution_sync.py scripts/pr16_exp_evolution_observation.py tests/test_pr16_exp_evolution_observation.py
          git diff --exit-code 9cfde111077c1ca451344de0d4cd09c83f335b0c HEAD -- AGENTS.md CHATGPT_RESUME.md config/active_play_baseline.json design/active_play_baseline.md content/modernization/pr16_bp_chooser_checkpoint.json content/modernization/p08_remaining_work.json content/modernization/pr16_learnset_boundaries_checkpoint.json content/modernization/pr16_learnset_first_refuse_checkpoint.json
      - name: host mGBAのみ準備
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmgba-dev
      - name: 保存Cコンパイル4unitと共有1caseのみ
        id: native
        continue-on-error: true
        run: python3 -B scripts/pr16_exp_share_saved.py execute
      - name: 原本・引継ぎ・両ログを記録し最終index検査
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_exp_share_saved.py record
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_exp_share_saved.py paths | tr '\n' '\0' >.local/pr16-exp-evolution-share/paths.z
          git add --pathspec-from-file=.local/pr16-exp-evolution-share/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_exp_share_saved.py guard
      - name: 同branchへ非force保存・remote照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-LEARNSET-EXP-EVOLUTION-SHARE: 保存C直接compileの共有native原本と引継ぎを保存'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-exp-evolution-share/proof/reflected-head.txt
          echo "RESULT=STOPPED TASK=USER-20260925-LEARNSET-EXP-EVOLUTION-SHARE VERIFY=${{ steps.native.outcome }} COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-exp-evolution-share-proof
          path: .local/pr16-exp-evolution-share/proof/
          retention-days: 30
          if-no-files-found: error
      - name: native失敗を成功へ読み替えない
        if: steps.native.outcome == 'failure'
        run: exit 1

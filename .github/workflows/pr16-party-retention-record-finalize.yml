name: Finalize PR16 party-retention record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-party-retention-record-finalize.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-party-retention-record-finalize
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recover verified native artifact and generate record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          rm -rf /tmp/pr16-native /tmp/native.zip /tmp/finalize_action.py
          mkdir -p /tmp/pr16-native
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10339976783/zip" \
            -o /tmp/native.zip
          echo '87166f621187c87fd19579b59aec89c56b2804ae6c8add010401c4f9db98f91f  /tmp/native.zip' | sha256sum -c -
          test "$(stat -c %s /tmp/native.zip)" = 1157946
          unzip -q /tmp/native.zip -d /tmp/pr16-native
          cat .github/pr16-finalize/part-*.b64 | base64 -d > /tmp/finalize_action.py
          echo 'fac5689d6f1b07a4e0f504a6bcf218aa7d92fc03a58a3ca7c96e13c36af3d5f6  /tmp/finalize_action.py' | sha256sum -c -
          python3 -m py_compile /tmp/finalize_action.py
          python3 /tmp/finalize_action.py
          python3 scripts/pr16_resume.py render
          python3 scripts/pr16_resume.py check
          python3 -m py_compile \
            scripts/pr16_resume.py \
            scripts/pr16_bp_party_retention_successor.py \
            scripts/pr16_bp_party_retention_native.py \
            tests/test_pr16_resume.py \
            tests/test_pr16_bp_party_retention_successor.py \
            tests/test_pr16_bp_party_retention_native.py
          python3 -m unittest discover -s tests -p 'test_pr16_bp_party_retention_successor.py' -v
          python3 -m unittest discover -s tests -p 'test_pr16_bp_party_retention_native.py' -v
          python3 -m unittest discover -s tests -p 'test_pr16_resume.py' -v
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' .github/workflows/pr16-bp-party-retention-native.yml
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/pr16-bp-party-retention-native.yml').read_text()
          assert '[skip retention-native]' in workflow
          extra = workflow.split('extra=[', 1)[1].split(']\n          bindings=', 1)[0]
          assert 'content/modernization/p08_remaining_work.json' not in extra

          state = json.loads(Path('content/modernization/pr16_native_supply_resume_20260913.json').read_text())
          evidence = json.loads(Path('content/modernization/pr16_bp_party_retention_verified.json').read_text())
          assert state['status'] == 'PASS_NATIVE_EXCHANGE_PARTY_RETENTION_NOT_BP'
          assert state['latest_native_run'] == 34825059791
          assert state['latest_native_job'] == 103915172830
          assert state['latest_native_tested_head'] == '10e535a046441dd3b797918106259b5c57b69716'
          assert state['next_action']['id'] == 'BP_THREE_WIN_REWARD_NATIVE'
          assert 'content/modernization/p08_remaining_work.json' not in state['source_bindings']

          result = evidence['native_result']
          assert evidence['artifact_digest'] == 'sha256:87166f621187c87fd19579b59aec89c56b2804ae6c8add010401c4f9db98f91f'
          assert evidence['accepted_native_cases_replayed'] == 0
          assert evidence['new_emulator_processes'] == 1
          assert result['runtime_connected']
          assert result['native_party_retention_accepted']
          assert result['exact600_retained']
          assert result['all_three_individuals_retained']
          assert result['exchanged_individual_retained']
          assert result['first_changed'] is None
          assert not result['native_bp_earning_accepted']
          assert not result['p05_native_bp_gap_closed']
          assert not result['release_ready']
          assert result['committed']['party_sha256'] == result['next_chooser']['party_sha256'] == result['next_action']['party_sha256']
          assert result['committed']['individuals'] == result['next_chooser']['individuals'] == result['next_action']['individuals']
          PY
          rm -rf scripts/__pycache__ tests/__pycache__
          rm -rf .github/pr16-finalize
          rm .github/workflows/pr16-party-retention-record-finalize.yml
          rm .github/workflows/pr16-recording-source-snapshot.yml
          git diff --check
      - name: Create recoverable final commit and attempt non-force push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          git fetch origin "$branch"
          test "$(git rev-parse origin/$branch)" = "$GITHUB_SHA"
          git add -A -- \
            .github/pr16-finalize \
            .github/workflows/pr16-bp-party-retention-native.yml \
            .github/workflows/pr16-party-retention-record-finalize.yml \
            .github/workflows/pr16-recording-source-snapshot.yml \
            content/modernization/p08_remaining_work.json \
            content/modernization/pr16_bp_party_retention_verified.json \
            content/modernization/pr16_bp_party_retention_wip.json \
            content/modernization/pr16_native_supply_resume_20260913.json \
            design/run_log.md \
            design/version_log.md \
            docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md
          expected=$(cat <<'EOF'
          .github/pr16-finalize/part-01.b64
          .github/pr16-finalize/part-02.b64
          .github/pr16-finalize/part-03.b64
          .github/pr16-finalize/part-04.b64
          .github/workflows/pr16-bp-party-retention-native.yml
          .github/workflows/pr16-party-retention-record-finalize.yml
          .github/workflows/pr16-recording-source-snapshot.yml
          content/modernization/p08_remaining_work.json
          content/modernization/pr16_bp_party_retention_verified.json
          content/modernization/pr16_bp_party_retention_wip.json
          content/modernization/pr16_native_supply_resume_20260913.json
          design/run_log.md
          design/version_log.md
          docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md
          EOF
          )
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit \
            -m 'USER-PR16: native保持結果を記録 [skip retention-native]' \
            -m 'Build: 0x090DD51C player true path scoped wrapper/trampoline; accepted cases replayed 0.' \
            -m 'Verify: run34825059791/job103915172830 artifact10339976783; focused 10 + resume 18 passed; BP remains pending.'
          final=$(git rev-parse HEAD)
          echo "FINAL_COMMIT=$final"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git push origin "HEAD:$branch"
          rc=$?
          set -e
          echo "PUSH_RC=$rc"
          exit 0

# transport repaired: fac5689d6f1b07a4e0f504a6bcf218aa7d92fc03a58a3ca7c96e13c36af3d5f6

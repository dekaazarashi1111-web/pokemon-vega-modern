name: PR16 Circus battle25 ordinary-input continuation
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_circus_battle25.py
      - scripts/pr16_circus_battle25_policy.py
      - tools/mgba_pr16_circus_battle25.h
      - tests/test_pr16_circus_battle25.py
      - .github/workflows/pr16-circus-battle25.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-circus-battle25-ordinary-input
  cancel-in-progress: false
jobs:
  battle25:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: pending runの必須キーを修正して生成式も回帰検査
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,sys
          sys.path.insert(0,'scripts')
          import pr16_circus_battle25 as b
          head=b.scope();prior=b.api('actions/runs/35467683171')
          assert prior['status']=='completed' and prior['conclusion']=='failure' and prior['head_sha']=='c4ac48db61d6dcd5bb90fc4712dd548694cfff8e'
          assert not pathlib.Path(b.REPORT).exists()
          paths={'scripts/pr16_circus_battle25.py':'43154edaa36969c5687497791ad621fce1e7c18f22c439a812f1640b1c24b52b',
                 'tests/test_pr16_circus_battle25.py':'1f9978ff89e8cf402c3ba9f5481f764a0b2e687db280714d4aa52a8a8f177f5a'}
          for name,sha in paths.items():
              p=pathlib.Path(name);raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==sha
              text=raw.decode()
              if name.startswith('scripts/'):
                  text=b.policy.replace_once(text,"source_head=value['source_head'],status_at_snapshot='in_progress',scope='battle25-continuation'","tested_head=value['source_head'],status='in_progress',scope='battle25-continuation'")
                  text=b.policy.replace_once(text,"checkpoint(value,'START')", "value['prior_setup_failures'].append(dict(run_id=35467683171,job_id=105962909421,source_head='c4ac48db61d6dcd5bb90fc4712dd548694cfff8e',original_conclusion='failure',native_processes=0,artifact_id=10591528567,archive=dict(size=139413,sha256='7639b0db1de7d7a53c29e48c7f609fb6ca1dbdc9f14c9d5bc3bab04882d46004'),reason_ja='pending_runsのtested_head/status必須キー不一致。記録producerの実生成式を回帰検査。'))\n    checkpoint(value,'START')")
                  text=b.policy.replace_once(text,"b'Ran 6 tests'","b'Ran 7 tests'")
                  text=b.policy.replace_once(text,'return dict(tests_run=6,success=True,skipped=0)','return dict(tests_run=7,success=True,skipped=0)')
                  text=text.replace('方策6契約','方策/記録7契約').replace('方策と6契約','方策と記録7契約')
              else:
                  test='''    def test_pending_run_producer_matches_resume_schema(self):
                  import ast
                  tree=ast.parse((ROOT/'scripts/pr16_circus_battle25.py').read_text())
                  fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='checkpoint')
                  rows=[n for n in ast.walk(fn) if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Subscript) and isinstance(n.targets[0].value,ast.Name) and n.targets[0].value.id=='state' and isinstance(n.targets[0].slice,ast.Constant) and n.targets[0].slice.value=='pending_runs']
                  self.assertEqual(len(rows),1)
                  value=dict(recording_run=17,source_head='a'*40)
                  actual=eval(compile(ast.Expression(rows[0].value),'pending producer','eval'),{},dict(value=value))
                  self.assertEqual(actual,[dict(run_id=17,tested_head='a'*40,status='in_progress',scope='battle25-continuation')])

          '''
                  text=b.policy.replace_once(text,'    def test_original_loss_never_promoted_to_30(self):',test+'    def test_original_loss_never_promoted_to_30(self):')
              compile(text,name,'exec');p.write_text(text)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(b.command('git','diff','--cached','--name-only',head).splitlines())==set(paths)
          b.scope()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m',b.TASK+': WIP pending run必須キーとproducer回帰を修正'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+b.BRANCH],check=True)
          b.scope()
          PY
      - name: 固定原本と7契約を照合し実装・引継ぎ・両ログを先に保存
        id: prepare
        run: |
          mkdir -p .local/pr16-circus-battle25
          python3 scripts/pr16_circus_battle25.py prepare > .local/pr16-circus-battle25/prepare.stdout 2> .local/pr16-circus-battle25/prepare.stderr
      - name: host native依存だけを用意し旧ARM builderを呼ばない
        run: |
          set -euo pipefail
          sudo apt-get update > .local/pr16-circus-battle25/apt-update.log 2>&1
          sudo apt-get install -y libmgba-dev > .local/pr16-circus-battle25/apt-install.log 2>&1
      - name: 同一候補で24勝prefixと25戦目以降を一続きに検証
        run: python3 scripts/pr16_circus_battle25.py native
      - name: 実停止・成功失敗・原本・引継ぎと両ログを非force記録
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_battle25.py finish
      - name: ROM save private入力を除きtextと画面だけ保存
        if: always()
        run: python3 scripts/pr16_circus_battle25.py pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-battle25
          path: .local/pr16-circus-battle25/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: scoped完走と真正30勝を混同しない
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_battle25.py result

name: PR16 Circus battle25 ordinary-input continuation
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_circus_battle25.py
      - scripts/pr16_circus_battle25_policy.py
      - tools/mgba_pr16_circus_battle25.h
      - tests/test_pr16_circus_battle25.py
      - .github/workflows/pr16-circus-battle25.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-circus-battle25-ordinary-input
  cancel-in-progress: false
jobs:
  battle25:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: テストfixtureの意図した台帳置換だけをhash同期し失敗履歴も保存
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess,sys
          sys.path.insert(0,'scripts')
          import pr16_circus_battle25 as b
          head=b.scope();state=b.resume.validate(b.ROOT)
          prior=b.api('actions/runs/35467845356')
          assert prior['status']=='completed' and prior['conclusion']=='failure' and prior['head_sha']=='0ff65b356c70182b7835bfa50b526bb1894a572d'
          assert not pathlib.Path(b.REPORT).exists()
          paths=['scripts/pr16_circus_battle25.py','tests/test_pr16_resume.py']
          p=pathlib.Path(paths[0]);raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='5fc2500106af951aebedec8c4534aa0a3be02fb86312457b75e529aed899741c'
          text=b.policy.replace_once(raw.decode(),"FILES=(SELF,HEADER,TEST,WORKFLOW,'scripts/pr16_circus_battle25_policy.py')","FILES=(SELF,HEADER,TEST,WORKFLOW,'scripts/pr16_circus_battle25_policy.py','tests/test_pr16_resume.py')")
          text=b.policy.replace_once(text,"checkpoint(value,'START')", "value['prior_setup_failures'].append(dict(run_id=35467845356,job_id=105963334813,source_head='0ff65b356c70182b7835bfa50b526bb1894a572d',original_conclusion='failure',native_processes=0,artifact_id=10592060796,archive=dict(size=141478,sha256='5f768a4cd77395979a9282250c874be993925fc35a2de373b5de9cc45538c904'),reason_ja='本物の投影validateはPASS。resumeテストの合成台帳が元台帳のhashを継承して5件失敗。setUpの意図したfixture生成直後だけbinding更新し、後続の改作拒否を維持。'))\n    checkpoint(value,'START')")
          compile(text,str(p),'exec');p.write_text(text)
          p=pathlib.Path(paths[1]);assert b.command('git','hash-object',str(p))=='c938eac6b69fb84fbc3fb03fdf0aaff17751ae89'
          text=b.policy.replace_once(p.read_text(),'        self.put(m.BACKLOG, backlog)\n',
              "        self.put(m.BACKLOG, backlog)\n        # setUpで意図的に合成した台帳だけを再bindingする。実検査中の改作は同期しない。\n        if m.BACKLOG in self.s['source_bindings']:\n            raw=(self.root/m.BACKLOG).read_bytes()\n            self.s['source_bindings'][m.BACKLOG]=dict(size=len(raw),sha256=hashlib.sha256(raw).hexdigest())\n")
          compile(text,str(p),'exec');p.write_text(text)
          # 既存受入のbindingがある場合のみ、検証済みpreimageからのこのテスト変更を同期。
          changed_binding=False
          for name in paths:
              if name in state['source_bindings']:
                  state['source_bindings'][name]=b.identity(pathlib.Path(name).read_bytes());changed_binding=True
          if changed_binding:
              b.write(b.resume.STATE,b.stable(state));b.write(b.resume.DOC,b.resume.render(state).encode())
              paths += [b.resume.STATE,b.resume.DOC]
          b.resume.validate(b.ROOT)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          assert set(b.command('git','diff','--cached','--name-only',head).splitlines())==set(paths)
          b.scope()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m',b.TASK+': WIP resume合成台帳fixtureの限定bindingを修復'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+b.BRANCH],check=True)
          b.scope()
          PY
      - name: 固定原本と7契約を照合し実装・引継ぎ・両ログを先に保存
        id: prepare
        run: |
          mkdir -p .local/pr16-circus-battle25
          python3 scripts/pr16_circus_battle25.py prepare > .local/pr16-circus-battle25/prepare.stdout 2> .local/pr16-circus-battle25/prepare.stderr
      - name: host native依存だけを用意し旧ARM builderを呼ばない
        run: |
          set -euo pipefail
          sudo apt-get update > .local/pr16-circus-battle25/apt-update.log 2>&1
          sudo apt-get install -y libmgba-dev > .local/pr16-circus-battle25/apt-install.log 2>&1
      - name: 同一候補で24勝prefixと25戦目以降を一続きに検証
        run: python3 scripts/pr16_circus_battle25.py native
      - name: 実停止・成功失敗・原本・引継ぎと両ログを非force記録
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_battle25.py finish
      - name: ROM save private入力を除きtextと画面だけ保存
        if: always()
        run: python3 scripts/pr16_circus_battle25.py pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-battle25
          path: .local/pr16-circus-battle25/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: scoped完走と真正30勝を混同しない
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_battle25.py result

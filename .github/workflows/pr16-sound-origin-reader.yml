name: pr16-sound-origin-reader
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_sound_origin_reader.py
      - scripts/pr16_sound_origin_reader_actions.py
      - tests/test_pr16_sound_origin_reader.py
      - tools/mgba_pr16_sound_origin_reader.c
      - .github/workflows/pr16-sound-origin-reader.yml
      - content/modernization/pr16_sound_origin_reader_completion_request.json
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-sound-origin-reader
  cancel-in-progress: false
jobs:
  sound-origin-reader:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped ARM and mGBA tools only for new measurement
        if: hashFiles('content/modernization/pr16_sound_origin_reader_completion_request.json') == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev libmgba-dev gcc make
      - name: Verify sound reader or receive completed measurement without replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/pr16_sound_origin_reader_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-sound-origin-reader-public-text
          path: .local/pr16-sound-origin-reader/public/
          if-no-files-found: error
          retention-days: 90

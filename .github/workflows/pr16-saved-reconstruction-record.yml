name: PR16 saved reconstruction record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-saved-reconstruction-record.yml
      - scripts/pr16_saved_reconstruction_record.py
      - tests/test_pr16_saved_reconstruction_record.py
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-saved-reconstruction-record
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 成功原本と固定JSON再開を検証し引継ぎ・両ログを非force記録
        run: |
          mkdir -p .local/pr16-saved-record
          python3 scripts/pr16_saved_reconstruction_record.py > .local/pr16-saved-record/record.stdout 2> .local/pr16-saved-record/record.stderr
      - name: text証拠とcommit receiptのみ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr16-saved-reconstruction-record
          path: |
            .local/pr16-saved-record/record.stdout
            .local/pr16-saved-record/record.stderr
            .local/pr16-saved-record/record-tests.txt
            .local/pr16-saved-record/resume-tests.txt
            .local/pr16-saved-record/task-graph.txt
            .local/pr16-saved-record/guard.json
            .local/pr16-saved-record/receipt.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

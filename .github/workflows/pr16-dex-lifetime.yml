name: pr16-dex-lifetime
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-dex-lifetime.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-lifetime
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  lifetime:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - name: Exact scoped source guard
        run: python3 -B -c 'import sys;sys.path.insert(0,"scripts");import pr16_dex_lifetime as m;m.guard()'
      - name: Same official mGBA package headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmgba-dev=0.10.2+dfsg-1.1build3 libmgba0.10t64=0.10.2+dfsg-1.1build3
      - name: New unsaved MDX lifetime fixture only
        run: python3 -B scripts/pr16_dex_lifetime.py
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-dex-lifetime-text-screens
          path: public-dex-lifetime
          retention-days: 90
          if-no-files-found: warn

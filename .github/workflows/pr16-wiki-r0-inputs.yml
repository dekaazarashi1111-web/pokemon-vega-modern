name: pr16-wiki-r0-inputs
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_wiki_r0_inputs.py
      - tests/test_pr16_wiki_r0_inputs.py
      - .github/workflows/pr16-wiki-r0-inputs.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-wiki-r0-inputs
  cancel-in-progress: false
jobs:
  input-audit:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 同一PRと最新refを照合
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-wiki-r0-inputs/proof
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from pr16_wiki_reconcile import fetch
          from pr16_wiki_r0_inputs import BRANCH, need, encode
          from pathlib import Path
          head = os.environ['GITHUB_SHA']
          pr = fetch('pulls/16'); ref = fetch('git/ref/heads/' + BRANCH)
          need(pr['head']['sha'] == head == ref['object']['sha'] and pr['head']['ref'] == BRANCH and pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY'] and pr['state'] == 'open' and pr['draft'] and not pr['merged'], 'PR/ref競合')
          runs = fetch('actions/runs?head_sha=' + head + '&per_page=100')
          need(runs['total_count'] == len(runs['workflow_runs']), '未取得Actionsページ')
          observed = {'source_head': head, 'runs': [{k:r[k] for k in ('id','name','head_sha','path','event','status','conclusion')} for r in runs['workflow_runs']], 'all_ci_green_claimed': False}
          Path('.local/pr16-wiki-r0-inputs/proof/observed-actions.json').write_bytes(encode(observed))
          PY
      - name: 新しい入力監査23試験だけを検証
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_pr16_wiki_r0_inputs.py -v >.local/pr16-wiki-r0-inputs/proof/unit.txt 2>&1
          python3 -B scripts/validate_task_graph.py >.local/pr16-wiki-r0-inputs/proof/task-graph.txt
      - name: 入力監査・未追記ログ・固定引継ぎを記録
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_wiki_r0_inputs.py record --tests 23 >.local/pr16-wiki-r0-inputs/proof/record.json
          python3 -B scripts/pr16_wiki_r0_inputs.py snapshot >.local/pr16-wiki-r0-inputs/proof/snapshot.json
      - name: 決定的checkとbyte・mtime不変を確認
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os, subprocess
          from pathlib import Path
          from scripts import pr16_wiki_r0_inputs as m
          root = Path.cwd()
          report, _ = m.inspect(root, os.environ['GITHUB_SHA'])
          paths = set(report['input_bindings']) | m.OUTPUTS
          before = {n:(m.identity((root/n).read_bytes()), (root/n).stat().st_mtime_ns) for n in paths}
          result = subprocess.run(['python3','-B','scripts/pr16_wiki_r0_inputs.py','check'], check=True, capture_output=True)
          after = {n:(m.identity((root/n).read_bytes()), (root/n).stat().st_mtime_ns) for n in paths}
          m.need(before == after, 'checkが入力/成果を変更')
          proof = root/'.local/pr16-wiki-r0-inputs/proof'
          (proof/'check.json').write_bytes(result.stdout)
          (proof/'readonly.json').write_bytes(m.encode({'status':'PASS','files':len(paths),'bytes_and_mtimes_unchanged':True,'deterministic_output_equal':True}))
          state = m.load((root/m.STATE).read_bytes())
          state['observed_head_checks'] = m.load((proof/'observed-actions.json').read_bytes())
          state['recording']['last_execution'].update(read_only_check_passed=True, task_graph_passed=True)
          (root/m.STATE).write_bytes(m.encode(state))
          PY
      - name: 最終indexの原本保護・追記・private境界を検証
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess
          from scripts import pr16_wiki_r0_inputs as m
          subprocess.run(['git','add','--',*sorted(m.CODE|m.OUTPUTS)], check=True)
          # 全体guardの既知違反は消さず、限定差分の検査と区別する。
          full = subprocess.run(['python3','-B','scripts/guard_private_files.py'], capture_output=True)
          proof = m.ROOT/'.local/pr16-wiki-r0-inputs/proof'
          (proof/'full-guard-summary.json').write_bytes(m.encode({'exit_code':full.returncode,'passed':full.returncode==0,'raw_log_published':False}))
          state = m.load((m.ROOT/m.STATE).read_bytes())
          state['recording']['last_execution']['full_index_private_guard'] = {'executed':True,'passed':full.returncode==0,'historical_violations_not_rewritten':True}
          (m.ROOT/m.STATE).write_bytes(m.encode(state))
          subprocess.run(['git','add','--',m.STATE], check=True)
          PY
          python3 -B scripts/pr16_wiki_r0_inputs.py guard >.local/pr16-wiki-r0-inputs/proof/index-guard.json
      - name: 完了した入力監査を同branchへ非force反映
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20261010-WIKI-R0-INPUTS: 入力監査と方針ログを保存し候補間の意味照合へ進む'
          git push origin "HEAD:$branch"
          head=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$head"
          printf 'RESULT=DONE TASK=USER-20261010-WIKI-R0-INPUTS VERIFY=PASS COMMIT=%s\n' "$head" | tee .local/pr16-wiki-r0-inputs/proof/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-wiki-r0-input-context
          path: .local/pr16-wiki-r0-inputs/context.zip
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-wiki-r0-input-proof
          path: .local/pr16-wiki-r0-inputs/proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

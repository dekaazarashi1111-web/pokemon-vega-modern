name: pr16-research-hatch-20260925
# 元C/fixture/50cycle/旧32unitを維持。未成功10件だけを独立workerへ。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-research-hatch-20260925.yml
      - scripts/pr16_research_hatch_matrix.py
      - tests/test_pr16_research_hatch_matrix.py
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-hatch-20260925
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  plan:
    name: plan
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新matrix境界unitだけ、旧32/復元30を再実行しない
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-research-hatch-matrix/proof
          python3 -B -m unittest tests.test_pr16_research_hatch_matrix -v >.local/pr16-research-hatch-matrix/proof/matrix-unit.stdout.txt 2>.local/pr16-research-hatch-matrix/proof/matrix-unit.stderr.txt
          cat .local/pr16-research-hatch-matrix/proof/matrix-unit.stderr.txt
      - name: 復元Actions終端・成果commitを照合し未成功だけを選ぶ
        id: plan
        run: python3 -B scripts/pr16_research_hatch_matrix.py plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-hatch-matrix-unit
          path: .local/pr16-research-hatch-matrix/proof/
          retention-days: 30
          if-no-files-found: error
  hatch:
    name: hatch / ${{ matrix.case }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: この未成功caseを動かすためのhost libraryのみ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmgba-dev
      - name: 原本個体fixtureから1件だけ実歩行・孵化・Save・fresh Continue
        run: python3 -B scripts/pr16_research_hatch_matrix.py worker '${{ matrix.case }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-rh-${{ matrix.case }}-proof
          path: .local/pr16-research-hatch/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-rh-${{ matrix.case }}-screens
          path: .local/pr16-research-hatch/screens/
          retention-days: 30
          if-no-files-found: warn
  collect:
    name: collect
    needs: [plan, hatch]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: worker別原本を照合し成功分だけ固定引継ぎ・両ログへ記録
        run: python3 -B scripts/pr16_research_hatch_matrix.py collect
      - name: 引継ぎ整合・task graph・最終index限定guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_research_hatch.py paths | tr '\n' '\0' >.local/pr16-research-hatch-matrix/paths.z
          git add --pathspec-from-file=.local/pr16-research-hatch-matrix/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_research_hatch.py guard
      - name: 集約jobだけ同branch非force commit/push・remote照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-RESEARCH-HATCH: 未成功10workerの原本を集約、保存5件を保持し固定引継ぎと両ログを記録'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-research-hatch-matrix/proof/reflected-head.txt
          echo "RESULT=CHECKPOINT TASK=USER-20260925-RESEARCH-HATCH COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-hatch-matrix-proof
          path: .local/pr16-research-hatch-matrix/proof/
          retention-days: 30
          if-no-files-found: error

name: pr16-research-hatch-20260925
# 未受入研究孵化だけ。保存配布17/旧unit/ARM/Wikiを再実行しない。
# 観測器だけを追加/修復したcommitでも専用検証へ到達させる。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-research-hatch-20260925.yml
      - scripts/pr16_research_hatch.py
      - tests/test_pr16_research_hatch.py
      - tools/mgba_pr16_research_hatch.c
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-hatch-20260925
  cancel-in-progress: false
jobs:
  research-hatch:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 未受入孵化用host libraryのみ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmgba-dev
      - name: 新unitと原本個体fixtureから実歩行・孵化・Save・fresh Continue
        id: native
        continue-on-error: true
        run: python3 -B scripts/pr16_research_hatch.py execute
      - name: 成功・失敗原本と固定引継ぎ・両ログを保存
        if: always() && steps.native.outcome != 'skipped'
        run: python3 -B scripts/pr16_research_hatch.py record
      - name: 引継ぎ整合・task graph・最終index限定guard
        if: always() && steps.native.outcome != 'skipped'
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_research_hatch.py paths | tr '\n' '\0' >.local/pr16-research-hatch/paths.z
          git add --pathspec-from-file=.local/pr16-research-hatch/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_research_hatch.py guard
      - name: 同branch非force commit/push・remote照合
        if: success()
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-RESEARCH-HATCH: 未受入研究孵化の実測原本・固定引継ぎ・両ログを保存'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-research-hatch/proof/reflected-head.txt
          echo "RESULT=CHECKPOINT TASK=USER-20260925-RESEARCH-HATCH COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-hatch-proof
          path: .local/pr16-research-hatch/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-hatch-screens
          path: .local/pr16-research-hatch/screens/
          retention-days: 30
          if-no-files-found: warn
      - name: native失敗をActions成功へ改称しない
        if: always() && steps.native.outcome != 'success'
        run: exit 1

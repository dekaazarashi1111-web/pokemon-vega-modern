name: pr16-learnset-supply-abi
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-supply-abi.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-supply-abi
  cancel-in-progress: false
jobs:
  supply-abi:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: 実装用tracked textのみ固定読取（検証再実行なし）
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          out = root / '.local/pr16-supply-abi-source'
          out.mkdir(parents=True)
          prefixes = ('scripts/', 'tools/', 'src/', 'tests/', 'config/', 'infra/', '.github/workflows/')
          exact = {'AGENTS.md', 'CHATGPT_RESUME.md', 'design/run_log.md', 'design/version_log.md', 'design/active_play_baseline.md', 'content/modernization/pr16_bp_chooser_checkpoint.json', 'content/modernization/p08_remaining_work.json'}
          rows = {}
          with zipfile.ZipFile(out / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
                  if not raw:
                      continue
                  name = raw.decode('utf-8')
                  selected = name in exact or name.startswith(prefixes) or (name.startswith(('content/modernization/', 'docs/')) and any(x in name.lower() for x in ('learnset', 'resume', 'supply', 'owner', 'compact', 'allocation', 'github_environment')))
                  path = pathlib.Path(name)
                  if not selected or path.suffix not in ('.py', '.c', '.h', '.ld', '.json', '.jsonl', '.md', '.yml', '.yaml', '.sh', '.txt') or path.is_symlink():
                      continue
                  body = path.read_bytes()
                  try:
                      body.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  z.writestr(name, body)
                  rows[name] = {'size': len(body), 'sha256': hashlib.sha256(body).hexdigest()}
              z.writestr('snapshot-manifest.json', json.dumps({'head': os.environ['GITHUB_SHA'], 'files': rows}, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'head': os.environ['GITHUB_SHA'], 'tracked_text_files': len(rows), 'old_tests_rerun': 0, 'rom_builds': 0, 'native_runs': 0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-supply-abi-source
          path: .local/pr16-supply-abi-source/source.zip
          retention-days: 7
          if-no-files-found: error

name: pr16-learnset-supply-abi
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-supply-abi.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-learnset-supply-abi
  cancel-in-progress: false
jobs:
  supply-abi:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 保存PLC2/PLA1の再利用と未取得ABIのみ採取
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pr16_learnset_supply_abi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-learnset-supply-abi
          path: .local/pr16-learnset-supply-abi/proof/
          retention-days: 30
          if-no-files-found: error

name: stage79-table-reference-audit
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/stage79-table-reference-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned analysis toolchain
        run: bash infra/setup_github_actions.sh --install
      - name: Inspect only the two stalled call sites and their literal references
        run: |
          set -euo pipefail
          mkdir -p .local/stage79-table-reference-audit
          python3 - <<'PY' > .local/stage79-table-reference-audit/references.txt
          import hashlib, json, pathlib, struct, subprocess
          config = json.loads(pathlib.Path('config/modernization_stage79_cumulative_mgba.json').read_text())
          paths = [pathlib.Path('build/stages/69_modernization_floette_gift.gba'),
                   pathlib.Path('build/stages/70_modernization_p04_species_runtime.gba'),
                   pathlib.Path(config['input_identity']['rom']['path'])]
          spans = [(0x092D11D8, 0x092D1330), (0x0937A000, 0x0937A200)]
          for path in paths:
              if not path.is_file():
                  print('STAGE_UNAVAILABLE', path)
                  continue
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if str(path) == config['input_identity']['rom']['path']:
                  assert digest == config['input_identity']['rom']['sha256']
              print('STAGE', path, 'SHA256', digest, flush=True)
              for start, end in spans:
                  subprocess.run(['arm-none-eabi-objdump', '-D', '-b', 'binary', '-m', 'arm',
                      '-M', 'force-thumb', '--adjust-vma=0x08000000',
                      f'--start-address={start}', f'--stop-address={end}', str(path)], check=True)
                  for address in range(start, end, 2):
                      op = struct.unpack_from('<H', raw, address - 0x08000000)[0]
                      if op & 0xF800 != 0x4800:
                          continue
                      literal = ((address + 4) & ~3) + (op & 255) * 4
                      value = struct.unpack_from('<I', raw, literal - 0x08000000)[0]
                      target = None
                      if 0x08000000 <= value < 0x09FFFFFC:
                          target = raw[value - 0x08000000:value - 0x08000000 + 16].hex()
                      print(f'LITERAL instruction={address:08x} location={literal:08x} value={value:08x} target16={target}')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          print('DIAGNOSTIC_ONLY: ROMs unchanged; no acceptance evidence produced')
          PY
          cat .local/stage79-table-reference-audit/references.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage79-table-reference-audit
          path: .local/stage79-table-reference-audit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

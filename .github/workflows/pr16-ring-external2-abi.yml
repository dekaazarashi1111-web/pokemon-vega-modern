name: pr16-ring-external2-abi
run-name: 保存external2の全u16分類・ABI検証記録・非force push
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_ring_external2_abi.py
      - tests/test_pr16_ring_external2_abi.py
      - .github/workflows/pr16-ring-external2-abi.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-external2-abi
  cancel-in-progress: false
jobs:
  verify-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 保存byteの全u16・ABI検証・正本と両ログ・guard・非force push
        run: python3 scripts/pr16_ring_external2_abi.py
      - name: 更新後の固定再開契約を検証
        run: python3 -m unittest discover -s tests -p test_pr16_resume.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-external2-abi
          path: |
            .local/pr16-ring-external2-abi/tests.json
            .local/pr16-ring-external2-abi/tests.txt
            .local/pr16-ring-external2-abi/recorded-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

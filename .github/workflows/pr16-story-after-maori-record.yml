name: pr16-story-after-maori-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-after-maori-record.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-story-after-maori-record
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: New record gate tests and scoped code guard only
        run: |
          mkdir -p .local/pr16-story-after-maori-record/preflight
          printf '%s\n' '660d2645c3ed42a3ea148298f1567374fe0e61cc62ea445e5fccb9f5b724a976  scripts/pr16_story_after_maori_record.py' '0a6248163acfe23573336498e5fc882ef8fd0b60d9162ab2413cc960e5f86985  tests/test_pr16_story_after_maori_record.py' | sha256sum --check
          python3 -B -m unittest discover -s tests -p test_pr16_story_after_maori_record.py -v > .local/pr16-story-after-maori-record/preflight/unit.stdout.txt 2> .local/pr16-story-after-maori-record/preflight/unit.stderr.txt
          cat .local/pr16-story-after-maori-record/preflight/unit.stderr.txt
          python3 -B -c "import sys; sys.path.insert(0,'scripts'); import pr16_story_after_maori_record as r; import pr16_learnset_runtime_record as g; g.START=r.SOURCE; g.CODE={r.SELF,r.WF,r.TEST}; g.OWNED=set(); g.guard()"
      - name: Record completed Save17 originals without core or accepted test reruns
        run: python3 -B scripts/pr16_story_after_maori_record.py record
      - name: Scoped final index private guard and fixed resume
        run: python3 -B scripts/pr16_story_after_maori_record.py guard
      - name: Lightweight task graph
        run: python3 -B scripts/validate_task_graph.py --check
      - name: Commit and nonforce push same branch
        run: |
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260929-STORY-AFTER-MAORI: 通常3戦・アヤメ回復Save17・独立Continueの限定受入を記録'
          git push origin HEAD:codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/codex/modernization-followup-20260908 | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Exact committed text readback
        run: |
          python3 -B scripts/pr16_story_after_maori_record.py snapshot
          cp .local/pr16-story-after-maori-record/preflight/unit.*.txt .local/pr16-story-after-maori-record/public/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-after-maori-record
          path: .local/pr16-story-after-maori-record/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

name: stage79-repair-workbench
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/stage79-repair-workbench.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked implementation and fixed Stage79 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/stage79-workbench
          git rev-parse HEAD > .local/stage79-workbench/head.txt
          git ls-files -z -- tools scripts tests overlays config content generated infra Makefile .github/scripts .github/workflows build/stages/06_battle_core.json build/stages/78_modernization_p05_eelevate_switch_ai.gba build/stages/78_modernization_p05_eelevate_switch_ai.json build/stages/78_modernization_p05_eelevate_switch_ai_allocation.json .local/60_wild_species_root_repair.srm | tar --null -T - -czf .local/stage79-workbench/inputs.tar.gz
          sha256sum build/stages/78_modernization_p05_eelevate_switch_ai.gba > .local/stage79-workbench/rom-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage79-repair-workbench
          path: .local/stage79-workbench/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

name: pr16-ring-external1-cont-bytes
run-name: 未読external1継続1根の採取検証記録・非force push
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_ring_external1_cont_bytes.py
      - tests/test_pr16_ring_external1_cont_bytes.py
      - .github/workflows/pr16-ring-external1-cont-bytes.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-ring-external1-cont-bytes
  cancel-in-progress: false
jobs:
  collect-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 未読継続1根採取・正本と両ログ・guard・非force push
        run: python3 scripts/pr16_ring_external1_cont_bytes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-ring-external1-cont-bytes
          path: |
            .local/pr16-ring-external1-cont-bytes/tests.json
            .local/pr16-ring-external1-cont-bytes/tests.txt
            .local/pr16-ring-external1-cont-bytes/recorded-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

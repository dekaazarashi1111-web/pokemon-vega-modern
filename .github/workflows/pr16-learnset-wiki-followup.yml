name: pr16-learnset-wiki-followup
# WIP preparation: exact-HEAD tracked UTF-8 sources only; no private input, ROM, test rerun, or acceptance claim.
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-learnset-wiki-followup.yml]
permissions:
  contents: read
concurrency:
  group: pr16-learnset-wiki-followup
  cancel-in-progress: false
jobs:
  source-context:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 必要なtracked textをHEAD・hash付きで転送（ROM等を除外）
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          output = root / '.local/pr16-learnset-wiki-context'
          output.mkdir(parents=True)
          roots = {'scripts','tests','tools','runtime','src','include','content','config','state','infra','design','tasks','.github'}
          roots_files = {'AGENTS.md','CHATGPT_RESUME.md','README.md','Makefile','pyproject.toml','package.json','.gitignore'}
          suffixes = {'.py','.c','.h','.json','.jsonl','.md','.txt','.yml','.yaml','.toml','.sh','.ini','.mk','.s','.S','.csv','.tsv'}
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          manifest = {'schema':'pr16-tracked-text-context-v1','source_head':os.environ['GITHUB_SHA'],'files':{}}
          total = 0
          with zipfile.ZipFile(output/'source-text.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(n for n in tracked if n):
                  path = pathlib.PurePosixPath(name)
                  selected = name in roots_files or path.parts[0] in roots or (path.parts[0]=='docs' and len(path.parts)==2)
                  if not selected or path.suffix not in suffixes and name not in roots_files:
                      continue
                  source = root / name
                  if source.is_symlink() or not source.is_file():
                      raise SystemExit('non-regular tracked source')
                  data = source.read_bytes()
                  if b'\0' in data:
                      continue
                  try:
                      data.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  if len(data)>32*1024*1024 or total+len(data)>512*1024*1024:
                      raise SystemExit('bounded source context exceeded')
                  total += len(data)
                  manifest['files'][name] = {'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  archive.writestr(name,data)
              archive.writestr('SOURCE_CONTEXT_MANIFEST.json',json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'source_head':manifest['source_head'],'files':len(manifest['files']),'utf8_bytes':total,'native_runs':0,'accepted_tests_rerun':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-learnset-wiki-source-context
          path: .local/pr16-learnset-wiki-context/source-text.zip
          retention-days: 7
          if-no-files-found: error

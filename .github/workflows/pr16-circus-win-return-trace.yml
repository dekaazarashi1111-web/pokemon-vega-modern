name: PR16 Circus win-return-trace continuation
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-win-return-trace.yml
      - scripts/pr16_circus_win_return_trace.py
      - tools/mgba_pr16_circus_win_return_trace.h
      - tests/test_pr16_circus_win_return_trace.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 17戦目勝利後停止の原本を照合しreadonly診断を検証・記録
        id: prepare
        run: python3 scripts/pr16_circus_win_return_trace.py prepare
      - name: 17戦目WINまで入力不変で正規復帰の待機taskを読取
        run: python3 scripts/pr16_circus_win_return_trace.py pipeline
      - name: 成否原本と固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_win_return_trace.py finish
      - name: ROMとsaveを除外して証跡を保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_win_return_trace.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-win-return-trace
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: pr16-learnset-payload-record
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/pr16-learnset-payload-record.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-learnset-payload-record
  cancel-in-progress: false
jobs:
  payload-record:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 完了Actionsだけを照合して固定MD JSONと両ログを同期
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_learnset_payload_verify.py record
          python3 -B scripts/pr16_resume.py check
          git diff --check
          git add content/modernization/pr16_learnset_payload_evidence content/modernization/pr16_learnset_payload_checkpoint.json content/modernization/pr16_learnset_binding_checkpoint.json content/modernization/pr16_native_supply_resume_20260913.json docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md docs/PR16_LEARNSET_PAYLOADS_JA.md design/run_log.md design/version_log.md
          git diff --cached --check
          python3 -B scripts/pr16_learnset_payload_verify.py guard
          git diff --exit-code
      - name: 同一branchへ受入記録を非force push
        shell: bash
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260921-LEARNSET-BASELINE-RESET: 191枠bindingと128352経路payloadの54試験を完了記録'
          git push origin "HEAD:refs/heads/$branch"
          new=$(git rev-parse HEAD)
          test "$new" = "$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'RESULT=DONE TASK=USER-20260921-LEARNSET-BASELINE-RESET VERIFY=PASS COMMIT=%s\n' "$new"

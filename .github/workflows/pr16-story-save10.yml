name: pr16-story-save10
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save10.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save10
  cancel-in-progress: false
jobs:
  supply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resume and immutable input boundary
        run: python3 -B scripts/pr16_resume.py check
      - name: New 218-input interval and independent cold62 only
        run: python3 -B scripts/pr16_story_save10_actions.py measure
      - name: Preserve pre-native failure and record Save10 evidence
        run: |
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import pr16_story_save10_actions as a
          run=a.d.inputs.api('actions/runs/36423263440')
          jobs=a.d.inputs.api('actions/runs/36423263440/jobs?per_page=100')
          a.m.need(run['head_sha']=='90429295e8d7b9e473779d7e7a466e8e20443818' and run['status']=='completed' and run['conclusion']=='failure','preserve failed preflight')
          a.write(a.PUBLIC/'preflight-failure.json',dict(run=a.d.run_summary(run),jobs=jobs,reason_ja='d.currentでGITHUB_TOKEN未設定のKeyError。native/テスト/入力artifact取得より前に停止。GH_TOKENだけを渡していたworkflowを修正。失敗を成功へ改作しない。',new_native_processes=0,new_test_executions=0))
          PY
          python3 -B scripts/pr16_story_save10_actions.py record
      - name: Task graph and scoped final index
        run: |
          python3 -B scripts/validate_task_graph.py --check
          python3 -B scripts/pr16_story_save10_actions.py guard
      - name: Non-force commit and remote readback
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260928-STORY-SAVE10: 通常ボール5個・Save10を限定受入、32検査と引継ぎ・両ログを同期 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/$branch
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          python3 -B scripts/pr16_story_save10_actions.py snapshot
          echo "RESULT=DONE TASK=USER-20260928-STORY-SAVE10 VERIFY=32_PASS COMMIT=$(git rev-parse HEAD)"
      - name: Preserve partial originals without rerun
        if: always()
        run: python3 -B scripts/pr16_story_save10_actions.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save10-checkpoint
          path: .local/pr16-story-save10/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

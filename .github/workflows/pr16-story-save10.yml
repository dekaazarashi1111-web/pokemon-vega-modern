name: pr16-story-save10
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths: [.github/workflows/pr16-story-save10.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-story-save10
  cancel-in-progress: false
jobs:
  supply:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resume and immutable input boundary
        run: python3 -B scripts/pr16_resume.py check
      - name: New 218-input interval and independent cold62 only
        run: python3 -B scripts/pr16_story_save10_actions.py measure
      - name: Record Save10 evidence and synchronized handoff
        run: python3 -B scripts/pr16_story_save10_actions.py record
      - name: Task graph and scoped final index
        run: |
          python3 -B scripts/validate_task_graph.py --check
          python3 -B scripts/pr16_story_save10_actions.py guard
      - name: Non-force commit and remote readback
        run: |
          set -euo pipefail
          branch=codex/modernization-followup-20260908
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "USER-20260928-STORY-SAVE10: 通常ボール5個・Save10を限定受入、32検査と引継ぎ・両ログを同期 run=$GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/$branch
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          python3 -B scripts/pr16_story_save10_actions.py snapshot
          echo "RESULT=DONE TASK=USER-20260928-STORY-SAVE10 VERIFY=32_PASS COMMIT=$(git rev-parse HEAD)"
      - name: Preserve partial originals without rerun
        if: always()
        run: python3 -B scripts/pr16_story_save10_actions.py preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-story-save10-checkpoint
          path: .local/pr16-story-save10/checkpoint
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

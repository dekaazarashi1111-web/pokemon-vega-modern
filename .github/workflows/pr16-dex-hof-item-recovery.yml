name: pr16-dex-hof-item-recovery
run-name: recover-current-exchange-mail-text-artifacts
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-dex-hof-item-recovery.yml
      - scripts/pr16_dex_hof_item_recovery*.py
      - tests/test_pr16_dex_hof_item_recovery*.py
      - content/modernization/pr16_dex_hof_item_recovery_development_proof.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr16-dex-hof-item-recovery
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  item-recovery:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Same branch and closed source boundary
        run: python3 -B scripts/pr16_dex_hof_item_recovery_actions.py guard
      - name: Official Ubuntu compiler for current candidate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev
      - name: Recover two current readers without rerunning 165 inherited tests
        id: measurement
        run: python3 -B scripts/pr16_dex_hof_item_recovery_actions.py run
      - name: Closed successful text publication guard
        id: publication_guard
        env:
          ITEM_RECOVERY_OUTCOME: ${{ steps.measurement.outcome }}
        if: always()
        run: python3 -B scripts/pr16_dex_hof_item_recovery_actions.py export
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.publication_guard.outcome == 'success' }}
        with:
          name: pr16-jp-item-recovery-text-only
          path: public-jp-item-recovery
          retention-days: 90
          if-no-files-found: error
      - name: Read-only checkout and task graph
        run: |
          python3 -B scripts/validate_task_graph.py --check
          git diff --exit-code

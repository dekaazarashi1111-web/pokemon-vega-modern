name: PR16 Circus post-prefix coverage
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-coverage.yml
      - scripts/pr16_circus_coverage.py
      - scripts/pr16_circus_reentry_probe.py
      - tools/mgba_pr16_circus_coverage.h
      - tests/test_pr16_circus_coverage.py
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  circus-finish:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 既存4勝後敗北のscoped記録を保持し再入場編成修復を記録
        id: prepare
        run: python3 scripts/pr16_circus_coverage.py prepare
      - name: 初回3勝の固定prefixを持つ再入場汎用方策を検証
        run: python3 scripts/pr16_circus_coverage.py pipeline
      - name: 成否原本と固定引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_coverage.py finish
      - name: ROMとsaveを除外して証跡を保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_coverage.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-coverage
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

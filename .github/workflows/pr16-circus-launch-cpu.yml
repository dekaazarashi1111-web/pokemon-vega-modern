name: PR16 Circus eighteenth launch CPU
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-launch-cpu.yml
      - scripts/pr16_circus_launch_cpu.py
      - tests/test_pr16_circus_launch_cpu.py
      - tools/mgba_pr16_circus_launch_cpu.h
permissions:
  contents: write
  actions: read
concurrency:
  group: pr16-circus-three-win
  cancel-in-progress: false
jobs:
  launch-cpu:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 17勝復帰原本と18戦目未完を区別して非force保存
        id: prepare
        run: python3 scripts/pr16_circus_launch_cpu.py prepare
      - name: 同一candidate再構成と未完launchの読取CPU診断
        run: python3 scripts/pr16_circus_launch_cpu.py pipeline
      - name: 診断成否と引継ぎと両ログを非force保存
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_launch_cpu.py finish
      - name: ROMとsaveを除外した証跡
        if: always() && steps.prepare.outcome == 'success'
        run: python3 scripts/pr16_circus_launch_cpu.py pack
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: pr16-circus-launch-cpu
          path: .local/pr16-circus-finish-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

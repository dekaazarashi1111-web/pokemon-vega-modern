name: PR16 Circus scoped acceptance receipt
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - scripts/pr16_circus_acceptance.py
      - tests/test_pr16_circus_acceptance.py
      - content/modernization/pr16_circus_visual_review.json
      - .github/workflows/pr16-circus-acceptance.yml
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-circus-suppression
  cancel-in-progress: false
jobs:
  receipt:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 既存resume案内のhash同期を固定入力から修復しsource checkpointを非force保存
        run: |
          mkdir -p .local/pr16-circus-acceptance
          python3 - <<'PYCODE'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import pr16_circus_battle25 as b
          import pr16_ring_compiled_record as guard
          manifest=json.loads(r'''{"scripts/pr16_circus_acceptance.py":{"before":"ed35429612626c88aa30293aca558db801a250999176ac9ee5544d8913dd091f","after":"4f6ee701082f67bb1a5f1e4b8f0b2d37de1db556cb9c3926c02df1751fc8e133","edits":[["WORKFLOW = '.github/workflows/pr16-circus-acceptance.yml'\nRESUME_TEST = 'tests/test_pr16_resume.py'\nFILES = (SELF, TEST, REVIEW, WORKFLOW, RESUME_TEST)\nOUT = ROOT / '.local/pr16-circus-acceptance'\nSOURCES = (\n","WORKFLOW = '.github/workflows/pr16-circus-acceptance.yml'\nRESUME_TEST = 'tests/test_pr16_resume.py'\nRESUME_IMPL = 'scripts/pr16_resume.py'\nFILES = (SELF, TEST, REVIEW, WORKFLOW, RESUME_TEST, RESUME_IMPL)\nOUT = ROOT / '.local/pr16-circus-acceptance'\nSOURCES = (\n"],["    state = b.load(b.resume.STATE)\n    # 検査fixtureの修復だけ。前回bindingをBASE原本と照合してから限定更新する。\n    prior_test = subprocess.check_output(['git','show',BASE+':'+RESUME_TEST],cwd=ROOT)\n    need(state['source_bindings'][RESUME_TEST] == identity(prior_test), 'unexpected prior test binding')\n    state['source_bindings'][RESUME_TEST] = identity((ROOT/RESUME_TEST).read_bytes())\n    b.write(b.resume.STATE,b.stable(state));b.write(b.resume.DOC,b.resume.render(state).encode())\n    b.resume.validate(ROOT)\n","    state = b.load(b.resume.STATE)\n    # 検査fixtureの修復だけ。前回bindingをBASE原本と照合してから限定更新する。\n    for path in (RESUME_TEST, RESUME_IMPL):\n        prior = subprocess.check_output(['git','show',BASE+':'+path],cwd=ROOT)\n        need(state['source_bindings'][path] == identity(prior), 'unexpected prior resume binding')\n        state['source_bindings'][path] = identity((ROOT/path).read_bytes())\n    b.write(b.resume.STATE,b.stable(state));b.write(b.resume.DOC,b.resume.render(state).encode())\n    b.resume.validate(ROOT)\n"],["        artifact_id=10604105487,archive_sha256='11b1846a8419dfac44b7f5c691a1cead39245ddab85562090a1c33a6d2594ba2',\n        cause_ja='原本照合後、合成resume fixtureがCircus未完を固定し0件を拒否。checkpoint/backlogの合成bindingと独立した未完/閉鎖fixtureへ修復。',\n        new_emulator_processes=0)\n    value['visual_review'] = verify_screens(zips[1], b.load(REVIEW))\n","        artifact_id=10604105487,archive_sha256='11b1846a8419dfac44b7f5c691a1cead39245ddab85562090a1c33a6d2594ba2',\n        cause_ja='原本照合後、合成resume fixtureがCircus未完を固定し0件を拒否。checkpoint/backlogの合成bindingと独立した未完/閉鎖fixtureへ修復。',\n        new_emulator_processes=0)\n    failed2 = b.api('actions/runs/35506191441')\n    need(failed2['status']=='completed' and failed2['conclusion']=='failure'\n         and failed2['head_sha']=='4a5de6198200589dc5a9685b3e8e598ecf534b93','second receipt failure changed')\n    value['prior_routing_failure'] = dict(run_id=failed2['id'],conclusion='failure',artifact_id=10604040930,\n        archive_sha256='81e5934d96a8faa8fd685f9c2fcde86828cac59faafd3df4fd7afe99b4c91802',\n        cause_ja='26検査中24成功、installがP08を更新してもbindingを同期しない既存不具合で2失敗。事前照合と変更対象限定同期を修復。',\n        new_emulator_processes=0)\n    value['visual_review'] = verify_screens(zips[1], b.load(REVIEW))\n"],["             '- Summary: '+stop+'\\n- Files changed: '+', '.join(paths)+'\\n'\n             '- Verify: 新規receipt契約・resume・task graph PASS。旧原本のgetter/predicate/delegate、lifecycle原本、29画面hash/目視と完了Actions再照合。新native/ARM/旧30勝再実行0。\\n'\n             '- Prior failure: run35505906219はresume合成fixtureのCircus未完固定でfailure。原本成功を変更せず検査のみ修復。新native0。\\n'\n             '- Commit: 同branch非force commit/push、remote/HEADを読戻し。\\n'\n             '- Network: GitHub RESTの固定2run/2artifactと最新30Actionsの照合のみ。\\n- Next: '+nxt+'\\n')\n    for name in b.LOGS:\n        need(TASK+'\\n' not in (ROOT/name).read_text(), 'duplicate receipt log')\n","             '- Summary: '+stop+'\\n- Files changed: '+', '.join(paths)+'\\n'\n             '- Verify: 新規receipt契約・resume・task graph PASS。旧原本のgetter/predicate/delegate、lifecycle原本、29画面hash/目視と完了Actions再照合。新native/ARM/旧30勝再実行0。\\n'\n             '- Prior failure: run35505906219はresume合成fixtureのCircus未完固定でfailure。原本成功を変更せず検査を修復。run35506191441はinstallのP08 hash同期漏れ2検査でfailure。変更前照合/限定同期を修復、新native0。\\n'\n             '- Commit: 同branch非force commit/push、remote/HEADを読戻し。\\n'\n             '- Network: GitHub RESTの固定native2run/2artifact、記録失敗2runと最新30Actionsの照合のみ。\\n- Next: '+nxt+'\\n')\n    for name in b.LOGS:\n        need(TASK+'\\n' not in (ROOT/name).read_text(), 'duplicate receipt log')\n"]]},"scripts/pr16_resume.py":{"before":"b0ec73bf933e46f7b254057559b0c637a2d1a9b625b08f348aa8308ea00dee5a","after":"385822716e7bbe1e3430ad778768a9ae0e1d2176d8bd3e3bdb09f1faf2b45252","edits":[["def install_routing(root: Path) -> None:\n    \"\"\"明示install時だけ案内を追加。既存本文・受入台帳の条件は保存する。\"\"\"\n    for name in ROUTE_PATHS + HISTORY_PATHS:\n        p = safe_path(root, name)\n","def install_routing(root: Path) -> None:\n    \"\"\"明示install時だけ案内を追加。既存本文・受入台帳の条件は保存する。\"\"\"\n    s = load(root, STATE)\n    touched = ROUTE_PATHS + HISTORY_PATHS + (BACKLOG,)\n    # 既存の不一致を更新処理で隠さない。全対象を変更前に照合する。\n    for name in touched:\n        if name in s['source_bindings']:\n            raw = safe_path(root, name).read_bytes()\n            expected = s['source_bindings'][name]\n            require(len(raw) == expected['size'] and hashlib.sha256(raw).hexdigest() == expected['sha256'],\n                    'stale routing input: '+name)\n    for name in ROUTE_PATHS + HISTORY_PATHS:\n        p = safe_path(root, name)\n"],["        title, sep, rest = text.partition('\\n')\n        p.write_text(title+sep+block+rest, encoding='utf-8')\n    s, backlog = load(root, STATE), load(root, BACKLOG)\n    for row in backlog['remaining_conditions']:\n        if row['id'] in ('NATURAL_CAPTURE_GEAR', 'FINAL_NATIVE_ACCEPTANCE'):\n","        title, sep, rest = text.partition('\\n')\n        p.write_text(title+sep+block+rest, encoding='utf-8')\n    backlog = load(root, BACKLOG)\n    for row in backlog['remaining_conditions']:\n        if row['id'] in ('NATURAL_CAPTURE_GEAR', 'FINAL_NATIVE_ACCEPTANCE'):\n"],["    backlog['current_resume_doc'] = DOC\n    safe_path(root, BACKLOG).write_text(json.dumps(backlog, ensure_ascii=False, sort_keys=True, indent=2) + '\\n', encoding='utf-8')\n    s['p08_resume_synchronized'] = True\n    dump(safe_path(root, STATE), s)\n","    backlog['current_resume_doc'] = DOC\n    safe_path(root, BACKLOG).write_text(json.dumps(backlog, ensure_ascii=False, sort_keys=True, indent=2) + '\\n', encoding='utf-8')\n    for name in touched:\n        if name in s['source_bindings']:\n            raw = safe_path(root, name).read_bytes()\n            s['source_bindings'][name] = dict(size=len(raw),sha256=hashlib.sha256(raw).hexdigest())\n    s['p08_resume_synchronized'] = True\n    dump(safe_path(root, STATE), s)\n"]]},"tests/test_pr16_resume.py":{"before":"dda9f1726253a45c8b3a035d1b25e772385f6c813cedea10fe120d1f4608232c","after":"7f31a83f3d92805ba547827f862f376b485db991758ed0763963b7ecc5e1fadf","edits":[["        m.validate(self.root)\n\n    def test_logs_append_once(self):\n        m.install_routing(self.root)\n","        m.validate(self.root)\n\n    def test_install_rejects_stale_bound_input_before_writes(self):\n        with (self.root/m.BACKLOG).open('a') as stream:stream.write(' ')\n        before={p.relative_to(self.root):p.read_bytes() for p in self.root.rglob('*') if p.is_file()}\n        with self.assertRaisesRegex(ValueError,'stale routing input'):\n            m.install_routing(self.root)\n        self.assertEqual(before,{p.relative_to(self.root):p.read_bytes() for p in self.root.rglob('*') if p.is_file()})\n\n    def test_install_updates_bound_routing_only(self):\n        before=copy.deepcopy(self.s['source_bindings'])\n        m.install_routing(self.root)\n        after=m.validate(self.root)['source_bindings']\n        for name,expected in before.items():\n            if name not in m.ROUTE_PATHS+m.HISTORY_PATHS+(m.BACKLOG,):\n                self.assertEqual(after[name],expected)\n        snapshot={name:(self.root/name).read_bytes() for name in (m.STATE,m.DOC,m.BACKLOG)}\n        m.install_routing(self.root)\n        self.assertEqual(snapshot,{name:(self.root/name).read_bytes() for name in snapshot})\n\n    def test_logs_append_once(self):\n        m.install_routing(self.root)\n"]]}}''')
          identity=lambda raw:hashlib.sha256(raw).hexdigest()
          head=b.scope();prepared={}
          for name,model in manifest.items():
              raw=Path(name).read_bytes()
              if identity(raw)==model['after']:continue
              b.need(identity(raw)==model['before'],'unexpected correction input: '+name)
              text=raw.decode()
              for before,after in model['edits']:
                  b.need(text.count(before)==1,'correction anchor: '+name)
                  text=text.replace(before,after)
              raw=text.encode();b.need(identity(raw)==model['after'],'correction output: '+name)
              prepared[name]=raw
          if prepared:
              for name,raw in prepared.items():Path(name).write_bytes(raw)
              subprocess.run(['git','add','--',*prepared],check=True)
              guard.BASE,guard.OUT,guard.ALLOWED=head,Path('.local/pr16-circus-acceptance'),set(prepared)
              guard.guard()
              subprocess.run(['git','diff','--cached','--check'],check=True)
              b.scope()
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','USER-20260920-CIRCUS-ACCEPTANCE: WIP 正本案内の事前照合・限定hash同期と28契約'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/'+b.BRANCH],check=True)
          Path('.local/pr16-circus-acceptance/corrected-source-head.txt').write_text(b.scope()+'\n')
          PYCODE
      - name: 完了原本と目視29画面を照合し正式受入・引継ぎ・両ログを非force保存
        run: |
          mkdir -p .local/pr16-circus-acceptance
          python3 scripts/pr16_circus_acceptance.py execute > .local/pr16-circus-acceptance/execute.stdout 2> .local/pr16-circus-acceptance/execute.stderr
      - name: P08限定読取用tracked textを保存（ROMとsaveは除外）
        if: always()
        run: python3 scripts/pr16_circus_acceptance.py pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-circus-acceptance
          path: .local/pr16-circus-acceptance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

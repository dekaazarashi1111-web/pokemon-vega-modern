name: pr16-research-hatch-terminal-20260925
# 原本5+独立worker10の終端のみ。旧unit/native/host/ARMを起動しない。
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-research-hatch-terminal-20260925.yml
      - scripts/pr16_research_hatch_terminal.py
      - tests/test_pr16_research_hatch_terminal.py
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: pr16-research-hatch-terminal-20260925
  cancel-in-progress: false
jobs:
  terminal:
    name: research-hatch-terminal
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 新しい終端境界unitだけ
        run: |
          set -euo pipefail
          mkdir -p .local/pr16-research-hatch-terminal/proof
          python3 -B -m unittest tests.test_pr16_research_hatch_terminal -v >.local/pr16-research-hatch-terminal/proof/terminal-unit.stdout.txt 2>.local/pr16-research-hatch-terminal/proof/terminal-unit.stderr.txt
          cat .local/pr16-research-hatch-terminal/proof/terminal-unit.stderr.txt
      - name: 15件原本・12job・全artifact・反映commitを照合して固定引継ぎと両ログを確定
        run: python3 -B scripts/pr16_research_hatch_terminal.py
      - name: 引継ぎ整合・task graph・最終index限定guard
        run: |
          set -euo pipefail
          python3 -B scripts/pr16_resume.py check
          python3 -B scripts/validate_task_graph.py
          python3 -B scripts/pr16_research_hatch.py paths | tr '\n' '\0' >.local/pr16-research-hatch-terminal/paths.z
          git add --pathspec-from-file=.local/pr16-research-hatch-terminal/paths.z --pathspec-file-nul
          python3 -B scripts/pr16_research_hatch.py guard
      - name: 同branch非force commit/push・remote照合
        run: |
          set -euo pipefail
          branch='codex/modernization-followup-20260908'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'USER-20260925-RESEARCH-HATCH: 研究孵化15件の原本とActions終端を限定受入、固定引継ぎと両ログを確定'
          git push origin "HEAD:$branch"
          sha=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$sha"
          echo "$sha" | tee .local/pr16-research-hatch-terminal/proof/reflected-head.txt
          echo "RESULT=DONE TASK=USER-20260925-RESEARCH-HATCH VERIFY=PASS_SCOPE_15 COMMIT=$sha"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr16-research-hatch-terminal-proof
          path: .local/pr16-research-hatch-terminal/proof/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pr16-research-hatch-terminal-screens
          path: .local/pr16-research-hatch-terminal/screens/
          retention-days: 30
          if-no-files-found: error

name: PR16 Circus physical entry
on:
  push:
    branches: [codex/modernization-followup-20260908]
    paths:
      - .github/workflows/pr16-circus-entry.yml
      - scripts/pr16_circus_entry.py
      - tests/test_pr16_circus_entry.py
permissions:
  contents: read
  actions: read
concurrency:
  group: pr16-circus-entry
  cancel-in-progress: false
jobs:
  entry:
    if: github.repository == 'dekaazarashi1111-web/pokemon-vega-modern' && github.ref == 'refs/heads/codex/modernization-followup-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 実受付接続に必要なtracked textだけを転送（既受入再実行なし）
        run: |
          python3 - <<'PY'
          import fnmatch,hashlib,json,pathlib,re,subprocess
          patterns = [
            'AGENTS.md','CHATGPT_RESUME.md',
            'docs/PR16_NATIVE_SUPPLY_RESUME_20260913_JA.md',
            'content/modernization/pr16_native_supply_resume_20260913.json',
            'content/modernization/pr16_bp_chooser_checkpoint.json',
            'content/modernization/p08_remaining_work.json',
            'content/modernization/pr16_circus*.json',
            'content/modernization/pr16_p05_supply_owner_findings.json',
            'content/modernization/pr16_ring_policy_acceptance.json',
            'config/facility*.json','config/active_play_baseline.json',
            'design/active_play_baseline.md',
            'scripts/pr16_circus*.py','scripts/pr16_resume.py',
            'scripts/pr16_receiver_audit.py',
            'scripts/pr16_ring_policy_successor.py',
            'scripts/pr16_ring_policy_native.py',
            'scripts/pr16_bp_native*.py','scripts/pr16_bp_trial*.py',
            'scripts/pr16_bp_chooser*.py','scripts/pr16_bp_battle*.py',
            'scripts/pr16_bp_spending*.py','scripts/build_facility_runtime.py',
            'scripts/pr16_*record*.py',
            'scripts/pr16_closeout*.py',
            'scripts/private_file_guard.py',
            'scripts/taskctl.py',
            'overlays/facility_runtime/*','overlays/circus_admission/*',
            'tests/test_pr16_circus*.py','tests/test_pr16_resume.py',
            '.github/workflows/pr16-bp-spending*.yml',
            '.github/workflows/pr16-ring-policy*.yml',
            '.github/workflows/pr16-circus-record*.yml'
          ]
          out=pathlib.Path('.local/pr16-circus-entry-source');out.mkdir(parents=True,exist_ok=True)
          members={};total=0
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name or not any(fnmatch.fnmatchcase(name,p) for p in patterns):continue
              p=pathlib.Path(name)
              assert p.is_file() and not p.is_symlink(),name
              assert p.suffix in {'.py','.c','.h','.json','.md','.yml'},name
              raw=p.read_bytes();raw.decode('utf-8');total+=len(raw)
              assert len(raw)<4000000 and total<30000000 and b'\0' not in raw,name
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,}|-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----',raw),name
              dst=out/'source'/p;dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(raw)
              members[name]={'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'members.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'members':members,'new_emulator_processes':0,'accepted_native_cases_replayed':0},indent=2)+'\n')
          print(json.dumps({'text_files':len(members),'bytes':total,'new_emulator_processes':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-circus-entry-source
          path: .local/pr16-circus-entry-source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
